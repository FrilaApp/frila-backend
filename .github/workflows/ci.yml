name: CI

on:
  # `develop` é a base de todo PR desde 28/09, e o merge nela precisa passar pelos mesmos
  # portões que o merge na `main`: um PR verde isolado não prova que dois PRs verdes,
  # juntos, continuam verdes. O `pull_request` segue sem filtro de branch, então PR contra
  # qualquer base roda a CI inteira.
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  banco:
    name: Migrações e pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # As imagens do Supabase vêm do ghcr.io, e um `docker pull` anônimo divide a cota
      # com o GitHub Actions inteiro. Em 23/09 isso derrubou quatro execuções seguidas
      # com `toomanyrequests` antes de qualquer teste rodar — CI vermelha por motivo que
      # ninguém deste repositório controla, que é o tipo de vermelho que o time aprende
      # a ignorar.
      #
      # O `GITHUB_TOKEN` do próprio job dá uma cota autenticada, e não precisa de
      # segredo nenhum configurado.
      - name: Autenticar no ghcr.io, para o pull não cair na cota anônima
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sobe Postgres, Auth e PostgREST. As migrações e o seed entram no start.
      - name: Subir o ambiente
        run: supabase start --exclude studio,realtime,storage-api,imgproxy,logflare,vector

      # O trigger de despacho exige o segredo antes de qualquer RPC que enfileire uma
      # vaga. O valor é efêmero, gerado no próprio job, e nunca é um secret do GitHub.
      - name: Configurar segredo efêmero do agendador
        run: |
          AGENDADOR_SECRET="$(openssl rand -hex 32)"
          # Mascara o segredo efêmero; ele só vale para o banco descartável deste job.
          echo "::add-mask::$AGENDADOR_SECRET"
          printf "\\set agendador_secret '%s'\nalter database postgres set frila.agendador_secret = :'agendador_secret';\nalter role authenticator set frila.agendador_secret = :'agendador_secret';\nselect pg_terminate_backend(pid) from pg_stat_activity where usename = 'authenticator' and pid <> pg_backend_pid();\n" \
            "$AGENDADOR_SECRET" |
            docker exec -e PGPASSWORD=postgres -i supabase_db_frila-backend \
              psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1
          printf 'AGENDADOR_SECRET=%s\n' "$AGENDADOR_SECRET" >> "$GITHUB_ENV"

      # Roda do zero de novo: prova que a ordem das migrações se sustenta sozinha.
      - name: Aplicar as migrações do zero
        run: supabase db reset

      - name: pgTAP
        run: supabase test db

      # Uma migração já aplicada é imutável (RNF12, migração em duas fases).
      # Editar arquivo antigo quebra o próximo ambiente em silêncio.
      - name: Nenhuma migração antiga foi editada
        if: github.event_name == 'pull_request'
        run: ./scripts/migracoes-imutaveis.sh "origin/${{ github.base_ref }}"

      # O pgTAP roda numa sessão só e não enxerga corrida. Duas conexões de verdade: o
      # mesmo dono com dois cadastros no ar recebe o estabelecimento, e não 409.
      - name: Corrida no cadastro do estabelecimento
        run: ./scripts/corrida-cadastrar-estabelecimento.sh

      # RN19 só falha sob concorrência: vinte conexões aceitando a mesma vaga de duas
      # posições. O pgTAP roda numa sessão só e veria sempre o caminho feliz.
      - name: Corrida na candidatura
        run: ./scripts/corrida-candidatar.sh

      # As outras corridas do ciclo (RNF14), 50 rodadas cada: reabrir_por_atraso ×
      # fazer_checkin, cancelar_vaga × candidatar e dois executores do despacho × teto.
      - name: Corridas do ciclo
        run: ./scripts/corrida-ciclo.sh

      - name: Ciclo completo por HTTP
        run: ./scripts/ciclo-completo.sh

      # A porta de demonstração é Edge Function, e função não sobe com `supabase start`:
      # precisa de `functions serve`. O código e os endereços aqui são de mentira de
      # propósito — o que a CI mede é o comportamento da porta, não o segredo. O segredo
      # de verdade vive em `supabase secrets set` no frila-dev e no frila-prod, e um
      # segredo real num workflow versionado seria um segredo publicado.
      #
      # Os endereços têm de casar com os do `seed.sql`, que é quem semeia as contas.
      # Os segredos entram por `--env-file`: variável de ambiente do passo vai para o
      # processo da CLI, e não para o worker que roda a função. Medido — sem o arquivo, a
      # função sobe e responde 404 em tudo, porque a lista de e-mails chega vazia.
      - name: Servir a Edge Function da demonstração
        run: |
          cat > supabase/functions/.env.local <<'EOF'
          DEMONSTRACAO_EMAILS=revisao-contratante@frila.app,revisao-profissional@frila.app
          DEMONSTRACAO_CODIGO=codigo-de-ci-sem-valor
          EOF
          printf 'AGENDADOR_SECRET=%s\n' "$AGENDADOR_SECRET" >> supabase/functions/.env.local
          supabase functions serve --env-file supabase/functions/.env.local &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:54321/functions/v1/entrar-demonstracao && break
            sleep 1
          done

      - name: Contas de demonstração por HTTP
        run: ./scripts/demonstracao.sh

      # Suíte verde não diz o que ela protege. Derruba cada restrição, trigger e
      # política — e afrouxa cada política para `using (true)` — exigindo que o pgTAP
      # fique vermelho em cada caso. Escrito depois de duas revisões medirem que 11 de
      # 31 restrições e 6 de 19 políticas passavam sem nenhum teste reclamar.
      # Mesmo motivo dos dois jobs baratos no fim deste arquivo: o portão é testado antes de
      # julgar o PR. Aqui o alvo é estreito — só a linha de base, que é a parte do
      # `mutacao.sh` que reprova e precisa dizer **onde**. Roda sem Postgres, com o
      # `supabase` dublado, e leva menos de um segundo.
      - name: A linha de base da mutação nomeia o vermelho
        run: ./scripts/teste-mutacao-linha-de-base.sh

      - name: Os testes cobrem as regras
        run: ./scripts/mutacao.sh

      # O lint tem um achado conhecido e falso positivo. Fixado por nome: achado novo
      # reprova, e o conhecido que sumir também avisa.
      - name: Lint do plpgsql sem achado novo
        run: ./scripts/lint-conhecido.sh

      # `privado.agora()` é o relógio do produto. Com `now()` no meio do caminho, todo
      # prazo vira decoração dentro de um teste que controla o relógio: o teste passa e a
      # regra some. O portão pergunta ao `pg_proc`, e não aos arquivos de migração —
      # migração é histórico, e o `now()` do gatilho de RN07 continua lá, no arquivo
      # imutável que já foi corrigido por outra migração.
      - name: Nenhuma função usa now() direto
        run: ./scripts/relogio-do-produto.sh

      # O Postgres monta o JSON de cada RPC à mão: basta renomear uma chave para quebrar o
      # app sem erro no banco, sem teste vermelho e sem log. Os outros dois portões de
      # contrato não alcançam isso — um compara o espelho com o original, o outro exige
      # que o PR que mexe em `public` mexa no contrato. Nenhum dos dois olha um corpo.
      #
      # Este chama cada RPC da v1.0 com o relógio do produto sob controle e valida a
      # resposta contra o schema declarado, nos dois sentidos: campo que sumiu e campo que
      # o contrato não declara.
      # Portão com furo aprova calado, e este decide se o corpo que o iOS desserializa
      # casa com o modelo que ele gerou. Roda antes de julgar o PR, como os outros
      # autotestes. Não precisa de Postgres, mas fica aqui porque o passo seguinte precisa.
      - name: O portão do corpo fecha nos casos conhecidos
        run: ./scripts/teste-contrato-responde.sh

      # A direção contrato-à-frente: o contrato promete uma recusa e o código não a
      # levanta. Os outros três portões de contrato medem a direção oposta. Autoteste
      # antes, como os outros, porque portão com furo aprova calado.
      - name: O portão da promessa fecha nos casos conhecidos
        run: ./scripts/teste-contrato-promete.sh

      - name: A resposta de cada RPC e de cada Edge Function casa com o contrato, e toda recusa prometida é alcançável
        run: ./scripts/contrato-responde.sh

      - name: Diagnóstico ao falhar
        if: failure()
        run: supabase status && docker ps -a

  # Job próprio, e não um passo do job do banco, por dois motivos.
  #
  # O primeiro é que este portão é git e `sed`: não precisa de Postgres, e amarrá-lo ao
  # `supabase start` faz um portão de dois segundos esperar três minutos de `docker
  # pull`. O segundo é o que aconteceu ao medir: o `ghcr.io` devolveu `toomanyrequests`,
  # o job caiu em "Subir o ambiente" e o portão **não chegou a rodar** — a CI ficou
  # vermelha pelo motivo errado, que é indistinguível de vermelha pelo motivo certo para
  # quem só olha o ✗.
  #
  # Portão barato fica fora do caminho do portão caro.
  contrato-acompanha:
    name: O contrato acompanhou o código
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # O script precisa da base para comparar, e o checkout de PR traz só o
          # commit de merge.
          fetch-depth: 0

      # O portão é testado antes de julgar o PR: um portão com furo aprova calado.
      - name: O portão fecha nos casos conhecidos
        run: ./scripts/teste-contrato-acompanha.sh

      - run: ./scripts/contrato-acompanha-o-codigo.sh "origin/${{ github.base_ref }}"

  # Mesmo raciocínio do job acima: `find`, `sed` e `uniq`, sem Postgres e sem rede. E este
  # tem um motivo a mais para ficar fora do job do banco — ele existe justamente para
  # pegar a falha que **mata** o `db reset` no meio. Rodá-lo depois do `supabase start`
  # seria pedir ao portão que avisasse do incêndio depois da casa queimada: a CI ficaria
  # vermelha em "Aplicar as migrações do zero", com a mensagem de chave duplicada do
  # Postgres no lugar do nome dos dois arquivos que colidiram.
  #
  # Roda em `push` também, e não só em PR: colisão entra por qualquer caminho que ponha
  # dois arquivos na pasta, incluindo um merge que junta dois branches inocentes.
  migracoes:
    name: Migrações sem colisão de versão
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mesmo motivo do job do contrato, na linha de cima deste arquivo: o portão é
      # testado antes de julgar o PR, porque um portão com furo aprova calado. Este nasceu
      # sem autoteste e o furo apareceu — a versão era lida como "o que vem antes do
      # primeiro `_`", e um arquivo sem `_` no nome passava como versão distinta, embora a
      # CLI o ignore em silêncio e nunca o aplique.
      - name: O portão fecha nos casos conhecidos
        run: ./scripts/teste-migracoes-sem-colisao.sh

      - run: ./scripts/migracoes-sem-colisao.sh

  # O plano de consulta é a única coisa neste repositório que não pode ser medida na
  # suíte: plano depende de estatística, estatística depende de volume, e a suíte roda
  # sobre 12 profissionais. Por isso um job próprio, e não um passo do job do banco.
  #
  # Dois motivos para ficar separado. O primeiro é tempo: a carga são 350 mil linhas, e o
  # job do banco já roda a suíte duas vezes. O segundo é contaminação — o job do banco
  # grava de verdade em `ciclo-completo.sh` e `corrida-*.sh`, e a carga se recusa a rodar
  # sobre base povoada (sai 2, "não medi"). Um passo no fim daquele job nunca mediria nada.
  #
  # O portão desfaz a carga com `rollback`, então não precisa de `db reset` depois e não
  # apaga o `frila.agendador_secret`.
  planos:
    name: Plano do caminho quente com o volume do DF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Autenticar no ghcr.io, para o pull não cair na cota anônima
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Só Postgres e PostgREST: o portão não faz HTTP nem Auth.
      - name: Subir o ambiente
        run: supabase start --exclude studio,realtime,storage-api,imgproxy,logflare,vector

      # Os tetos são folgados de propósito. O runner do Actions é mais lento e mais
      # variável que a máquina, e um portão que fica amarelo por hardware é um portão que
      # o time aprende a reexecutar sem ler. O que reprova de verdade aqui é o Seq Scan,
      # que é determinístico; o tempo é rede de proteção contra regressão grosseira.
      # Medido na máquina em 29/09: p95 de 17,8 a 39,4 ms com a reescrita, 182,7 ms com a
      # regressão de 26/09 reproduzida (MUTAR=cte).
      - name: Nenhuma varredura sequencial no caminho quente
        env:
          P95_MAX_ELEGIVEIS: 400
          P95_MAX_VAGAS: 600
        run: ./scripts/planos-com-carga.sh --plano

  # As Edge Functions tinham testes que nunca rodaram: até 29/09, `grep -rin deno
  # .github/` devolvia zero linhas. Os treze portões cobriam migração, pgTAP, HTTP, corrida,
  # contrato, lint e relógio — e nenhum tocava no TypeScript, que é onde mora o envio de
  # push, a exclusão de conta e a limpeza de contas órfãs.
  #
  # O que ficava sem rede: entre os 42 testes do `enviar-push` está
  # `filtrarDataPayloadFcm só permite chaves autorizadas`, que é a garantia de RN15 e RN10
  # de o payload não levar telefone, e-mail nem relato. O `mutacao.sh` não alcança — ele
  # derruba restrição e política no Postgres, e esse filtro é uma lista em TypeScript.
  #
  # Job próprio porque não precisa de Postgres: roda em segundos, e não deve esperar os três
  # minutos de `docker pull` do job do banco para dizer que o TypeScript quebrou.
  deno:
    name: Testes das Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # `--no-check` de propósito: as funções importam do `esm.sh` e de `deno.land/std` sem
      # mapa de importação, e a checagem de tipos puxaria a rede inteira para dizer o que o
      # teste já diz. O que este portão mede é comportamento, não tipo.
      - name: deno test
        working-directory: supabase/functions
        run: deno test --allow-all --no-check

  contrato:
    name: Contrato em dia com o Frila
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sem o secret, confere só a integridade do espelho e avisa em voz alta que o
      # original não foi conferido. FrilaApp/frila-docs é privado, e o GITHUB_TOKEN do
      # Actions não alcança outro repositório.
      - name: O espelho não divergiu do original
        env:
          FRILA_DOCS_TOKEN: ${{ secrets.FRILA_DOCS_TOKEN }}
        run: ./scripts/contrato-em-dia.sh

  # As Edge Functions têm 105 testes em Deno (`index_test.ts`), e até aqui nenhum rodava na
  # CI: o workflow `Entrega` publica a função no frila-dev a cada merge, e função quebrada
  # só aparecia no aparelho. Job próprio porque não precisa de Postgres nem de Docker: banco
  # e provedores entram injetados nos testes (#207).
  funcoes:
    name: Testes das Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: deno test
        run: deno test --allow-all supabase/functions/
