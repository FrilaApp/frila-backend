name: Avisos no Slack

# Envio de notificações operacionais da equipe no Slack via Webhook (Cartões zYC0uhH2 e bB0tV5R8).
#
# Casos atendidos via workflow_run:
#   - CI vermelha em develop, main e branches de teste (com link do run em ≤3 min).
#   - Falha de Entrega (frila-dev ou frila-prod) e sucesso de tag de produção aplicada.
#   - Backup diário do frila-prod (falha e sucesso diário resumido).
#   - Mantém o Prod vivo (falha de disponibilidade / saude do frila-prod).
#
# Casos agendados / dispatch:
#   - Checagem de backup ausente: se o backup-prod não tiver sucesso há mais de 30 h, emite alerta.
#   - Aviso manual (acao=aviso): publica no Slack o texto do input `mensagem`, com até 1000 caracteres.
#     O texto chega ao script só por variável de ambiente, nunca interpolado no `run:`.
#
# Segredo:
#   SLACK_WEBHOOK_URL (Repository secret, Settings > Secrets and variables > Actions).
#   Caso o segredo não esteja configurado, o workflow emite um warning no log e não falha.

on:
  workflow_run:
    workflows:
      - "CI"
      - "Entrega"
      - "Backup diário do frila-prod"
      - "Mantém o Prod vivo"
    types:
      - completed
  schedule:
    # A cada hora para monitorar a janela de 30h de backup ausente
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      acao:
        description: "Ação a executar (checar_backup, teste_ci ou aviso)"
        type: choice
        options:
          - checar_backup
          - teste_ci
          - aviso
        default: checar_backup
      mensagem:
        description: "Texto do aviso (só para acao=aviso; obrigatório nessa ação, até 1000 caracteres)"
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: notifica-slack-${{ github.event_name }}-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  notificar-execucao:
    name: Notificar resultado de workflow
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Processar resultado e notificar Slack se aplicável
        # Endurecimento: os valores do evento passam por env e entram no comando como "$VAR",
        # nunca interpolados no texto do `run:`. Checado por scripts/teste-workflows-sem-interpolacao.sh.
        env:
          WORKFLOW_NOME: ${{ github.event.workflow_run.name }}
          CONCLUSAO: ${{ github.event.workflow_run.conclusion }}
          RAMO: ${{ github.event.workflow_run.head_branch }}
          SHA_COMMIT: ${{ github.event.workflow_run.head_sha }}
          URL_EXECUCAO: ${{ github.event.workflow_run.html_url }}
        run: |
          ./scripts/notificar-slack.sh \
            --evento-workflow-run \
            --workflow-nome="$WORKFLOW_NOME" \
            --conclusao="$CONCLUSAO" \
            --branch="$RAMO" \
            --sha="$SHA_COMMIT" \
            --url="$URL_EXECUCAO"

  checar-backup-30h:
    name: Checar janela de 30h sem backup com sucesso
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.acao == 'checar_backup')
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verificar idade do último backup
        run: |
          ./scripts/notificar-slack.sh --checar-backup-30h

  aviso-manual:
    name: Publicar aviso manual
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.acao == 'aviso'
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      MENSAGEM: ${{ inputs.mensagem }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Publicar o aviso
        run: |
          ./scripts/notificar-slack.sh --tipo aviso_manual --mensagem="$MENSAGEM"
