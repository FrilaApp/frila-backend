name: Backup diário do frila-prod

# Workflow diário de backup lógico do frila-prod (issue #352, RNF12).
#
# Executa o backup lógico empacotado (pacote v2: banco.dump, extensoes.sql e formato.txt)
# via `scripts/backup-logico.sh`, cifra com chave pública age, e envia o arquivo cifrado
# para armazenamento S3-compatível externo (Cloudflare R2 ou Backblaze B2).
#
# Environment: `frila-backup`
# Separado do Environment `frila-prod` de propósito: `frila-prod` tem (ou terá) revisores
# obrigatórios configurados para deploys e renovações, o que exigiria aprovação humana
# manual toda madrugada às 04:00 BRT, travando o agendamento diário. O Environment
# `frila-backup` isola os segredos do backup sem portão de aprovação manual.
#
# Segredos exigidos (configurados no Environment `frila-backup`):
#   BACKUP_DB_URL                 Conexão PostgreSQL (com SSL) ao frila-prod
#   BACKUP_PUBLIC_KEY             Destinatário público age (age1...)
#   BACKUP_S3_ENDPOINT            Endpoint do storage S3-compatível (R2 / B2)
#   BACKUP_S3_BUCKET              Nome do bucket no storage
#   BACKUP_S3_ACCESS_KEY_ID       Access Key ID S3 com permissão PutObject
#   BACKUP_S3_SECRET_ACCESS_KEY   Secret Access Key S3
#
# Retenção de 14 dias:
# A retenção no storage externo é garantida pela política de ciclo de vida (Lifecycle Rule)
# configurada no bucket S3/R2/B2, que expira e remove objetos com mais de 14 dias. Essa
# abordagem permite conceder privilégio mínimo à credencial do runner (somente PutObject),
# impedindo que o Actions tenha permissão destrutiva de DeleteObject sobre backups anteriores.
#
# O repositório é público: nenhum artefato é publicado no GitHub Actions (`upload-artifact`
# proibido). Todo dump em claro gerado transitoriamente durante o processo é apagado pelo
# próprio script antes da publicação do arquivo cifrado, e a pasta temporária do runner
# é removida ao término do job.
on:
  schedule:
    # 04:00 BRT = 07:00 UTC (fora do horário de pico do produto)
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-prod
  cancel-in-progress: false

jobs:
  backup:
    name: Backup lógico do frila-prod
    runs-on: ubuntu-latest
    environment: frila-backup
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validar presença dos segredos necessários
        env:
          DB_URL: ${{ secrets.BACKUP_DB_URL }}
          PUB_KEY: ${{ secrets.BACKUP_PUBLIC_KEY }}
          S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          S3_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
        run: |
          set +x
          faltando=()
          [ -n "$DB_URL" ] || faltando+=("BACKUP_DB_URL")
          [ -n "$PUB_KEY" ] || faltando+=("BACKUP_PUBLIC_KEY")
          [ -n "$S3_ENDPOINT" ] || faltando+=("BACKUP_S3_ENDPOINT")
          [ -n "$S3_BUCKET" ] || faltando+=("BACKUP_S3_BUCKET")
          [ -n "$S3_KEY_ID" ] || faltando+=("BACKUP_S3_ACCESS_KEY_ID")
          [ -n "$S3_SECRET_KEY" ] || faltando+=("BACKUP_S3_SECRET_ACCESS_KEY")
          if [ ${#faltando[@]} -gt 0 ]; then
            echo "::error::Segredos ausentes no Environment frila-backup: ${faltando[*]}"
            exit 1
          fi
          echo "✓ Todos os 6 segredos necessários estão configurados no Environment frila-backup."

      - name: Instalar postgresql-client-17 e age
        run: |
          set -Eeuo pipefail
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17 age
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Conferir versões das ferramentas
        run: |
          set -Eeuo pipefail
          echo "=== Versões das ferramentas ==="
          pg_dump --version
          psql --version
          age --version
          aws --version

      - name: Executar backup lógico cifrado
        id: backup
        env:
          BACKUP_DB_URL: ${{ secrets.BACKUP_DB_URL }}
          BACKUP_PUBLIC_KEY: ${{ secrets.BACKUP_PUBLIC_KEY }}
          BACKUP_CIPHER: age
          BACKUP_KEEP: 14
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set +x
          set -Eeuo pipefail

          # Pasta dedicada fora do checkout (exigência de segurança do backup-logico.sh)
          PASTA_BACKUP="${RUNNER_TEMP_DIR}/frila-backup-prod"
          mkdir -p "$PASTA_BACKUP"
          export BACKUP_DIR="$PASTA_BACKUP"
          echo "BACKUP_DIR=$BACKUP_DIR" >> "$GITHUB_ENV"

          # Execução do script oficial de backup lógico cifrado
          ./scripts/backup-logico.sh

      - name: Enviar dump cifrado ao armazenamento S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION || 'auto' }}
          S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          set +x
          set -Eeuo pipefail

          # Identifica o arquivo cifrado gerado
          ARQUIVO=$(find "$BACKUP_DIR" -maxdepth 1 -name "frila-backup-*.tar.age" -type f | head -n 1)
          if [ -z "$ARQUIVO" ] || [ ! -s "$ARQUIVO" ]; then
            echo "::error::Nenhum arquivo de backup cifrado (.tar.age) encontrado em $BACKUP_DIR."
            exit 1
          fi

          NOME_ARQUIVO=$(basename "$ARQUIVO")
          TAMANHO=$(wc -c < "$ARQUIVO" | tr -d ' ')
          echo "Enviando $NOME_ARQUIVO ($TAMANHO bytes) para s3://${S3_BUCKET}/${NOME_ARQUIVO}..."

          aws s3 cp "$ARQUIVO" "s3://${S3_BUCKET}/${NOME_ARQUIVO}" \
            --endpoint-url "${S3_ENDPOINT}" \
            --no-progress

          echo "✓ Backup cifrado enviado com sucesso."

          # Registro no Step Summary (sem segredos, apenas confirmação operacional e metadados)
          {
            echo "### Backup Diário do frila-prod"
            echo
            echo "| Propriedade | Valor |"
            echo "|---|---|"
            echo "| Arquivo cifrado | \`$NOME_ARQUIVO\` |"
            echo "| Tamanho | $TAMANHO bytes |"
            echo "| Destino | \`s3://$S3_BUCKET/$NOME_ARQUIVO\` |"
            echo "| Cifra | \`age\` (pacote v2: \`banco.dump\`, \`extensoes.sql\`, \`formato.txt\`) |"
            echo "| Retenção no bucket | 14 dias (Lifecycle Rule) |"
            echo "| Concluído em | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpar pasta temporária de backup no runner
        if: always()
        run: |
          set +x
          if [ -n "${BACKUP_DIR:-}" ] && [ -d "$BACKUP_DIR" ]; then
            rm -rf -- "$BACKUP_DIR"
            echo "✓ Pasta temporária de backup removida do runner."
          fi
