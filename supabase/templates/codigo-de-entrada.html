<!-- Modelo do código de entrada. Só o código, em texto simples: nenhum link e nenhum
     botão (decisão do Cauê, 08/11/2026, cartão GZ6PYIMn).

     Os seis dígitos ficam juntos no HTML; o respiro entre eles é só `letter-spacing`.
     Assim o próprio cliente de e-mail reconhece o código e oferece a cópia, e quem
     seleciona à mão não leva espaço junto. Link mágico não entra, nem como texto.
     A validade do texto acompanha `otp_expiry` em `supabase/config.toml` (600 s).
     O comentário também vai no e-mail: nada de marcação de modelo aqui dentro. -->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; background-color: #ffffff; color: #1a1a1a;">

  <p style="font-size: 15px; line-height: 1.5; margin: 0 0 16px;">
    Seu código de entrada no Frila:
  </p>

  <p style="font-size: 40px; font-weight: 700; line-height: 1.2; letter-spacing: 8px; margin: 0 0 24px; font-variant-numeric: tabular-nums;">{{ .Token }}</p>

  <p style="font-size: 15px; line-height: 1.5; margin: 0 0 8px;">
    Ele vale por 10 minutos e serve uma vez só.
  </p>

  <p style="font-size: 13px; line-height: 1.5; color: #666; margin: 24px 0 0;">
    Se não foi você que pediu, ignore este e-mail. Ninguém entra na sua conta só com
    o seu endereço.
  </p>

</div>
