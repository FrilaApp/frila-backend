<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
  <title>Seu código de entrada · Frila</title>
  <style>
    :root { color-scheme: light dark; background: #faf9f7; color: #1a1a1a; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 64px 24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.5; }
    main { max-width: 400px; margin: 0 auto; }
    .marca { margin: 0 0 48px; font-size: 28px; font-weight: 750; }
    h1 { font-size: 24px; line-height: 1.3; margin: 0 0 16px; }
    p { margin: 0 0 24px; }
    #codigo { font-size: 36px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 6px; user-select: all; -webkit-user-select: all; }
    button { width: 100%; min-height: 60px; border: 0; border-radius: 8px; padding: 12px 16px; background: #EA5A36; color: #ffffff; font: 700 20px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; cursor: pointer; }
    button:focus-visible { outline: 3px solid #1a1a1a; outline-offset: 4px; }
    #estado { margin: 20px 0 0; }
    @media (prefers-color-scheme: dark) {
      :root { background: #171717; color: #f5f5f5; }
      button:focus-visible { outline-color: #f5f5f5; }
    }
  </style>
</head>
<body>
  <main>
    <p class="marca">Frila</p>
    <h1>Seu código de entrada</h1>
    <section id="valido" hidden aria-label="Copiar código de entrada">
      <p id="codigo"></p>
      <button id="copiar" type="button">Copiar código</button>
      <p id="estado" role="status">Volte ao Frila e cole o código</p>
    </section>
    <p id="invalido">Abra o link do e-mail de novo</p>
    <noscript><p>Ative o JavaScript para copiar aqui ou toque e segure o código no e-mail.</p></noscript>
  </main>
  <script>
    const codigo = window.location.hash.slice(1);
    if (codigo.length === 6 && /^\d{6}$/.test(codigo)) {
      const botao = document.getElementById('copiar');
      const estado = document.getElementById('estado');
      document.getElementById('codigo').textContent = codigo;
      document.getElementById('valido').hidden = false;
      document.getElementById('invalido').hidden = true;

      function copiarAlternativa() {
        const campo = document.createElement('textarea');
        campo.value = codigo;
        campo.setAttribute('readonly', '');
        campo.setAttribute('aria-label', 'Código de entrada');
        campo.style.position = 'fixed';
        campo.style.left = '-9999px';
        document.body.appendChild(campo);
        try {
          campo.select();
          return document.execCommand('copy');
        } finally {
          campo.remove();
          botao.focus();
        }
      }

      botao.addEventListener('click', async () => {
        let copiado = false;
        try {
          await navigator.clipboard.writeText(codigo);
          copiado = true;
        } catch {
          try { copiado = copiarAlternativa(); } catch { copiado = false; }
        }
        botao.textContent = copiado ? 'Copiado!' : 'Copiar código';
        estado.textContent = copiado
          ? 'Volte ao Frila e cole o código'
          : 'Não foi possível copiar. Para copiar, toque e segure o código acima.';
      });
    }
  </script>
</body>
</html>
