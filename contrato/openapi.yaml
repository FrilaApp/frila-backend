    **Versão 0.2.18, de 26/09/2026.** Exclusão de conta e proteção de escrita para contas
    encerradas (RF25, RN15). A exclusão de conta agora conta com a Edge Function
    `excluir-conta` e a rotina transacional no banco. Para proteger o estado das vagas e a
    reputação das partes, qualquer token emitido antes da exclusão passa a ser recusado com
    `401 nao_autenticado` em todas as operações de escrita. O que a implementação fixou:

    - **Token de conta encerrada recebe `401 nao_autenticado`.** O backend não cria código
      novo de 403 (`conta_encerrada`): uma conta cujos dados foram anonimizados e cuja
      credencial em `auth.users` foi apagada é tratada como não autenticada. Todo cliente que
      receber `401` deve encerrar a sessão local e conduzir a pessoa ao início.
    - **Isenção de falta exclusiva da exclusão.** Na exclusão de profissional com turnos
      futuros confirmados, a posição é cancelada e a vaga reaberta sem falta (RN12). A
      isenção é interna da transação de exclusão: chamar `cancelar_posicao` com o texto
      "exclusão de conta" a menos de 24 h continua marcando falta e recalculando a taxa de
      comparecimento normalmente.
    - **Contratante único membro cancela turnos futuros sem falta.** Vagas abertas são
      canceladas, candidaturas pendentes são marcadas como `retirada` e os profissionais
      são avisados por notificação com `reaberta: false`. Vaga preenchida com turno em
      andamento vai para `cancelada`, mas o turno segue até o fim para fins de histórico e
      auditoria.
    - **Idempotência da exclusão.** Chamar a exclusão em conta já anonimizada ou cuja linha
      nem chegou a ser gravada em `public.usuario` devolve `202` com `turnos_cancelados: 0`
      e garante a remoção em `auth.users`, permitindo retentativa segura pós-502.
    - **Administrador único com outros membros recebe `409 administrador_unico`.** O
      estabelecimento não pode ficar sem liderança; a titularidade precisa ser transferida
      antes de excluir a conta.

