    **Versão 0.2.7, de 24/09/2026.** `candidatar` foi implementada no modo urgência, e
    a implementação separou dois casos que o contrato tratava como um só.

    - **Vaga `preenchida` recusa com `409 posicao_ja_preenchida`, e não com
      `vaga_encerrada`.** Os dois são 409 e a diferença importa para a tela:
      `vaga_encerrada` é "esta vaga não existe mais" — cancelada, encerrada ou já
      começada; `posicao_ja_preenchida` é "alguém chegou antes", que o produto trata
      como funcionamento normal. Uma vaga preenchida fechou porque **encheu**, e quem
      chegou depois merece a tela do segundo caso.
    - **`422 inelegivel` com `details: funcao_incompativel`** também para quem ainda não
      tem perfil profissional. Sem perfil não há função cadastrada, e sem função nenhuma
      vaga serve; os dois casos terminam na mesma tela, a de completar o perfil.
    - **`404 nao_encontrado`** para vaga que o profissional não deveria alcançar —
      bloqueio entre as partes ou conta de demonstração —, igual ao que `detalhe_vaga`
      responde. Candidatar-se é a continuação natural de ter visto a vaga, e as duas
      operações escondem a mesma coisa.

    `contato` volta preenchido já na resposta da confirmação, com o prazo do RN10: o
    fim previsto do turno mais 7 dias. O `whatsapp_url` sai sem o `+` do E.164, que o
    `wa.me` não aceita — a regra mora no servidor para não ser reescrita em três apps.

    ---

    **Versão 0.2.6, de 24/09/2026.** `vagas_abertas` e `detalhe_vaga` foram
    implementadas. As duas são leituras, e o que a implementação acrescentou aqui é
    sobretudo **o que elas recusam** e **o que elas escondem**.

    - **As duas são a tela de quem procura turno**, e recusam conta de contratante com
      `422 perfil_incompativel`. Antes isso não estava escrito, e um cliente que
      chamasse com a conta errada receberia uma lista vazia — que a tela leria como
      "não há vagas", e não como "esta tela não é sua".
    - **`limite` fora de 1..100 e `deslocamento` negativo** são `422 campo_invalido` com
      o nome do parâmetro em `details`, e não um truncamento silencioso.
    - **Sem coordenada e sem ponto base**, `vagas_abertas` recusa com
      `422 campo_obrigatorio` e `details: latitude`. Sem ponto de referência não há
      ordem, e ordenar por um ponto inventado devolveria uma lista plausível e errada.
    - **`detalhe_vaga` responde `404 nao_encontrado`** para vaga que o profissional não
      deveria alcançar — bloqueio entre as partes (RF26) ou conta de demonstração — e
      não `403`. Um 403 confirmaria que aquela vaga existe, e quem bloqueou alguém não
      deve receber prova de que a outra parte continua publicando.
    - **Conta de demonstração e conta real não se enxergam** (diretrizes 2.1 e 4.2): a
      lista e o detalhe de uma população nunca trazem a vaga da outra.
    - **`PerfilPublico` de estabelecimento** traz `taxa_comparecimento` nula e os dois
      contadores de turno em zero. A taxa é do profissional — é ele que comparece ou
      falta —, e zero aqui não é "nunca trabalhou": é "este campo não se aplica a esta
      ponta".

    Uma correção, e não uma adição: `PerfilPublico` de **profissional** passou a trazer
    `turnos_realizados`, que o schema `Reputacao` exige desde a 0.2.1 e a implementação
    não devolvia. Um cliente gerado a partir do contrato quebraria ao desserializar.

    ---

    **Versão 0.2.5, de 24/09/2026.** `publicar_vaga` foi implementada, e o que a
    implementação descobriu está escrito aqui.

    - **`modo = selecao` é recusado na v1.0**, com `422 campo_invalido` e `details: modo`.
      O escopo do MVP tem só o modo urgência. O código **não** é
      `selecao_sem_antecedencia`: aquele é a regra das 24 horas de RN24, e ele só volta a
      ter sentido na v1.1, quando o modo passar a existir e houver antecedência para
      recusar. Um cliente que trate os dois como o mesmo erro vai dizer "publique com mais
      antecedência" para quem escolheu um modo que ainda não existe.
    - **`422 campo_invalido` com o campo em `details`** para `valor_centavos` não positivo,
      `posicoes` fora de 1..200, `funcao_id` fora do catálogo e `ponto` com latitude ou
      longitude fora da faixa. Antes isso chegava ao cliente como violação de restrição do
      banco, que ele não sabe ler.
    - **`403 sem_permissao`** para quem não é membro do estabelecimento — inclusive quando o
      estabelecimento não existe, e de propósito: um 404 diria a quem não é membro que
      aquele estabelecimento existe. Conta suspensa recebe o mesmo 403, com
      `details: conta_suspensa` (RN13).
    - **`422 perfil_incompativel`** para conta de profissional (RN25).
    - **Diretriz 1.2**: `local`, `responsavel_local`, `traje` e `observacoes` passam pelo
      filtro de termos bloqueados, e recusam com `422 campo_invalido` e o campo em
      `details`, como a 0.2.3 antecipou.

    A resposta não mudou: `VagaPublicada` com `vaga_id` e um id por posição. O despacho
    continua fora da requisição (B15) — publicar enfileira e responde.

    ---

    **Versão 0.2.4, de 23/09/2026.** Um código de erro novo e uma resposta que faltava.

    As três RPCs do perfil profissional foram implementadas, e duas coisas que o contrato
    não dizia apareceram na implementação:

    - **`409 perfil_ja_existe`**, em `criar_perfil_profissional`. O contrato já previa a
      resposta 409; faltava o código. Criar duas vezes é conflito e não sobrescrita —
      sobrescrever apagaria a grade semanal de quem tocasse duas vezes no botão de
      cadastrar, e quem quer mudar chama `atualizar_perfil_profissional`.
    - **`404` em `atualizar_perfil_profissional`.** Atualizar um perfil que não existe não
      é erro de campo. Sem essa resposta declarada, o cliente não tinha como distinguir
      "seu perfil sumiu" de "você mandou um campo errado".

    Também ficou escrito o que `atualizar_perfil_profissional` faz com uma chamada sem
    nenhum campo: `422 campo_obrigatorio` com `details: nenhum_campo`. É o mesmo que o
    `minProperties: 1` do schema já dizia, agora com o código que o cliente compara.

    ---

    **Versão 0.2.3, de 23/09/2026.** Uma recusa nova numa operação que já existia.

    `criar_conta` passa a conferir o `nome` contra a lista de termos bloqueados da
    diretriz 1.2 da App Store, e recusa com `422 campo_invalido`, `details: nome`. O
    código já estava no catálogo desde a 0.2.2; o que muda é que `criar_conta` passa a
    poder devolvê-lo, e a tela do cadastro precisa tratar dois motivos diferentes para o
    mesmo campo — `campo_obrigatorio` quando falta, `campo_invalido` quando não serve.

    A ordem das duas conferências é parte do contrato: nome vazio continua saindo como
    `campo_obrigatorio`. Um cliente que trate os dois com o mesmo texto vai dizer
    "preencha o nome" para quem preencheu.

    O filtro é por palavra inteira sobre o texto sem acento e em minúsculas. Não persegue
    variação de grafia, e isso é desenho, não limitação: um filtro que persegue grafia
    vira um filtro que recusa nome de gente, e o custo dos dois erros não é o mesmo —
    texto ofensivo que escapa tem denúncia e bloqueio atrás dele (RF26), enquanto quem
    não consegue se cadastrar apenas vai embora.

    `publicar_vaga`, `republicar_vaga` e `cadastrar_estabelecimento` vão chamar o mesmo
    filtro em `traje`, `observacoes`, `responsavel_local` e `nome` quando forem
    implementadas, no Sprint 1. Cada uma acrescenta a recusa à sua própria lista aqui.

    ---

    **Versão 0.2.2, de 23/09/2026.** Só adições e uma troca de parâmetro; nenhuma operação saiu.

    Em relação à 0.2.1: entram `meus_estabelecimentos`, `remover_dispositivo`,
    `configuracao_do_app`, `registrar_evento` e a Edge Function `entrar-demonstracao`; `Turno`
    ganha `contato_visivel_ate`; `Reputacao` ganha `turnos_realizados` ao lado de
    `turnos_considerados`, que passam a ter definição escrita; `exportar-meus-dados` ganha o
    schema do que devolve; e o catálogo de erros ganha `campo_invalido`, `fora_da_janela`,
    `registro_no_futuro`, `contestacao_ja_aberta`, o `details` `conta_suspensa` em
    `sem_permissao` e o `funcao_incompativel` em `inelegivel`.

    **A única mudança que quebra cliente:** `bloquear` e `denunciar` trocam `alvo_usuario_id` por
    `alvo_tipo` + `alvo_id`. O campo antigo era impreenchível — nenhuma resposta do contrato devolve
    o id de *conta* da outra parte, então o app não tinha como preenchê-lo. O que ele recebe é o
    `PerfilPublico`, que traz `id` e `tipo`; o servidor resolve a conta a partir daí. Como não
    havia cliente capaz de chamar as duas operações, a troca não deixa ninguém para trás e não
    vira `_v2`.

    A 0.2.1, de 22/09, tinha trazido o aceite dos termos em `criar_conta`, a criação de
    `minha_conta` e a chave `headers` no trecho de `erro()`, sem a qual o PostgREST devolve 500 em
    toda recusa de regra de negócio.

    Fica para a próxima versão: escala de evento em lote (RF19), convite de membros do
    estabelecimento (RF21) e verificação progressiva de identidade (RN14).

    ### Divergências conhecidas com o quadro

    Levantadas na conferência de 23/09 contra os 83 cartões do Sprint 1 e do Sprint 2. Aqui está o
    que o contrato decidiu, e por quê — quem lê o cartão e o contrato juntos precisa saber qual dos
    dois está atrasado.

    - **`criar_conta` não recebe a data do aceite.** O cartão pede "versão e data". A versão vem do
      cliente; o instante é carimbado pelo servidor, porque data de aceite enviada pelo app é
      forjável — e um registro de consentimento que a parte interessada pode escrever não vale como
      registro. O cartão é que precisa mudar.
    - **`meus_turnos` filtra por `de` e `ate`, não por `periodo`.** Um enum de período ("semana",
      "mês") obriga o servidor a adivinhar o fuso de quem pergunta, e o produto tem turno que vira a
      noite. O intervalo explícito não tem essa ambiguidade.
  contact:
    name: BlendOps — Challenge 18
servers:
  - url: https://{projeto}.supabase.co/rest/v1
    description: API REST do Supabase (PostgREST) — tabelas e funções RPC.
    variables:
      projeto:
        default: frila
        description: Identificador do projeto no Supabase.
security:
  - chaveDoProjeto: []
    tokenDoUsuario: []
tags:
  - name: Autenticação
    description: Supabase Auth, usado pelo SDK de cada plataforma. Entrada por código de uso único enviado ao e-mail, sem senha e sem SMS (RF01).
  - name: Cadastro e perfil
    description: Conta, perfil do profissional, disponibilidade e explicação do despacho (RF01, RF03, RF27).
  - name: Estabelecimento
    description: Cadastro do estabelecimento e equipe de confiança (RF02, RF18).
  - name: Vagas
    description: Publicação e lista de vagas (RF04, RF05, RF07, RF09).
  - name: Candidatura e confirmação
    description: Candidatura sem formulário e confirmação sem duplicidade (RF08, RF09, RF10, RN19, RN24).
  - name: Turno
    description: Contato, aviso a caminho, check-in, check-out, cancelamento e reabertura (RF11, RF12, RF13, RF14, RN10, RN22).
  - name: Avaliação e reputação
    description: Avaliação binária e perfil público com denominador (RF15, RF16, RN07, RN08).
  - name: Painel do gestor
    description: Acompanhamento de vagas e turnos pelo estabelecimento, no app e na web (RF20, UC07).
  - name: Confiança e direitos
    description: Denúncia, bloqueio, suspensão e contestação (RF24, RF26, RN13).
  - name: Dispositivos
    description: Registro do token de push (FCM) de cada aparelho.
  - name: Exportação e conta
    description: Exportação de turnos e de dados pessoais, e exclusão da conta (RF22, RF25).
  - name: Aplicativo
    description: Configuração que o app precisa antes de ter sessão — versão mínima e aviso de atualização.
  - name: Telemetria
    description: Eventos do dicionário de métricas, só com identificadores (RN15).
  - name: Catálogo
    description: Dados de referência lidos direto da tabela.

paths:

  # ───────────────────────────────────────────── Autenticação (Supabase Auth)

  /otp:
    servers:
      - url: https://{projeto}.supabase.co/auth/v1
        variables:
          projeto:
            default: frila
    post:
      tags: [Autenticação]
      operationId: pedirCodigo
      summary: Pedir o código de entrada por e-mail
      description: |
        Envia um código de uso único ao e-mail. Os apps chamam pelo SDK do Supabase (`signInWithOtp`
        com `email`); a rota está aqui para o contrato ficar completo. Cria a conta de autenticação se
        ela ainda não existir. O modelo de e-mail do Supabase leva o código (`{{ .Token }}`), e não o
        link. O envio de e-mail embutido do Supabase serve só para teste; o piloto usa um provedor de
        e-mail próprio (SMTP).
      security:
        - chaveDoProjeto: []
      x-requisitos: [RF01, UC09, UC10]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Código enviado.
        '429':
          $ref: '#/components/responses/LimiteExcedido'

  /verify:
    servers:
      - url: https://{projeto}.supabase.co/auth/v1
        variables:
          projeto:
            default: frila
    post:
      tags: [Autenticação]
      operationId: confirmarCodigo
      summary: Confirmar o código e abrir a sessão
      description: |
        Troca o código recebido no e-mail por uma sessão. O token de acesso é curto e o de renovação é
        longo; os dois ficam no Keychain (iOS), no Keystore (Android) ou em cookie `HttpOnly` (web),
        nunca em `UserDefaults` ou `localStorage` (RNF07).
      security:
        - chaveDoProjeto: []
      x-requisitos: [RF01, RNF07]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, type]
              properties:
                email:
                  type: string
                  format: email
                token:
                  type: string
                  description: Código recebido no e-mail.
                  example: '123456'
                type:
                  type: string
                  const: email
      responses:
        '200':
          description: Sessão aberta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /token:
    servers:
      - url: https://{projeto}.supabase.co/auth/v1
        variables:
          projeto:
            default: frila
    post:
      tags: [Autenticação]
      operationId: renovarSessao
      summary: Renovar o token de acesso
      security:
        - chaveDoProjeto: []
      parameters:
        - name: grant_type
          in: query
          required: true
          schema:
            type: string
            const: refresh_token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Nova sessão.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  # ───────────────────────────────────────────── Cadastro e perfil

  /rpc/configuracao_do_app:
    get:
      tags: [Aplicativo]
      operationId: configuracaoDoApp
      summary: Versão mínima do app e aviso de atualização obrigatória
      description: |
        Chamada na abertura, **antes de haver sessão**: um app abaixo da versão mínima precisa
        conseguir descobrir isso mesmo sem conseguir entrar. Por isso é a única operação de
        `rest/v1` que dispensa o token do usuário — a chave publicável basta.

        `versao_minima` é por plataforma e é comparada pelo app contra a própria versão de build.
        Abaixo dela, a tela de bloqueio substitui o app inteiro e leva à loja; a partir de
        `versao_recomendada`, o aviso é dispensável e aparece uma vez por versão.

        Existe porque a v1.1 sai com o piloto rodando e o app antigo continua nos aparelhos. Sem
        este canal, um defeito grave não sai de circulação e o backend fica preso à compatibilidade
        com ele para sempre.
      security:
        - chaveDoProjeto: []
      x-requisitos: [RNF12]
      parameters:
        - name: plataforma
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Plataforma'
      responses:
        '200':
          description: Configuração em vigor para a plataforma.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracaoDoApp'
        '404':
          description: |
            `nao_encontrado` com `details: plataforma`: a plataforma existe no enum, mas ainda não
            tem configuração (hoje, só `ios` tem). Bloquear quem não tem loja para onde ir não
            ajudaria ninguém.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '422':
          description: |
            `campo_obrigatorio` quando `plataforma` está ausente ou em branco; `campo_invalido`
            quando está fora do enum. Os dois com `details: plataforma`. Não há autenticação a
            falhar, porque esta operação existe justamente para o app que ainda não conseguiu entrar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /rpc/criar_conta:
    post:
      tags: [Cadastro e perfil]
      operationId: criarConta
      summary: Criar a conta do usuário depois de confirmar o e-mail
      description: |
        Cria a linha de `usuario` ligada à conta de autenticação do chamador. O e-mail vem da conta
        já confirmada pelo código. O perfil (`profissional` ou `contratante`) é gravado aqui e não
        muda depois (RN25): para usar o outro perfil, a pessoa cria outra conta, com outro e-mail. O
        telefone é obrigatório, porque é o contato do turno (RN10); o banco confere só o formato, sem
        verificação por SMS, e o mesmo número pode estar em outra conta. A maioridade é verificada
        no banco pela data de nascimento, e não por um booleano enviado pela tela (RN20). Nenhum
        documento é pedido aqui (RN14).

        O `nome` passa pelo filtro de texto da diretriz 1.2 da App Store: termo da lista de
        bloqueio, como palavra inteira, é recusado com `422 campo_invalido` e `details: nome`. A
        conferência vem **depois** da de presença, então nome vazio continua saindo como
        `campo_obrigatorio` — a tela mostra texto diferente para "faltou" e para "não serve", e
        tratar os dois com a mesma mensagem diria "preencha o nome" para quem preencheu.

        O filtro compara palavra inteira, o que é por que `Ana Cunha` passa enquanto `cu` sozinho
        não. Ele não persegue variação de grafia, e isso é desenho: texto ofensivo que escapa tem
        denúncia e bloqueio atrás dele (RF26); quem não consegue se cadastrar não tem nada atrás.
      x-requisitos: [RF01, RN14, RN20, RN25, UC09, UC10]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [perfil, nome, telefone, nascimento, termos_versao]
              properties:
                perfil:
                  $ref: '#/components/schemas/PerfilConta'
                nome:
                  type: string
                  minLength: 2
                telefone:
                  $ref: '#/components/schemas/Telefone'
                nascimento:
                  type: string
                  format: date
                  example: '1998-04-12'
                termos_versao:
                  type: string
                  minLength: 1
                  description: |
                    Versão dos termos de uso e da política de privacidade que a tela exibiu.
                    Guardar só um booleano não responde o que a pessoa aceitou, que é o que a
                    LGPD e a diretriz da App Store perguntam. **Não há campo de data**: o
                    instante é carimbado pelo servidor, porque data de aceite enviada pelo
                    cliente é forjável e não vale como registro de consentimento.
                  example: '2026-09-22'
      responses:
        '200':
          description: Conta criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/minha_conta:
    get:
      tags: [Cadastro e perfil]
      operationId: minhaConta
      summary: Ler a própria conta
      description: |
        O app chama ao abrir, para saber se a sessão já tem conta no produto. Depois de
        confirmar o código existe sessão e pode não existir conta: `404 nao_encontrado` é
        como o app sabe que precisa mandar a pessoa para o cadastro, em vez de mandar de
        novo quem já cadastrou.
      x-requisitos: [RF01, UC09, UC10]
      responses:
        '200':
          description: Conta do chamador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /rpc/criar_perfil_profissional:
    post:
      tags: [Cadastro e perfil]
      operationId: criarPerfilProfissional
      summary: Criar o perfil de profissional
      description: |
        Declara funções, ponto base e disponibilidade. Não há distância para configurar: a
        notificação vai para quem está a até 15 km do local da vaga (RN05). O perfil passa a receber
        notificações assim que tiver ao menos uma função e o ponto base. Conta de contratante é
        recusada com `422 perfil_incompativel` (RN25).

        Chamar numa conta que já tem perfil é `409 perfil_ja_existe`, e não sobrescrita: sobrescrever
        apagaria a grade semanal de quem tocasse duas vezes no botão. Para mudar, use
        `atualizar_perfil_profissional`.

        **Grade vazia é aceita.** `disponibilidades: []` cadastra o perfil sem nenhuma janela, e cabe
        ao app avisar que, assim, ele não vai receber notificação. Recusar obrigaria a pessoa a
        inventar uma grade para terminar o cadastro — e grade inventada é pior que grade vazia,
        porque produz despacho para quem não vai atender.

        Função fora do catálogo é `422 campo_invalido` com `details: funcoes`; latitude ou longitude
        fora da faixa, `campo_invalido` com `details: ponto_base`; `dia_semana` fora de 0..6 ou
        janela de duração zero, `campo_invalido` com `details: disponibilidades`.
      x-requisitos: [RF01, RF03, RN05, RN25, UC09]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DadosDoPerfilProfissional'
      responses:
        '200':
          description: Perfil criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilProfissional'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/meu_perfil_profissional:
    get:
      tags: [Cadastro e perfil]
      operationId: meuPerfilProfissional
      summary: Ler o próprio perfil de profissional
      x-requisitos: [RF03, RF16]
      responses:
        '200':
          description: Perfil do chamador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilProfissional'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /rpc/atualizar_perfil_profissional:
    post:
      tags: [Cadastro e perfil]
      operationId: atualizarPerfilProfissional
      summary: Alterar funções, ponto base ou disponibilidade
      description: |
        Os campos enviados substituem os atuais; os omitidos ficam como estão. A mudança vale na
        próxima notificação, sem novo login (RF03).

        **É substituição, não acréscimo.** `disponibilidades: []` limpa a grade; `funcoes: []` é
        `422 campo_obrigatorio` com `details: funcoes`, porque perfil sem função nenhuma não recebe
        vaga nenhuma. Chamada sem nenhum campo é `422 campo_obrigatorio` com `details: nenhum_campo`
        — é o que o `minProperties: 1` do schema já dizia, com o código que o cliente compara.
      x-requisitos: [RF03, UC09]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlteracaoDoPerfilProfissional'
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilProfissional'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/criterios_de_notificacao:
    get:
      tags: [Cadastro e perfil]
      operationId: criteriosDeNotificacao
      summary: Dados da tela "Por que recebo vagas"
      description: |
        Os critérios que decidem se o profissional recebe a notificação de uma vaga: função, grade
        semanal de disponibilidade e distância de até 15 km do ponto base, mais as equipes de confiança de que ele
        faz parte. O texto da tela é do app; a função devolve os dados (RF27, LGPD art. 20).
      x-requisitos: [RF27, RN05, RN06, RN23]
      responses:
        '200':
          description: Critérios em vigor para o chamador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CriteriosDeNotificacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/pedir_revisao_despacho:
    post:
      tags: [Cadastro e perfil]
      operationId: pedirRevisaoDespacho
      summary: Contestar o despacho ("Contestar" na tela "Por que recebo vagas")
      description: |
        Registra o pedido de revisão; a Equipe Frila responde por e-mail em até 5 dias úteis (RF27).

        Apenas 1 contestação por despacho pelo app (opção B, 0.2.37). Reenvio com contestação em
        análise ou respondida recebe `409 contestacao_ja_aberta`. Recurso posterior só por e-mail.
      x-requisitos: [RF27]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [relato]
              properties:
                relato:
                  type: string
                  minLength: 10
      responses:
        '200':
          description: Pedido registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Protocolo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  # ───────────────────────────────────────────── Estabelecimento

  /rpc/cadastrar_estabelecimento:
    post:
      tags: [Estabelecimento]
      operationId: cadastrarEstabelecimento
      summary: Cadastrar o estabelecimento
      description: |
        Cria o estabelecimento com o chamador como administrador. Aceita CNPJ ou CPF, porque serviço
        doméstico também contrata pelo Frila. `tipo` serve para leitura e filtro, nunca para barrar
        ninguém. `regiao_administrativa` é a Região Administrativa do DF onde o estabelecimento fica.
        Conta de profissional é recusada com `422 perfil_incompativel` (RN25).
      x-requisitos: [RF02, RF21, RN25, UC10]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoEstabelecimento'
      responses:
        '200':
          description: Estabelecimento criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estabelecimento'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/meus_estabelecimentos:
    get:
      tags: [Estabelecimento]
      operationId: meusEstabelecimentos
      summary: Estabelecimentos de que a conta é membro
      description: |
        A conta de contratante pode operar mais de um estabelecimento — a mesma pessoa cuida do bar
        e do buffet —, e toda tela do contratante precisa saber por qual delas está falando antes de
        chamar qualquer outra coisa. Sem esta operação, o app só descobre o `estabelecimento_id`
        cadastrando um novo, que é o caminho errado para quem já tem.

        Devolve o papel junto: o `operador` publica e acompanha as vagas da casa, mas não inclui nem
        remove profissionais da equipe de confiança, que é do `administrador` (RF18, RF21). A tela
        precisa esconder o que o servidor vai recusar com `403 sem_permissao`.

        Lista vazia é resposta legítima: conta de contratante recém-criada, antes do primeiro
        cadastro. Conta de **profissional** recebe `422 perfil_incompativel`, e não lista vazia — a
        tela leria vazio como "você não tem casas", que é outra frase.

        A lista vem **ordenada por nome**, para o seletor do app não trocar de posição entre duas
        aberturas da mesma tela. `reputacao` vem no mesmo formato do `PerfilPublico` de
        estabelecimento, da mesma função. Nenhum dado de cadastro sai aqui (RN10): sem documento,
        sem endereço, sem coordenada e sem contato — quem precisa do endereço e do ponto para
        publicar uma vaga chama `/rpc/meu_estabelecimento` (0.2.29).
      x-requisitos: [RF02, RF21, UC07]
      responses:
        '200':
          description: Estabelecimentos da conta, com o papel em cada um.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EstabelecimentoDaConta'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/meu_estabelecimento:
    get:
      tags: [Estabelecimento]
      operationId: meuEstabelecimento
      summary: O cadastro de um estabelecimento de que a conta é membro
      description: |
        O endereço, a Região Administrativa e o ponto do estabelecimento, para o app preencher a
        publicação de uma vaga (`NovaVaga.local`, `regiao_administrativa` e `ponto` vêm preenchidos
        com os do estabelecimento). Sem esta operação, só quem acabou de cadastrar tem esses dados,
        na resposta de `/rpc/cadastrar_estabelecimento`: quem volta ao app noutro dia não consegue
        publicar a segunda vaga.

        Só para **membro** do estabelecimento, administrador ou operador: os dois publicam vagas
        (RF21). `papel` é o de quem chama. Quem não é membro recebe `403 sem_permissao`, que é o
        que responde também quando o estabelecimento não existe, como em `/rpc/painel_estabelecimento`.
        Conta de profissional nunca é membro e recebe o mesmo `403`, e não o `422
        perfil_incompativel` de `/rpc/meus_estabelecimentos`.

        A resposta é o `MeuEstabelecimento`: o cadastro **sem o `documento`** (CNPJ ou CPF), para
        o administrador e para o operador (decisão de produto de 02/10/2026). A publicação não usa
        o documento, e ele não sai onde não é preciso (RN15). Também sem contato e sem os outros
        membros.
      x-requisitos: [RF02, RF04, RF21, RN02, RN15, UC01]
      parameters:
        - $ref: '#/components/parameters/EstabelecimentoId'
      responses:
        '200':
          description: O estabelecimento, sem o documento, com o papel de quem chama.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeuEstabelecimento'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'

  /rpc/equipe_de_confianca:
    get:
      tags: [Estabelecimento]
      operationId: equipeDeConfianca
      summary: Listar a equipe de confiança
      x-requisitos: [RF18, UC11]
      parameters:
        - $ref: '#/components/parameters/EstabelecimentoId'
      responses:
        '200':
          description: Profissionais da equipe.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PerfilPublico'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'

  /rpc/incluir_na_equipe:
    post:
      tags: [Estabelecimento]
      operationId: incluirNaEquipe
      summary: Incluir profissional na equipe de confiança
      description: |
        O profissional da equipe recebe a notificação das vagas do estabelecimento mesmo além de 15 km,
        desde que tenha a função e esteja disponível (RF18). Não há exclusividade de tempo nem ordem.
        Idempotente.

        Apenas o administrador do estabelecimento pode incluir profissionais na equipe (RF21). Exige que
        o profissional tenha cumprido ao menos um turno com presença verificada no estabelecimento (UC11);
        caso contrário, recusa com `403 sem_permissao` (`details: sem_turno_cumprido`).
      x-requisitos: [RF18, RN05, UC11]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembroDaEquipe'
      responses:
        '200':
          description: Profissional na equipe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembroDaEquipe'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/remover_da_equipe:
    post:
      tags: [Estabelecimento]
      operationId: removerDaEquipe
      summary: Remover profissional da equipe de confiança
      description: Sem penalidade nem aviso ao profissional (RN16). Idempotente.
      x-requisitos: [RF18, RN16, UC11]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembroDaEquipe'
      responses:
        '200':
          description: Profissional fora da equipe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembroDaEquipe'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  # ───────────────────────────────────────────── Catálogo

  /funcao:
    get:
      tags: [Catálogo]
      operationId: listarFuncoes
      summary: Catálogo de funções
      description: |
        Leitura direta da tabela (PostgREST), aberta a qualquer usuário autenticado. Catálogo fechado:
        função nunca é texto livre, para a elegibilidade de RN05 não virar busca por aproximação.
      x-requisitos: [RF03, RF04, RN05]
      parameters:
        - name: select
          in: query
          schema:
            type: string
            default: id,nome,categoria
        - name: ativo
          in: query
          description: 'Filtro do PostgREST. Use `eq.true`.'
          schema:
            type: string
            example: eq.true
      responses:
        '200':
          description: Funções.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Funcao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  # ───────────────────────────────────────────── Vagas

  /rpc/publicar_vaga:
    post:
      tags: [Vagas]
      operationId: publicarVaga
      summary: Publicar uma vaga
      description: |
        Grava a vaga, cria uma posição por unidade pedida e responde na hora. A notificação sai depois,
        pelo agendador, em até 30 segundos (RNF03); publicar não espera o despacho (B15).

        Recusas: campo obrigatório ausente (`campo_obrigatorio`, com o nome do campo em `details`,
        RN02); valor, número de posições, função ou coordenada que o campo trouxe e a regra não
        aceita (`campo_invalido`, com o campo em `details`); fim antes do início ou turno no passado
        (`horario_invalido`); texto com termo bloqueado em `local`, `regiao_administrativa`,
        `responsavel_local`, `traje` ou `observacoes` (`campo_invalido`, diretriz 1.2). Conta de profissional
        recebe `perfil_incompativel` (RN25); quem não é membro do estabelecimento recebe `403
        sem_permissao`, e é o que responde também quando o estabelecimento não existe; conta
        suspensa recebe `403 sem_permissao` com `details: conta_suspensa` (RN13).

        **Modo seleção (RN24), desde a 0.2.24:** `modo = selecao` é aceito quando o início está a
        mais de 24 horas; com 24 horas ou menos, `422 selecao_sem_antecedencia`. A vaga nova é
        notificada igual nos dois modos; no seleção, os candidatos ficam pendentes até a escolha
        (`escolher_candidato`). Até a 0.2.23 o modo seleção era recusado com `campo_invalido` e
        `details: modo`.

        `chave` torna o reenvio seguro: a mesma chave devolve a mesma vaga, com as mesmas posições,
        e não enfileira o despacho de novo.
      x-requisitos: [RF04, RF09, RN02, RN03, RN04, RN18, RN24, UC01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovaVaga'
      responses:
        '200':
          description: Vaga publicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VagaPublicada'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/republicar_posicoes_restantes:
    post:
      tags: [Vagas]
      operationId: republicarPosicoesRestantes
      summary: Republicar em urgência as posições que o modo seleção deixou vazias
      description: |
        O toque do aviso `selecao_encerrada` (D1-C). Quando a vaga de seleção fecha, 24 horas antes do
        início (RN24), as posições sem escolha são canceladas. Esta operação publica uma **vaga nova de
        urgência** com só essas posições, para o **mesmo turno** (mesmo início e fim) e o **mesmo valor**
        (RN01). O servidor decide modo, horário, valor e quantidade: não há campo para mudá-los. Quem
        quer outro horário usa `republicar_vaga`.

        As posições restantes são as da vaga de origem menos as já escolhidas (confirmadas ou
        cumpridas). O despacho da vaga nova é o de qualquer vaga (RN23). Quem foi escolhido na origem
        não se candidata à nova, porque o turno se cruza (RN21).

        Quem pode: membro do estabelecimento da vaga de origem, com perfil de contratante e conta
        ativa. Profissional recebe `422 perfil_incompativel` antes de qualquer leitura; vaga de outra
        casa, `403 sem_permissao`; origem inexistente, `404 nao_encontrado`; conta suspensa,
        `403 sem_permissao` com `details: conta_suspensa`; vaga de origem ocultada pela moderação,
        `422 vaga_oculta`, como em `republicar_vaga`.

        **Idempotente pela `chave`:** reenviar com a mesma chave devolve a mesma vaga nova. Enquanto
        houver uma republicação **ativa** da mesma origem (vaga nova `publicada` ou `preenchida`),
        outra é recusada com `republicacao_indisponivel` e `details: ja_republicada`. O limite geral de escrita por minuto
        vale, como em toda operação, e não é declarado aqui.

        Recusas por regra: `422 republicacao_indisponivel`, com o motivo em `details`:
        `nao_e_selecao` (a origem é de urgência), `selecao_em_curso` (ainda `publicada`),
        `vaga_cancelada`, `ja_comecou` (o início já passou), `sem_posicoes_restantes` e
        `ja_republicada`.
      x-requisitos: [RF05, RF09, RN24, UC01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vaga_id, chave]
              properties:
                vaga_id:
                  $ref: '#/components/schemas/Uuid'
                chave:
                  $ref: '#/components/schemas/ChaveDeIdempotencia'
      responses:
        '200':
          description: Vaga de urgência publicada com as posições restantes, ou a mesma de um reenvio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VagaPublicada'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/republicar_vaga:
    post:
      tags: [Vagas]
      operationId: republicarVaga
      summary: Republicar uma vaga anterior com nova data e horário
      description: |
        Copia todos os campos da vaga de origem e muda só início e fim (RF05). Mesmas recusas de
        `publicar_vaga` — literalmente as mesmas: a implementação delega a ela, em vez de manter uma
        segunda lista de validações que começaria igual e divergiria depois.

        Vaga de origem que não existe é `404 nao_encontrado`; vaga de outra casa é `403 sem_permissao`.
        A diferença é o oposto do critério de `detalhe_vaga`, e de propósito: quem republica veio da
        própria lista de vagas, então a existência já não é segredo para ele. Conta sem perfil de
        contratante recebe `422 perfil_incompativel` antes de qualquer leitura, para o código de erro
        não contar a um profissional se aquela vaga existe.

        `publicado_por` da vaga nova é **quem republicou** (RF04), e não quem publicou a de origem.
        `evento_id` não é copiado: `publicar_vaga` não o recebe.

        Vaga de origem ocultada pela moderação da Equipe Frila responde `422 vaga_oculta`: a cópia
        levaria o conteúdo moderado de volta à vitrine como vaga nova (0.2.23).
      x-requisitos: [RF05, UC01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vaga_id, inicio_em, fim_em, chave]
              properties:
                vaga_id:
                  $ref: '#/components/schemas/Uuid'
                inicio_em:
                  $ref: '#/components/schemas/Instante'
                fim_em:
                  $ref: '#/components/schemas/Instante'
                chave:
                  $ref: '#/components/schemas/ChaveDeIdempotencia'
      responses:
        '200':
          description: Nova vaga publicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VagaPublicada'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/cancelar_vaga:
    post:
      tags: [Vagas]
      operationId: cancelarVaga
      summary: Cancelar a vaga inteira
      description: |
        Cancela as posições abertas e as confirmadas, com motivo registrado (RN12). Profissionais já
        confirmados são avisados (`cancelamento`, com `reaberta = false`). Cancelamento pelo
        contratante não gera falta para ninguém.

        Reenvio idempotente (0.2.35): repetir a chamada após queda de rede pelo mesmo contratante
        autor do cancelamento original devolve `200` com o objeto da vaga já cancelada, sem reprocessar
        cancelamentos nem disparar notificações repetidas. Continua sendo `409 vaga_encerrada` se a
        vaga já começou, ou se foi cancelada por outro autor (outro membro da casa ou moderação).

        Motivo com menos de 3 caracteres é `422 campo_obrigatorio`, e motivo que o filtro da
        diretriz 1.2 recusa é `422 campo_invalido`, os dois com `details: motivo`. Vaga que não
        existe, ou de outra casa, é `404 nao_encontrado`. É do contratante: conta de profissional
        recebe `422 perfil_incompativel` (RN25).
      x-requisitos: [RF14, RN12]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vaga_id, motivo]
              properties:
                vaga_id:
                  $ref: '#/components/schemas/Uuid'
                motivo:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: Vaga cancelada.
          content:
            application/json:
              schema:
                type: object
                required: [vaga_id, estado, posicoes_canceladas]
                properties:
                  vaga_id:
                    $ref: '#/components/schemas/Uuid'
                  estado:
                    $ref: '#/components/schemas/EstadoVaga'
                  posicoes_canceladas:
                    type: integer
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/vagas_abertas:
    get:
      tags: [Vagas]
      operationId: vagasAbertas
      summary: Lista de vagas abertas do DF, das mais próximas para as mais distantes
      description: |
        Todas as vagas abertas, ordenadas pela distância até o ponto informado (ou até o ponto base do
        profissional, se nenhum for enviado). A distância aqui **ordena**, não filtra: o limite de
        15 km vale só para a notificação (B07). Vagas de estabelecimentos com bloqueio entre as partes
        não aparecem (RF26), nem a vaga ocultada pela moderação da Equipe Frila (diretriz 1.2, 0.2.23).
        A ordem não pode ser comprada (RN06).

        Vaga cujo início já passou não aparece (regra da 0.2.19, vale para toda vaga), com uma
        exceção: a que tem posição reaberta por atraso (`reabrir_por_atraso`) `aberta` continua na
        lista até `fim_em - 1 h` (decisão 8zLfn0mt, item 5) — o mesmo prazo em que `candidatar` a
        aceita. Depois do início, `posicoes_abertas` conta só essas posições reabertas.

        É a tela de quem procura turno: conta de contratante recebe `422 perfil_incompativel`.
        `limite` fora de 1..100 e `deslocamento` negativo são `422 campo_invalido` com o nome do
        parâmetro em `details`. Sem coordenada e sem ponto base no perfil, `422 campo_obrigatorio`
        com `details: latitude` — sem ponto de referência não há ordem.

        Conta de demonstração e conta real não se enxergam (diretrizes 2.1 e 4.2).
      x-requisitos: [RF07, RN05, RN06, RF26, UC03]
      parameters:
        - name: latitude
          in: query
          description: Posição de referência. Sem ela, vale o ponto base.
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: funcao_id
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: data
          in: query
          description: Dia do início, no fuso America/Sao_Paulo.
          schema:
            type: string
            format: date
        - name: distancia_max_km
          in: query
          description: Filtro opcional escolhido pelo profissional na busca.
          schema:
            type: number
            minimum: 0
        - name: limite
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: deslocamento
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Página da lista.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VagaNaLista'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/detalhe_vaga:
    get:
      tags: [Vagas]
      operationId: detalheVaga
      summary: Detalhe de uma vaga
      description: |
        Tudo o que o profissional vê antes de se candidatar (UC03, passo 2). Sem documento do
        estabelecimento e sem contato de ninguém: o telefone sai por `contato_do_turno`, depois da
        confirmação e dentro do prazo (RN10).

        Conta de contratante recebe `422 perfil_incompativel`. Vaga que o profissional não deveria
        alcançar — bloqueio entre as partes (RF26), conta de demonstração ou vaga ocultada pela
        moderação da Equipe Frila (diretriz 1.2) sem que ele ocupe posição ou tenha candidatura
        nela — responde `404 nao_encontrado`, e não `403`: o 403 confirmaria que ela existe. Quem
        ocupa posição ou tem candidatura na vaga ocultada recebe `200` com `oculta: true`, o mesmo
        que já vê em `minhas_candidaturas` ou `meus_turnos`.

        **Depois do início**, o detalhe continua respondendo `200`, com o `estado` real (o início
        não muda o estado da vaga: a `publicada` segue `publicada` até o fim). `posicoes_abertas` conta só as posições reabertas por atraso
        (`reabrir_por_atraso`) ainda antes de `fim_em - 1 h` (decisão 8zLfn0mt, item 5); fora
        desse prazo, ou sem reabertura, é `0`. Não há `404` por horário: o toque numa notificação
        antiga abre a vaga. A tela mostra o botão de candidatura só com `estado = publicada` e
        `posicoes_abertas > 0`, nunca pelo relógio do aparelho.
      x-requisitos: [RF04, RF16, RN02, UC03]
      parameters:
        - name: vaga_id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Vaga.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vaga'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  # ───────────────────────────────────────────── Candidatura e confirmação

  /rpc/candidatar:
    post:
      tags: [Candidatura e confirmação]
      operationId: candidatar
      summary: Candidatar-se a uma vaga
      description: |
        O profissional se candidata à vaga; o servidor escolhe a posição.

        - **Modo urgência:** o primeiro elegível que aceita é confirmado na hora, por escrita
          condicional no banco (RN19). A resposta já traz o turno e o contato da outra parte (RN10).
          O profissional e cada membro do estabelecimento recebem o aviso `confirmacao` (RF10).
        - **Modo seleção:** a candidatura fica pendente até o contratante escolher, com `posicao_id`,
          `turno_id` e `contato` nulos — a posição só é decidida na escolha. Ela vale até a vaga
          fechar, e a vaga fecha sozinha 24 horas antes do início se ninguém for escolhido (RN24); a
          partir daí a candidatura recebe `409 vaga_encerrada`. Reenviar devolve a mesma candidatura
          pendente, e a retirada volta a `pendente` quando o profissional se candidata de novo.

        **Conta suspensa não recebe `403`:** a candidatura é recusada por elegibilidade, com
        `422 inelegivel` e `details: perfil_suspenso` (RN13).

        As três respostas são normais: `200` (entrou), `409 posicao_ja_preenchida` (alguém chegou
        antes — a tela diz "que pena, foi rápido", não "algo deu errado") e `422 inelegivel`
        (`turno_sobreposto`, `perfil_suspenso` ou `funcao_incompativel`). Reenviar para a mesma vaga
        devolve o mesmo resultado.

        **Vaga `preenchida` também responde `posicao_ja_preenchida`**, e não `vaga_encerrada`: ela
        fechou porque encheu. `vaga_encerrada` fica para a vaga cancelada, encerrada ou cujo início
        já passou. Vaga escondida por bloqueio, por demonstração ou pela moderação da Equipe Frila
        (diretriz 1.2) responde `404 nao_encontrado`, igual a `detalhe_vaga`.

        **Exceção: posição reaberta por atraso** (`reabrir_por_atraso`) aceita candidatura após o
        início, até `fim_em - 1 h` (decisão 8zLfn0mt, item 5). A exceção é da posição: depois do
        início, o servidor só escolhe posição criada por `reabrir_por_atraso`, nunca uma posição
        original que ficou `aberta` sem ninguém. Vaga começada sem posição reaberta `aberta`
        dentro do prazo responde `409 vaga_encerrada`; perder a corrida pela posição reaberta é
        `409 posicao_ja_preenchida`. O valor continua o anunciado para o turno inteiro (RN01).
      x-requisitos: [RF08, RF09, RF10, RF11, RN03, RN10, RN19, RN21, RN24, UC03, UC04]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vaga_id]
              properties:
                vaga_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Candidatura registrada; no modo urgência, já confirmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoCandidatura'
              examples:
                urgencia:
                  summary: Modo urgência — ganhou a corrida
                  value:
                    estado: confirmada
                    candidatura_id: 6f1c2a4e-2b7d-4c5e-9a1f-3d2e1c0b9a88
                    posicao_id: 0b8a7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                    turno_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f0b8a7c6d
                    contato:
                      nome: Bar do Zé
                      telefone: '+5561999990000'
                      whatsapp_url: https://wa.me/5561999990000
                      visivel_ate: '2026-09-27T06:00:00Z'
                selecao:
                  summary: Modo seleção — aguardando a escolha
                  value:
                    estado: pendente
                    candidatura_id: 6f1c2a4e-2b7d-4c5e-9a1f-3d2e1c0b9a88
                    posicao_id: null
                    turno_id: null
                    contato: null
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/retirar_candidatura:
    post:
      tags: [Candidatura e confirmação]
      operationId: retirarCandidatura
      summary: Retirar a candidatura antes de ser escolhido
      description: |
        Sem penalidade (RN24). Candidatura já escolhida não se retira; vira cancelamento
        (`cancelar_posicao`). Retirar de novo devolve a mesma candidatura retirada; recusada ou
        expirada responde `409 candidatura_indisponivel`.

        É do profissional: conta de contratante recebe `422 perfil_incompativel` (RN25).
        `candidatura_id` nulo responde `422 campo_obrigatorio`, com `details: candidatura_id`
        (declarados na 0.2.32).
      x-requisitos: [RN16, RN24, RN25, UC04]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidatura_id]
              properties:
                candidatura_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Candidatura retirada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidatura'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/minhas_candidaturas:
    get:
      tags: [Candidatura e confirmação]
      operationId: minhasCandidaturas
      summary: Candidaturas do profissional
      description: |
        A candidatura pendente numa vaga ocultada pela moderação da Equipe Frila continua listada e
        pendente (0.2.23); o detalhe da vaga abre para quem a tem, com `oculta: true`.

        Desde a 0.2.32, a candidatura `aceita` traz `turno_id`, o turno que nasceu dela: é por
        ele, e não pela vaga, que a tela chega ao turno em `/rpc/meus_turnos`.

        É do profissional: conta de contratante recebe `422 perfil_incompativel` (RN25, declarado
        na 0.2.32).
      x-requisitos: [RF08, RN25, UC04]
      parameters:
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoCandidatura'
      responses:
        '200':
          description: Candidaturas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Candidatura'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/candidatos_da_vaga:
    get:
      tags: [Candidatura e confirmação]
      operationId: candidatosDaVaga
      summary: Candidatos de uma vaga no modo seleção
      description: |
        Com reputação, denominador e taxa de comparecimento de cada um (RN08, UC04). **Em ordem de
        chegada, sem outra ordenação** (RN06); `da_equipe` (0.2.38) marca quem está na equipe de
        confiança da casa e serve só para o selo "da sua equipe", nunca para ordenar. Continua legível
        pela casa quando a vaga foi ocultada pela moderação da Equipe Frila; escolher é que é
        recusado (`escolher_candidato`, `422 vaga_oculta`).

        É do contratante: conta de profissional recebe `422 perfil_incompativel` (RN25). `vaga_id`
        nulo responde `422 campo_obrigatorio`, com `details: vaga_id` (declarados na 0.2.32).
      x-requisitos: [RF09, RF16, RN08, RN25, UC04]
      parameters:
        - name: vaga_id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Candidatos pendentes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Candidato'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/escolher_candidato:
    post:
      tags: [Candidatura e confirmação]
      operationId: escolherCandidato
      summary: Escolher um candidato no modo seleção
      description: |
        Confirma o candidato numa posição aberta da vaga, com a mesma escrita condicional do modo
        urgência (RN19). Respostas: `200` com o turno e o contato do profissional; `409
        posicao_ja_preenchida` se todas as posições já foram ocupadas; `409 candidatura_indisponivel`
        se o candidato retirou ou a candidatura expirou; `422 inelegivel` com `turno_sobreposto` se ele
        foi confirmado em outro turno que se cruza com este (RN21); `422 vaga_oculta` se a vaga foi
        ocultada pela moderação da Equipe Frila — a candidatura segue pendente, e a escolha volta a
        valer se a Equipe reexibir a vaga (0.2.23).

        Só membro do estabelecimento escolhe (`403 sem_permissao`). Candidatura já escolhida responde
        `409 candidatura_indisponivel`; vaga fechada pelas 24 horas (RN24), cancelada ou encerrada,
        `409 vaga_encerrada`. O escolhido recebe o aviso `confirmacao`; quando a escolha ocupa a
        última posição, as candidaturas ainda pendentes passam a `recusada`, com o aviso
        `candidatura_recusada`.
      x-requisitos: [RF09, RF10, RF11, RN10, RN19, RN21, UC04]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidatura_id]
              properties:
                candidatura_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Profissional confirmado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoConfirmacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  # ───────────────────────────────────────────── Turno

  /rpc/meus_turnos:
    get:
      tags: [Turno]
      operationId: meusTurnos
      summary: Turnos do chamador, como profissional ou como estabelecimento
      description: |
        Base do histórico (UC13) e da leitura offline por 24 horas (RNF06).

        Hoje e os próximos primeiro, do mais próximo para o mais distante; os anteriores depois, do
        mais recente para o mais antigo. Com `estabelecimento_id`, quem pergunta precisa ser membro
        da casa — senão `403 sem_permissao`. Conta de contratante **sem** `estabelecimento_id`
        recebe lista vazia, e não erro.

        Nenhum telefone sai por aqui: o contato sai por `contato_do_turno`, que confere o prazo de
        RN10. `contato_visivel_ate` vem em cada turno para que a tela saiba se pode oferecer o botão
        antes de tocá-lo.

        **O turno cancelado continua na lista** (RN12): o cancelamento não apaga o registro do que
        foi combinado. Desde a 0.2.31 ele vem com `estado: cancelada`, e é por esse campo que a tela
        o separa do turno de pé. Cada turno traz também `avaliacao`, a que este lado já deu.

        Desde a 0.2.32, o turno cancelado traz `cancelamento`: a causa, se contou como falta e o
        instante. O texto que alguém escreveu ao cancelar não sai por aqui, para nenhum dos dois
        lados.
      x-requisitos: [RF13, RF14, RF15, RF22, RN12, RNF06, UC13]
      parameters:
        - name: de
          in: query
          schema:
            $ref: '#/components/schemas/Instante'
        - name: ate
          in: query
          schema:
            $ref: '#/components/schemas/Instante'
        - name: estabelecimento_id
          in: query
          description: Para membros de estabelecimento. Sem ele, valem os turnos do chamador como profissional.
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Turnos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Turno'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'

  /rpc/contato_do_turno:
    get:
      tags: [Turno]
      operationId: contatoDoTurno
      summary: Contato da outra parte do turno
      description: |
        Só existe depois da confirmação e só até 7 dias depois do fim do turno (RN10). A base legal é
        a execução do contrato (LGPD, art. 7º, V). Depois do prazo, `403 contato_expirado`, para os
        dois lados; o sétimo dia conta inteiro.

        Token de conta encerrada/anonimizada não lê contatos (RF25, RNF08): a verificação de conta
        ativa roda antes de qualquer leitura e recusa com `401 nao_autenticado`.

        Todo o resto é `404 nao_encontrado`: antes da confirmação, para quem não é nenhum dos dois
        lados, e quando há bloqueio entre as partes. Um `403` confirmaria que aquele turno existe a
        quem não deveria saber.
      x-requisitos: [RF11, RF25, RN10, RNF08]
      parameters:
        - name: turno_id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Contato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contato'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/ParametroObrigatorio'

  /rpc/avisar_a_caminho:
    post:
      tags: [Turno]
      operationId: avisarACaminho
      summary: Profissional avisa que está a caminho do turno
      description: |
        Ação "Estou a caminho" disparada pela notificação de 3 horas antes do início ou pelo botão
        correspondente na tela Meu turno (US14, RF12). Não altera presença, taxa de comparecimento
        nem substitui o check-in: é um sinal operacional visível pelo contratante no acompanhamento
        do turno (`painel_estabelecimento`).

        Só o profissional confirmado no turno pode chamar (`403 sem_permissao`). A janela permitida
        vai de 3 horas antes do início previsto até 15 minutos depois do início; fora dessa janela,
        a chamada é recusada com `422 a_caminho_fora_da_janela`.

        Idempotente: chamar uma segunda vez não altera o instante já gravado e devolve o mesmo
        registro com o `a_caminho_em` original.
      x-requisitos: [RF12, US14]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [turno_id]
              properties:
                turno_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Aviso registrado com sucesso ou retorno do registro já gravado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoACaminho'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/fazer_checkin:
    post:
      tags: [Turno]
      operationId: fazerCheckin
      summary: Registrar o check-in
      description: |
        O app lê a localização **só no toque**, nunca em segundo plano, calcula no aparelho a distância
        até o endereço da vaga e envia só a distância, nunca a coordenada (RN22, minimização da LGPD).

        - Distância de até 200 m: check-in `geolocalizado`, presença `verificado` na hora.
        - Sem localização (sem sinal, permissão negada, GPS impreciso) ou a mais de 200 m: envie
          `distancia_m` nulo ou a distância medida; o check-in vira `manual` e a presença fica
          `pendente` até o contratante confirmar (`confirmar_checkin_manual`).

        Os membros do estabelecimento recebem o aviso `checkin` (presença verificada) ou
        `checkin_manual_pendente` (pedido de confirmação). O reenvio não avisa de novo (RF13).

        `registrado_em` é a hora do toque, e não a da sincronização: o check-in feito sem rede entra na
        fila do app e sai depois com a hora certa. O banco recusa hora no futuro. Reenviar devolve o
        registro já gravado.

        Turno que não existe, ou que não é de quem chama, é `404 nao_encontrado`. Check-in em
        posição já cancelada (por exemplo, o que esperava na fila do app quando a posição foi
        cancelada) é `409 vaga_encerrada` com `details: posicao_cancelada`; a trava é um gatilho do
        banco.
      x-requisitos: [RF13, RN11, RN22, UC05]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroDePresenca'
      responses:
        '200':
          description: Check-in registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoRegistro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/confirmar_checkin_manual:
    post:
      tags: [Turno]
      operationId: confirmarCheckinManual
      summary: Contratante confirma o check-in manual
      description: |
        Um toque, no app ou no Painel web. Só então o check-in manual conta como presença (RN22).

        Turno que não existe é `404 nao_encontrado`.
      x-requisitos: [RF13, RF20, RN22, UC05, UC07]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [turno_id]
              properties:
                turno_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Presença verificada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoRegistro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/ParametroObrigatorio'

  /rpc/fazer_checkout:
    post:
      tags: [Turno]
      operationId: fazerCheckout
      summary: Registrar o check-out
      description: |
        Mesma regra do check-in: localização lida só no toque e só a distância enviada. Sem
        localização, `distancia_m` vai nulo. O Frila não calcula hora extra: se o fim previsto passou,
        os dois já foram avisados pelo agendador, e o valor fica entre as partes (A09).

        Turno que não existe, ou que não é de quem chama, é `404 nao_encontrado`.
      x-requisitos: [RF13, RN11, RN22, UC05]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroDePresenca'
      responses:
        '200':
          description: Check-out registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoRegistro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/cancelar_posicao:
    post:
      tags: [Turno]
      operationId: cancelarPosicao
      summary: Cancelar uma posição confirmada
      description: |
        Qualquer das partes, com motivo (RN12). Antes do início, a posição cancelada é substituída por
        uma nova, aberta, e a notificação sai de novo em até 30 segundos. Depois do início, não há
        reabertura, e o contratante é avisado de que o turno ficou descoberto.

        Só a outra parte recebe o aviso `cancelamento`, com `reaberta` no payload: `false` quando
        o turno ficou descoberto, para a casa distinguir da posição que voltou para a fila.

        Cancelamento do profissional com menos de 24 horas do início conta como falta; com mais de 24
        horas, sai da taxa de comparecimento. Nenhum cancelamento suspende ninguém (RN13).

        Reenvio idempotente (0.2.35): repetir a chamada após queda de rede pelo mesmo autor do
        cancelamento (o próprio profissional, ou o mesmo membro da casa) devolve `200` com o
        objeto `ResultadoCancelamento`, sem duplicar penalidade na taxa de comparecimento, ocorrências,
        notificações ou abertura de posições substitutas. Continua sendo `409 posicao_nao_cancelavel`
        se a posição está aberta sem confirmação, se o turno já está em andamento ou cumprido, ou
        se foi cancelada pela outra parte.

        Motivo com menos de 3 caracteres é `422 campo_obrigatorio`, e motivo que o filtro da
        diretriz 1.2 recusa é `422 campo_invalido`, os dois com `details: motivo`: a tela pede para
        reescrever, e não para tentar de novo. Posição que não existe, ou de que quem chama não é
        parte (nem o profissional nem membro da casa), é `404 nao_encontrado`: a diferença diria a
        um estranho que a posição existe.
      x-requisitos: [RF14, RN12, RN13, RN16, UC08]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [posicao_id, motivo]
              properties:
                posicao_id:
                  $ref: '#/components/schemas/Uuid'
                motivo:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: Cancelamento registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoCancelamento'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/reabrir_por_atraso:
    post:
      tags: [Turno]
      operationId: reabrirPorAtraso
      summary: Reabrir a vaga quando o profissional não chegou
      description: |
        Aos 15 minutos do início sem check-in, o contratante recebe o alerta e decide esperar ou
        reabrir (D06). Reabrir marca falta do profissional e abre uma nova posição, que é notificada de
        novo. Antes dos 15 minutos: `422 reabertura_antes_da_tolerancia`. Com check-in já feito: `409`.
      x-requisitos: [RF13, RF14, RN12, UC05, UC08]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [posicao_id]
              properties:
                posicao_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Vaga reaberta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoCancelamento'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  # ───────────────────────────────────────────── Avaliação e reputação

  /rpc/avaliar:
    post:
      tags: [Avaliação e reputação]
      operationId: avaliar
      summary: Avaliação binária depois do turno
      description: |
        Uma pergunta só: "Você chamaria essa pessoa de novo?" (contratante) ou "Você trabalharia nesse
        local de novo?" (profissional). Sim ou não; nunca nota de 1 a 5 (RN07).

        Só abre depois do fim previsto e só para turno com presença verificada — check-in
        geolocalizado ou manual confirmado. Quem faltou não é avaliado. Recusas: `422
        avaliacao_indisponivel` com `antes_do_fim` ou `sem_presenca_verificada`. Reenviar a mesma
        resposta devolve a avaliação gravada; resposta diferente dá `409 avaliacao_ja_registrada`.

        **Um voto por lado do turno, e não por pessoa.** Um estabelecimento tem vários membros, e
        dois deles votando no mesmo turno dariam à casa dois votos sobre o mesmo profissional. O
        operador que reenvia a resposta que o administrador já gravou recebe `200` com a avaliação
        **do lado dele**; com resposta diferente, `409`. É o mesmo que `Turno.pode_avaliar` já
        descrevia. Desde a 0.2.31 a avaliação gravada volta também em `Turno.avaliacao`, para a
        tela mostrar a resposta já dada sem depender do que o aparelho guardou.

        Turno que não existe recebe o mesmo `403 sem_permissao` de turno alheio: a diferença diria a
        um estranho que aquele turno existe. `turno_id` ausente é `422 campo_obrigatorio` com
        `details: turno_id`, e conta suspensa é `403 sem_permissao` com `details: conta_suspensa`
        (RN13).
      x-requisitos: [RF15, RN07, RN08, RN22, UC06]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [turno_id, resposta]
              properties:
                turno_id:
                  $ref: '#/components/schemas/Uuid'
                resposta:
                  type: boolean
      responses:
        '200':
          description: Avaliação registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Avaliacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/perfil_publico:
    get:
      tags: [Avaliação e reputação]
      operationId: perfilPublico
      summary: Perfil público de um profissional ou estabelecimento
      description: |
        Reputação sempre com denominador ("7 de 7 chamariam de novo") e taxa de comparecimento com o
        total de turnos considerados (RN08, RF16). Perfil sem histórico vem com `total = 0` e taxa nula
        — a tela mostra "Sem histórico", nunca nota zero. Nenhum dado de contato aparece aqui (RN10).

        Conta anonimizada (RF25) devolve `nome: "Conta encerrada"`. O turno e a avaliação sobrevivem à
        exclusão porque pertencem também à contraparte; o nome, não.

        Bloqueio (RF26, 0.2.28): entre partes bloqueadas, nos dois sentidos, o perfil responde
        `404 nao_encontrado`, igual a um id que não existe. Vale também quando a outra parte é
        membro do estabelecimento consultado. O cliente mostra "perfil indisponível" e não revela
        que houve bloqueio.
      x-requisitos: [RF16, RN08]
      parameters:
        - name: id
          in: query
          required: true
          description: Id do profissional ou do estabelecimento.
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Perfil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilPublico'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  # ───────────────────────────────────────────── Painel do gestor

  /rpc/painel_estabelecimento:
    get:
      tags: [Painel do gestor]
      operationId: painelEstabelecimento
      summary: Vagas, candidatos, contratados, check-ins e turnos do estabelecimento
      description: |
        A mesma leitura atende o Painel da versão web e a tela de acompanhamento do app. Traz os
        alertas que o agendador já disparou por notificação: vaga ainda vazia dentro da janela crítica
        (padrão de 3 horas antes do início, ajustável na publicação) e atraso de 15 minutos sem
        check-in. Não existe operador do Frila olhando esta tela (D01).

        Cada posição no painel expõe `a_caminho_em` (US14, 0.2.25), permitindo acompanhar se o
        profissional confirmado já sinalizou deslocamento.

        Desde a 0.2.31, cada posição traz também a hora e o tipo do check-in e a hora da
        confirmação manual (`checkin_em`, `checkin_tipo`, `checkin_confirmado_em`), e a posição
        cancelada que chegou a ter profissional traz `cancelamento`: a causa, se contou como falta,
        o texto de quem cancelou e o instante (RN12).
      x-requisitos: [RF20, RF13, RF14, RN12, UC07]
      parameters:
        - $ref: '#/components/parameters/EstabelecimentoId'
        - name: de
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Instante'
        - name: ate
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Instante'
      responses:
        '200':
          description: Painel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Painel'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '422':
          $ref: '#/components/responses/ParametroObrigatorio'

  # ───────────────────────────────────────────── Confiança e direitos

  /rpc/denunciar:
    post:
      tags: [Confiança e direitos]
      operationId: denunciar
      summary: Denunciar outro usuário
      description: |
        Registra a denúncia e a envia à Equipe Frila, que responde por e-mail em até 5 dias úteis.
        Denúncia grave confirmada (assédio, fraude ou documento falso) leva à suspensão, com motivo
        registrado e direito de contestar (RN13). Fraude e documento falso chegam pelo motivo `outro`,
        com o relato, e a Equipe Frila apura (decisão de produto de 30/09). Em risco imediato, o app mostra os atalhos para o 190
        e o 180 sem esperar a resposta. Exigência da diretriz 1.2 da App Store.

        Recusas: campo obrigatório ausente (`campo_obrigatorio`, com o nome do campo em `details`:
        `alvo_tipo`, `alvo_id`, `motivo`, `relato` ou `chave`, RF26); valor recusado pela regra
        (`campo_invalido`, com o campo em `details`: `alvo_tipo` fora do enum, `alvo_id` não UUID,
        `motivo` fora do enum `MotivoDenuncia`, `relato` com menos de 10 caracteres ou `chave` não UUID).
      x-requisitos: [RF26, RN13, RN15, UC17]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alvo_tipo, alvo_id, motivo, relato, chave]
              properties:
                alvo_tipo:
                  $ref: '#/components/schemas/TipoDeAlvo'
                alvo_id:
                  description: |
                    O `id` do `PerfilPublico` da outra parte, como ele chegou ao app. O servidor
                    resolve a conta a partir do par `alvo_tipo` + `alvo_id`.
                  $ref: '#/components/schemas/Uuid'
                turno_id:
                  oneOf:
                    - $ref: '#/components/schemas/Uuid'
                    - type: 'null'
                motivo:
                  $ref: '#/components/schemas/MotivoDenuncia'
                relato:
                  type: string
                  minLength: 10
                chave:
                  $ref: '#/components/schemas/ChaveDeIdempotencia'
      responses:
        '200':
          description: Denúncia registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Protocolo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/abrir_suporte:
    post:
      tags: [Confiança e direitos]
      operationId: abrirSuporte
      summary: Abrir um chamado de suporte a partir de um turno
      description: |
        Registra o chamado e devolve o `Protocolo`, com o prazo de até 5 dias úteis. **Não envia
        e-mail**: o app chama esta operação e em seguida abre o e-mail do aparelho para
        `suporte@frila.app`, com o protocolo curto no assunto, no formato
        `[Frila Suporte #<protocolo curto>]`. O texto da pessoa vai só nesse e-mail, e o Frila não o
        guarda no banco (RN15). Sem atendimento ao vivo (RF23). Em risco imediato, o app mostra os
        atalhos para o 190 e o 180 sem esperar a resposta (UC14).

        Quem pode chamar: o profissional do turno, ou um membro do estabelecimento da vaga, com
        a conta ativa. A conta suspensa recebe `403 sem_permissao` com `details: conta_suspensa`;
        o canal dela é a contestação (`/rpc/contestar_suspensao`) ou o e-mail direto.

        **Idempotente pela `chave`:** reenviar com a mesma chave devolve o mesmo `Protocolo` e não
        abre outro chamado, e esse reenvio não conta para o limite diário.

        **Limite diário (0.2.40):** no máximo 5 chamados novos por conta por dia (dia de
        America/Sao_Paulo). O 5 é um valor inicial, ajustável sem mudar o contrato, a reavaliar com
        dados do piloto. O seguinte recebe `429 limite_excedido`. O limite por minuto de toda
        escrita (RNF07) continua valendo à parte.

        Recusas: `campo_obrigatorio` com o campo em `details` (`turno_id`, `categoria` ou `chave`);
        `campo_invalido` com `details: categoria` quando fora do enum `CategoriaSuporte`; `404
        nao_encontrado` quando o turno não existe **ou não é do chamador**, sem distinguir os dois
        casos.
      x-requisitos: [RF23, RN15, UC14]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [turno_id, categoria, chave]
              properties:
                turno_id:
                  $ref: '#/components/schemas/Uuid'
                categoria:
                  $ref: '#/components/schemas/CategoriaSuporte'
                chave:
                  $ref: '#/components/schemas/ChaveDeIdempotencia'
      responses:
        '200':
          description: Chamado aberto, ou o mesmo chamado de um reenvio com a mesma `chave`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Protocolo'
              example:
                ocorrencia_id: 6f1c2a4e-2b7d-4c5e-9a1f-3d2e1c0b9a88
                tipo: suporte
                criada_em: '2026-10-08T14:00:00Z'
                prazo_resposta_ate: '2026-10-15'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'
        '429':
          $ref: '#/components/responses/LimiteExcedido'

  /rpc/bloquear:
    post:
      tags: [Confiança e direitos]
      operationId: bloquear
      summary: Bloquear outro usuário
      description: |
        Imediato e automático, sem depender da Equipe Frila. Vale nos dois sentidos: as partes não
        voltam a se cruzar em notificação, lista ou candidatura. Quando uma delas é membro de
        estabelecimento, vale para as vagas do estabelecimento inteiro. Idempotente.

        Recusas: campo obrigatório ausente (`campo_obrigatorio`, com o nome do campo em `details`:
        `alvo_tipo` ou `alvo_id`, RF26); valor recusado pela regra (`campo_invalido`, com o campo em
        `details`: `alvo_tipo` fora do enum, `alvo_id` não UUID ou tentativa de bloquear a si mesmo).
      x-requisitos: [RF26, UC17]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alvo_tipo, alvo_id]
              properties:
                alvo_tipo:
                  $ref: '#/components/schemas/TipoDeAlvo'
                alvo_id:
                  description: O `id` do `PerfilPublico` da outra parte, como ele chegou ao app.
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Bloqueio em vigor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bloqueio'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/situacao_da_conta:
    get:
      tags: [Confiança e direitos]
      operationId: situacaoDaConta
      summary: Situação da conta e da suspensão, se houver
      description: |
        Mostra ao titular o motivo e a data da suspensão, e o protocolo da contestação vinculada à
        suspensão em vigor, esteja ela em análise ou já respondida pela Equipe Frila (decisão de produto,
        opção B) (RF24, RN13). O resultado da análise do suporte não é exposto no app (RN07), e eventual
        recurso adicional é tratado exclusivamente por e-mail, sem reenvio pelo aplicativo.
      x-requisitos: [RF24, RN13, UC15]
      responses:
        '200':
          description: Situação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SituacaoDaConta'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /rpc/contestar_suspensao:
    post:
      tags: [Confiança e direitos]
      operationId: contestarSuspensao
      summary: Contestar a suspensão
      description: |
        Vai à Equipe Frila, com resposta em até 5 dias úteis. Se a contestação for aceita, a conta volta
        na hora (RN13). Sem suspensão em vigor: `422 sem_suspensao_ativa`.

        Relato vazio é `422 campo_obrigatorio`; relato com menos de 10 caracteres, ou que o filtro
        da diretriz 1.2 recusa, é `422 campo_invalido`, os dois com `details: relato`.

        Uma contestação por suspensão (opção B, 0.2.36): quem já contestou a suspensão em vigor,
        com a contestação em análise ou já respondida, recebe `409 contestacao_ja_aberta`. Depois de
        respondida não há reenvio pelo app; o eventual recurso é por e-mail e não aparece no app.
      x-requisitos: [RF24, RN13, UC15]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [relato]
              properties:
                relato:
                  type: string
                  minLength: 10
      responses:
        '200':
          description: Contestação registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Protocolo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  # ───────────────────────────────────────────── Dispositivos

  /rpc/registrar_dispositivo:
    post:
      tags: [Dispositivos]
      operationId: registrarDispositivo
      summary: Registrar o token de push do aparelho
      description: |
        O agendador manda o push pelo FCM, que no iOS entrega pelo APNs (B17). Chamar a cada abertura do
        app e sempre que o token mudar. O mesmo token reenviado só atualiza a data. Quem recusou a
        permissão de notificação não registra token e, para o despacho, não é alcançável.

        **Conta suspensa registra normalmente** (`200`): RN15 não exige conta ativa para registrar o
        token do aparelho. Esta operação não responde `403`.

        A resposta traz o `vinculo_id` deste token com a conta que chama. O mesmo id vem em todo
        push mandado a este aparelho para esta conta, e é por ele que o app sabe que o aviso é de
        quem está no aparelho: o token que era de outra conta passa para quem chama com um
        `vinculo_id` novo, e o aviso que ainda carrega o anterior não é mostrado nem aberto (RN15).
      x-requisitos: [RF06, RN15, RNF02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token_fcm, plataforma]
              properties:
                token_fcm:
                  type: string
                  minLength: 20
                plataforma:
                  $ref: '#/components/schemas/Plataforma'
      responses:
        '200':
          description: Dispositivo registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispositivo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/remover_dispositivo:
    post:
      tags: [Dispositivos]
      operationId: removerDispositivo
      summary: Tirar o token de push do aparelho
      description: |
        Chamada no logout, e em todo caminho que encerra a sessão naquele aparelho. Sem ela, o
        token continua registrado para a conta anterior: o aparelho passa a receber push de vagas
        de alguém que não está mais logado nele — que é vazamento de dado pessoal por notificação,
        e RN15 proíbe.

        Idempotente: token que não está registrado devolve `200` igual. O app não precisa saber se
        chegou a registrar.
      x-requisitos: [RF06, RN15, RNF02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token_fcm]
              properties:
                token_fcm:
                  type: string
                  minLength: 20
      responses:
        '200':
          description: O token não está mais registrado para esta conta.
          content:
            application/json:
              schema:
                type: object
                required: [removido]
                properties:
                  removido:
                    type: boolean
                    description: Falso quando o token já não estava registrado. A ação deu no mesmo.
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /rpc/registrar_evento:
    post:
      tags: [Telemetria]
      operationId: registrarEvento
      summary: Registrar um evento do dicionário de métricas
      description: |
        Só eventos do dicionário fechado (`EventoDeTelemetria`), e só identificadores no corpo.
        Texto livre não entra: RN15 proíbe dado pessoal em log, e um campo aberto de telemetria é
        por onde o dado pessoal entra — alguém manda o nome do profissional "só para depurar" e
        ninguém revisa de novo.

        A lista fechada não é burocracia: é o que torna a proibição verificável. Evento fora dela é
        recusado com `422 campo_invalido`, `details: evento`.

        Não substitui o log do servidor. Serve para o que só o app sabe: que a tela apareceu, que a
        permissão foi negada, que a ação entrou na fila offline.
      x-requisitos: [RN15, RNF08]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evento]
              properties:
                evento:
                  $ref: '#/components/schemas/EventoDeTelemetria'
                vaga_id:
                  oneOf:
                    - $ref: '#/components/schemas/Uuid'
                    - type: 'null'
                turno_id:
                  oneOf:
                    - $ref: '#/components/schemas/Uuid'
                    - type: 'null'
                ocorrido_em:
                  description: |
                    Quando o app registrou o evento. Existe por causa da fila offline, que envia
                    depois — sem ele, um dia inteiro de uso sem rede chegaria carimbado com a hora
                    da reconexão. O servidor recusa instante adiante do próprio relógio com
                    `422 registro_no_futuro`.
                  $ref: '#/components/schemas/Instante'
      responses:
        '200':
          description: Evento registrado.
          content:
            application/json:
              schema:
                type: object
                required: [registrado]
                properties:
                  registrado:
                    type: boolean
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  # ───────────────────────────────────────────── Exportação e conta (Edge Functions)

  /exportar-turnos:
    servers:
      - url: https://{projeto}.supabase.co/functions/v1
        variables:
          projeto:
            default: frila
    post:
      tags: [Exportação e conta]
      operationId: exportarTurnos
      summary: Exportar os turnos de um período em CSV ou PDF
      description: |
        Data, função, horários registrados, valor acordado e contraparte de cada turno (RF22, RN17). O
        valor é o acordado e registrado, nunca um pagamento processado pelo Frila (RN09). Turno "não
        verificado" sai marcado como tal.

        Os parâmetros `de` e `ate` são opcionais: se omitidos, assume-se o padrão dos últimos 15 dias.
        O intervalo entre `de` e `ate` não pode exceder 30 dias (janela regulamentar, pd7zOS5P).

        Corpo incompleto ou inválido é `422`: `campo_obrigatorio` quando falta `formato`;
        `intervalo_maximo_excedido` quando o intervalo entre `de` e `ate` for superior a 30 dias;
        `campo_invalido` quando o instante não é ISO-8601, quando `de` vem depois de `ate`
        (com `details: de`), quando o formato não é `csv` nem `pdf`, ou quando `estabelecimento_id`
        não é um uuid. Método que não é POST é `405 metodo_nao_permitido`.
      x-requisitos: [RF22, RN09, RN17, UC13]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [formato]
              properties:
                de:
                  description: Início do período (ISO-8601). Opcional; default dos últimos 15 dias se omitido.
                  $ref: '#/components/schemas/Instante'
                ate:
                  description: Fim do período (ISO-8601). Opcional; default dos últimos 15 dias se omitido.
                  $ref: '#/components/schemas/Instante'
                formato:
                  type: string
                  enum: [csv, pdf]
                estabelecimento_id:
                  description: Para membros de estabelecimento. Sem ele, valem os turnos do chamador como profissional.
                  oneOf:
                    - $ref: '#/components/schemas/Uuid'
                    - type: 'null'
      responses:
        '200':
          description: Arquivo gerado.
          content:
            text/csv:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
        '204':
          description: O período não tem turnos; nenhum arquivo vazio é gerado (UC13, 1a).
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '405':
          $ref: '#/components/responses/MetodoNaoPermitido'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /exportar-meus-dados:
    servers:
      - url: https://{projeto}.supabase.co/functions/v1
        variables:
          projeto:
            default: frila
    post:
      tags: [Exportação e conta]
      operationId: exportarMeusDados
      summary: Exportar os dados pessoais do titular
      description: |
        Devolve o JSON **no corpo da resposta**, e não um link para baixar depois. Um link é mais
        um lugar onde o dado pessoal fica em repouso, com prazo de validade que alguém precisa
        lembrar de configurar; o corpo da resposta morre com a conexão.

        O conteúdo é o que a LGPD chama de portabilidade: o que o titular forneceu e o que o
        sistema registrou sobre ele. As avaliações **recebidas** entram sem o autor — a resposta
        individual não é do titular, e revelá-la convidaria à retaliação, que é o que RN07 evita
        ao manter a avaliação binária e agregada.

        Sessão sem conta (antes de `criar_conta`) é `404 nao_encontrado`. Método que não é POST é
        `405 metodo_nao_permitido`.
      x-requisitos: [RF25, RNF08, UC16]
      responses:
        '200':
          description: Os dados pessoais do chamador, no corpo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeusDados'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '405':
          $ref: '#/components/responses/MetodoNaoPermitido'

  /entrar-demonstracao:
    servers:
      - url: https://{projeto}.supabase.co/functions/v1
        variables:
          projeto:
            default: frila
    post:
      tags: [Exportação e conta]
      operationId: entrarDemonstracao
      summary: Entrada da conta de demonstração da revisão da App Store
      description: |
        A App Store exige que o revisor consiga usar o app inteiro, e o Frila entra por código no
        e-mail — o revisor não tem acesso à caixa de entrada de ninguém. Sem esta porta, a revisão
        para na primeira tela (diretriz 2.1).

        Aceita **um** e-mail, declarado no App Store Connect, com um código fixo guardado como
        segredo da função. Devolve a mesma `Sessao` do fluxo normal; daí para a frente o app não
        sabe que a conta é de demonstração.

        **O que esta porta não faz:** não cria conta, não aceita e-mail que não seja o declarado, e
        não existe fora da Edge Function — não há RPC equivalente, porque uma função do Postgres
        com esse poder ficaria exposta em `rest/v1` para qualquer um tentar. A conta é de
        profissional, tem dados de demonstração e não recebe push.

        Roda como Edge Function porque emite sessão, e emitir sessão é trabalho do Supabase Auth,
        não do Postgres.
      security:
        - chaveDoProjeto: []
      x-requisitos: [RF01, RNF08]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, codigo]
              properties:
                email:
                  type: string
                  format: email
                  description: O endereço declarado no App Store Connect. Qualquer outro recebe `404 nao_encontrado`.
                codigo:
                  type: string
                  description: Código fixo da revisão, guardado como segredo da função. Não é o código de 6 dígitos do e-mail.
      responses:
        '200':
          description: Sessão da conta de demonstração.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'

  /excluir-conta:
    servers:
      - url: https://{projeto}.supabase.co/functions/v1
        variables:
          projeto:
            default: frila
    post:
      tags: [Exportação e conta]
      operationId: excluirConta
      summary: Excluir a conta e anonimizar os dados pessoais (RF25, RN15)
      description: |
        Exclusão definitiva de conta exigida pelas diretrizes de privacidade das lojas (App Store 5.1.1(v)).
        Anonimiza o registro em `usuario`, cancela turnos futuros sem gerar falta para o profissional,
        notifica as contrapartes, remove registros de aparelhos e apaga a credencial em `auth.users`.
        Idempotente: reenviar em conta já anonimizada ou sem registro no banco devolve 202 com
        `turnos_cancelados: 0`. O único administrador de um estabelecimento com outros usuários precisa
        transferir a administração antes (`409 administrador_unico`). Roda como Edge Function porque
        apaga a credencial no Supabase Auth.
      x-requisitos: [RF25, RNF08, UC16]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmar]
              properties:
                confirmar:
                  type: boolean
                  enum: [true]
                  description: Confirmação explícita obrigatória.
      responses:
        '202':
          description: Exclusão aceita e processada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExclusaoDeConta'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '405':
          description: Método não permitido (apenas POST).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                code: metodo_nao_permitido
                message: metodo_nao_permitido
                details: null
                hint: null
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

components:

  securitySchemes:
    chaveDoProjeto:
      type: apiKey
      in: header
      name: apikey
      description: Chave publicável do projeto no Supabase. Vai em toda requisição; não identifica o usuário.
    tokenDoUsuario:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acesso da sessão do Supabase Auth. É ele que as políticas de RLS leem.

  parameters:
    EstabelecimentoId:
      name: estabelecimento_id
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'

  responses:
    NaoAutenticado:
      description: Token ausente, expirado, inválido ou pertencente a conta encerrada/anonimizada (RF25).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            jwt_invalido:
              summary: Token ausente ou expirado na camada PostgREST
              value:
                code: PGRST301
                message: JWT expired
                details: null
                hint: null
            conta_encerrada:
              summary: Token de conta cuja exclusão já foi processada
              value:
                code: nao_autenticado
                message: nao_autenticado
                details: null
                hint: null
    SemPermissao:
      description: |
        Autenticado, mas sem papel para a ação, ou prazo de acesso vencido. Conta suspensa, em
        operação que exige conta ativa, recebe o mesmo código com `details: conta_suspensa` (RN13).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            sem_permissao:
              value:
                code: sem_permissao
                message: sem_permissao
                details: null
                hint: null
            contato_expirado:
              value:
                code: contato_expirado
                message: contato_expirado
                details: null
                hint: null
            sem_turno_cumprido:
              summary: Profissional sem turno verificado prévio no estabelecimento
              value:
                code: sem_permissao
                message: sem_permissao
                details: sem_turno_cumprido
                hint: null
            conta_suspensa:
              summary: Conta suspensa em operação que exige conta ativa (RN13)
              value:
                code: sem_permissao
                message: sem_permissao
                details: conta_suspensa
                hint: null
    ContaSuspensa:
      description: |
        A conta está suspensa, e a operação exige conta ativa (RN13). É o mesmo `403 sem_permissao`
        do papel insuficiente, com `details: conta_suspensa`; a tela que explica a suspensão lê
        `/rpc/situacao_da_conta`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            code: sem_permissao
            message: sem_permissao
            details: conta_suspensa
            hint: null
    NaoEncontrado:
      description: Não existe, ou não é visível para quem pede.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            code: nao_encontrado
            message: nao_encontrado
            details: null
            hint: null
    Conflito:
      description: Conflito legítimo de estado. No modo urgência, é o funcionamento normal para quem chegou depois.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            posicao_ja_preenchida:
              value:
                code: posicao_ja_preenchida
                message: posicao_ja_preenchida
                details: null
                hint: null
            vaga_encerrada:
              value:
                code: vaga_encerrada
                message: vaga_encerrada
                details: null
                hint: null
            administrador_unico:
              value:
                code: administrador_unico
                message: administrador_unico
                details: null
                hint: null
            contestacao_ja_aberta:
              value:
                code: contestacao_ja_aberta
                message: contestacao_ja_aberta
                details: null
                hint: null
    RegraRecusou:
      description: Uma regra de negócio recusou a operação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            inelegivel:
              value:
                code: inelegivel
                message: inelegivel
                details: turno_sobreposto
                hint: null
            campo_obrigatorio:
              value:
                code: campo_obrigatorio
                message: campo_obrigatorio
                details: responsavel_local
                hint: null
            campo_invalido:
              value:
                code: campo_invalido
                message: campo_invalido
                details: relato
                hint: null
            intervalo_maximo_excedido:
              value:
                code: intervalo_maximo_excedido
                message: intervalo_maximo_excedido
                details: null
                hint: null
            perfil_incompativel:
              summary: A operação é do outro perfil (RN25)
              value:
                code: perfil_incompativel
                message: perfil_incompativel
                details: null
                hint: null
            selecao_sem_antecedencia:
              value:
                code: selecao_sem_antecedencia
                message: selecao_sem_antecedencia
                details: null
                hint: null
            vaga_oculta:
              value:
                code: vaga_oculta
                message: vaga_oculta
                details: null
                hint: null
            a_caminho_fora_da_janela:
              value:
                code: a_caminho_fora_da_janela
                message: a_caminho_fora_da_janela
                details: null
                hint: null
    LimiteExcedido:
      description: Limite de requisições.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            code: limite_excedido
            message: limite_excedido
            details: null
            hint: null
    ParametroObrigatorio:
      description: Um parâmetro obrigatório veio nulo; `details` diz qual.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            code: campo_obrigatorio
            message: campo_obrigatorio
            details: turno_id
            hint: null
    MetodoNaoPermitido:
      description: Método não permitido (apenas POST).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            code: metodo_nao_permitido
            message: metodo_nao_permitido
            details: null
            hint: null

  schemas:

    # ── Tipos base

    Uuid:
      type: string
      format: uuid
    Instante:
      type: string
      format: date-time
      description: UTC, ISO-8601 (RN18).
      example: '2026-09-19T21:00:00Z'
    Centavos:
      type: integer
      minimum: 1
      description: Valor em centavos de real, inteiro (RN18).
      example: 12000
    Telefone:
      type: string
      pattern: '^\+[1-9][0-9]{7,14}$'
      description: Formato E.164.
      example: '+5561999990000'
    Coordenada:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      example:
        latitude: -15.7942
        longitude: -47.8822
    ChaveDeIdempotencia:
      type: string
      format: uuid
      description: Gerada pelo app uma vez por ação. Reenviar com a mesma chave devolve o mesmo resultado.
    HoraDoDia:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: Hora local em America/Sao_Paulo, HH:MM.
      example: '18:00'

    # ── Enumerações (iguais às do banco)

    ModoPreenchimento:
      type: string
      enum: [urgencia, selecao]
    EstadoVaga:
      type: string
      enum: [publicada, preenchida, encerrada, cancelada]
    EstadoPosicao:
      type: string
      enum: [aberta, confirmada, cumprida, cancelada]
    EstadoCandidatura:
      type: string
      enum: [pendente, aceita, recusada, retirada, expirada]
    TipoRegistro:
      type: string
      enum: [geolocalizado, manual]
    Verificacao:
      type: string
      enum: [pendente, verificado, nao_verificado]
      description: |
        `verificado` só com prova: check-in geolocalizado a até 200 m, ou manual confirmado pelo
        contratante. `nao_verificado` não conta a favor nem contra na taxa de comparecimento (RN22).
    TipoEstabelecimento:
      type: string
      enum: [food_service, evento, varejo, logistica, servico_domestico, outro]
    PapelMembro:
      type: string
      enum: [administrador, operador]
    MotivoDenuncia:
      type: string
      enum: [assedio, discriminacao, risco_seguranca, outro]
    CategoriaSuporte:
      description: |
        O motivo do chamado de suporte, escolhido pela pessoa na tela do turno (UC14). Não é o
        texto do pedido: esse vai só no e-mail.
      type: string
      enum: [endereco, atraso, conduta, seguranca, outro]
    Plataforma:
      type: string
      enum: [ios, android, web]
    TipoDeAlvo:
      description: |
        O que o par `alvo_tipo` + `alvo_id` aponta. São os mesmos dois valores de
        `PerfilPublico.tipo`, e é essa igualdade que permite ao app denunciar ou bloquear com o
        que ele já tem na tela.
      type: string
      enum: [profissional, estabelecimento]
    TipoNotificacao:
      description: |
        Os avisos que o sistema endereça a uma conta. Descritos em prosa desde a 0.2.14 (e mais
        dois na 0.2.24), declarados como enum a partir da 0.2.33 porque `MeusDados.notificacoes`
        os devolve e o cliente precisa gerar o modelo. Só `vaga` e `vagas_agrupadas` contam para o
        teto da RN23.

        **Textos do push do modo seleção (0.2.38, aprovados em 07/10/2026).** O corpo do push é
        montado no servidor com a vaga e sai sem dado pessoal do candidato (RN15). Quando falta o dado
        entre `{}`, vale o texto sem ele.

        | Tipo | Quem recebe | Título | Corpo |
        |---|---|---|---|
        | `confirmacao` (vaga em seleção) | Profissional escolhido | Você foi escolhido | O estabelecimento escolheu você para o turno. Toque para ver os detalhes e o contato. |
        | `candidatura_recusada` | Candidato não escolhido, quando a vaga encheu | Vaga preenchida | O estabelecimento escolheu outro profissional para esta vaga. Sua candidatura foi encerrada e você está livre para outras vagas. |
        | `selecao_encerrada` | Candidato pendente | Vaga fechada sem escolha | O prazo de escolha terminou e sua candidatura foi encerrada. Você está livre para outras vagas. |
        | `selecao_encerrada` | Membro do estabelecimento | Prazo de escolha encerrado | A vaga de {função} fechou sem todas as posições preenchidas. Toque para republicar em urgência. |
        | `selecao_lembrete` | Membro do estabelecimento | Candidatos esperando sua escolha | {N} candidato(s) para a vaga de {função}. Escolha até {dd/mm às HH:MM}, quando a vaga fecha. |

        `confirmacao` em vaga de urgência mantém o texto de sempre ("Turno confirmado"). O
        `selecao_lembrete` sai uma vez por vaga: faltando 6 horas ou menos para o prazo de escolha
        (RN24) e com ao menos uma candidatura pendente. O horário é o do fuso America/Sao_Paulo (RN18).
      type: string
      enum: [vaga, vagas_agrupadas, vaga_sem_elegiveis, confirmacao, lembrete_24h, lembrete_3h,
             inicio_sem_checkin, atraso_15min, fim_sem_checkout, vaga_vazia, checkin,
             checkin_manual_pendente, cancelamento, avaliacao_disponivel, suspensao, reativacao,
             candidatura_recusada, selecao_encerrada, selecao_lembrete]
    EventoDeTelemetria:
      description: |
        Dicionário fechado. Acrescentar evento é mudança de contrato, com versão subindo — é o
        preço de garantir que nenhum campo aberto entre por aqui (RN15).
      type: string
      enum:
        - app_aberto
        - cadastro_concluido
        - permissao_push_negada
        - vaga_vista
        - vaga_detalhe_aberto
        - candidatura_enviada
        - candidatura_retirada
        - checkin_tentado
        - checkin_concluido
        - checkout_concluido
        - avaliacao_enviada
        - contato_aberto
        - acao_enfileirada_offline
        - atualizacao_obrigatoria_exibida
    PerfilConta:
      type: string
      enum: [profissional, contratante]
      description: Perfil da conta, escolhido no cadastro e fixo (RN25).
    EstadoConta:
      type: string
      enum: [ativa, suspensa]

    # ── Erro

    Erro:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Código estável em `snake_case` nas recusas de regra (ver o catálogo na descrição da API), ou
            código do PostgREST/Postgres nos demais casos (`PGRST301`, `23505`...).
        message:
          type: string
          description: Texto para log. Nunca exibir na tela.
        details:
          type: [string, 'null']
          description: 'Motivo complementar estável, quando houver (por exemplo, `turno_sobreposto`).'
        hint:
          type: [string, 'null']

    # ── Conta e perfis

    Sessao:
      type: object
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: bearer
        expires_in:
          type: integer
          description: Segundos até o token de acesso expirar.
        refresh_token:
          type: string
        user:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            email:
              type: string
              format: email
    Usuario:
      type: object
      required: [id, perfil, nome, telefone, email, nascimento, estado]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        perfil:
          $ref: '#/components/schemas/PerfilConta'
        nome:
          type: string
        telefone:
          $ref: '#/components/schemas/Telefone'
        email:
          type: string
          format: email
        nascimento:
          type: string
          format: date
        estado:
          $ref: '#/components/schemas/EstadoConta'
    JanelaDeDisponibilidade:
      type: object
      required: [dia_semana, hora_inicio, hora_fim]
      description: |
        Janela semanal em que o profissional aceita trabalhar. `hora_fim` pode ser menor que
        `hora_inicio`: 18:00–02:00 atravessa a meia-noite e é a janela mais comum do setor.
      properties:
        dia_semana:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = domingo.
        hora_inicio:
          $ref: '#/components/schemas/HoraDoDia'
        hora_fim:
          $ref: '#/components/schemas/HoraDoDia'
    DadosDoPerfilProfissional:
      type: object
      required: [funcoes, ponto_base, disponibilidades]
      properties:
        funcoes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        ponto_base:
          $ref: '#/components/schemas/Coordenada'
        disponibilidades:
          type: array
          items:
            $ref: '#/components/schemas/JanelaDeDisponibilidade'
    AlteracaoDoPerfilProfissional:
      type: object
      minProperties: 1
      properties:
        funcoes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        ponto_base:
          $ref: '#/components/schemas/Coordenada'
        disponibilidades:
          type: array
          items:
            $ref: '#/components/schemas/JanelaDeDisponibilidade'
    PerfilProfissional:
      type: object
      required: [id, usuario_id, funcoes, ponto_base, disponibilidades, reputacao]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        usuario_id:
          $ref: '#/components/schemas/Uuid'
        funcoes:
          type: array
          items:
            $ref: '#/components/schemas/Funcao'
        ponto_base:
          $ref: '#/components/schemas/Coordenada'
        disponibilidades:
          type: array
          items:
            $ref: '#/components/schemas/JanelaDeDisponibilidade'
        reputacao:
          $ref: '#/components/schemas/Reputacao'
    CriteriosDeNotificacao:
      type: object
      required: [funcoes, disponibilidades, distancia_maxima_km, equipes_de_confianca, notificacoes_no_maximo_a_cada_min]
      properties:
        funcoes:
          type: array
          items:
            $ref: '#/components/schemas/Funcao'
        disponibilidades:
          type: array
          items:
            $ref: '#/components/schemas/JanelaDeDisponibilidade'
        distancia_maxima_km:
          type: number
          description: Parâmetro do sistema; hoje, 15 (RN05).
          example: 15
        equipes_de_confianca:
          type: array
          description: Estabelecimentos cuja equipe de confiança inclui o profissional; as vagas deles chegam mesmo além dos 15 km.
          items:
            type: object
            required: [estabelecimento_id, nome]
            properties:
              estabelecimento_id:
                $ref: '#/components/schemas/Uuid'
              nome:
                type: string
        notificacoes_no_maximo_a_cada_min:
          type: integer
          description: Teto de RN23; hoje, 30.
          example: 30
    NovoEstabelecimento:
      type: object
      required: [nome, documento, tipo, endereco, regiao_administrativa, ponto]
      properties:
        nome:
          type: string
        documento:
          type: string
          pattern: '^([0-9]{11}|[0-9]{14})$'
          description: CPF (11) ou CNPJ (14), só dígitos.
        tipo:
          $ref: '#/components/schemas/TipoEstabelecimento'
        endereco:
          type: string
          description: Logradouro, número e complemento.
        regiao_administrativa:
          type: string
          description: "Região Administrativa do Distrito Federal onde o estabelecimento fica (ex.: Plano Piloto, Águas Claras, Taguatinga)."
          example: Plano Piloto
        ponto:
          $ref: '#/components/schemas/Coordenada'
    Estabelecimento:
      type: object
      required: [id, nome, documento, tipo, endereco, regiao_administrativa, ponto, papel]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nome:
          type: string
        documento:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoEstabelecimento'
        endereco:
          type: string
        regiao_administrativa:
          type: string
          description: "Região Administrativa do Distrito Federal onde o estabelecimento fica (ex.: Plano Piloto, Águas Claras, Taguatinga)."
          example: Plano Piloto
        ponto:
          $ref: '#/components/schemas/Coordenada'
        papel:
          $ref: '#/components/schemas/PapelMembro'
    MeuEstabelecimento:
      type: object
      required: [id, nome, tipo, endereco, regiao_administrativa, ponto, papel]
      description: |
        O cadastro do estabelecimento como um membro o lê em `/rpc/meu_estabelecimento` (0.2.29):
        os campos do `Estabelecimento`, **sem o `documento`**. O CNPJ ou CPF só aparece na resposta
        de `/rpc/cadastrar_estabelecimento`, para quem acabou de informá-lo (RN15).
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nome:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoEstabelecimento'
        endereco:
          type: string
          description: Logradouro, número e complemento. É o que preenche `NovaVaga.local`.
        regiao_administrativa:
          type: string
          description: "Região Administrativa do Distrito Federal onde o estabelecimento fica (ex.: Plano Piloto, Águas Claras, Taguatinga)."
          example: Plano Piloto
        ponto:
          $ref: '#/components/schemas/Coordenada'
        papel:
          description: O papel de quem chama neste estabelecimento.
          $ref: '#/components/schemas/PapelMembro'
      example:
        id: 5b0f6c1e-2a47-4f0b-9d3e-8c1a7e2f4b10
        nome: Bar da Lia
        tipo: food_service
        endereco: CLS 408, Bloco B, Loja 12
        regiao_administrativa: Plano Piloto
        ponto:
          latitude: -15.7942
          longitude: -47.8822
        papel: operador
    MembroDaEquipe:
      type: object
      required: [estabelecimento_id, profissional_id]
      properties:
        estabelecimento_id:
          $ref: '#/components/schemas/Uuid'
        profissional_id:
          $ref: '#/components/schemas/Uuid'
    Funcao:
      type: object
      required: [id, nome, categoria]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nome:
          type: string
          example: garçom
        categoria:
          type: string
          example: Salão

    # ── Reputação

    Reputacao:
      type: object
      required: [positivas, total, taxa_comparecimento, turnos_considerados, turnos_realizados]
      description: |
        Sempre exibida com o denominador: "7 de 7 chamariam de novo" (RN08). Não existe média, e não
        deve existir (RN07). Sem histórico, `total = 0` e taxa nula: a tela mostra "Sem histórico".
      properties:
        positivas:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        taxa_comparecimento:
          description: |
            Turnos com presença ÷ turnos confirmados. Falta = não aparecer ou cancelar com menos de 24 h.
            Ficam fora: candidatura não escolhida, cancelamento com mais de 24 h e turno não verificado.
            Só para profissional; aparece no perfil e não altera quem recebe notificação (RN06).
          oneOf:
            - type: number
              minimum: 0
              maximum: 1
            - type: 'null'
        turnos_considerados:
          description: |
            O **denominador** da taxa de comparecimento: turnos confirmados cujo desfecho já é
            conhecido. Entram o turno cumprido e a falta; ficam de fora a candidatura não
            escolhida, o cancelamento com mais de 24 h de antecedência e o turno ainda por
            acontecer. É este número que `taxa_comparecimento` divide.
          type: integer
          minimum: 0
        turnos_realizados:
          description: |
            Turnos que a pessoa **cumpriu**, com presença verificada. É o número que a tela mostra
            como experiência ("12 turnos realizados"), e não se confunde com `turnos_considerados`:
            quem faltou a dois de dez tem `turnos_realizados: 8` e `turnos_considerados: 10`.

            Os dois existem separados porque a tela usa um e a regra usa o outro, e um único campo
            chamado "turnos" seria lido como o que cada leitor precisasse naquele dia.
          type: integer
          minimum: 0
    PerfilPublico:
      type: object
      required: [id, tipo, nome, reputacao]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tipo:
          type: string
          enum: [profissional, estabelecimento]
        nome:
          type: string
        funcoes:
          type: array
          description: Só para profissional.
          items:
            type: string
        reputacao:
          $ref: '#/components/schemas/Reputacao'

    # ── Vagas

    NovaVaga:
      type: object
      required:
        - estabelecimento_id
        - funcao_id
        - inicio_em
        - fim_em
        - local
        - regiao_administrativa
        - ponto
        - valor_centavos
        - posicoes
        - inclui_refeicao
        - inclui_transporte
        - exige_material_proprio
        - responsavel_local
        - modo
        - chave
      description: Campos obrigatórios de RN02; traje, rateio e observações são opcionais.
      properties:
        estabelecimento_id:
          $ref: '#/components/schemas/Uuid'
        funcao_id:
          $ref: '#/components/schemas/Uuid'
        inicio_em:
          $ref: '#/components/schemas/Instante'
        fim_em:
          $ref: '#/components/schemas/Instante'
        local:
          type: string
          description: Endereço. Vem preenchido com o do estabelecimento.
        regiao_administrativa:
          type: string
          description: Região Administrativa do Distrito Federal onde o turno será executado. Vem preenchida com a do estabelecimento.
          example: Plano Piloto
        ponto:
          $ref: '#/components/schemas/Coordenada'
        valor_centavos:
          $ref: '#/components/schemas/Centavos'
        posicoes:
          type: integer
          minimum: 1
          maximum: 200
        inclui_refeicao:
          type: boolean
        inclui_transporte:
          type: boolean
        exige_material_proprio:
          type: boolean
          description: Sim = o profissional leva o material.
        responsavel_local:
          type: string
          description: Quem recebe o profissional no local.
        traje:
          type: [string, 'null']
        participa_rateio:
          type: [boolean, 'null']
          description: Participa do rateio dos 10% da taxa de serviço (Lei 13.419/2017).
        observacoes:
          type: [string, 'null']
        modo:
          $ref: '#/components/schemas/ModoPreenchimento'
        alerta_antecedencia_min:
          type: integer
          minimum: 1
          default: 180
          description: Janela crítica — minutos antes do início em que o contratante é alertado se a posição seguir vaga.
        chave:
          $ref: '#/components/schemas/ChaveDeIdempotencia'
    VagaPublicada:
      type: object
      required: [vaga_id, posicoes]
      properties:
        vaga_id:
          $ref: '#/components/schemas/Uuid'
        posicoes:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
    Inclusos:
      type: object
      required: [inclui_refeicao, inclui_transporte, exige_material_proprio]
      properties:
        inclui_refeicao:
          type: boolean
        inclui_transporte:
          type: boolean
        exige_material_proprio:
          type: boolean
    VagaNaLista:
      type: object
      required: [id, funcao, estabelecimento, inicio_em, fim_em, local, regiao_administrativa, distancia_km, valor_centavos, posicoes_abertas, inclusos, modo]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        funcao:
          $ref: '#/components/schemas/Funcao'
        estabelecimento:
          $ref: '#/components/schemas/PerfilPublico'
        inicio_em:
          $ref: '#/components/schemas/Instante'
        fim_em:
          $ref: '#/components/schemas/Instante'
        local:
          type: string
        regiao_administrativa:
          type: string
          description: Região Administrativa do Distrito Federal onde o turno será executado.
          example: Plano Piloto
        distancia_km:
          type: number
          minimum: 0
        valor_centavos:
          $ref: '#/components/schemas/Centavos'
        posicoes_abertas:
          type: integer
          minimum: 0
        inclusos:
          $ref: '#/components/schemas/Inclusos'
        modo:
          $ref: '#/components/schemas/ModoPreenchimento'
    Vaga:
      type: object
      required: [id, estabelecimento, funcao, inicio_em, fim_em, local, regiao_administrativa, ponto, valor_centavos, posicoes, posicoes_abertas, inclusos, responsavel_local, modo, estado, oculta, publicado_em]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        estabelecimento:
          $ref: '#/components/schemas/PerfilPublico'
        funcao:
          $ref: '#/components/schemas/Funcao'
        inicio_em:
          $ref: '#/components/schemas/Instante'
        fim_em:
          $ref: '#/components/schemas/Instante'
        local:
          type: string
        regiao_administrativa:
          type: string
          description: Região Administrativa do Distrito Federal onde o turno será executado.
          example: Plano Piloto
        ponto:
          $ref: '#/components/schemas/Coordenada'
        distancia_km:
          type: [number, 'null']
        valor_centavos:
          $ref: '#/components/schemas/Centavos'
        posicoes:
          type: integer
        posicoes_abertas:
          type: integer
        inclusos:
          $ref: '#/components/schemas/Inclusos'
        responsavel_local:
          type: string
        traje:
          type: [string, 'null']
        participa_rateio:
          type: [boolean, 'null']
        observacoes:
          type: [string, 'null']
        modo:
          $ref: '#/components/schemas/ModoPreenchimento'
        estado:
          $ref: '#/components/schemas/EstadoVaga'
        oculta:
          type: boolean
          description: |
            Verdadeiro quando a moderação da Equipe Frila ocultou a vaga (diretriz 1.2, 0.2.23). Só
            chega verdadeiro a quem ocupa posição ou tem candidatura nela; o `estado` não muda.
        publicado_em:
          $ref: '#/components/schemas/Instante'
    VagaDetalhe:
      $ref: '#/components/schemas/Vaga'
      description: Detalhe completo de uma vaga (mesmo schema de Vaga).
    VagaResumo:
      type: object
      required: [id, funcao, local, regiao_administrativa, inicio_em, fim_em, valor_centavos]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        funcao:
          type: string
        local:
          type: string
        regiao_administrativa:
          type: string
          description: Região Administrativa do Distrito Federal onde o turno será executado.
          example: Plano Piloto
        inicio_em:
          $ref: '#/components/schemas/Instante'
        fim_em:
          $ref: '#/components/schemas/Instante'
        valor_centavos:
          $ref: '#/components/schemas/Centavos'

    # ── Candidatura e confirmação

    Contato:
      type: object
      required: [nome, telefone, whatsapp_url, visivel_ate]
      description: Liberado só depois da confirmação, até 7 dias depois do fim do turno (RN10).
      properties:
        nome:
          type: string
        telefone:
          $ref: '#/components/schemas/Telefone'
        whatsapp_url:
          type: string
          format: uri
        visivel_ate:
          $ref: '#/components/schemas/Instante'
    ResultadoCandidatura:
      type: object
      required: [estado, candidatura_id, posicao_id, turno_id, contato]
      properties:
        estado:
          type: string
          enum: [confirmada, pendente]
          description: '`confirmada` no modo urgência; `pendente` no modo seleção.'
        candidatura_id:
          $ref: '#/components/schemas/Uuid'
        posicao_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        turno_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        contato:
          oneOf:
            - $ref: '#/components/schemas/Contato'
            - type: 'null'
    ResultadoConfirmacao:
      type: object
      required: [estado, posicao_id, turno_id, contato]
      properties:
        estado:
          type: string
          const: confirmada
        posicao_id:
          $ref: '#/components/schemas/Uuid'
        turno_id:
          $ref: '#/components/schemas/Uuid'
        contato:
          $ref: '#/components/schemas/Contato'
    Candidatura:
      type: object
      required: [id, vaga, estado, criada_em]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        vaga:
          $ref: '#/components/schemas/VagaResumo'
        estado:
          $ref: '#/components/schemas/EstadoCandidatura'
        criada_em:
          $ref: '#/components/schemas/Instante'
        turno_id:
          description: |
            O turno que nasceu desta candidatura (0.2.32). Só vem preenchido no estado `aceita`,
            e é o mesmo `turno_id` que `/rpc/candidatar` (modo urgência) ou
            `/rpc/escolher_candidato` (modo seleção) devolveu na confirmação. Nulo nos outros
            estados: `pendente`, `recusada`, `retirada` e `expirada`.

            O cancelamento do turno não muda a candidatura: ela segue `aceita`, com o `turno_id`
            do turno cancelado, e é `Turno.estado` que diz se o turno está de pé.

            Opcional: o servidor anterior à 0.2.32 não o manda. Ausente não é o mesmo que nulo: o
            cliente só afirma "não há turno" quando o campo vem nulo.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    Candidato:
      type: object
      required: [candidatura_id, profissional, criada_em]
      properties:
        candidatura_id:
          $ref: '#/components/schemas/Uuid'
        profissional:
          $ref: '#/components/schemas/PerfilPublico'
        criada_em:
          $ref: '#/components/schemas/Instante'
        da_equipe:
          description: |
            0.2.38. `true` se o profissional está na equipe de confiança do estabelecimento da vaga;
            a tela mostra o selo "da sua equipe". Não altera a ordem da lista (RN06). Ausente vale
            `false`.
          type: boolean

    # ── Turno

    RegistroDePresenca:
      type: object
      required: [turno_id, distancia_m, registrado_em]
      properties:
        turno_id:
          $ref: '#/components/schemas/Uuid'
        distancia_m:
          description: Distância até o endereço da vaga, medida no aparelho no momento do toque. Nulo quando não há localização.
          oneOf:
            - type: integer
              minimum: 0
            - type: 'null'
        registrado_em:
          $ref: '#/components/schemas/Instante'
    ResultadoRegistro:
      type: object
      required: [turno_id, tipo, verificacao, registrado_em, distancia_m]
      properties:
        turno_id:
          $ref: '#/components/schemas/Uuid'
        tipo:
          $ref: '#/components/schemas/TipoRegistro'
        verificacao:
          $ref: '#/components/schemas/Verificacao'
        registrado_em:
          $ref: '#/components/schemas/Instante'
        distancia_m:
          oneOf:
            - type: integer
              minimum: 0
            - type: 'null'
    ResultadoACaminho:
      type: object
      required: [turno_id, a_caminho_em]
      description: Confirmação do registro de aviso "a caminho" pelo profissional do turno (US14).
      properties:
        turno_id:
          $ref: '#/components/schemas/Uuid'
        a_caminho_em:
          $ref: '#/components/schemas/Instante'
    Turno:
      type: object
      required: [id, posicao_id, vaga, contraparte, contato_visivel_ate, a_caminho_em, checkin_em, checkin_tipo, checkin_distancia_m, checkin_confirmado_em, checkout_em, checkout_distancia_m, verificacao, valor_acordado_centavos, pode_avaliar]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        posicao_id:
          $ref: '#/components/schemas/Uuid'
        vaga:
          $ref: '#/components/schemas/VagaResumo'
        contraparte:
          $ref: '#/components/schemas/PerfilPublico'
        contato_visivel_ate:
          description: |
            Fim previsto do turno mais 7 dias (RN10). Depois disso `contato_do_turno` responde
            `403 contato_expirado`, e a tela precisa saber disso **antes** de oferecer o botão —
            senão o profissional toca em "falar com o contratante" e recebe um erro que ele não
            tem como prever. É o mesmo instante que `Contato.visivel_ate` carrega; aparece aqui
            para que a tela do turno não precise pedir o contato só para descobrir se pode.
          $ref: '#/components/schemas/Instante'
        a_caminho_em:
          oneOf:
            - $ref: '#/components/schemas/Instante'
            - type: 'null'
          description: Instante em que o profissional avisou que está a caminho do turno (US14). Nulo se ainda não avisou.
        checkin_em:
          oneOf:
            - $ref: '#/components/schemas/Instante'
            - type: 'null'
        checkin_tipo:
          oneOf:
            - $ref: '#/components/schemas/TipoRegistro'
            - type: 'null'
        checkin_distancia_m:
          type: [integer, 'null']
        checkin_confirmado_em:
          oneOf:
            - $ref: '#/components/schemas/Instante'
            - type: 'null'
        checkout_em:
          oneOf:
            - $ref: '#/components/schemas/Instante'
            - type: 'null'
        checkout_distancia_m:
          type: [integer, 'null']
        verificacao:
          $ref: '#/components/schemas/Verificacao'
        valor_acordado_centavos:
          $ref: '#/components/schemas/Centavos'
        pode_avaliar:
          type: boolean
          description: Verdadeiro depois do fim previsto, com presença verificada e sem avaliação deste lado ainda (RN07).
        estado:
          description: |
            O estado da posição deste turno (0.2.31), o mesmo campo de `PosicaoNoPainel.estado`:
            `confirmada` com o turno de pé, `cumprida` depois do fim com check-in, `cancelada`
            quando uma das partes cancelou, a casa reabriu por atraso, a vaga foi cancelada ou o
            turno terminou sem check-in. Nunca `aberta`: posição aberta não tem turno. Quem passa a
            `cumprida` ou fecha o turno sem check-in é o agendador, minutos depois do fim previsto;
            até lá o turno encerrado ainda vem `confirmada`.

            O turno cancelado continua em `/rpc/meus_turnos`, e é por este campo que a tela o
            distingue. Opcional: o servidor anterior à 0.2.31 não o manda, e o cliente trata a
            ausência como "o servidor ainda não diz", sem supor `confirmada`.
          $ref: '#/components/schemas/EstadoPosicao'
        avaliacao:
          description: |
            A avaliação que **este lado** do turno já deu (0.2.31), igual à resposta de
            `/rpc/avaliar`. Nulo enquanto este lado não avaliou. Para quem opera a casa é o voto da
            casa, dado por qualquer membro dela (um voto por lado). **Nunca** é a avaliação que a
            outra parte deu sobre quem chama: essa só aparece agregada, na reputação (RN07, RN08).
            Com `avaliacao` preenchida, `pode_avaliar` é falso.

            Opcional: o servidor anterior à 0.2.31 não o manda. Ausente não é o mesmo que nulo: o
            cliente só afirma "ainda não avaliou" quando o campo vem nulo.
          oneOf:
            - $ref: '#/components/schemas/Avaliacao'
            - type: 'null'
        cancelamento:
          description: |
            Por que este turno foi cancelado e se contou como falta (0.2.32, RN12). Vem preenchido
            quando `estado` é `cancelada`, e nulo nos outros estados. Não traz texto livre, para
            nenhum dos dois lados: o que a pessoa escreveu ao cancelar só sai no painel da casa
            (`PosicaoNoPainel.cancelamento.motivo`).

            Opcional: o servidor anterior à 0.2.32 não o manda. Ausente não é o mesmo que nulo.
          oneOf:
            - $ref: '#/components/schemas/CancelamentoDoTurno'
            - type: 'null'
    CancelamentoDoTurno:
      type: object
      required: [causa, falta, cancelada_em]
      description: |
        O cancelamento de um turno, como as duas partes o leem em `/rpc/meus_turnos` (0.2.32,
        RN12). É o `CancelamentoDaPosicao` do painel **sem o `motivo`**: o texto que a casa
        escreveu ao cancelar não vai ao profissional (decisão de produto de 02/10/2026). Por isso
        este schema não tem a propriedade, em vez de trazê-la nula. `causa`, `falta` e
        `cancelada_em` são os mesmos valores que o painel mostra para a mesma posição.

        O que o profissional lê em cada causa:

        - `profissional`: ele mesmo desistiu. `falta` diz se a desistência contou (menos de 24
          horas do início). O texto que ele escreveu não volta.
        - `estabelecimento`: a casa cancelou a posição ou a vaga inteira. Não conta falta.
        - `reabertura_por_atraso` e `no_show_sem_checkin`: sempre com `falta: true`.
        - `outro`: o turno saiu sem escolha de nenhuma das partes. Não conta falta.
      properties:
        causa:
          $ref: '#/components/schemas/CausaDoCancelamento'
        falta:
          type: boolean
          description: |
            Verdadeiro quando o cancelamento conta como falta do profissional na taxa de
            comparecimento (RN12). O mesmo valor de `CancelamentoDaPosicao.falta`.
        cancelada_em:
          $ref: '#/components/schemas/Instante'
      example:
        causa: estabelecimento
        falta: false
        cancelada_em: '2026-10-03T19:40:00Z'
    ResultadoCancelamento:
      type: object
      required: [posicao_id, falta, reaberta, nova_posicao_id]
      properties:
        posicao_id:
          $ref: '#/components/schemas/Uuid'
        falta:
          type: boolean
          description: Verdadeiro quando conta como falta do profissional (menos de 24 h, ou reabertura por atraso).
        reaberta:
          type: boolean
          description: Falso quando o início já passou e o turno ficou descoberto.
        nova_posicao_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    Avaliacao:
      type: object
      required: [turno_id, resposta, criada_em]
      properties:
        turno_id:
          $ref: '#/components/schemas/Uuid'
        resposta:
          type: boolean
        criada_em:
          $ref: '#/components/schemas/Instante'

    # ── Painel

    Painel:
      type: object
      required: [estabelecimento_id, vagas, checkins_pendentes]
      properties:
        estabelecimento_id:
          $ref: '#/components/schemas/Uuid'
        vagas:
          type: array
          items:
            $ref: '#/components/schemas/VagaNoPainel'
        checkins_pendentes:
          type: array
          description: Turnos com check-in manual esperando a confirmação do contratante.
          items:
            $ref: '#/components/schemas/Uuid'
    VagaNoPainel:
      type: object
      required: [vaga, modo, estado, oculta, alerta_vaga_vazia, candidatos_pendentes, posicoes]
      properties:
        vaga:
          $ref: '#/components/schemas/VagaResumo'
        republicavel_em_urgencia:
          description: |
            0.2.41. Quantas posições `republicar_posicoes_restantes` republicaria agora, ou nulo
            quando a vaga não é republicável por esse caminho. A tela mostra "Republicar N posições
            em urgência" só quando é maior que zero. O servidor calcula com a mesma regra da
            operação, para o botão e a recusa nunca discordarem. Ausente vale nulo.
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
        modo:
          $ref: '#/components/schemas/ModoPreenchimento'
        estado:
          $ref: '#/components/schemas/EstadoVaga'
        oculta:
          type: boolean
          description: |
            Verdadeiro quando a moderação da Equipe Frila ocultou a vaga (diretriz 1.2, 0.2.23): fora
            da vitrine e do despacho, sem escolha de candidato e sem republicação, até a Equipe
            reexibi-la. A tela mostra "oculta pela Equipe"; o `estado` continua o do ciclo de vida.
        alerta_vaga_vazia:
          type: boolean
          description: Há posição aberta dentro da janela crítica.
        candidatos_pendentes:
          type: integer
          minimum: 0
        posicoes:
          type: array
          items:
            $ref: '#/components/schemas/PosicaoNoPainel'
    PosicaoNoPainel:
      type: object
      required: [id, estado, profissional, turno_id, verificacao, em_atraso, a_caminho_em]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        estado:
          $ref: '#/components/schemas/EstadoPosicao'
        profissional:
          oneOf:
            - $ref: '#/components/schemas/PerfilPublico'
            - type: 'null'
        turno_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        verificacao:
          oneOf:
            - $ref: '#/components/schemas/Verificacao'
            - type: 'null'
        em_atraso:
          type: boolean
          description: Passou 15 minutos do início sem check-in (D06); o contratante pode esperar ou reabrir.
        a_caminho_em:
          oneOf:
            - $ref: '#/components/schemas/Instante'
            - type: 'null'
          description: |
            Instante em que o profissional avisou estar a caminho do turno (US14). Nulo se ainda não
            avisou ou se a posição ainda não tem turno confirmado.
        checkin_em:
          description: |
            A hora do toque no check-in (0.2.31), o mesmo `Turno.checkin_em`. Nulo sem check-in ou
            sem turno. Com `checkin_tipo: manual`, é a hora que o profissional declarou e a casa
            confirma. Opcional: o servidor anterior à 0.2.31 não o manda.
          oneOf:
            - $ref: '#/components/schemas/Instante'
            - type: 'null'
        checkin_tipo:
          description: O tipo do check-in (0.2.31), o mesmo `Turno.checkin_tipo`. Nulo sem check-in. Opcional.
          oneOf:
            - $ref: '#/components/schemas/TipoRegistro'
            - type: 'null'
        checkin_confirmado_em:
          description: |
            Quando um membro da casa confirmou o check-in manual (0.2.31), o mesmo
            `Turno.checkin_confirmado_em`. Nulo no check-in geolocalizado, que já nasce
            verificado, e no manual ainda sem confirmação. Opcional.
          oneOf:
            - $ref: '#/components/schemas/Instante'
            - type: 'null'
        cancelamento:
          description: |
            Por que a posição foi cancelada (0.2.31, RN12). Vem na posição `cancelada` que chegou a
            ter profissional. Nulo nos outros estados e na posição cancelada **sem nunca ter tido
            profissional** (`profissional` nulo), que não tem cancelamento registrado: a vaga foi
            cancelada, o modo seleção fechou sem escolha, ou a posição reaberta por atraso não foi
            preenchida a tempo. Opcional: o servidor anterior à 0.2.31 não o manda.
          oneOf:
            - $ref: '#/components/schemas/CancelamentoDaPosicao'
            - type: 'null'
    CausaDoCancelamento:
      type: string
      enum: [profissional, estabelecimento, reabertura_por_atraso, no_show_sem_checkin, outro]
      description: |
        Dicionário fechado (0.2.31): valor novo é mudança de contrato, com versão subindo. Desde a
        0.2.32 é também a causa em `Turno.cancelamento`, com o mesmo valor que o painel mostra
        para a mesma posição.

        - `profissional`: o profissional desistiu (`cancelar_posicao`).
        - `estabelecimento`: um membro da casa cancelou a posição (`cancelar_posicao`) ou a vaga
          inteira (`cancelar_vaga`).
        - `reabertura_por_atraso`: a casa declarou o não comparecimento aos 15 minutos
          (`reabrir_por_atraso`, D06).
        - `no_show_sem_checkin`: o turno terminou sem check-in, e o agendador fechou a posição.
        - `outro`: a posição saiu sem escolha de nenhuma das partes neste turno, por conta
          encerrada ou por ação da Equipe Frila. O contrato não diz qual das duas: a situação da
          conta de uma parte não é dado da outra (RN13, RN15).
    CancelamentoDaPosicao:
      type: object
      required: [causa, falta, motivo, cancelada_em]
      description: O registro do cancelamento de uma posição que tinha profissional (RN12), como a casa o lê no painel.
      properties:
        causa:
          $ref: '#/components/schemas/CausaDoCancelamento'
        falta:
          type: boolean
          description: |
            Verdadeiro quando conta como falta do profissional na taxa de comparecimento (RN12):
            desistência a menos de 24 horas do início, reabertura por atraso ou turno terminado sem
            check-in. É o mesmo valor que `ResultadoCancelamento.falta` devolveu a quem cancelou.
        motivo:
          type: [string, 'null']
          description: |
            O texto que a pessoa escreveu ao cancelar, em `cancelar_posicao` ou `cancelar_vaga`, já
            passado pelo filtro de termos. Só vem com `causa` `profissional` ou `estabelecimento`.
            Nulo nas outras causas: o motivo delas é a própria causa, e nenhum código interno sai
            aqui como texto.
        cancelada_em:
          $ref: '#/components/schemas/Instante'
      example:
        causa: profissional
        falta: true
        motivo: Tive um imprevisto de saúde e não consigo chegar.
        cancelada_em: '2026-10-03T19:40:00Z'

    # ── Confiança e direitos

    Protocolo:
      type: object
      required: [ocorrencia_id, tipo, criada_em, prazo_resposta_ate]
      description: |
        Registro de algo que a Equipe Frila responde por e-mail em até 5 dias úteis.

        O **protocolo curto** é o que a pessoa vê e cita: os 8 primeiros caracteres hexadecimais de
        `ocorrencia_id`, sem hifens, em maiúsculas (`6f1c2a4e-…` vira `6F1C2A4E`). O app o calcula
        desta regra, e a Equipe Frila o usa para achar a ocorrência.
      properties:
        ocorrencia_id:
          $ref: '#/components/schemas/Uuid'
        tipo:
          type: string
          enum: [denuncia, contestacao, revisao_despacho, suporte]
        criada_em:
          $ref: '#/components/schemas/Instante'
        prazo_resposta_ate:
          type: string
          format: date
    Bloqueio:
      type: object
      required: [alvo_tipo, alvo_id, criado_em]
      description: |
        Devolve o mesmo par que a chamada recebeu, e não o id de conta da outra parte: o app não
        tem o que fazer com um id que nenhuma outra resposta menciona, e devolvê-lo abriria um
        caminho de leitura que RN10 fecha em todos os outros.
      properties:
        alvo_tipo:
          $ref: '#/components/schemas/TipoDeAlvo'
        alvo_id:
          $ref: '#/components/schemas/Uuid'
        criado_em:
          $ref: '#/components/schemas/Instante'
    SituacaoDaConta:
      type: object
      required: [estado, suspensao]
      properties:
        estado:
          $ref: '#/components/schemas/EstadoConta'
        suspensao:
          oneOf:
            - type: object
              required: [motivo, desde, contestacao]
              properties:
                motivo:
                  type: string
                desde:
                  $ref: '#/components/schemas/Instante'
                contestacao:
                  description: |
                    Protocolo da contestação vinculada à suspensão em vigor, quer esteja em análise
                    ou já respondida pela Equipe Frila (decisão de produto, opção B, 0.2.36). O
                    resultado do suporte não é exposto no app (RN07, RF24) e eventual recurso
                    adicional é tratado exclusivamente por e-mail. Nulo se o titular ainda não
                    contestou a suspensão em vigor.
                  oneOf:
                    - $ref: '#/components/schemas/Protocolo'
                    - type: 'null'
            - type: 'null'

    # ── Aplicativo

    ConfiguracaoDoApp:
      type: object
      required: [plataforma, versao_minima, versao_recomendada, url_da_loja]
      description: |
        Lida sem sessão, na abertura. As versões são strings de build comparadas por ordem natural
        de versão (`1.2.10` é maior que `1.2.9`), e não números — um `double` transformaria
        `1.2.10` em `1.21`.
      properties:
        plataforma:
          $ref: '#/components/schemas/Plataforma'
        versao_minima:
          type: string
          pattern: '^[0-9]{1,6}(\.[0-9]{1,6}){0,3}$'
          description: Abaixo desta, o app bloqueia e leva à loja. Nenhuma tela do produto abre.
          example: "1.0.0"
        versao_recomendada:
          type: string
          pattern: '^[0-9]{1,6}(\.[0-9]{1,6}){0,3}$'
          description: Aviso dispensável, uma vez por versão. Nunca abaixo de `versao_minima`.
          example: "1.1.0"
        url_da_loja:
          type: string
          format: uri
        mensagem:
          type: [string, 'null']
          description: |
            Texto opcional para a tela de bloqueio. Nulo na maior parte do tempo: o app tem um
            texto padrão, e depender deste campo para a tela funcionar faria uma falha de rede
            virar tela vazia.

    # ── Dispositivos e conta

    EstabelecimentoDaConta:
      type: object
      required: [id, nome, papel]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nome:
          type: string
        papel:
          $ref: '#/components/schemas/PapelMembro'
        tipo:
          $ref: '#/components/schemas/TipoEstabelecimento'
        reputacao:
          $ref: '#/components/schemas/Reputacao'

    MeusDados:
      type: object
      required: [gerado_em, conta, turnos, avaliacoes_dadas, avaliacoes_recebidas, dispositivos,
                 candidaturas, ocorrencias, bloqueios, notificacoes, despachos, equipe_confianca,
                 pedido_de_exclusao]
      description: |
        Portabilidade da LGPD: o que o titular forneceu e o que o sistema registrou sobre ele.

        As sete coleções acrescentadas na 0.2.33 — `candidaturas`, `ocorrencias`, `bloqueios`,
        `notificacoes`, `despachos`, `equipe_confianca` e `pedido_de_exclusao` — são obrigatórias
        como as demais: coleção vazia é `[]`, e `pedido_de_exclusao` é `null` quando não há pedido.
        Nenhuma delas vem ausente.
      properties:
        gerado_em:
          $ref: '#/components/schemas/Instante'
        conta:
          $ref: '#/components/schemas/Usuario'
        perfil_profissional:
          oneOf:
            - $ref: '#/components/schemas/PerfilProfissional'
            - type: 'null'
        estabelecimentos:
          type: array
          items:
            $ref: '#/components/schemas/EstabelecimentoDaConta'
        disponibilidade:
          type: array
          items:
            $ref: '#/components/schemas/JanelaDeDisponibilidade'
        turnos:
          type: array
          items:
            $ref: '#/components/schemas/Turno'
        avaliacoes_dadas:
          type: array
          items:
            $ref: '#/components/schemas/Avaliacao'
        avaliacoes_recebidas:
          description: |
            **Sem o autor.** A resposta individual não pertence ao titular, e devolvê-la aqui
            abriria pela porta da portabilidade o que RN07 fecha em todas as outras: a avaliação é
            binária e agregada justamente para que ninguém responda com medo de retaliação.
          type: array
          items:
            type: object
            required: [turno_id, resposta, criada_em]
            properties:
              turno_id:
                $ref: '#/components/schemas/Uuid'
              resposta:
                type: boolean
              criada_em:
                $ref: '#/components/schemas/Instante'
        dispositivos:
          type: array
          items:
            $ref: '#/components/schemas/Dispositivo'
        candidaturas:
          description: |
            As candidaturas do titular, no mesmo objeto que `/rpc/minhas_candidaturas` devolve — e
            pelo mesmo caminho, para não existir uma segunda definição de candidatura.

            Entram todas, inclusive as retiradas, recusadas e expiradas: o registro de ter se
            candidatado é dado do titular, e o estado final faz parte dele.
          type: array
          items:
            $ref: '#/components/schemas/Candidatura'
        ocorrencias:
          description: |
            Os registros em que o titular saiu do curso normal, de um lado ou do outro: denúncia
            que ele abriu, contestação de suspensão, pedido de revisão de despacho, atendimento de
            suporte, suspensão aplicada a ele e cancelamento registrado no nome dele. `papel` diz
            de que lado ele está em cada um.

            **`motivo` vem só quando o titular é o autor**, ou quando o tipo é `suspensao` — nesse
            caso o motivo é da Equipe Frila e ele já o lê em `/rpc/situacao_da_conta`. Quando ele é
            o alvo de uma denúncia, o texto foi escrito por outra pessoa, e devolvê-lo aqui abriria
            pela porta da portabilidade o que RF26 e RN07 fecham: quem denuncia precisa poder
            denunciar sem ser identificado.

            **Sem `resultado`.** O desfecho que a Equipe Frila escreve fala das duas partes; o que
            o titular precisa saber do próprio caso é se ele foi resolvido, e `resolvido_em` diz.
          type: array
          items:
            type: object
            required: [id, tipo, papel, criada_em]
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              tipo:
                type: string
                enum: [cancelamento, suspensao, contestacao, suporte, denuncia, revisao_despacho]
              papel:
                type: string
                enum: [autor, alvo]
                description: |
                  `autor` quando o titular abriu o registro, `alvo` quando ele é a parte sobre
                  quem o registro foi aberto.
              motivo:
                oneOf:
                  - type: string
                  - type: 'null'
                description: Nulo quando o titular é o alvo e o tipo não é `suspensao`.
              criada_em:
                $ref: '#/components/schemas/Instante'
              resolvido_em:
                oneOf:
                  - $ref: '#/components/schemas/Instante'
                  - type: 'null'
        bloqueios:
          description: |
            Quem o titular bloqueou (RF26), no mesmo par `alvo_tipo` + `alvo_id` que `/rpc/bloquear`
            devolve, e não o id de conta da outra parte.

            **Só os que ele criou.** Os bloqueios feitos contra ele não entram: saber que foi
            bloqueado é exatamente o que RF26 esconde, e uma exportação que contasse isso desfaria
            a proteção de todos os bloqueios já existentes.
          type: array
          items:
            $ref: '#/components/schemas/Bloqueio'
        notificacoes:
          description: |
            Os avisos endereçados à conta do titular (0.2.14): o que o sistema mandou para ele, de
            que tipo, sobre o que e quando.

            **Sem a mecânica de entrega.** Nada de token de aparelho, contagem de tentativas ou
            erro devolvido pelo provedor de push — é credencial e diagnóstico de infraestrutura,
            não dado do titular, pela mesma razão que `Dispositivo` não leva o token (RN15).
          type: array
          items:
            type: object
            required: [tipo, referencia_id, payload, enviada_em]
            properties:
              tipo:
                $ref: '#/components/schemas/TipoNotificacao'
              referencia_id:
                $ref: '#/components/schemas/Uuid'
                description: A vaga, posição, turno ou estabelecimento de que o aviso trata.
              payload:
                type: object
                description: |
                  O corpo que o toque no push carrega: só o tipo e ids (RN15). Chaves possíveis:
                  `vaga_id`, `posicao_id`, `turno_id`, `estabelecimento_id` e, no cancelamento,
                  `reaberta` (booleano). Nunca telefone, e-mail, nome ou coordenada.
                additionalProperties: true
              enviada_em:
                $ref: '#/components/schemas/Instante'
              entregue_em:
                oneOf:
                  - $ref: '#/components/schemas/Instante'
                  - type: 'null'
                description: Nulo enquanto o push não foi confirmado pelo aparelho, ou se falhou.
        despachos:
          description: |
            O registro de ter sido considerado para uma vaga (RF18, RN05): é o que sustenta a tela
            "Por que recebo vagas" e o pedido em `/rpc/pedir_revisao_despacho`.

            Uma linha por vaga, mesmo quando o aviso saiu agrupado com outras ou ainda não saiu: o
            despacho diz que o titular foi considerado, e a notificação diz o que chegou até ele.
            É por isso que os dois são coleções separadas aqui, como são duas tabelas no banco.
          type: array
          items:
            type: object
            required: [vaga_id, criado_em, reaberta]
            properties:
              vaga_id:
                $ref: '#/components/schemas/Uuid'
              criado_em:
                $ref: '#/components/schemas/Instante'
              reaberta:
                type: boolean
                description: O despacho nasceu da reabertura de uma posição por atraso (D06).
        equipe_confianca:
          description: |
            As casas que puseram o titular na equipe de confiança (RF18), com o instante em que
            isso aconteceu. Estar na equipe não muda a ordem de ninguém (RN06); muda o alcance: a
            pessoa é avisada das vagas daquela casa mesmo além dos 15 km.

            **Só o lado do profissional.** A equipe das casas que o titular administra é dado dos
            profissionais dela, e não dele — quem exporta os próprios dados não leva a lista de
            outras pessoas. Quem administra a casa lê essa equipe em `/rpc/equipe_de_confianca`.
          type: array
          items:
            type: object
            required: [estabelecimento_id, nome, adicionado_em]
            properties:
              estabelecimento_id:
                $ref: '#/components/schemas/Uuid'
              nome:
                type: string
              adicionado_em:
                $ref: '#/components/schemas/Instante'
        pedido_de_exclusao:
          description: |
            O pedido de exclusão de conta, quando existe (RF25), ou `null`. É registro de operação,
            e não cópia de dado: guarda o instante, o estado e quantas vezes o pedido foi repetido.

            Ele aparece na exportação porque sobrevive a uma exclusão que falhou — o pedido é
            gravado em transação própria, **antes** de a exclusão ser tentada, para não desaparecer
            junto com ela se ela voltar atrás. É nessa janela que o titular precisa poder ver que o
            pedido está registrado e pendente, em vez de não ter prova de que pediu.
          oneOf:
            - type: object
              required: [pedido_em, estado, tentativas]
              properties:
                pedido_em:
                  $ref: '#/components/schemas/Instante'
                estado:
                  type: string
                  enum: [pendente, concluido]
                tentativas:
                  type: integer
                  minimum: 1
                  description: Quantas vezes o pedido foi registrado. Quem repetiu porque a exclusão falhou aparece aqui.
                concluido_em:
                  oneOf:
                    - $ref: '#/components/schemas/Instante'
                    - type: 'null'
            - type: 'null'

    Dispositivo:
      type: object
      required: [plataforma, atualizado_em]
      properties:
        plataforma:
          $ref: '#/components/schemas/Plataforma'
        atualizado_em:
          $ref: '#/components/schemas/Instante'
        vinculo_id:
          type: string
          format: uuid
          description: |
            O vínculo deste token com a conta que o registrou, opaco. Muda quando o token passa de
            uma conta para outra e quando é registrado de novo depois de `remover_dispositivo`; o
            registro repetido pela mesma conta devolve o mesmo valor. Vem igual em todo push
            mandado a este aparelho para esta conta. Opcional: o servidor anterior à 0.2.30 não o
            devolve, e o app trata a ausência como "sem conferência por vínculo".
    ExclusaoDeConta:
      type: object
      required: [perfil_removido_em, dados_apagados_ate, turnos_cancelados]
      properties:
        perfil_removido_em:
          $ref: '#/components/schemas/Instante'
        dados_apagados_ate:
          type: string
          format: date
          example: '2026-10-11'
          description: Até 15 dias depois do pedido (RF25). Limite para purga dos backups/retenção LGPD.
        turnos_cancelados:
          type: integer
          minimum: 0
          example: 2
