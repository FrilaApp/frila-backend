    **Versão 0.2.12, de 25/09/2026.** `avaliar` e `perfil_publico` foram implementadas, e
    com elas o ciclo do Sprint 1 fecha inteiro. As duas já estavam descritas aqui; o que
    muda é o que a implementação precisou decidir e este documento não dizia.

    - **A avaliação é um voto por lado do turno, e não um voto por pessoa.** Era a única
      coisa que este contrato afirmava duas vezes, de dois jeitos: a tabela de erros dizia
      "avaliação **deste autor**", e `Turno.pode_avaliar` dizia "sem avaliação **deste
      lado** ainda". Vale o lado. Um estabelecimento tem vários membros, e dois deles
      votando no mesmo turno dariam à casa dois votos sobre o mesmo profissional — a
      reputação deixaria de comparar gente com gente. A linha da tabela de erros foi
      corrigida.
    - **A consequência prática, para a tela:** o operador que reenvia a resposta que o
      administrador já gravou recebe **`200` com a avaliação do lado dele**, e não um
      erro. Se a resposta for diferente, recebe `409 avaliacao_ja_registrada`. A tela
      precisa saber disso: "já avaliado" aqui pode significar "a sua casa já avaliou", e
      não "você já avaliou".
    - **`avaliar` responde `403 sem_permissao` também para turno que não existe**, e não
      `404`. É o mesmo critério do resto do turno: a diferença entre "não é seu" e "não
      existe" diria a um estranho que aquele turno existe.
    - **`turno_id` ausente é `422 campo_obrigatorio` com `details: turno_id`.** Campo
      faltando não é falta de permissão, e mandar a tela pedir permissão para consertar um
      campo é mandá-la para o lugar errado.
    - **Conta suspensa não avalia**: `403 sem_permissao` com `details: conta_suspensa`,
      igual a `publicar_vaga` (RN13).
    - **`perfil_publico` de conta anonimizada devolve `nome: "Conta encerrada"`** (RF25). A
      anonimização não apaga o nome da linha — quem mascara é a leitura —, e o mesmo nome
      passa a valer em `detalhe_vaga`, `vagas_abertas` e no painel, que leem a mesma
      função.

    O que **não** mudou, e vale dizer por escrito: `perfil_publico` continua sem filtrar
    bloqueio (RF26), embora o catálogo de erros diga que o `404` "inclui bloqueio". O
    cartão de implementação não pedia, e a decisão é de produto. Está registrado como
    divergência aberta, e não como esquecimento.

