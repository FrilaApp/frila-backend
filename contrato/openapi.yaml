    **Versão 0.2.47, de 01/11/2026.** Coordenadas exatas do estabelecimento em `meus_turnos` (RN06, RN22, Cartão 72):

    - **`VagaResumo.ponto`** (`Coordenada` ou nulo, opcional): expõe latitude e longitude do estabelecimento
      em `/rpc/meus_turnos` (e em `MeusDados.turnos`). Permite ao cliente Android (e iOS) obter as coordenadas
      exatas para monitoramento de proximidade e geofencing nativo de check-in (RN22), eliminando o fallback
      impreciso de geocodificação offline por texto sobre centróides de regiões administrativas.
    - **Regra de Visibilidade e LGPD (art. 7º, V e VI, opção mais restritiva):**
      - **Para o profissional alocado no turno:** as coordenadas exatas (`ponto`) só aparecem enquanto o turno
        estiver confirmado (`posicao.estado = 'confirmada'`, cobrindo turnos futuros e em andamento, sob o
        art. 7º, V — execução de contrato), ou quando cumprido com presença comprovada (`posicao.estado = 'cumprida'`
        e `verificacao = 'verificado'`, sob o art. 7º, VI — exercício regular de direitos e resguardo probatório).
      - **Nos demais casos do profissional** (turnos cancelados `posicao.estado = 'cancelada'`, ou turnos
        cumpridos com presença não verificada `verificacao = 'nao_verificado'`), o campo `ponto` é retornado como
        **nulo**, mitigando exposição de geolocalização residencial/privada sem necessidade operacional (LGPD art. 6º, III).
      - **Para membros do estabelecimento:** membros com acesso a `/rpc/meus_turnos?estabelecimento_id=...`
        leem as coordenadas de suas próprias vagas normalmente.
      - **Em `/rpc/minhas_candidaturas`:** `Candidatura.vaga` continua sem coordenadas (campo omitido/nulo),
        pois o candidato ainda não foi confirmado para o turno.
      - **Terceiros:** nunca recebem dados nem coordenadas de turnos alheios (recusa com lista vazia `[]` ou `403 sem_permissao`).
    - **Compatibilidade total:** `ponto` é opcional (fora da lista `required` de `VagaResumo`). Clientes legados
      continuam desserializando `VagaResumo` normalmente; clientes v1.1 passam a priorizar `vaga.ponto` quando
      presente.

    **Versão 0.2.46, de 23/10/2026.** Push FCM data-only para Android e alerta APNs no iOS (RN15):

    - **Android (push data-only e canais por tipo):** O FCM envia a mensagem sem bloco raiz `notification` e
      sem o bloco `android.notification` (`channel_id`), enviando apenas o bloco `data` com `tipo`,
      `vinculo_id`, os ids da entidade (`vaga_id`, etc.) e as strings `titulo` e `corpo`. Com isso, o Android
      executa incondicionalmente `FirebaseMessagingService.onMessageReceived()` em segundo plano ou com o app
      fechado, permitindo ao `ProcessadorDePush` validar o `vinculo_id` da sessão ativa antes de qualquer
      exibição (isolamento de conta em aparelho compartilhado, RN15) e selecionar o canal de notificação
      apropriado conforme a tabela abaixo:

      | `data.tipo` | Canal Android (`channel_id`) | Importância | Finalidade do aviso |
      | :--- | :--- | :--- | :--- |
      | `vaga` | `canal_urgencia` | Alta (`IMPORTANCE_HIGH`) | Nova oportunidade de vaga de trabalho |
      | `vagas_agrupadas` | `canal_urgencia` | Alta (`IMPORTANCE_HIGH`) | Vagas agrupadas pelo teto da RN23 |
      | `confirmacao` | `canal_turnos` | Padrão (`IMPORTANCE_DEFAULT`) | Confirmação de vaga pelo contratante |
      | `lembrete_24h` | `canal_turnos` | Padrão (`IMPORTANCE_DEFAULT`) | Lembrete de turno com 24h de antecedência |
      | `lembrete_3h` | `canal_turnos` | Padrão (`IMPORTANCE_DEFAULT`) | Lembrete de turno com 3h de antecedência |
      | `inicio_sem_checkin` | `canal_turnos` | Padrão (`IMPORTANCE_DEFAULT`) | Alerta de turno iniciado sem check-in |
      | `atraso_15min` | `canal_turnos` | Padrão (`IMPORTANCE_DEFAULT`) | Alerta de 15 minutos de tolerância esgotados |
      | `fim_sem_checkout` | `canal_turnos` | Padrão (`IMPORTANCE_DEFAULT`) | Alerta de turno finalizado sem check-out |
      | `checkin` | `canal_turnos` | Padrão (`IMPORTANCE_DEFAULT`) | Confirmação de check-in efetuado |
      | `checkin_manual_pendente` | `canal_turnos` | Padrão (`IMPORTANCE_DEFAULT`) | Solicitação de check-in manual pendente |
      | `cancelamento` | `canal_turnos` | Padrão (`IMPORTANCE_DEFAULT`) | Cancelamento de candidatura ou turno |
      | `avaliacao_disponivel` | `canal_turnos` | Padrão (`IMPORTANCE_DEFAULT`) | Liberação de avaliação mútua |
      | `vaga_vazia` | `canal_sistema` | Padrão (`IMPORTANCE_DEFAULT`) | Vaga expirada sem candidatos |
      | `candidatura_recusada` | `canal_sistema` | Padrão (`IMPORTANCE_DEFAULT`) | Candidatura não selecionada |
      | `suspensao` | `canal_sistema` | Padrão (`IMPORTANCE_DEFAULT`) | Notificação de suspensão de conta (RF24) |
      | `reativacao` | `canal_sistema` | Padrão (`IMPORTANCE_DEFAULT`) | Notificação de reativação de conta |
      | *(demais / futuro)* | `canal_sistema` | Padrão (`IMPORTANCE_DEFAULT`) | Fallback de sistema |

      *Nota de compatibilidade:* No backend, tipos administrativos/gerais usavam internamente `canal_geral`.
      No cliente Android, os canais criados são exclusivamente `canal_urgencia`, `canal_turnos` e `canal_sistema`;
      portanto, `canal_geral` é unificado em `canal_sistema`.
    - **iOS (alerta via APNs e mutable-content):** O título e corpo são entregues em `apns.payload.aps.alert`
      (`{ title, body }`), junto de `sound: "default"`, `badge: 1` e `mutable-content: 1`, preservando a
      interceptação pré-exibição pela Notification Service Extension para validação do `vinculo_id`.

