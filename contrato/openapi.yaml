    **Versão 0.2.9, de 24/09/2026.** `contato_do_turno` foi implementada, e o único 403
    que ela devolve é o do prazo.

    - **Quem não é nenhum dos dois lados do turno recebe `404 nao_encontrado`**, e não
      `403 sem_permissao`. O 403 confirmaria que aquele turno existe a quem não deveria
      saber. O mesmo 404 responde antes da confirmação — sem confirmação não há contrato
      a executar, e portanto não há base legal — e quando há bloqueio entre as partes.
    - **`403 contato_expirado` é o prazo virando resposta**, e vale para os dois lados.
      O sétimo dia conta inteiro: a recusa começa depois de `fim_em + 7 dias`.
    - O contato do profissional traz o **nome da pessoa**; o da casa, o **nome do
      estabelecimento**. Deste lado há gente, do outro há marca.

    ---

    **Versão 0.2.8, de 24/09/2026.** `meus_turnos` foi implementada, para os dois lados.

    - **É a mesma operação para o profissional e para a casa**, e o que muda é quem
      aparece em `contraparte`: para o profissional, o estabelecimento; para quem opera
      a casa, o profissional. Com `estabelecimento_id`, quem pergunta precisa ser membro
      — senão `403 sem_permissao`.
    - **Conta de contratante sem `estabelecimento_id` recebe lista vazia**, e não erro.
      A pergunta "quais são os meus turnos como profissional?" é válida vinda de
      qualquer conta; a resposta é "nenhum".
    - **A ordem é a da tela**: hoje e os próximos primeiro, do mais próximo para o mais
      distante; os anteriores depois, do mais recente para o mais antigo. O turno de
      hoje é o que a pessoa abre o app para ver.
    - **Nenhum telefone sai por aqui.** O contato tem porta própria, `contato_do_turno`,
      que confere o prazo de RN10 — uma lista que já trouxesse o contato tornaria o
      prazo decorativo. `contato_visivel_ate` vem em cada turno justamente para que a
      tela saiba se pode oferecer o botão antes de tocá-lo.

    ---

    **Versão 0.2.7, de 24/09/2026.** `candidatar` foi implementada no modo urgência, e
    a implementação separou dois casos que o contrato tratava como um só.

    - **Vaga `preenchida` recusa com `409 posicao_ja_preenchida`, e não com
      `vaga_encerrada`.** Os dois são 409 e a diferença importa para a tela:
      `vaga_encerrada` é "esta vaga não existe mais" — cancelada, encerrada ou já
      começada; `posicao_ja_preenchida` é "alguém chegou antes", que o produto trata
      como funcionamento normal. Uma vaga preenchida fechou porque **encheu**, e quem
      chegou depois merece a tela do segundo caso.
    - **`422 inelegivel` com `details: funcao_incompativel`** também para quem ainda não
      tem perfil profissional. Sem perfil não há função cadastrada, e sem função nenhuma
      vaga serve; os dois casos terminam na mesma tela, a de completar o perfil.
    - **`404 nao_encontrado`** para vaga que o profissional não deveria alcançar —
      bloqueio entre as partes ou conta de demonstração —, igual ao que `detalhe_vaga`
      responde. Candidatar-se é a continuação natural de ter visto a vaga, e as duas
      operações escondem a mesma coisa.

    `contato` volta preenchido já na resposta da confirmação, com o prazo do RN10: o
    fim previsto do turno mais 7 dias. O `whatsapp_url` sai sem o `+` do E.164, que o
    `wa.me` não aceita — a regra mora no servidor para não ser reescrita em três apps.

    ---

    **Versão 0.2.6, de 24/09/2026.** `vagas_abertas` e `detalhe_vaga` foram
    implementadas. As duas são leituras, e o que a implementação acrescentou aqui é
    sobretudo **o que elas recusam** e **o que elas escondem**.

    - **As duas são a tela de quem procura turno**, e recusam conta de contratante com
      `422 perfil_incompativel`. Antes isso não estava escrito, e um cliente que
      chamasse com a conta errada receberia uma lista vazia — que a tela leria como
      "não há vagas", e não como "esta tela não é sua".
    - **`limite` fora de 1..100 e `deslocamento` negativo** são `422 campo_invalido` com
      o nome do parâmetro em `details`, e não um truncamento silencioso.
    - **Sem coordenada e sem ponto base**, `vagas_abertas` recusa com
      `422 campo_obrigatorio` e `details: latitude`. Sem ponto de referência não há
      ordem, e ordenar por um ponto inventado devolveria uma lista plausível e errada.
    - **`detalhe_vaga` responde `404 nao_encontrado`** para vaga que o profissional não
      deveria alcançar — bloqueio entre as partes (RF26) ou conta de demonstração — e
      não `403`. Um 403 confirmaria que aquela vaga existe, e quem bloqueou alguém não
      deve receber prova de que a outra parte continua publicando.
    - **Conta de demonstração e conta real não se enxergam** (diretrizes 2.1 e 4.2): a
      lista e o detalhe de uma população nunca trazem a vaga da outra.
    - **`PerfilPublico` de estabelecimento** traz `taxa_comparecimento` nula e os dois
      contadores de turno em zero. A taxa é do profissional — é ele que comparece ou
      falta —, e zero aqui não é "nunca trabalhou": é "este campo não se aplica a esta
      ponta".

    Uma correção, e não uma adição: `PerfilPublico` de **profissional** passou a trazer
    `turnos_realizados`, que o schema `Reputacao` exige desde a 0.2.1 e a implementação
    não devolvia. Um cliente gerado a partir do contrato quebraria ao desserializar.

    ---

    **Versão 0.2.5, de 24/09/2026.** `publicar_vaga` foi implementada, e o que a
    implementação descobriu está escrito aqui.

    - **`modo = selecao` é recusado na v1.0**, com `422 campo_invalido` e `details: modo`.
      O escopo do MVP tem só o modo urgência. O código **não** é
      `selecao_sem_antecedencia`: aquele é a regra das 24 horas de RN24, e ele só volta a
      ter sentido na v1.1, quando o modo passar a existir e houver antecedência para
      recusar. Um cliente que trate os dois como o mesmo erro vai dizer "publique com mais
      antecedência" para quem escolheu um modo que ainda não existe.
    - **`422 campo_invalido` com o campo em `details`** para `valor_centavos` não positivo,
      `posicoes` fora de 1..200, `funcao_id` fora do catálogo e `ponto` com latitude ou
      longitude fora da faixa. Antes isso chegava ao cliente como violação de restrição do
      banco, que ele não sabe ler.
    - **`403 sem_permissao`** para quem não é membro do estabelecimento — inclusive quando o
      estabelecimento não existe, e de propósito: um 404 diria a quem não é membro que
      aquele estabelecimento existe. Conta suspensa recebe o mesmo 403, com
      `details: conta_suspensa` (RN13).
    - **`422 perfil_incompativel`** para conta de profissional (RN25).
    - **Diretriz 1.2**: `local`, `responsavel_local`, `traje` e `observacoes` passam pelo
      filtro de termos bloqueados, e recusam com `422 campo_invalido` e o campo em
      `details`, como a 0.2.3 antecipou.

    A resposta não mudou: `VagaPublicada` com `vaga_id` e um id por posição. O despacho
    continua fora da requisição (B15) — publicar enfileira e responde.

    ---

    **Versão 0.2.4, de 23/09/2026.** Um código de erro novo e uma resposta que faltava.

    As três RPCs do perfil profissional foram implementadas, e duas coisas que o contrato
    não dizia apareceram na implementação:

    - **`409 perfil_ja_existe`**, em `criar_perfil_profissional`. O contrato já previa a
      resposta 409; faltava o código. Criar duas vezes é conflito e não sobrescrita —
      sobrescrever apagaria a grade semanal de quem tocasse duas vezes no botão de
      cadastrar, e quem quer mudar chama `atualizar_perfil_profissional`.
    - **`404` em `atualizar_perfil_profissional`.** Atualizar um perfil que não existe não
      é erro de campo. Sem essa resposta declarada, o cliente não tinha como distinguir
      "seu perfil sumiu" de "você mandou um campo errado".

    Também ficou escrito o que `atualizar_perfil_profissional` faz com uma chamada sem
    nenhum campo: `422 campo_obrigatorio` com `details: nenhum_campo`. É o mesmo que o
    `minProperties: 1` do schema já dizia, agora com o código que o cliente compara.

    ---

    **Versão 0.2.3, de 23/09/2026.** Uma recusa nova numa operação que já existia.

    `criar_conta` passa a conferir o `nome` contra a lista de termos bloqueados da
    diretriz 1.2 da App Store, e recusa com `422 campo_invalido`, `details: nome`. O
    código já estava no catálogo desde a 0.2.2; o que muda é que `criar_conta` passa a
    poder devolvê-lo, e a tela do cadastro precisa tratar dois motivos diferentes para o
    mesmo campo — `campo_obrigatorio` quando falta, `campo_invalido` quando não serve.

    A ordem das duas conferências é parte do contrato: nome vazio continua saindo como
    `campo_obrigatorio`. Um cliente que trate os dois com o mesmo texto vai dizer
    "preencha o nome" para quem preencheu.

    O filtro é por palavra inteira sobre o texto sem acento e em minúsculas. Não persegue
    variação de grafia, e isso é desenho, não limitação: um filtro que persegue grafia
    vira um filtro que recusa nome de gente, e o custo dos dois erros não é o mesmo —
    texto ofensivo que escapa tem denúncia e bloqueio atrás dele (RF26), enquanto quem
    não consegue se cadastrar apenas vai embora.

    `publicar_vaga`, `republicar_vaga` e `cadastrar_estabelecimento` vão chamar o mesmo
    filtro em `traje`, `observacoes`, `responsavel_local` e `nome` quando forem
    implementadas, no Sprint 1. Cada uma acrescenta a recusa à sua própria lista aqui.

    ---

    **Versão 0.2.2, de 23/09/2026.** Só adições e uma troca de parâmetro; nenhuma operação saiu.

    Em relação à 0.2.1: entram `meus_estabelecimentos`, `remover_dispositivo`,
    `configuracao_do_app`, `registrar_evento` e a Edge Function `entrar-demonstracao`; `Turno`
    ganha `contato_visivel_ate`; `Reputacao` ganha `turnos_realizados` ao lado de
    `turnos_considerados`, que passam a ter definição escrita; `exportar-meus-dados` ganha o
    schema do que devolve; e o catálogo de erros ganha `campo_invalido`, `fora_da_janela`,
    `registro_no_futuro`, `contestacao_ja_aberta`, o `details` `conta_suspensa` em
    `sem_permissao` e o `funcao_incompativel` em `inelegivel`.

    **A única mudança que quebra cliente:** `bloquear` e `denunciar` trocam `alvo_usuario_id` por
    `alvo_tipo` + `alvo_id`. O campo antigo era impreenchível — nenhuma resposta do contrato devolve
    o id de *conta* da outra parte, então o app não tinha como preenchê-lo. O que ele recebe é o
    `PerfilPublico`, que traz `id` e `tipo`; o servidor resolve a conta a partir daí. Como não
    havia cliente capaz de chamar as duas operações, a troca não deixa ninguém para trás e não
    vira `_v2`.

    A 0.2.1, de 22/09, tinha trazido o aceite dos termos em `criar_conta`, a criação de
    `minha_conta` e a chave `headers` no trecho de `erro()`, sem a qual o PostgREST devolve 500 em
    toda recusa de regra de negócio.

    Fica para a próxima versão: escala de evento em lote (RF19), convite de membros do
    estabelecimento (RF21) e verificação progressiva de identidade (RN14).

    ### Divergências conhecidas com o quadro

    Levantadas na conferência de 23/09 contra os 83 cartões do Sprint 1 e do Sprint 2. Aqui está o
    que o contrato decidiu, e por quê — quem lê o cartão e o contrato juntos precisa saber qual dos
    dois está atrasado.

    - **`criar_conta` não recebe a data do aceite.** O cartão pede "versão e data". A versão vem do
      cliente; o instante é carimbado pelo servidor, porque data de aceite enviada pelo app é
      forjável — e um registro de consentimento que a parte interessada pode escrever não vale como
      registro. O cartão é que precisa mudar.
    - **`meus_turnos` filtra por `de` e `ate`, não por `periodo`.** Um enum de período ("semana",
      "mês") obriga o servidor a adivinhar o fuso de quem pergunta, e o produto tem turno que vira a
      noite. O intervalo explícito não tem essa ambiguidade.
  contact:
    name: BlendOps — Challenge 18
servers:
  - url: https://{projeto}.supabase.co/rest/v1
    description: API REST do Supabase (PostgREST) — tabelas e funções RPC.
    variables:
      projeto:
        default: frila
        description: Identificador do projeto no Supabase.
security:
  - chaveDoProjeto: []
    tokenDoUsuario: []
tags:
  - name: Autenticação
    description: Supabase Auth, usado pelo SDK de cada plataforma. Entrada por código de uso único enviado ao e-mail, sem senha e sem SMS (RF01).
  - name: Cadastro e perfil
    description: Conta, perfil do profissional, disponibilidade e explicação do despacho (RF01, RF03, RF27).
  - name: Estabelecimento
    description: Cadastro do estabelecimento e equipe de confiança (RF02, RF18).
  - name: Vagas
    description: Publicação e lista de vagas (RF04, RF05, RF07, RF09).
  - name: Candidatura e confirmação
    description: Candidatura sem formulário e confirmação sem duplicidade (RF08, RF09, RF10, RN19, RN24).
  - name: Turno
    description: Contato, aviso a caminho, check-in, check-out, cancelamento e reabertura (RF11, RF12, RF13, RF14, RN10, RN22).
  - name: Avaliação e reputação
    description: Avaliação binária e perfil público com denominador (RF15, RF16, RN07, RN08).
  - name: Painel do gestor
    description: Acompanhamento de vagas e turnos pelo estabelecimento, no app e na web (RF20, UC07).
  - name: Confiança e direitos
    description: Denúncia, bloqueio, suspensão, contestação e verificação de identidade (RF24, RF26, RN13, RN14).
  - name: Dispositivos
    description: Registro do token de push (FCM) de cada aparelho.
  - name: Exportação e conta
    description: Exportação de turnos e de dados pessoais, e exclusão da conta (RF22, RF25).
  - name: Aplicativo
    description: Configuração que o app precisa antes de ter sessão — versão mínima e aviso de atualização.
  - name: Telemetria
    description: Eventos do dicionário de métricas, só com identificadores (RN15).
  - name: Catálogo
    description: Dados de referência lidos direto da tabela.

paths:

  # ───────────────────────────────────────────── Autenticação (Supabase Auth)

  /otp:
    servers:
      - url: https://{projeto}.supabase.co/auth/v1
        variables:
          projeto:
            default: frila
    post:
      tags: [Autenticação]
      operationId: pedirCodigo
      summary: Pedir o código de entrada por e-mail
      description: |
        Envia um código de uso único ao e-mail. Os apps chamam pelo SDK do Supabase (`signInWithOtp`
        com `email`); a rota está aqui para o contrato ficar completo. Cria a conta de autenticação se
        ela ainda não existir. O modelo de e-mail do Supabase leva o código (`{{ .Token }}`), e não o
        link. O envio de e-mail embutido do Supabase serve só para teste; o piloto usa um provedor de
        e-mail próprio (SMTP).
      security:
        - chaveDoProjeto: []
      x-requisitos: [RF01, UC09, UC10]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Código enviado.
        '429':
          $ref: '#/components/responses/LimiteExcedido'

  /verify:
    servers:
      - url: https://{projeto}.supabase.co/auth/v1
        variables:
          projeto:
            default: frila
    post:
      tags: [Autenticação]
      operationId: confirmarCodigo
      summary: Confirmar o código e abrir a sessão
      description: |
        Troca o código recebido no e-mail por uma sessão. O token de acesso é curto e o de renovação é
        longo; os dois ficam no Keychain (iOS), no Keystore (Android) ou em cookie `HttpOnly` (web),
        nunca em `UserDefaults` ou `localStorage` (RNF07).
      security:
        - chaveDoProjeto: []
      x-requisitos: [RF01, RNF07]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, type]
              properties:
                email:
                  type: string
                  format: email
                token:
                  type: string
                  description: Código recebido no e-mail.
                  example: '000000'
                type:
                  type: string
                  const: email
      responses:
        '200':
          description: Sessão aberta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /token:
    servers:
      - url: https://{projeto}.supabase.co/auth/v1
        variables:
          projeto:
            default: frila
    post:
      tags: [Autenticação]
      operationId: renovarSessao
      summary: Renovar o token de acesso
      security:
        - chaveDoProjeto: []
      parameters:
        - name: grant_type
          in: query
          required: true
          schema:
            type: string
            const: refresh_token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Nova sessão.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  # ───────────────────────────────────────────── Cadastro e perfil

  /rpc/configuracao_do_app:
    get:
      tags: [Aplicativo]
      operationId: configuracaoDoApp
      summary: Versão mínima do app e aviso de atualização obrigatória
      description: |
        Chamada na abertura, **antes de haver sessão**: um app abaixo da versão mínima precisa
        conseguir descobrir isso mesmo sem conseguir entrar. Por isso é a única operação de
        `rest/v1` que dispensa o token do usuário — a chave publicável basta.

        `versao_minima` é por plataforma e é comparada pelo app contra a própria versão de build.
        Abaixo dela, a tela de bloqueio substitui o app inteiro e leva à loja; a partir de
        `versao_recomendada`, o aviso é dispensável e aparece uma vez por versão.

        Existe porque a v1.1 sai com o piloto rodando e o app antigo continua nos aparelhos. Sem
        este canal, um defeito grave não sai de circulação e o backend fica preso à compatibilidade
        com ele para sempre.

        **Recursos por versão (0.2.65).** Sem `versao_app`, ou com ela malformada, todos os campos de
        `recursos` vêm `false`: é o que recebem o app 1.0 e o 1.1, que não a mandam. Com ela, cada
        recurso vem `true` só se as duas condições valem: o servidor liga a chave do recurso, e a
        versão é igual ou maior que a versão mínima que o servidor guarda para aquele recurso naquela
        plataforma. Sem mínimo configurado para a plataforma, o recurso vem `false` (fechado por
        padrão, como a chave ausente). Ligar um recurso numa plataforma exige, portanto, dois atos: a
        chave e o mínimo. Assim, um build com código ainda não revisado pela loja nunca liga por
        esquecimento. O mínimo do recurso não aparece na resposta e não tem relação com
        `versao_minima`, que é a do bloqueio.
      security:
        - chaveDoProjeto: []
      x-requisitos: [RN46]
      parameters:
        - name: plataforma
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Plataforma'
        - name: versao_app
          in: query
          required: false
          description: |
            0.2.65, revisto na 0.2.67. Versão do app que chama (no iOS, o `CFBundleShortVersionString`).
            De uma a quatro partes numéricas separadas por ponto, como `versao_minima` e
            `registrar_dispositivo.versao_app`; a parte que faltar vale 0 (`1.2` é `1.2.0`), e a
            comparação é parte a parte, como número (`1.10.0` é maior que `1.9.0`). Fora desse
            formato, o servidor trata como ausente e devolve os recursos `false`, sem erro, porque esta
            é a chamada da abertura e não pode travar o app. Só decide `recursos`; o bloqueio por
            `versao_minima` continua comparado pelo app.
          schema:
            type: string
            pattern: '^[0-9]{1,6}(\.[0-9]{1,6}){0,3}$'
            example: "1.2"
      responses:
        '200':
          description: Configuração em vigor para a plataforma.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracaoDoApp'
        '404':
          description: |
            `nao_encontrado` com `details: plataforma`: a plataforma existe no enum, mas ainda não
            tem configuração (hoje, só `ios` tem). Bloquear quem não tem loja para onde ir não
            ajudaria ninguém.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '422':
          description: |
            `campo_obrigatorio` quando `plataforma` está ausente ou em branco; `campo_invalido`
            quando está fora do enum. Os dois com `details: plataforma`. Não há autenticação a
            falhar, porque esta operação existe justamente para o app que ainda não conseguiu entrar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /rpc/criar_conta:
    post:
      tags: [Cadastro e perfil]
      operationId: criarConta
      summary: Criar a conta do usuário depois de confirmar o e-mail
      description: |
        Cria a linha de `usuario` ligada à conta de autenticação do chamador. O e-mail vem da conta
        já confirmada pelo código. O perfil (`profissional` ou `contratante`) é gravado aqui e não
        muda depois (RN25): para usar o outro perfil, a pessoa cria outra conta, com outro e-mail. O
        telefone é obrigatório, porque é o contato do turno (RN10); o banco confere só o formato, sem
        verificação por SMS, e o mesmo número pode estar em outra conta. A maioridade é verificada
        no banco pela data de nascimento, e não por um booleano enviado pela tela (RN20). Nenhum
        documento é pedido aqui (RN14).

        Se o app consultou a faixa etária do aparelho (Declared Age Range), envia o resultado
        em `sinal_idade`. O servidor guarda só a faixa, o método e o instante da aferição —
        nunca a data vinda do aparelho nem identificador do sistema — e não os devolve: são
        prova de conformidade (ECA Digital), não dado do perfil. Quem não envia o campo é
        cadastrado como hoje.

        O `nome` passa pelo filtro de texto da diretriz 1.2 da App Store: termo da lista de
        bloqueio, como palavra inteira, é recusado com `422 campo_invalido` e `details: nome`. A
        conferência vem **depois** da de presença, então nome vazio continua saindo como
        `campo_obrigatorio` — a tela mostra texto diferente para "faltou" e para "não serve", e
        tratar os dois com a mesma mensagem diria "preencha o nome" para quem preencheu.

        O filtro compara palavra inteira, o que é por que `Ana Cunha` passa enquanto `cu` sozinho
        não. Ele não persegue variação de grafia, e isso é desenho: texto ofensivo que escapa tem
        denúncia e bloqueio atrás dele (RF26); quem não consegue se cadastrar não tem nada atrás.
      x-requisitos: [RF01, RN14, RN20, RN25, UC09, UC10]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [perfil, nome, telefone, nascimento, termos_versao]
              properties:
                perfil:
                  $ref: '#/components/schemas/PerfilConta'
                nome:
                  type: string
                  minLength: 2
                telefone:
                  $ref: '#/components/schemas/Telefone'
                nascimento:
                  type: string
                  format: date
                  example: '1998-04-12'
                termos_versao:
                  type: string
                  minLength: 1
                  description: |
                    Versão dos termos de uso e da política de privacidade que a tela exibiu.
                    Guardar só um booleano não responde o que a pessoa aceitou, que é o que a
                    LGPD e a diretriz da App Store perguntam. **Não há campo de data**: o
                    instante é carimbado pelo servidor, porque data de aceite enviada pelo
                    cliente é forjável e não vale como registro de consentimento.
                  example: '2026-09-22'
                sinal_idade:
                  type: string
                  enum: [dezoito_ou_mais, recusou, indisponivel]
                  description: |
                    Faixa etária que o aparelho respondeu no cadastro (Declared Age Range,
                    iOS 26.2 ou mais novo). Opcional: app que não consulta o sinal não envia
                    o campo. `abaixo_de_18` não é valor aceito — o app bloqueia antes de
                    chamar. O servidor grava só a faixa, o método (`aparelho` para
                    `dezoito_ou_mais`; `declaracao`, isto é, data de nascimento mais aceite
                    dos termos, nos outros dois) e o instante, pelo próprio relógio; nada
                    disso volta na resposta. Valor fora da lista: `422 campo_invalido` com
                    `details: sinal_idade`. Prova de como a idade foi aferida (Lei
                    15.211/2025, art. 9º; Decreto 12.880/2026, arts. 24 §3º e 25 a 27).
                  example: dezoito_ou_mais
      responses:
        '200':
          description: Conta criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/minha_conta:
    get:
      tags: [Cadastro e perfil]
      operationId: minhaConta
      summary: Ler a própria conta
      description: |
        O app chama ao abrir, para saber se a sessão já tem conta no produto. Depois de
        confirmar o código existe sessão e pode não existir conta: `404 nao_encontrado` é
        como o app sabe que precisa mandar a pessoa para o cadastro, em vez de mandar de
        novo quem já cadastrou.
      x-requisitos: [RF01, UC09, UC10]
      responses:
        '200':
          description: Conta do chamador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /rpc/criar_perfil_profissional:
    post:
      tags: [Cadastro e perfil]
      operationId: criarPerfilProfissional
      summary: Criar o perfil de profissional
      description: |
        Declara funções, ponto base e disponibilidade. Não há distância para configurar: a
        notificação vai para quem está a até 15 km do local da vaga (RN05). O perfil passa a receber
        notificações assim que tiver ao menos uma função e o ponto base. Conta de contratante é
        recusada com `422 perfil_incompativel` (RN25).

        Chamar numa conta que já tem perfil é `409 perfil_ja_existe`, e não sobrescrita: sobrescrever
        apagaria a grade semanal de quem tocasse duas vezes no botão. Para mudar, use
        `atualizar_perfil_profissional`.

        **Grade vazia é aceita.** `disponibilidades: []` cadastra o perfil sem nenhuma janela, e cabe
        ao app avisar que, assim, ele não vai receber notificação. Recusar obrigaria a pessoa a
        inventar uma grade para terminar o cadastro — e grade inventada é pior que grade vazia,
        porque produz despacho para quem não vai atender.

        Função fora do catálogo é `422 campo_invalido` com `details: funcoes`; latitude ou longitude
        fora da faixa, `campo_invalido` com `details: ponto_base`; `dia_semana` fora de 0..6 ou
        janela de duração zero, `campo_invalido` com `details: disponibilidades`.
      x-requisitos: [RF01, RF03, RN05, RN25, UC09]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DadosDoPerfilProfissional'
      responses:
        '200':
          description: Perfil criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilProfissional'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/meu_perfil_profissional:
    get:
      tags: [Cadastro e perfil]
      operationId: meuPerfilProfissional
      summary: Ler o próprio perfil de profissional
      x-requisitos: [RF03, RF16]
      responses:
        '200':
          description: Perfil do chamador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilProfissional'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /rpc/atualizar_perfil_profissional:
    post:
      tags: [Cadastro e perfil]
      operationId: atualizarPerfilProfissional
      summary: Alterar funções, ponto base ou disponibilidade
      description: |
        Os campos enviados substituem os atuais; os omitidos ficam como estão. A mudança vale na
        próxima notificação, sem novo login (RF03).

        **É substituição, não acréscimo.** `disponibilidades: []` limpa a grade; `funcoes: []` é
        `422 campo_obrigatorio` com `details: funcoes`, porque perfil sem função nenhuma não recebe
        vaga nenhuma. Chamada sem nenhum campo é `422 campo_obrigatorio` com `details: nenhum_campo`
        — é o que o `minProperties: 1` do schema já dizia, com o código que o cliente compara.
      x-requisitos: [RF03, UC09]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlteracaoDoPerfilProfissional'
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilProfissional'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/atualizar_apresentacao_profissional:
    post:
      tags: [Cadastro e perfil]
      operationId: atualizarApresentacaoProfissional
      summary: Alterar "Sobre mim", experiência, cursos e idiomas
      description: |
        0.2.53. Campos opcionais do perfil do profissional (RN26). Os enviados substituem os atuais;
        os omitidos ficam como estão; `null` limpa o campo. Chamada sem nenhum campo é
        `422 campo_obrigatorio` com `details: nenhum_campo`.

        Texto passa pelo filtro de termos e pelo filtro de contato (telefone, e-mail, link, @ e chave
        Pix): recusa com `422 campo_invalido` e o nome do campo em `details` (RN38). Conta de
        contratante é `422 perfil_incompativel` (RN25).
      x-requisitos: [RN26, RN38, RN39, RN25]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApresentacaoDoProfissional'
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilProfissionalDetalhado'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: |
            `sem_permissao` com `details: recurso_desligado` quando `recursos.perfil_rico` está
            desligado (0.2.60); `conta_suspensa` quando a conta está suspensa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/definir_servicos:
    post:
      tags: [Cadastro e perfil]
      operationId: definirServicos
      summary: Definir os serviços oferecidos, com preço
      description: |
        0.2.53. **Substitui** o conjunto de serviços do perfil (`servicos: []` limpa). Cada serviço é
        uma função que o profissional já marcou em `funcoes`; função não marcada é
        `422 funcao_nao_marcada` com o `funcao_id` em `details` (RN27). Função repetida na lista é
        `422 campo_invalido` com `details: servicos`.

        O preço é referência pública, em centavos, entre 1.000 e 1.000.000 (R$ 10 a R$ 10.000) por
        unidade, e é o que o profissional recebe: o Frila não desconta nada (RN01). Campos por unidade:

        | `unidade` | Obrigatório além de `valor_centavos` | Opcional |
        |---|---|---|
        | `hora` | — | `valor_max_centavos`, `minimo_horas` |
        | `diaria` | `horas_incluidas` (4 a 12) | `valor_max_centavos` |
        | `evento` | — | `duracao_tipica_h`, `ate_pessoas` |
        | `pacote` | `descricao_pacote` | `valor_max_centavos` |
        | `por_pessoa` | `minimo_pessoas` | — |
        | `a_combinar` | nada; `valor_centavos` deve vir nulo ou ausente | — |

        Campo que não pertence à unidade é `422 campo_invalido` com o nome do campo em `details`.
        `valor_max_centavos` menor que `valor_centavos` é `422 campo_invalido`
        (`valor_max_centavos`). Até 10 serviços e até 8 especialidades por serviço, da lista da
        própria função (0.2.52). Texto livre (`inclui`, `descricao_pacote`) passa pelos filtros da
        RN38.

        Função marcada sem serviço continua valendo para o despacho de vagas, como hoje (RN05).
      x-requisitos: [RN27, RN01, RN38, RN44]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [servicos]
              properties:
                servicos:
                  type: array
                  maxItems: 10
                  items:
                    $ref: '#/components/schemas/ServicoOferecido'
      responses:
        '200':
          description: Serviços gravados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilProfissionalDetalhado'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: |
            `sem_permissao` com `details: recurso_desligado` quando `recursos.perfil_rico` está
            desligado (0.2.60); `conta_suspensa` quando a conta está suspensa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/definir_regioes_atendidas:
    post:
      tags: [Cadastro e perfil]
      operationId: definirRegioesAtendidas
      summary: Definir as regiões administrativas onde atende
      description: |
        0.2.53. Substitui as regiões marcadas (ids de `GET /regiao_administrativa`). Com
        `atende_todo_df: true`, a lista é ignorada e gravada vazia. Id fora do catálogo ou inativo é
        `422 campo_invalido` com `details: regioes`. Não muda o despacho de vagas, que continua pelo
        ponto base e 15 km (RN05).
      x-requisitos: [RN26, RN44]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [regioes, atende_todo_df]
              properties:
                regioes:
                  type: array
                  uniqueItems: true
                  items:
                    type: integer
                    minimum: 1
                atende_todo_df:
                  type: boolean
      responses:
        '200':
          description: Regiões gravadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilProfissionalDetalhado'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: |
            `sem_permissao` com `details: recurso_desligado` quando `recursos.perfil_rico` está
            desligado (0.2.60); `conta_suspensa` quando a conta está suspensa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/meu_perfil_detalhado:
    get:
      tags: [Cadastro e perfil]
      operationId: meuPerfilDetalhado
      summary: Ler o próprio perfil completo
      description: |
        0.2.53. O perfil de `meu_perfil_profissional` mais apresentação, serviços e regiões. Conta de
        contratante é `422 perfil_incompativel`; profissional sem perfil, `404`.
      x-requisitos: [RN26, RN27]
      responses:
        '200':
          description: Perfil do chamador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilProfissionalDetalhado'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: |
            `sem_permissao` com `details: recurso_desligado` quando `recursos.perfil_rico` está
            desligado (0.2.60).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/solicitar_upload_midia:
    post:
      tags: [Cadastro e perfil]
      operationId: solicitarUploadMidia
      summary: Pedir a URL para enviar uma foto
      description: |
        0.2.54. Cria a mídia em `enviando` e devolve a `upload_url` para enviar o arquivo ao bucket
        privado `midia-perfil`, válida por 2 h. O app envia JPEG já sem EXIF, lado maior até 1600 px,
        até 5 MB. A miniatura de 320 px é **gerada pelo servidor** a partir do original verificado; o
        app não a envia (0.2.57). O caminho do objeto não contém o id do usuário e é escolhido pelo
        servidor, nunca pelo app.

        **Envio (0.2.63).** A `upload_url` aponta para a Edge Function `enviar-midia`
        (`…/functions/v1/enviar-midia?midia_id=…&token=…`), não para o Storage. O token é opaco, de
        **uso único**, e o servidor guarda só o seu hash. O app faz `PUT` na `upload_url` com o JPEG no
        corpo e `Content-Type: image/jpeg`, **sem** o token da sessão, como antes; 2xx quer dizer
        gravado. Qualquer outra resposta é falha e não grava nada: token inválido, vencido ou já usado,
        mídia fora de `enviando`, corpo acima de 5 MB ou fora de JPEG. Para tentar de novo, o app pede
        outra URL. Depois do 2xx, `confirmar_upload_midia` segue igual.

        Nesta versão só `tipo = foto_perfil`, uma por dono (profissional, ou estabelecimento com
        `estabelecimento_id` para a foto ou logo da casa, por membro da casa). Outro `tipo` é
        `422 midia_invalida` (`tipo_indisponivel`). Formato fora de JPEG é `formato`; acima de 5 MB,
        `tamanho`. Trocar a foto é enviar outra: a anterior aprovada continua até a nova ser aprovada.
      x-requisitos: [RN37, RN46]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, mime, bytes]
              properties:
                tipo:
                  $ref: '#/components/schemas/TipoMidia'
                mime:
                  type: string
                  example: image/jpeg
                bytes:
                  type: integer
                  minimum: 1
                estabelecimento_id:
                  description: Para a foto ou o logo da casa. Exige ser membro do estabelecimento.
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Mídia criada e URL de upload.
          content:
            application/json:
              schema:
                type: object
                required: [midia_id, upload_url, expira_em]
                properties:
                  midia_id:
                    $ref: '#/components/schemas/Uuid'
                  upload_url:
                    description: URL de envio de uso único, válida por 2 h, da Edge Function `enviar-midia` (0.2.63). `PUT` com o JPEG, sem o token da sessão.
                    type: string
                    format: uri
                  upload_url_miniatura:
                    deprecated: true
                    description: 0.2.57. Descontinuado antes de ser usado; o servidor gera a miniatura. Pode vir ausente.
                    type: string
                    format: uri
                  expira_em:
                    $ref: '#/components/schemas/Instante'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: |
            `sem_permissao` com `details: recurso_desligado` quando `recursos.foto_de_perfil` está
            desligado; `conta_suspensa` quando a conta está suspensa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/confirmar_upload_midia:
    post:
      tags: [Cadastro e perfil]
      operationId: confirmarUploadMidia
      summary: Confirmar o envio e pedir a análise
      description: |
        0.2.54. Confere que o arquivo chegou ao bucket (`422 evidencia_incompleta`, como na RN14), o
        tipo pelo cabeçalho do arquivo e a ausência de EXIF (`422 midia_invalida`, `formato` ou
        `metadados`). Passou, a mídia vai a `em_analise` e a análise automática é **enfileirada**; a
        resposta não espera a análise e nada é publicado antes da decisão. As verificações do servidor
        (tipo real pelos bytes, tamanho, dimensões, recodificação sem EXIF) valem para o original, e a
        miniatura é gerada pelo servidor a partir dele; nunca vem do cliente.
        Idempotente: confirmar de novo devolve o estado atual.
      x-requisitos: [RN37, RN46]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [midia_id]
              properties:
                midia_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Mídia em análise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Midia'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: |
            `sem_permissao` com `details: recurso_desligado` quando `recursos.foto_de_perfil` está
            desligado; `conta_suspensa` quando a conta está suspensa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/remover_midia:
    post:
      tags: [Cadastro e perfil]
      operationId: removerMidia
      summary: Remover uma foto
      description: |
        0.2.54. A mídia vai a `removida` na hora: nenhuma URL nova é emitida e a já emitida vence em
        até 1 h. O arquivo sai do Storage na rodada seguinte do expurgo em duas fases da RN14.
        Idempotente. **Funciona mesmo com `recursos.foto_de_perfil` desligado**: remover o próprio
        dado nunca depende do interruptor (o mesmo vale para `minhas_midias`).
      x-requisitos: [RN37, RN46]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [midia_id]
              properties:
                midia_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Mídia removida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Midia'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: |
            `sem_permissao` com `details: conta_suspensa` quando a conta está suspensa. Esta operação
            não depende de `recursos.foto_de_perfil`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /rpc/minhas_midias:
    get:
      tags: [Cadastro e perfil]
      operationId: minhasMidias
      summary: Listar as próprias fotos
      description: |
        0.2.54. Todas as mídias do chamador, em qualquer estado, com o motivo genérico de recusa.
        Nunca traz o código fino da análise, o caminho no Storage nem o registro interno da decisão.
      x-requisitos: [RN37, RN46]
      responses:
        '200':
          description: Mídias do chamador.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Midia'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: |
            `sem_permissao` com `details: conta_suspensa` quando a conta está suspensa. Esta operação
            não depende de `recursos.foto_de_perfil`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /rpc/pedir_nova_analise_midia:
    post:
      tags: [Cadastro e perfil]
      operationId: pedirNovaAnaliseMidia
      summary: Pedir nova análise de uma foto recusada
      description: |
        0.2.54. Uma vez por foto, para mídia `recusada` ou `nao_publicada`: volta a `em_analise` e a
        análise automática é refeita uma vez. Repetir o pedido da mesma foto não gera outra
        análise e devolve o estado atual. Mídia em outro estado é `409 midia_indisponivel`
        (`estado_invalido`). Só enquanto o arquivo ainda existe: depois do expurgo da recusada (até
        24 h, RN14) é `409 midia_indisponivel` (`expurgada`), e o app orienta enviar outra foto. O
        pedido **não** estende a retenção do arquivo. Depois disso, o caminho é o e-mail do suporte,
        sem prazo prometido; o app não promete revisão por pessoa.
      x-requisitos: [RN37, RN46]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [midia_id]
              properties:
                midia_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Estado atual da mídia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Midia'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: |
            `sem_permissao` com `details: recurso_desligado` quando `recursos.foto_de_perfil` está
            desligado; `conta_suspensa` quando a conta está suspensa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'

  /rpc/criterios_de_notificacao:
    get:
      tags: [Cadastro e perfil]
      operationId: criteriosDeNotificacao
      summary: Dados da tela "Por que recebo vagas"
      description: |
        Os critérios que decidem se o profissional recebe a notificação de uma vaga: função, grade
        semanal de disponibilidade e distância de até 15 km do ponto base, mais as equipes de confiança de que ele
        faz parte. O texto da tela é do app; a função devolve os dados (RF27, LGPD art. 20).
      x-requisitos: [RF27, RN05, RN06, RN23]
      responses:
        '200':
          description: Critérios em vigor para o chamador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CriteriosDeNotificacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/pedir_revisao_despacho:
    post:
      tags: [Cadastro e perfil]
      operationId: pedirRevisaoDespacho
      summary: Contestar o despacho ("Contestar" na tela "Por que recebo vagas")
      description: |
        Registra o pedido de revisão; a Equipe Frila responde por e-mail em até 5 dias úteis (RF27).

        Apenas 1 contestação por despacho pelo app (opção B, 0.2.37). Reenvio com contestação em
        análise ou respondida recebe `409 contestacao_ja_aberta`. Recurso posterior só por e-mail.

        Relato vazio é `422 campo_obrigatorio`; com menos de 10 caracteres, `422 campo_invalido`, os
        dois com `details: relato`. O relato não passa pelo filtro de termos da diretriz 1.2
        (decisão J1=B, 13/10/2026), como em `contestarSuspensao`.
      x-requisitos: [RF27]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [relato]
              properties:
                relato:
                  type: string
                  minLength: 10
      responses:
        '200':
          description: Pedido registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Protocolo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  # ───────────────────────────────────────────── Estabelecimento

  /rpc/cadastrar_estabelecimento:
    post:
      tags: [Estabelecimento]
      operationId: cadastrarEstabelecimento
      summary: Cadastrar o estabelecimento
      description: |
        Cria o estabelecimento com o chamador como administrador. Aceita CNPJ ou CPF, porque serviço
        doméstico também contrata pelo Frila. `tipo` serve para leitura e filtro, nunca para barrar
        ninguém. `regiao_administrativa` é a Região Administrativa do DF onde o estabelecimento fica.
        Conta de profissional é recusada com `422 perfil_incompativel` (RN25).
      x-requisitos: [RF02, RF21, RN25, UC10]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoEstabelecimento'
      responses:
        '200':
          description: Estabelecimento criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estabelecimento'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/meus_estabelecimentos:
    get:
      tags: [Estabelecimento]
      operationId: meusEstabelecimentos
      summary: Estabelecimentos de que a conta é membro
      description: |
        A conta de contratante pode operar mais de um estabelecimento — a mesma pessoa cuida do bar
        e do buffet —, e toda tela do contratante precisa saber por qual delas está falando antes de
        chamar qualquer outra coisa. Sem esta operação, o app só descobre o `estabelecimento_id`
        cadastrando um novo, que é o caminho errado para quem já tem.

        Devolve o papel junto: o `operador` publica e acompanha as vagas da casa, mas não inclui nem
        remove profissionais da equipe de confiança, que é do `administrador` (RF18, RF21). A tela
        precisa esconder o que o servidor vai recusar com `403 sem_permissao`.

        Lista vazia é resposta legítima: conta de contratante recém-criada, antes do primeiro
        cadastro. Conta de **profissional** recebe `422 perfil_incompativel`, e não lista vazia — a
        tela leria vazio como "você não tem casas", que é outra frase.

        A lista vem **ordenada por nome**, para o seletor do app não trocar de posição entre duas
        aberturas da mesma tela. `reputacao` vem no mesmo formato do `PerfilPublico` de
        estabelecimento, da mesma função. Nenhum dado de cadastro sai aqui (RN10): sem documento,
        sem endereço, sem coordenada e sem contato — quem precisa do endereço e do ponto para
        publicar uma vaga chama `/rpc/meu_estabelecimento` (0.2.29).
      x-requisitos: [RF02, RF21, UC07]
      responses:
        '200':
          description: Estabelecimentos da conta, com o papel em cada um.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EstabelecimentoDaConta'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/meu_estabelecimento:
    get:
      tags: [Estabelecimento]
      operationId: meuEstabelecimento
      summary: O cadastro de um estabelecimento de que a conta é membro
      description: |
        O endereço, a Região Administrativa e o ponto do estabelecimento, para o app preencher a
        publicação de uma vaga (`NovaVaga.local`, `regiao_administrativa` e `ponto` vêm preenchidos
        com os do estabelecimento). Sem esta operação, só quem acabou de cadastrar tem esses dados,
        na resposta de `/rpc/cadastrar_estabelecimento`: quem volta ao app noutro dia não consegue
        publicar a segunda vaga.

        Só para **membro** do estabelecimento, administrador ou operador: os dois publicam vagas
        (RF21). `papel` é o de quem chama. Quem não é membro recebe `403 sem_permissao`, que é o
        que responde também quando o estabelecimento não existe, como em `/rpc/painel_estabelecimento`.
        Conta de profissional nunca é membro e recebe o mesmo `403`, e não o `422
        perfil_incompativel` de `/rpc/meus_estabelecimentos`.

        A resposta é o `MeuEstabelecimento`: o cadastro **sem o `documento`** (CNPJ ou CPF), para
        o administrador e para o operador (decisão de produto de 02/10/2026). A publicação não usa
        o documento, e ele não sai onde não é preciso (RN15). Também sem contato e sem os outros
        membros.
      x-requisitos: [RF02, RF04, RF21, RN02, RN15, UC01]
      parameters:
        - $ref: '#/components/parameters/EstabelecimentoId'
      responses:
        '200':
          description: O estabelecimento, sem o documento, com o papel de quem chama.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeuEstabelecimento'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'

  /rpc/equipe_de_confianca:
    get:
      tags: [Estabelecimento]
      operationId: equipeDeConfianca
      summary: Listar a equipe de confiança
      x-requisitos: [RF18, UC11]
      parameters:
        - $ref: '#/components/parameters/EstabelecimentoId'
      responses:
        '200':
          description: Profissionais da equipe.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PerfilPublico'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'

  /rpc/incluir_na_equipe:
    post:
      tags: [Estabelecimento]
      operationId: incluirNaEquipe
      summary: Incluir profissional na equipe de confiança
      description: |
        O profissional da equipe recebe a notificação das vagas do estabelecimento mesmo além de 15 km,
        desde que tenha a função e esteja disponível (RF18). Não há exclusividade de tempo nem ordem.
        Idempotente.

        Apenas o administrador do estabelecimento pode incluir profissionais na equipe (RF21). Exige que
        o profissional tenha cumprido ao menos um turno com presença verificada no estabelecimento (UC11);
        caso contrário, recusa com `403 sem_permissao` (`details: sem_turno_cumprido`).
      x-requisitos: [RF18, RN05, UC11]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembroDaEquipe'
      responses:
        '200':
          description: Profissional na equipe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembroDaEquipe'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/remover_da_equipe:
    post:
      tags: [Estabelecimento]
      operationId: removerDaEquipe
      summary: Remover profissional da equipe de confiança
      description: Sem penalidade nem aviso ao profissional (RN16). Idempotente.
      x-requisitos: [RF18, RN16, UC11]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembroDaEquipe'
      responses:
        '200':
          description: Profissional fora da equipe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembroDaEquipe'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/sair_da_equipe:
    post:
      tags: [Estabelecimento]
      operationId: sair_da_equipe
      summary: Profissional sai voluntariamente da equipe de confiança de um estabelecimento
      description: |
        O profissional sai por vontade própria da equipe de confiança do estabelecimento (LGPD art. 18,
        direito de autoexclusão). Sem penalidade nem aviso ao estabelecimento.

        Recusas: `401 nao_autenticado` se sem sessão; `403 sem_permissao` se o chamador não for
        profissional; `422 campo_obrigatorio` (`details: estabelecimento_id`) quando ausente;
        `422 campo_invalido` (`details: estabelecimento_id`) quando o profissional não faz parte da equipe
        daquele estabelecimento.
      x-requisitos: [RF18, RN16, UC11]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estabelecimento_id]
              properties:
                estabelecimento_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Profissional saiu da equipe de confiança.
          content:
            application/json:
              schema: {}
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/convidar_membro:
    post:
      tags: [Estabelecimento]
      operationId: convidarMembro
      summary: Convidar novo membro para o estabelecimento com papel
      description: |
        0.2.73. Gera convite para novo membro do estabelecimento com token de uso único (RF21, US24).
        Apenas o administrador do estabelecimento pode convidar. O convite tem validade de 7 dias
        e expira automaticamente.

        Recusas: `401 nao_autenticado` se sem sessão; `403 sem_permissao` se o chamador não for
        administrador do estabelecimento; `404 nao_encontrado` se o estabelecimento não existir;
        `422 campo_obrigatorio` (`details: papel`) quando ausente; `422 campo_invalido` (`details: email`)
        quando o formato do e-mail for inválido.
      x-requisitos: [RF21, US24]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estabelecimento_id, email, papel]
              properties:
                estabelecimento_id:
                  $ref: '#/components/schemas/Uuid'
                email:
                  type: string
                  format: email
                papel:
                  $ref: '#/components/schemas/PapelMembro'
      responses:
        '200':
          description: Convite gerado com sucesso.
          content:
            application/json:
              schema:
                type: object
                required: [token, convite_id, expira_em]
                properties:
                  convite_id:
                    $ref: '#/components/schemas/Uuid'
                  estabelecimento_id:
                    $ref: '#/components/schemas/Uuid'
                  email:
                    type: string
                    format: email
                  papel:
                    $ref: '#/components/schemas/PapelMembro'
                  token:
                    type: string
                    description: Token opaco de 64 caracteres hexadecimais para aceitar o convite.
                  expira_em:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/aceitar_convite_membro:
    post:
      tags: [Estabelecimento]
      operationId: aceitarConviteMembro
      summary: Aceitar convite para ingressar como membro do estabelecimento
      description: |
        0.2.73. Consome token de uso único e adiciona o chamador à equipe do estabelecimento
        com o papel designado (RF21, US24). Exige conta com perfil contratante ativa.

        Recusas: `401 nao_autenticado` se sem sessão; `422 perfil_incompativel` se a conta for de profissional;
        `422 convite_invalido` se o token não existir, já tiver sido usado ou estiver expirado.
      x-requisitos: [RF21, US24]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Token recebido no convite.
      responses:
        '200':
          description: Convite aceito e membro adicionado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: membro_adicionado
                  membro_id:
                    $ref: '#/components/schemas/Uuid'
                  estabelecimento_id:
                    $ref: '#/components/schemas/Uuid'
                  usuario_id:
                    $ref: '#/components/schemas/Uuid'
                  papel:
                    $ref: '#/components/schemas/PapelMembro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/remover_membro:
    post:
      tags: [Estabelecimento]
      operationId: removerMembro
      summary: Remover membro do estabelecimento
      description: |
        0.2.73. Remove membro da equipe do estabelecimento com proteção para o último administrador (RF21, US24).
        Apenas o administrador do estabelecimento pode remover membros.

        Recusas: `401 nao_autenticado` se sem sessão; `403 sem_permissao` se o chamador não for
        administrador do estabelecimento; `404 nao_encontrado` se o membro não pertencer ao estabelecimento;
        `422 ultimo_administrador` se tentar remover o único administrador restante.
      x-requisitos: [RF21, US24]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estabelecimento_id, membro_id]
              properties:
                estabelecimento_id:
                  $ref: '#/components/schemas/Uuid'
                membro_id:
                  $ref: '#/components/schemas/Uuid'
                  description: Identificador do registro de membro ou do usuário.
      responses:
        '200':
          description: Membro removido com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: membro_removido
                  removido:
                    type: boolean
                  estabelecimento_id:
                    $ref: '#/components/schemas/Uuid'
                  membro_id:
                    $ref: '#/components/schemas/Uuid'
                  usuario_id:
                    $ref: '#/components/schemas/Uuid'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/transferir_administracao:
    post:
      tags: [Estabelecimento]
      operationId: transferirAdministracao
      summary: Promover membro do estabelecimento a administrador
      description: |
        0.2.73. Promove outro membro existente do estabelecimento para o papel de administrador (RF21, US24).
        Apenas o administrador atual do estabelecimento pode promover membros.

        Recusas: `401 nao_autenticado` se sem sessão; `403 sem_permissao` se o chamador não for
        administrador do estabelecimento; `404 nao_encontrado` se o membro indicado não pertencer ao estabelecimento.
      x-requisitos: [RF21, US24]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estabelecimento_id, novo_admin_id]
              properties:
                estabelecimento_id:
                  $ref: '#/components/schemas/Uuid'
                novo_admin_id:
                  $ref: '#/components/schemas/Uuid'
                  description: Identificador do membro ou usuário a ser promovido.
      responses:
        '200':
          description: Administração transferida / membro promovido com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: administracao_transferida
                  estabelecimento_id:
                    $ref: '#/components/schemas/Uuid'
                  novo_admin_id:
                    $ref: '#/components/schemas/Uuid'
                  novo_admin_usuario_id:
                    $ref: '#/components/schemas/Uuid'
                  papel:
                    $ref: '#/components/schemas/PapelMembro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  # ───────────────────────────────────────────── Catálogo

  /funcao:
    get:
      tags: [Catálogo]
      operationId: listarFuncoes
      summary: Catálogo de funções
      description: |
        Leitura direta da tabela (PostgREST), aberta a qualquer usuário autenticado. Catálogo fechado:
        função nunca é texto livre, para a elegibilidade de RN05 não virar busca por aproximação.
      x-requisitos: [RF03, RF04, RN05]
      parameters:
        - name: select
          in: query
          schema:
            type: string
            default: id,nome,categoria
        - name: ativo
          in: query
          description: 'Filtro do PostgREST. Use `eq.true`.'
          schema:
            type: string
            example: eq.true
      responses:
        '200':
          description: Funções.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Funcao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /regiao_administrativa:
    get:
      tags: [Catálogo]
      operationId: listarRegioesAdministrativas
      summary: Catálogo das regiões administrativas do DF
      description: |
        Leitura direta da tabela (PostgREST), aberta a qualquer usuário autenticado. Catálogo fechado,
        mantido por migração, como o de funções: o perfil do profissional marca as regiões onde atende
        por `id`, nunca por texto (0.2.52, RN44). Hoje são 37 regiões, da RA I (Plano Piloto) à
        RA XXXVII (Ponte Alta, Lei Distrital 7.917/2026), com a lei de cada uma em
        `pesquisa/2026-11-07-regioes-administrativas-df.md`; região nova entra por migração.

        Os campos `regiao_administrativa` de `NovoEstabelecimento`, `NovaVaga` e das leituras de vaga
        continuam texto (0.2.20) e não mudam nesta versão.
      x-requisitos: [RN44]
      parameters:
        - name: select
          in: query
          schema:
            type: string
            default: id,numero,nome
        - name: ativo
          in: query
          description: 'Filtro do PostgREST. Use `eq.true`.'
          schema:
            type: string
            example: eq.true
        - name: order
          in: query
          description: 'Ordem do PostgREST. Use `id.asc` para a ordem oficial (RA I, RA II...).'
          schema:
            type: string
            example: id.asc
      responses:
        '200':
          description: Regiões administrativas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegiaoAdministrativa'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /especialidade:
    get:
      tags: [Catálogo]
      operationId: listarEspecialidades
      summary: Especialidades de cada função
      description: |
        Leitura direta da tabela (PostgREST), aberta a qualquer usuário autenticado. Lista fechada por
        função, curada pela Equipe Frila e mantida por migração (0.2.52, RN44). O perfil marca até 8
        especialidades por serviço; isso chega com o contrato do perfil.
      x-requisitos: [RN44]
      parameters:
        - name: select
          in: query
          schema:
            type: string
            default: id,funcao_id,nome
        - name: funcao_id
          in: query
          description: 'Filtro do PostgREST. Ex.: `eq.<uuid da função>`.'
          schema:
            type: string
        - name: ativo
          in: query
          description: 'Filtro do PostgREST. Use `eq.true`.'
          schema:
            type: string
            example: eq.true
      responses:
        '200':
          description: Especialidades.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Especialidade'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /rpc/resolver_servico:
    get:
      tags: [Catálogo]
      operationId: resolverServico
      summary: Funções que correspondem ao que a pessoa digitou
      description: |
        Devolve até 5 funções ativas para o termo digitado, por sinônimo (tabela `funcao_sinonimo`,
        mantida por migração) e por nome, sem acento e sem diferença de maiúscula (0.2.52, RN44).
        "diarista" e "faxineira" devolvem faxina residencial; "garçom" devolve também "garçonete",
        que compartilham `grupo_busca`. Serve à escolha de função no cadastro, na publicação e,
        depois, na busca. Não altera a elegibilidade: o despacho continua por `funcao_id` (RN05).

        Termo com menos de 2 caracteres, depois de tirar espaços, é `422 campo_invalido` com
        `details: termo`. Termo sem correspondência devolve lista vazia.
      x-requisitos: [RN44, RN05]
      parameters:
        - name: termo
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 60
            example: diarista
      responses:
        '200':
          description: Até 5 funções, da correspondência mais exata para a menos exata.
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items:
                  $ref: '#/components/schemas/Funcao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  # ───────────────────────────────────────────── Vagas

  /rpc/publicar_vaga:
    post:
      tags: [Vagas]
      operationId: publicarVaga
      summary: Publicar uma vaga
      description: |
        Grava a vaga, cria uma posição por unidade pedida e responde na hora. A notificação sai depois,
        pelo agendador, em até 30 segundos (RNF03); publicar não espera o despacho (B15).

        Recusas: campo obrigatório ausente (`campo_obrigatorio`, com o nome do campo em `details`,
        RN02); valor, número de posições, função ou coordenada que o campo trouxe e a regra não
        aceita (`campo_invalido`, com o campo em `details`); fim antes do início ou turno no passado
        (`horario_invalido`); texto com termo bloqueado em `local`, `regiao_administrativa`,
        `responsavel_local`, `traje` ou `observacoes` (`campo_invalido`, diretriz 1.2). Conta de profissional
        recebe `perfil_incompativel` (RN25); quem não é membro do estabelecimento recebe `403
        sem_permissao`, e é o que responde também quando o estabelecimento não existe; conta
        suspensa recebe `403 sem_permissao` com `details: conta_suspensa` (RN13).

        **Modo seleção (RN24), desde a 0.2.24:** `modo = selecao` é aceito quando o início está a
        mais de 24 horas; com 24 horas ou menos, `422 selecao_sem_antecedencia`. A vaga nova é
        notificada igual nos dois modos; no seleção, os candidatos ficam pendentes até a escolha
        (`escolher_candidato`). Até a 0.2.23 o modo seleção era recusado com `campo_invalido` e
        `details: modo`.

        `chave` torna o reenvio seguro: a mesma chave devolve a mesma vaga, com as mesmas posições,
        e não enfileira o despacho de novo.
      x-requisitos: [RF04, RF09, RN02, RN03, RN04, RN18, RN24, UC01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovaVaga'
      responses:
        '200':
          description: Vaga publicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VagaPublicada'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/republicar_posicoes_restantes:
    post:
      tags: [Vagas]
      operationId: republicarPosicoesRestantes
      summary: Republicar em urgência as posições que o modo seleção deixou vazias
      description: |
        O toque do aviso `selecao_encerrada` (D1-C). Quando a vaga de seleção fecha, 24 horas antes do
        início (RN24), as posições sem escolha são canceladas. Esta operação publica uma **vaga nova de
        urgência** com só essas posições, para o **mesmo turno** (mesmo início e fim) e o **mesmo valor**
        (RN01). O servidor decide modo, horário, valor e quantidade: não há campo para mudá-los. Quem
        quer outro horário usa `republicar_vaga`.

        As posições restantes são as da vaga de origem menos as já escolhidas (confirmadas ou
        cumpridas). O despacho da vaga nova é o de qualquer vaga (RN23). Quem foi escolhido na origem
        não se candidata à nova, porque o turno se cruza (RN21).

        Quem pode: membro do estabelecimento da vaga de origem, com perfil de contratante e conta
        ativa. Profissional recebe `422 perfil_incompativel` antes de qualquer leitura; vaga de outra
        casa, `403 sem_permissao`; origem inexistente, `404 nao_encontrado`; conta suspensa,
        `403 sem_permissao` com `details: conta_suspensa`; vaga de origem ocultada pela moderação,
        `422 vaga_oculta`, como em `republicar_vaga`.

        **Idempotente pela `chave`:** reenviar com a mesma chave devolve a mesma vaga nova. Enquanto
        houver uma republicação **ativa** da mesma origem (vaga nova `publicada` ou `preenchida`),
        outra é recusada com `republicacao_indisponivel` e `details: ja_republicada`. O limite geral de escrita por minuto
        vale, como em toda operação, e não é declarado aqui.

        Recusas por regra: `422 republicacao_indisponivel`, com o motivo em `details`:
        `nao_e_selecao` (a origem é de urgência), `selecao_em_curso` (ainda `publicada`),
        `vaga_cancelada`, `ja_comecou` (o início já passou), `sem_posicoes_restantes` e
        `ja_republicada`.
      x-requisitos: [RF05, RF09, RN24, UC01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vaga_id, chave]
              properties:
                vaga_id:
                  $ref: '#/components/schemas/Uuid'
                chave:
                  $ref: '#/components/schemas/ChaveDeIdempotencia'
      responses:
        '200':
          description: Vaga de urgência publicada com as posições restantes, ou a mesma de um reenvio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VagaPublicada'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/republicar_vaga:
    post:
      tags: [Vagas]
      operationId: republicarVaga
      summary: Republicar uma vaga anterior com nova data e horário
      description: |
        Copia todos os campos da vaga de origem e muda só início e fim (RF05). Mesmas recusas de
        `publicar_vaga` — literalmente as mesmas: a implementação delega a ela, em vez de manter uma
        segunda lista de validações que começaria igual e divergiria depois.

        Vaga de origem que não existe é `404 nao_encontrado`; vaga de outra casa é `403 sem_permissao`.
        A diferença é o oposto do critério de `detalhe_vaga`, e de propósito: quem republica veio da
        própria lista de vagas, então a existência já não é segredo para ele. Conta sem perfil de
        contratante recebe `422 perfil_incompativel` antes de qualquer leitura, para o código de erro
        não contar a um profissional se aquela vaga existe.

        `publicado_por` da vaga nova é **quem republicou** (RF04), e não quem publicou a de origem.
        `evento_id` não é copiado: `publicar_vaga` não o recebe.

        Vaga de origem ocultada pela moderação da Equipe Frila responde `422 vaga_oculta`: a cópia
        levaria o conteúdo moderado de volta à vitrine como vaga nova (0.2.23).
      x-requisitos: [RF05, UC01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vaga_id, inicio_em, fim_em, chave]
              properties:
                vaga_id:
                  $ref: '#/components/schemas/Uuid'
                inicio_em:
                  $ref: '#/components/schemas/Instante'
                fim_em:
                  $ref: '#/components/schemas/Instante'
                chave:
                  $ref: '#/components/schemas/ChaveDeIdempotencia'
      responses:
        '200':
          description: Nova vaga publicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VagaPublicada'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/cancelar_vaga:
    post:
      tags: [Vagas]
      operationId: cancelarVaga
      summary: Cancelar a vaga inteira
      description: |
        Cancela as posições abertas e as confirmadas, com motivo registrado (RN12). Profissionais já
        confirmados são avisados (`cancelamento`, com `reaberta = false`). Cancelamento pelo
        contratante não gera falta para ninguém.

        Reenvio idempotente (0.2.35): repetir a chamada após queda de rede pelo mesmo contratante
        autor do cancelamento original devolve `200` com o objeto da vaga já cancelada, sem reprocessar
        cancelamentos nem disparar notificações repetidas. Continua sendo `409 vaga_encerrada` se a
        vaga já começou, ou se foi cancelada por outro autor (outro membro da casa ou moderação).

        Motivo com menos de 3 caracteres é `422 campo_obrigatorio`, e motivo que o filtro da
        diretriz 1.2 recusa é `422 campo_invalido`, os dois com `details: motivo`. Vaga que não
        existe, ou de outra casa, é `404 nao_encontrado`. É do contratante: conta de profissional
        recebe `422 perfil_incompativel` (RN25).
      x-requisitos: [RF14, RN12]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vaga_id, motivo]
              properties:
                vaga_id:
                  $ref: '#/components/schemas/Uuid'
                motivo:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: Vaga cancelada.
          content:
            application/json:
              schema:
                type: object
                required: [vaga_id, estado, posicoes_canceladas]
                properties:
                  vaga_id:
                    $ref: '#/components/schemas/Uuid'
                  estado:
                    $ref: '#/components/schemas/EstadoVaga'
                  posicoes_canceladas:
                    type: integer
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/vagas_abertas:
    get:
      tags: [Vagas]
      operationId: vagasAbertas
      summary: Lista de vagas abertas do DF, das mais próximas para as mais distantes
      description: |
        **Vaga direta (0.2.55):** `origem = chamada_direta` nunca aparece nesta lista, para ninguém
        (RN28).

        Todas as vagas abertas, ordenadas pela distância até o ponto informado (ou até o ponto base do
        profissional, se nenhum for enviado). A distância aqui **ordena**, não filtra: o limite de
        15 km vale só para a notificação (B07). Vagas de estabelecimentos com bloqueio entre as partes
        não aparecem (RF26), nem a vaga ocultada pela moderação da Equipe Frila (diretriz 1.2, 0.2.23).
        A ordem não pode ser comprada (RN06).

        Vaga cujo início já passou não aparece (regra da 0.2.19, vale para toda vaga), com uma
        exceção: a que tem posição reaberta por atraso (`reabrir_por_atraso`) `aberta` continua na
        lista até `fim_em - 1 h` (decisão 8zLfn0mt, item 5) — o mesmo prazo em que `candidatar` a
        aceita. Depois do início, `posicoes_abertas` conta só essas posições reabertas.

        É a tela de quem procura turno: conta de contratante recebe `422 perfil_incompativel`.
        `limite` fora de 1..100 e `deslocamento` negativo são `422 campo_invalido` com o nome do
        parâmetro em `details`. Sem coordenada e sem ponto base no perfil, `422 campo_obrigatorio`
        com `details: latitude` — sem ponto de referência não há ordem.

        Conta de demonstração e conta real não se enxergam (diretrizes 2.1 e 4.2).
      x-requisitos: [RF07, RN05, RN06, RF26, UC03]
      parameters:
        - name: latitude
          in: query
          description: Posição de referência. Sem ela, vale o ponto base.
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: funcao_id
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: data
          in: query
          description: Dia do início, no fuso America/Sao_Paulo.
          schema:
            type: string
            format: date
        - name: distancia_max_km
          in: query
          description: Filtro opcional escolhido pelo profissional na busca.
          schema:
            type: number
            minimum: 0
        - name: limite
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: deslocamento
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Página da lista.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VagaNaLista'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/detalhe_vaga:
    get:
      tags: [Vagas]
      operationId: detalheVaga
      summary: Detalhe de uma vaga
      description: |
        **Vaga direta (0.2.55):** para `origem = chamada_direta`, responde `404 nao_encontrado`,
        indistinguível de vaga inexistente, a quem não é membro do estabelecimento nem o
        profissional com turno confirmado nela. Antes do aceite, o profissional chamado lê o
        trabalho só por `detalhe_chamada`, sem endereço (RN28, RN36).

        Tudo o que o profissional vê antes de se candidatar (UC03, passo 2). Sem documento do
        estabelecimento e sem contato de ninguém: o telefone sai por `contato_do_turno`, depois da
        confirmação e dentro do prazo (RN10).

        Conta de contratante recebe `422 perfil_incompativel`. Vaga que o profissional não deveria
        alcançar — bloqueio entre as partes (RF26), conta de demonstração ou vaga ocultada pela
        moderação da Equipe Frila (diretriz 1.2) sem que ele ocupe posição ou tenha candidatura
        nela — responde `404 nao_encontrado`, e não `403`: o 403 confirmaria que ela existe. Quem
        ocupa posição ou tem candidatura na vaga ocultada recebe `200` com `oculta: true`, o mesmo
        que já vê em `minhas_candidaturas` ou `meus_turnos`.

        **Depois do início**, o detalhe continua respondendo `200`, com o `estado` real (o início
        não muda o estado da vaga: a `publicada` segue `publicada` até o fim). `posicoes_abertas` conta só as posições reabertas por atraso
        (`reabrir_por_atraso`) ainda antes de `fim_em - 1 h` (decisão 8zLfn0mt, item 5); fora
        desse prazo, ou sem reabertura, é `0`. Não há `404` por horário: o toque numa notificação
        antiga abre a vaga. A tela mostra o botão de candidatura só com `estado = publicada` e
        `posicoes_abertas > 0`, nunca pelo relógio do aparelho.
      x-requisitos: [RF04, RF16, RN02, UC03]
      parameters:
        - name: vaga_id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Vaga.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vaga'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  # ───────────────────────────────────────────── Candidatura e confirmação

  /rpc/candidatar:
    post:
      tags: [Candidatura e confirmação]
      operationId: candidatar
      summary: Candidatar-se a uma vaga
      description: |
        **Vaga direta (0.2.55):** candidatar numa vaga com `origem = chamada_direta` é `404
        nao_encontrado`, inclusive para o profissional chamado: o aceite é só por
        `responder_chamada` (RN28).

        O profissional se candidata à vaga; o servidor escolhe a posição.

        - **Modo urgência:** o primeiro elegível que aceita é confirmado na hora, por escrita
          condicional no banco (RN19). A resposta já traz o turno e o contato da outra parte (RN10).
          O profissional e cada membro do estabelecimento recebem o aviso `confirmacao` (RF10).
        - **Modo seleção:** a candidatura fica pendente até o contratante escolher, com `posicao_id`,
          `turno_id` e `contato` nulos — a posição só é decidida na escolha. Ela vale até a vaga
          fechar, e a vaga fecha sozinha 24 horas antes do início se ninguém for escolhido (RN24); a
          partir daí a candidatura recebe `409 vaga_encerrada`. Reenviar devolve a mesma candidatura
          pendente, e a retirada volta a `pendente` quando o profissional se candidata de novo.

        **Conta suspensa não recebe `403`:** a candidatura é recusada por elegibilidade, com
        `422 inelegivel` e `details: perfil_suspenso` (RN13).

        As três respostas são normais: `200` (entrou), `409 posicao_ja_preenchida` (alguém chegou
        antes — a tela diz "que pena, foi rápido", não "algo deu errado") e `422 inelegivel`
        (`turno_sobreposto`, `perfil_suspenso` ou `funcao_incompativel`). Reenviar para a mesma vaga
        devolve o mesmo resultado.

        **Vaga `preenchida` também responde `posicao_ja_preenchida`**, e não `vaga_encerrada`: ela
        fechou porque encheu. `vaga_encerrada` fica para a vaga cancelada, encerrada ou cujo início
        já passou. Vaga escondida por bloqueio, por demonstração ou pela moderação da Equipe Frila
        (diretriz 1.2) responde `404 nao_encontrado`, igual a `detalhe_vaga`.

        **Exceção: posição reaberta por atraso** (`reabrir_por_atraso`) aceita candidatura após o
        início, até `fim_em - 1 h` (decisão 8zLfn0mt, item 5). A exceção é da posição: depois do
        início, o servidor só escolhe posição criada por `reabrir_por_atraso`, nunca uma posição
        original que ficou `aberta` sem ninguém. Vaga começada sem posição reaberta `aberta`
        dentro do prazo responde `409 vaga_encerrada`; perder a corrida pela posição reaberta é
        `409 posicao_ja_preenchida`. O valor continua o anunciado para o turno inteiro (RN01).
      x-requisitos: [RF08, RF09, RF10, RF11, RN03, RN10, RN19, RN21, RN24, UC03, UC04]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vaga_id]
              properties:
                vaga_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Candidatura registrada; no modo urgência, já confirmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoCandidatura'
              examples:
                urgencia:
                  summary: Modo urgência — ganhou a corrida
                  value:
                    estado: confirmada
                    candidatura_id: 6f1c2a4e-2b7d-4c5e-9a1f-3d2e1c0b9a88
                    posicao_id: 0b8a7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                    turno_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f0b8a7c6d
                    contato:
                      nome: Bar do Zé
                      telefone: '+5561999990000'
                      whatsapp_url: https://wa.me/5561999990000
                      visivel_ate: '2026-09-27T06:00:00Z'
                selecao:
                  summary: Modo seleção — aguardando a escolha
                  value:
                    estado: pendente
                    candidatura_id: 6f1c2a4e-2b7d-4c5e-9a1f-3d2e1c0b9a88
                    posicao_id: null
                    turno_id: null
                    contato: null
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/retirar_candidatura:
    post:
      tags: [Candidatura e confirmação]
      operationId: retirarCandidatura
      summary: Retirar a candidatura antes de ser escolhido
      description: |
        Sem penalidade (RN24). Candidatura já escolhida não se retira; vira cancelamento
        (`cancelar_posicao`). Retirar de novo devolve a mesma candidatura retirada; recusada ou
        expirada responde `409 candidatura_indisponivel`.

        É do profissional: conta de contratante recebe `422 perfil_incompativel` (RN25).
        `candidatura_id` nulo responde `422 campo_obrigatorio`, com `details: candidatura_id`
        (declarados na 0.2.32).
      x-requisitos: [RN16, RN24, RN25, UC04]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidatura_id]
              properties:
                candidatura_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Candidatura retirada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidatura'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/minhas_candidaturas:
    get:
      tags: [Candidatura e confirmação]
      operationId: minhasCandidaturas
      summary: Candidaturas do profissional
      description: |
        A candidatura pendente numa vaga ocultada pela moderação da Equipe Frila continua listada e
        pendente (0.2.23); o detalhe da vaga abre para quem a tem, com `oculta: true`.

        Desde a 0.2.32, a candidatura `aceita` traz `turno_id`, o turno que nasceu dela: é por
        ele, e não pela vaga, que a tela chega ao turno em `/rpc/meus_turnos`.

        É do profissional: conta de contratante recebe `422 perfil_incompativel` (RN25, declarado
        na 0.2.32).
      x-requisitos: [RF08, RN25, UC04]
      parameters:
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoCandidatura'
      responses:
        '200':
          description: Candidaturas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Candidatura'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/candidatos_da_vaga:
    get:
      tags: [Candidatura e confirmação]
      operationId: candidatosDaVaga
      summary: Candidatos de uma vaga no modo seleção
      description: |
        Com reputação, denominador e taxa de comparecimento de cada um (RN08, UC04). **Em ordem de
        chegada, sem outra ordenação** (RN06); `da_equipe` (0.2.38) marca quem está na equipe de
        confiança da casa e serve só para o selo "da sua equipe", nunca para ordenar. Continua legível
        pela casa quando a vaga foi ocultada pela moderação da Equipe Frila; escolher é que é
        recusado (`escolher_candidato`, `422 vaga_oculta`).

        É do contratante: conta de profissional recebe `422 perfil_incompativel` (RN25). `vaga_id`
        nulo responde `422 campo_obrigatorio`, com `details: vaga_id` (declarados na 0.2.32).
        Candidatos com bloqueio mútuo com o estabelecimento não aparecem na listagem (RF26, RN10, frila-backend#184).
      x-requisitos: [RF09, RF16, RF26, RN08, RN10, RN25, UC04]
      parameters:
        - name: vaga_id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Candidatos pendentes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Candidato'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/escolher_candidato:
    post:
      tags: [Candidatura e confirmação]
      operationId: escolherCandidato
      summary: Escolher um candidato no modo seleção
      description: |
        Confirma o candidato numa posição aberta da vaga, com a mesma escrita condicional do modo
        urgência (RN19). Respostas: `200` com o turno e o contato do profissional; `409
        posicao_ja_preenchida` se todas as posições já foram ocupadas; `409 candidatura_indisponivel`
        se o candidato retirou ou a candidatura expirou; `422 inelegivel` com `turno_sobreposto` se ele
        foi confirmado em outro turno que se cruza com este (RN21); `422 vaga_oculta` se a vaga foi
        ocultada pela moderação da Equipe Frila — a candidatura segue pendente, e a escolha volta a
        valer se a Equipe reexibir a vaga (0.2.23).

        Só membro do estabelecimento escolhe (`403 sem_permissao`). Tentativa de escolher candidatura
        inexistente, de outra casa ou de candidato com bloqueio mútuo com o estabelecimento responde
        indistintamente com `403 sem_permissao` sem `details` (frila-backend#184, RF26, RN10), sem
        revelar a existência da candidatura ou do bloqueio. Essa checagem tem precedência sobre os
        conflitos `409`: uma candidatura já escolhida cujo profissional bloqueou a casa posteriormente
        responde `403 sem_permissao`, e não `409 candidatura_indisponivel`. Candidatura já escolhida
        responde `409 candidatura_indisponivel`; vaga fechada pelas 24 horas (RN24), cancelada ou encerrada,
        `409 vaga_encerrada`. O escolhido recebe o aviso `confirmacao`; quando a escolha ocupa a
        última posição, as candidaturas ainda pendentes passam a `recusada`, com o aviso
        `candidatura_recusada`.
      x-requisitos: [RF09, RF10, RF11, RF26, RN10, RN19, RN21, UC04]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidatura_id]
              properties:
                candidatura_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Profissional confirmado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoConfirmacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/chamar_profissional:
    post:
      tags: [Vagas]
      operationId: chamarProfissional
      summary: Chamar direto um profissional para um trabalho
      description: |
        0.2.55. Cria uma **vaga direta** de uma posição (`origem = chamada_direta`, `modo = urgencia`),
        nunca despachada nem listada em `vagas_abertas`, e uma chamada para o profissional. Ou se manda
        `vaga_id` (chamar mais alguém para o mesmo trabalho, até 3 abertas) ou os campos da RN02, com os
        mesmos nomes de `NovaVaga`; nunca os dois. Idempotente pela `chave`: reenviar devolve a mesma
        chamada e não gasta cota.

        **Quem pode ser chamado (v1.1):** quem tem turno cumprido com presença verificada com a casa,
        ou está na equipe de confiança dela, e não desligou "receber chamadas de quem já trabalhou
        comigo" nem está pausado. Tem de ter a função e não estar suspenso. Bloqueio entre as partes é
        `404 nao_encontrado` e tem precedência sobre qualquer outra recusa (RF26).

        **Prazo:** o início tem de estar a pelo menos o maior entre 2 h e a antecedência mínima do
        profissional (`422 profissional_indisponivel`, `antecedencia_insuficiente`). O servidor calcula
        `expira_em` = menor entre envio + 12 h e início − 1 h; entre 22 h e 7 h (America/Sao_Paulo), o
        envio conta a partir das 7 h, salvo início antes das 10 h (RN31).

        **Valor:** `valor_centavos` é o total fechado do trabalho, que o profissional recebe (RN01,
        RN29). Os termos não mudam com chamada aberta.

        **Limites (RN33, RN34):** 1 chamada aberta por par estabelecimento e profissional
        (`409 chamada_ja_aberta`); 24 h depois de recusa (`422 profissional_indisponivel`,
        `par_em_pausa`) e 30 dias quando as três últimas chamadas respondidas ou expiradas do par foram
        recusadas ou expiraram (`par_bloqueado_temporariamente`; cancelada não conta); 5 chamadas abertas
        no profissional (`agenda_cheia`); por estabelecimento, somando os membros, 3 por trabalho, 10
        abertas e 20 por dia civil, ou 3 abertas e 5 em 7 dias sem turno cumprido
        (`422 limite_de_chamadas`). Cancelar não devolve cota de envio.

        **Recorrência (J7, RN45):** se o estabelecimento é pessoa física (CPF) e esta seria a 3ª
        chamada ao mesmo profissional em 7 dias corridos, sem `confirmo_recorrencia: true` a resposta é
        `409 recorrencia_nao_confirmada`; o app mostra o aviso e reenvia com a confirmação. Nunca vale
        para CNPJ e nunca bloqueia.

        O `recado` passa pelo filtro de termos e de contato (RN38). A preferência "aceito só de
        estabelecimentos com CNPJ" e as demais saem como `nao_aceita_chamadas`, sem dizer qual. Profissional sem vínculo de trabalho com a casa recebe a mesma recusa genérica (`422 profissional_indisponivel`, `nao_aceita_chamadas`), sem revelar que o vínculo falta.

        **Versão do app (0.2.66).** O profissional sem nenhum aparelho registrado com `versao_app` na
        versão mínima de `chamada_direta` da plataforma (0.2.65) recebe a mesma recusa genérica
        (`422 profissional_indisponivel`, `nao_aceita_chamadas`). Assim nunca se cria uma chamada para
        quem não a receberia. Isso inclui quem não deu permissão de notificação: sem ela, o app não
        registra o aparelho.

        **Pausas que o servidor já aplicava (listadas na 0.2.67).** `pausado`: o profissional pausou as
        chamadas nas preferências. Só aparece para quem passa pelas três recusas genéricas
        (preferência só-CNPJ, versão e vínculo), para a casa sem vínculo não descobrir a pausa.
        `par_em_pausa`: o profissional recusou uma chamada desta casa há menos de 24 h.
        `par_bloqueado_temporariamente`: nos últimos 30 dias, as três últimas chamadas desta casa a
        este profissional que foram respondidas ou expiraram (cancelada não conta) foram recusadas ou
        expiraram, sem nenhuma aceita no período.
      x-requisitos: [RN28, RN29, RN30, RN31, RN33, RN34, RN38, RN45, RN46, RN02, RN19, RF26]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chave, profissional_id, estabelecimento_id]
              properties:
                chave:
                  $ref: '#/components/schemas/ChaveDeIdempotencia'
                profissional_id:
                  description: O `id` do `PerfilPublico` do profissional.
                  $ref: '#/components/schemas/Uuid'
                estabelecimento_id:
                  $ref: '#/components/schemas/Uuid'
                vaga_id:
                  description: |
                    Para chamar mais alguém para um trabalho já criado. Exclui os campos abaixo. Tem
                    de ser vaga do mesmo `estabelecimento_id`, com `origem = chamada_direta`, uma
                    posição e ainda aberta; vaga de outra casa é `404`, e vaga normal, preenchida ou
                    encerrada é `409 vaga_encerrada`.
                  $ref: '#/components/schemas/Uuid'
                funcao_id:
                  $ref: '#/components/schemas/Uuid'
                inicio_em:
                  $ref: '#/components/schemas/Instante'
                fim_em:
                  $ref: '#/components/schemas/Instante'
                local:
                  type: string
                regiao_administrativa:
                  type: string
                ponto:
                  $ref: '#/components/schemas/Coordenada'
                valor_centavos:
                  $ref: '#/components/schemas/Centavos'
                inclui_refeicao:
                  type: boolean
                inclui_transporte:
                  type: boolean
                exige_material_proprio:
                  type: boolean
                responsavel_local:
                  type: string
                recado:
                  type: string
                  maxLength: 300
                confirmo_recorrencia:
                  type: boolean
              oneOf:
                - required: [vaga_id]
                - required: [funcao_id, inicio_em, fim_em, local, regiao_administrativa, ponto,
                             valor_centavos, inclui_refeicao, inclui_transporte,
                             exige_material_proprio, responsavel_local]
      responses:
        '200':
          description: Chamada criada (ou a mesma, no reenvio pela `chave`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chamada'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: |
            `sem_permissao`: `recurso_desligado` quando `recursos.chamada_direta` está desligado;
            `conta_suspensa`; ou quem chama não é membro do estabelecimento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/responder_chamada:
    post:
      tags: [Vagas]
      operationId: responderChamada
      summary: Aceitar ou recusar uma chamada
      description: |
        0.2.55. Só o profissional chamado. Aceitar é candidatar e confirmar numa transação, com a trava
        da vaga (RN19). Conferências, nesta ordem: (1) bloqueio → `404` e a chamada vira `encerrada`;
        (2) suspensão → `403 sem_permissao` (`conta_suspensa`) e a chamada vira `cancelada`; (3) prazo
        pelo relógio do servidor, `agora < expira_em` → senão `409 chamada_indisponivel` (`expirada`);
        (4) função ainda marcada → senão `422 inelegivel` (`funcao_incompativel`); (5) turno
        sobreposto (RN21) → `422 inelegivel` (`turno_sobreposto`), e a chamada segue aberta até o
        prazo. Aceites simultâneos do mesmo trabalho: o primeiro confirma e encerra as outras chamadas;
        o segundo recebe `409 chamada_indisponivel` (`encerrada`). `409 posicao_ja_preenchida` fica só
        como defesa.

        Aceito, nasce o turno e o profissional passa a ver `local`, `ponto` e `responsavel_local`.
        **Nenhum telefone é devolvido.** Recusar aceita `motivo_recusa` opcional, que o contratante vê
        como categoria; `motivo_recusa` junto de `aceitar` é ignorado. Recusar não penaliza (RN16,
        RN33). Repetir a mesma resposta devolve o mesmo resultado; resposta diferente é
        `409 chamada_indisponivel`.
      x-requisitos: [RN32, RN33, RN36, RN42, RN46, RN16, RN19, RN21, RF26]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chamada_id, resposta]
              properties:
                chamada_id:
                  $ref: '#/components/schemas/Uuid'
                resposta:
                  type: string
                  enum: [aceitar, recusar]
                motivo_recusa:
                  $ref: '#/components/schemas/MotivoRecusaChamada'
      responses:
        '200':
          description: Resposta registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoChamada'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: |
            `sem_permissao`: `recurso_desligado` quando `recursos.chamada_direta` está desligado;
            `conta_suspensa`; ou quem chama não é membro do estabelecimento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/cancelar_chamada:
    post:
      tags: [Vagas]
      operationId: cancelarChamada
      summary: Cancelar uma chamada ainda aberta
      description: |
        0.2.55. Qualquer membro do estabelecimento cancela uma chamada `aberta`, sem efeito para
        ninguém; o profissional recebe `chamada_cancelada`. Idempotente para o mesmo autor. Chamada em
        outro estado é `409 chamada_indisponivel`. Depois do aceite, o caminho é `cancelar_posicao`
        (RN12), com a reposição sem despacho da vaga direta.
      x-requisitos: [RN35, RN46, RN12]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chamada_id]
              properties:
                chamada_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Chamada cancelada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chamada'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: |
            `sem_permissao`: `recurso_desligado` quando `recursos.chamada_direta` está desligado;
            `conta_suspensa`; ou quem chama não é membro do estabelecimento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'

  /rpc/minhas_chamadas:
    get:
      tags: [Vagas]
      operationId: minhasChamadas
      summary: Listar as próprias chamadas
      description: |
        0.2.56. Para o profissional, as chamadas recebidas; para o contratante, as de todos os
        estabelecimentos de que ele é membro (RN25). Da mais nova para a mais antiga, por cursor
        opaco (nunca `offset`), até 20 por página. Cursor de outra lista ou adulterado é
        `422 cursor_invalido`. Bloqueio entre as partes tira a chamada da lista (RF26).
      x-requisitos: [RN46, RN25, RF26]
      parameters:
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoChamada'
        - name: cursor
          in: query
          schema:
            type: string
        - name: limite
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
      responses:
        '200':
          description: Uma página de chamadas.
          content:
            application/json:
              schema:
                type: object
                required: [itens, proximo_cursor]
                properties:
                  itens:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChamadaResumo'
                  proximo_cursor:
                    oneOf:
                      - type: string
                      - type: 'null'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: |
            `sem_permissao`: `recurso_desligado` quando `recursos.chamada_direta` está desligado;
            `conta_suspensa`; ou o chamador não é parte da chamada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/detalhe_chamada:
    get:
      tags: [Vagas]
      operationId: detalheChamada
      summary: Ler uma chamada
      description: |
        0.2.56. Só as partes: o profissional chamado e os membros do estabelecimento; para qualquer
        outra conta, e entre partes bloqueadas, `404`. Antes do aceite, o profissional vê região,
        faixa de distância a partir do ponto base, valor, inclusos, recado e o perfil da casa; **não**
        vê `local`, `ponto` nem `responsavel_local`, que só vêm com `estado = aceita` (RN36). Nenhum
        telefone, em estado nenhum. A vaga direta antes do aceite só é lida por aqui (as leituras de
        vaga respondem `404` para o chamado, RN28).
      x-requisitos: [RN28, RN36, RN46, RF26]
      parameters:
        - name: chamada_id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: A chamada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChamadaDetalhe'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: |
            `sem_permissao`: `recurso_desligado` quando `recursos.chamada_direta` está desligado;
            `conta_suspensa`; ou o chamador não é parte da chamada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /rpc/publicar_a_partir_da_chamada:
    post:
      tags: [Vagas]
      operationId: publicarAPartirDaChamada
      summary: Publicar para todos a partir de uma vaga direta
      description: |
        0.2.56. Membro do estabelecimento converte a vaga direta numa vaga normal **nova** (outro
        `id`, `vaga_origem_id` apontando para a direta), despachada a partir desse momento como
        qualquer vaga, com os mesmos termos. A direta e as chamadas abertas dela vão a `encerrada`,
        com aviso aos chamados. Nunca há duas posições contratáveis para o mesmo trabalho.

        Vale antes do início e, para posição reaberta por atraso, até `fim_em − 1 h`, a mesma janela de
        `reabrir_por_atraso`. Fora disso, ou com a direta já preenchida sem posição reaberta, ou
        cancelada, é `409 vaga_encerrada`. `modo` opcional, padrão `urgencia`; `selecao` segue a RN24
        (`422 selecao_sem_antecedencia`). Idempotente pela `chave` e pela vaga direta: repetir devolve a
        mesma vaga nova.
      x-requisitos: [RN35, RN46, RN04, RN12, RN24]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vaga_id, chave]
              properties:
                vaga_id:
                  description: A vaga direta.
                  $ref: '#/components/schemas/Uuid'
                chave:
                  $ref: '#/components/schemas/ChaveDeIdempotencia'
                modo:
                  $ref: '#/components/schemas/ModoPreenchimento'
      responses:
        '200':
          description: A vaga nova.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VagaPublicada'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: |
            `sem_permissao`: `recurso_desligado` quando `recursos.chamada_direta` está desligado;
            `conta_suspensa`; ou o chamador não é parte da chamada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/definir_preferencia_chamadas:
    post:
      tags: [Cadastro e perfil]
      operationId: definirPreferenciaChamadas
      summary: Preferências do profissional para receber chamadas
      description: |
        0.2.56. Campos enviados substituem os atuais; os omitidos ficam como estão. Padrões:
        `aceita_de_quem_ja_trabalhou = true`, `antecedencia_minima_h = 6`, `aceita_de = todos`, sem
        pausa. `pausado_ate` é a data (America/Sao_Paulo) até a qual ninguém chama, por nenhum
        caminho; `null` tira a pausa. Chamadas já recebidas continuam respondíveis. Sem nenhum campo,
        `422 campo_obrigatorio` (`nenhum_campo`); data no passado, `422 campo_invalido`
        (`pausado_ate`). Conta de contratante, `422 perfil_incompativel` (RN25).
      x-requisitos: [RN30, RN43, RN46, RN25]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                aceita_de_quem_ja_trabalhou:
                  type: boolean
                pausado_ate:
                  oneOf:
                    - type: string
                      format: date
                    - type: 'null'
                antecedencia_minima_h:
                  type: integer
                  enum: [2, 6, 24, 48]
                aceita_de:
                  type: string
                  enum: [todos, so_cnpj]
      responses:
        '200':
          description: Preferências em vigor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenciaChamadas'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: |
            `sem_permissao`: `recurso_desligado` quando `recursos.chamada_direta` está desligado;
            `conta_suspensa`; ou o chamador não é parte da chamada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  # ───────────────────────────────────────────── Turno

  /rpc/meus_turnos:
    get:
      tags: [Turno]
      operationId: meusTurnos
      summary: Turnos do chamador, como profissional ou como estabelecimento
      description: |
        Base do histórico (UC13) e da leitura offline por 24 horas (RNF06).

        Hoje e os próximos primeiro, do mais próximo para o mais distante; os anteriores depois, do
        mais recente para o mais antigo. Com `estabelecimento_id`, quem pergunta precisa ser membro
        da casa — senão `403 sem_permissao`. Conta de contratante **sem** `estabelecimento_id`
        recebe lista vazia, e não erro.

        Nenhum telefone sai por aqui: o contato sai por `contato_do_turno`, que confere o prazo de
        RN10. `contato_visivel_ate` vem em cada turno para que a tela saiba se pode oferecer o botão
        antes de tocá-lo.

        **O turno cancelado continua na lista** (RN12): o cancelamento não apaga o registro do que
        foi combinado. Desde a 0.2.31 ele vem com `estado: cancelada`, e é por esse campo que a tela
        o separa do turno de pé. Cada turno traz também `avaliacao`, a que este lado já deu.

        Desde a 0.2.32, o turno cancelado traz `cancelamento`: a causa, se contou como falta e o
        instante. O texto que alguém escreveu ao cancelar não sai por aqui, para nenhum dos dois
        lados.

        Desde a 0.2.47 (v1.1, Cartão 72), `vaga` (`VagaResumo`) traz o campo opcional `ponto`
        (coordenadas latitude/longitude do estabelecimento). Para o profissional, as coordenadas
        só são expostas enquanto o turno estiver confirmado (`estado: confirmada`) ou se foi
        cumprido com presença verificada (`verificacao: verificado`), sob os arts. 7º, V e VI da LGPD.
        Nos turnos cancelados ou cumpridos sem verificação, `ponto` retorna nulo.
      x-requisitos: [RF13, RF14, RF15, RF22, RN12, RNF06, UC13]
      parameters:
        - name: de
          in: query
          schema:
            $ref: '#/components/schemas/Instante'
        - name: ate
          in: query
          schema:
            $ref: '#/components/schemas/Instante'
        - name: estabelecimento_id
          in: query
          description: Para membros de estabelecimento. Sem ele, valem os turnos do chamador como profissional.
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Turnos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Turno'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'

  /rpc/contato_do_turno:
    get:
      tags: [Turno]
      operationId: contatoDoTurno
      summary: Contato da outra parte do turno
      deprecated: true
      description: |
        **Descontinuada na 0.2.49.** Decisão de produto de 04/11/2026: a troca de contatos entre
        contratante e contratado não deve ser praticada nem explicitada no app. Isso sobrescreve a
        US13 e a RN10 (contato liberado até 7 dias depois do turno) e deixa sem objeto o evento de
        telemetria `contato_aberto` (abertura do WhatsApp). A RN15, de dado pessoal fora de log e de
        push, continua valendo (correção de citação na 0.2.57). A coordenação do turno passa a ser só pelos sinais que já
        existem: instruções de chegada, "Estou a caminho", alerta de atraso, check-in, check-out,
        cancelamento e suporte.

        O app deixa de chamar esta operação. Enquanto o servidor não for alterado (Fase 2, issue
        #396 do backend), ela segue respondendo como descrito abaixo, para os apps já publicados.
        Quando a Fase 2 chegar, o servidor deixa de devolver o contato ou desativa a função, e o
        comportamento exato dessa resposta será declarado numa versão própria do contrato, junto
        com a implementação. Não gere cliente novo contra esta operação.

        Comportamento vigente até lá: só existe depois da confirmação e só até 7 dias depois do
        fim do turno (RN10). A base legal é a execução do contrato (LGPD, art. 7º, V). Depois do
        prazo, `403 contato_expirado`, para os dois lados; o sétimo dia conta inteiro.

        Token de conta encerrada/anonimizada não lê contatos (RF25, RNF08): a verificação de conta
        ativa roda antes de qualquer leitura e recusa com `401 nao_autenticado`.

        Todo o resto é `404 nao_encontrado`: antes da confirmação, para quem não é nenhum dos dois
        lados, e quando há bloqueio entre as partes. Um `403` confirmaria que aquele turno existe a
        quem não deveria saber.
      x-requisitos: [RF11, RF25, RN10, RNF08]
      parameters:
        - name: turno_id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Contato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contato'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/ParametroObrigatorio'

  /rpc/avisar_a_caminho:
    post:
      tags: [Turno]
      operationId: avisarACaminho
      summary: Profissional avisa que está a caminho do turno
      description: |
        Ação "Estou a caminho" disparada pela notificação de 3 horas antes do início ou pelo botão
        correspondente na tela Meu turno (US14, RF12). Não altera presença, taxa de comparecimento
        nem substitui o check-in: é um sinal operacional visível pelo contratante no acompanhamento
        do turno (`painel_estabelecimento`).

        Só o profissional confirmado no turno pode chamar (`403 sem_permissao`). A janela permitida
        vai de 3 horas antes do início previsto até 15 minutos depois do início; fora dessa janela,
        a chamada é recusada com `422 a_caminho_fora_da_janela`.

        Idempotente: chamar uma segunda vez não altera o instante já gravado e devolve o mesmo
        registro com o `a_caminho_em` original.
      x-requisitos: [RF12, US14]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [turno_id]
              properties:
                turno_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Aviso registrado com sucesso ou retorno do registro já gravado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoACaminho'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/fazer_checkin:
    post:
      tags: [Turno]
      operationId: fazerCheckin
      summary: Registrar o check-in
      description: |
        O app lê a localização **só no toque**, nunca em segundo plano, calcula no aparelho a distância
        até o endereço da vaga e envia só a distância, nunca a coordenada (RN22, minimização da LGPD).

        - Distância de até 200 m: check-in `geolocalizado`, presença `verificado` na hora.
        - Sem localização (sem sinal, permissão negada, GPS impreciso) ou a mais de 200 m: envie
          `distancia_m` nulo ou a distância medida; o check-in vira `manual` e a presença fica
          `pendente` até o contratante confirmar (`confirmar_checkin_manual`).

        Os membros do estabelecimento recebem o aviso `checkin` (presença verificada) ou
        `checkin_manual_pendente` (pedido de confirmação). O reenvio não avisa de novo (RF13).

        `registrado_em` é a hora do toque, e não a da sincronização: o check-in feito sem rede entra na
        fila do app e sai depois com a hora certa. O banco recusa hora no futuro. Reenviar devolve o
        registro já gravado.

        Turno que não existe, ou que não é de quem chama, é `404 nao_encontrado`. Check-in em
        posição já cancelada (por exemplo, o que esperava na fila do app quando a posição foi
        cancelada) é `409 vaga_encerrada` com `details: posicao_cancelada`; a trava é um gatilho do
        banco.

        Toque com `registrado_em` adiantado em mais de 2 minutos em relação ao relógio do servidor é
        recusado com `422 registro_no_futuro`. Toque fora da janela permitida (de 60 minutos antes do
        início até o fim previsto do turno) é recusado com `422 fora_da_janela` (RN22). A conta de
        demonstração/revisão da App Store (`usuario.demonstracao`) atravessa a janela de turno sem recusa
        de `fora_da_janela` para permitir inspeção assíncrona da diretriz 2.1, mas mantém a trava de
        `registro_no_futuro`.

        **Check-in por código (0.2.68).** O app 1.2 manda também `sinais`, o que o aparelho diz
        sobre a leitura de localização. Com a chave `checkin_por_codigo` ligada para o
        estabelecimento do turno e um sinal suspeito (localização simulada, precisão ruim, salto de
        posição, ou distância entre 150 e 200 m), o servidor não verifica pelo GPS: o check-in fica
        `manual`, a presença fica `pendente` e a resposta traz `codigo_exigido: true`. A casa recebe o
        mesmo aviso `checkin_manual_pendente` e atesta a chegada pelo código
        (`gerar_codigo_checkin` e `validar_codigo_checkin`) ou pela confirmação manual. O limiar de
        precisão fica no servidor, e a resposta não diz qual sinal pesou. Sem `sinais`, ou com a
        chave desligada, nada muda: a distância de até 200 m verifica na hora, como acima.
      x-requisitos: [RF13, RN11, RN22, RN46, UC05]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroDeCheckin'
      responses:
        '200':
          description: Check-in registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoRegistro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/confirmar_checkin_manual:
    post:
      tags: [Turno]
      operationId: confirmarCheckinManual
      summary: Contratante confirma o check-in manual
      description: |
        Um toque, no app ou no Painel web. Só então o check-in manual conta como presença (RN22).

        Tentativa de confirmar turno em que o profissional ainda não realizou o check-in é recusada com
        `409 checkin_pendente`. Turno com check-in geolocalizado (que já nasce verificado) recusa `409 checkin_ja_confirmado`.
        Turno com a presença já verificada pelo código (`tipo: codigo`, 0.2.68) também recusa
        `409 checkin_ja_confirmado`, e a hora da validação não muda (0.2.69).
        Turno que não existe é `404 nao_encontrado`.
      x-requisitos: [RF13, RF20, RN22, UC05, UC07]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [turno_id]
              properties:
                turno_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Presença verificada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoRegistro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/ParametroObrigatorio'

  /rpc/gerar_codigo_checkin:
    post:
      tags: [Turno]
      operationId: gerarCodigoCheckin
      summary: Casa gera ou revê o código de check-in do turno
      description: |
        0.2.68. A tela da casa chama esta operação ao abrir pelo aviso `checkin_manual_pendente` e
        mostra o código já visível, em QR e nos 6 dígitos, sem navegação extra. O código é gerado e
        guardado só no servidor, preso ao turno e ao vínculo, e vale o tempo configurado (hoje 5
        minutos; faixa de 2 a 5). Chamar de novo dentro da validade devolve o mesmo código; vencido,
        um novo. Código novo não devolve tentativas ao profissional, e com ele em bloqueio
        temporário a casa ainda gera.

        O QR carrega exatamente os 6 dígitos, e nada mais: é a mesma credencial, validada no mesmo
        ponto (`validar_codigo_checkin`), e quem usa leitor de tela digita. `segundos_restantes` é a
        validade contada pelo servidor no momento da resposta; a tela conta a partir dele, e não do
        relógio do aparelho.

        Só membro do estabelecimento dono do turno gera: o profissional do turno recebe
        `403 sem_permissao`, como em `confirmar_checkin_manual`. Chave `checkin_por_codigo`
        desligada para o estabelecimento: `403 sem_permissao` (`recurso_desligado`), sem tocar em
        dado. Conta excluída (token de conta já anonimizada, RF25): `401 nao_autenticado`. Conta
        suspensa: `403 sem_permissao` (`conta_suspensa`). Turno que não existe, ou com bloqueio
        entre as partes: `404 nao_encontrado`. Sem check-in: `409 checkin_pendente`.
        Presença já verificada: `409 checkin_ja_confirmado`. Caminho do código encerrado no turno
        (2 bloqueios): `409 codigo_bloqueado` (`encerrado`), e vale a confirmação manual. Fora da
        janela do check-in: `422 fora_da_janela`.
      x-requisitos: [RF13, RF20, RN22, RN46, UC05, UC07]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [turno_id]
              properties:
                turno_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: O código em vigor para o turno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodigoDeCheckin'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/validar_codigo_checkin:
    post:
      tags: [Turno]
      operationId: validarCodigoCheckin
      summary: Profissional valida o código de check-in da casa
      description: |
        0.2.68. O profissional lê o QR ou digita os 6 dígitos que a casa mostra, depois de um
        `fazer_checkin` que ficou `pendente`. O app lê a localização no toque, como no check-in, e
        manda só a distância até o endereço da vaga, nunca a coordenada. A hora que vale é a do
        servidor.

        - Código certo, em vigor, deste turno, com `distancia_m` de até 100 m: presença
          `verificado`, `tipo: codigo`, e `checkin_confirmado_em` é a hora da validação. O código não
          serve de novo. Os membros da casa recebem o aviso `checkin`.
        - Código certo sem posição (`distancia_m` nulo: permissão negada ou GPS desligado): valida
          do mesmo jeito, e o servidor marca o turno como de confiança baixa. A marca não sai nas
          respostas operacionais; sai só na exportação do próprio profissional
          (`MeusDados.checkins_por_codigo`, LGPD, art. 18).
        - Qualquer outro caso: `422 codigo_invalido`, um código só, sem dizer se o código estava
          errado, vencido, era de outro turno ou se a distância passou de 100 m. Cada recusa conta
          como tentativa errada. O código já usado não chega aqui: com a presença verificada, a
          resposta é `409 checkin_ja_confirmado`.

        A resposta é o registro do check-in: `registrado_em` é a hora do toque em `fazer_checkin`, e
        `distancia_m` vem nulo, porque a distância da leitura não é gravada.

        Tentativas: 3 erradas no turno bloqueiam a leitura pelo tempo configurado (hoje 5 minutos;
        faixa de 2 a 5), e a terceira já responde `409 codigo_bloqueado` (`temporario`). A sexta
        errada é o segundo bloqueio e fecha o caminho do código para o turno: ela e toda leitura
        depois dela respondem `409 codigo_bloqueado` (`encerrado`), sem novo tempo de espera, e vale
        a confirmação manual. O contador é do servidor, por turno, e não zera quando a casa gera
        código novo.

        Duas leituras ao mesmo tempo do mesmo código: uma só vence, e a outra recebe
        `409 checkin_ja_confirmado`, como toda leitura que chega com a presença já verificada por
        qualquer caminho; o app trata como presença verificada e relê o turno. Sem check-in:
        `409 checkin_pendente`. Fora da janela do check-in: `422 fora_da_janela`. Turno que não
        existe, que não é de quem chama ou com bloqueio entre as partes: `404 nao_encontrado`. Chave
        desligada para o estabelecimento do turno: `403 sem_permissao` (`recurso_desligado`), sem
        tocar em dado nem no contador. Conta excluída (token de conta já anonimizada, RF25):
        `401 nao_autenticado`. Conta suspensa: `403 sem_permissao` (`conta_suspensa`). Conta de
        contratante: `422 perfil_incompativel` (RN25). `codigo` fora do formato de 6 dígitos é
        `422 campo_invalido` (`codigo`) e não conta como tentativa.

        Se a resposta se perder (timeout), o app não repete sozinho: relê o turno e deixa a pessoa
        digitar de novo. A tentativa errada já foi gravada, e a repetição contaria outra (0.2.69).
      x-requisitos: [RF13, RN22, RN46, UC05]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [turno_id, codigo, distancia_m]
              properties:
                turno_id:
                  $ref: '#/components/schemas/Uuid'
                codigo:
                  description: Os 6 dígitos lidos do QR ou digitados.
                  type: string
                  pattern: '^[0-9]{6}$'
                  example: '482913'
                distancia_m:
                  description: |
                    Distância até o endereço da vaga, medida no aparelho no momento da leitura. Nulo
                    sem localização. Não é gravada: o servidor guarda só se veio até 100 m, acima
                    disso ou sem posição.
                  oneOf:
                    - type: integer
                      minimum: 0
                    - type: 'null'
      responses:
        '200':
          description: Presença verificada pelo código.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoRegistro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/fazer_checkout:
    post:
      tags: [Turno]
      operationId: fazerCheckout
      summary: Registrar o check-out
      description: |
        Mesma regra do check-in: localização lida só no toque e só a distância enviada. Sem
        localização, `distancia_m` vai nulo. O Frila não calcula hora extra: se o fim previsto passou,
        os dois já foram avisados pelo agendador, e o valor fica entre as partes (A09).

        Turno que não existe, ou que não é de quem chama, é `404 nao_encontrado`.

        Check-out de um turno que ainda não teve check-in registrado é recusado com `409 checkin_pendente`
        (indica o passo que falta para a tela direcionar a pessoa). Toque com `registrado_em` adiantado
        em mais de 2 minutos em relação ao relógio do servidor recusa `422 registro_no_futuro`, e fora da
        janela permitida do turno recusa `422 fora_da_janela` (RN22). A conta de demonstração/revisão
        da App Store é isenta da janela de turno, mantendo a trava de `registro_no_futuro`.
      x-requisitos: [RF13, RN11, RN22, UC05]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroDePresenca'
      responses:
        '200':
          description: Check-out registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoRegistro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/cancelar_posicao:
    post:
      tags: [Turno]
      operationId: cancelarPosicao
      summary: Cancelar uma posição confirmada
      description: |
        **Vaga direta (0.2.55):** na vaga com `origem = chamada_direta`, a posição cancelada antes
        do início reabre **sem despacho e sem notificação**; os membros da casa recebem o aviso com
        as duas saídas (chamar outra pessoa ou `publicar_a_partir_da_chamada`). Só a conversão
        explícita cria vaga pública (RN12 alterada, RN35).

        Qualquer das partes, com motivo (RN12). Antes do início, a posição cancelada é substituída por
        uma nova, aberta, e a notificação sai de novo em até 30 segundos. Depois do início, não há
        reabertura, e o contratante é avisado de que o turno ficou descoberto.

        Só a outra parte recebe o aviso `cancelamento`, com `reaberta` no payload: `false` quando
        o turno ficou descoberto, para a casa distinguir da posição que voltou para a fila.

        Cancelamento do profissional com menos de 24 horas do início conta como falta; com mais de 24
        horas, sai da taxa de comparecimento. Nenhum cancelamento suspende ninguém (RN13).

        Reenvio idempotente (0.2.35): repetir a chamada após queda de rede pelo mesmo autor do
        cancelamento (o próprio profissional, ou o mesmo membro da casa) devolve `200` com o
        objeto `ResultadoCancelamento`, sem duplicar penalidade na taxa de comparecimento, ocorrências,
        notificações ou abertura de posições substitutas. Continua sendo `409 posicao_nao_cancelavel`
        se a posição está aberta sem confirmação, se já foi cumprida, ou se foi cancelada pela outra
        parte. O que decide é o estado da posição, e não o relógio: depois de `inicio_em`, a posição
        `confirmada` ainda pode ser cancelada, sem posição nova e sem despacho novo (0.2.48).

        Motivo com menos de 3 caracteres é `422 campo_obrigatorio`, e motivo que o filtro da
        diretriz 1.2 recusa é `422 campo_invalido`, os dois com `details: motivo`: a tela pede para
        reescrever, e não para tentar de novo. Posição que não existe, ou de que quem chama não é
        parte (nem o profissional nem membro da casa), é `404 nao_encontrado`: a diferença diria a
        um estranho que a posição existe.
      x-requisitos: [RF14, RN12, RN13, RN16, UC08]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [posicao_id, motivo]
              properties:
                posicao_id:
                  $ref: '#/components/schemas/Uuid'
                motivo:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: Cancelamento registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoCancelamento'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/reabrir_por_atraso:
    post:
      tags: [Turno]
      operationId: reabrirPorAtraso
      summary: Reabrir a vaga quando o profissional não chegou
      description: |
        **Vaga direta (0.2.55):** na vaga com `origem = chamada_direta`, a reabertura por atraso
        reabre a posição **sem despacho e sem notificação**; a casa pode chamar outra pessoa ou
        converter com `publicar_a_partir_da_chamada` até `fim_em − 1 h` (RF13 alterada, RN35).

        Aos 15 minutos do início sem check-in, o contratante recebe o alerta e decide esperar ou
        reabrir (D06). Reabrir marca falta do profissional e abre uma nova posição, que é notificada de
        novo. Antes dos 15 minutos: `422 reabertura_antes_da_tolerancia`. Com check-in já feito: `409`.
      x-requisitos: [RF13, RF14, RN12, UC05, UC08]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [posicao_id]
              properties:
                posicao_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Vaga reaberta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoCancelamento'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  # ───────────────────────────────────────────── Avaliação e reputação

  /rpc/avaliar:
    post:
      tags: [Avaliação e reputação]
      operationId: avaliar
      summary: Avaliação binária depois do turno
      description: |
        Uma pergunta só: "Você chamaria essa pessoa de novo?" (contratante) ou "Você trabalharia nesse
        local de novo?" (profissional). Sim ou não; nunca nota de 1 a 5 (RN07).

        Só abre depois do fim previsto e só para turno com presença verificada — check-in
        geolocalizado ou manual confirmado. Quem faltou não é avaliado. Recusas: `422
        avaliacao_indisponivel` com `antes_do_fim` ou `sem_presenca_verificada`. Reenviar a mesma
        resposta devolve a avaliação gravada; resposta diferente dá `409 avaliacao_ja_registrada`.

        **Um voto por lado do turno, e não por pessoa.** Um estabelecimento tem vários membros, e
        dois deles votando no mesmo turno dariam à casa dois votos sobre o mesmo profissional. O
        operador que reenvia a resposta que o administrador já gravou recebe `200` com a avaliação
        **do lado dele**; com resposta diferente, `409`. É o mesmo que `Turno.pode_avaliar` já
        descrevia. Desde a 0.2.31 a avaliação gravada volta também em `Turno.avaliacao`, para a
        tela mostrar a resposta já dada sem depender do que o aparelho guardou.

        Turno que não existe recebe o mesmo `403 sem_permissao` de turno alheio: a diferença diria a
        um estranho que aquele turno existe. `turno_id` ausente é `422 campo_obrigatorio` com
        `details: turno_id`, e conta suspensa é `403 sem_permissao` com `details: conta_suspensa`
        (RN13).
      x-requisitos: [RF15, RN07, RN08, RN22, UC06]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [turno_id, resposta]
              properties:
                turno_id:
                  $ref: '#/components/schemas/Uuid'
                resposta:
                  type: boolean
      responses:
        '200':
          description: Avaliação registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Avaliacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/perfil_publico:
    get:
      tags: [Avaliação e reputação]
      operationId: perfilPublico
      summary: Perfil público de um profissional ou estabelecimento
      description: |
        Reputação sempre com denominador ("7 de 7 chamariam de novo") e taxa de comparecimento com o
        total de turnos considerados (RN08, RF16). Perfil sem histórico vem com `total = 0` e taxa nula
        — a tela mostra "Sem histórico", nunca nota zero. Nenhum dado de contato aparece aqui (RN10).

        Conta anonimizada (RF25) devolve `nome: "Conta encerrada"`. O turno e a avaliação sobrevivem à
        exclusão porque pertencem também à contraparte; o nome, não.

        Bloqueio (RF26, 0.2.28): entre partes bloqueadas, nos dois sentidos, o perfil responde
        `404 nao_encontrado`, igual a um id que não existe. Vale também quando a outra parte é
        membro do estabelecimento consultado. O cliente mostra "perfil indisponível" e não revela
        que houve bloqueio.
      x-requisitos: [RF16, RN08]
      parameters:
        - name: id
          in: query
          required: true
          description: Id do profissional ou do estabelecimento.
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Perfil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilPublico'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  # ───────────────────────────────────────────── Painel do gestor

  /rpc/painel_estabelecimento:
    get:
      tags: [Painel do gestor]
      operationId: painelEstabelecimento
      summary: Vagas, candidatos, contratados, check-ins e turnos do estabelecimento
      description: |
        A mesma leitura atende o Painel da versão web e a tela de acompanhamento do app. Traz os
        alertas que o agendador já disparou por notificação: vaga ainda vazia dentro da janela crítica
        (padrão de 3 horas antes do início, ajustável na publicação) e atraso de 15 minutos sem
        check-in. Não existe operador do Frila olhando esta tela (D01).

        Cada posição no painel expõe `a_caminho_em` (US14, 0.2.25), permitindo acompanhar se o
        profissional confirmado já sinalizou deslocamento.

        Desde a 0.2.31, cada posição traz também a hora e o tipo do check-in e a hora da
        confirmação manual (`checkin_em`, `checkin_tipo`, `checkin_confirmado_em`), e a posição
        cancelada que chegou a ter profissional traz `cancelamento`: a causa, se contou como falta,
        o texto de quem cancelou e o instante (RN12).
      x-requisitos: [RF20, RF13, RF14, RN12, UC07]
      parameters:
        - $ref: '#/components/parameters/EstabelecimentoId'
        - name: de
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Instante'
        - name: ate
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Instante'
      responses:
        '200':
          description: Painel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Painel'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '422':
          $ref: '#/components/responses/ParametroObrigatorio'

  # ───────────────────────────────────────────── Confiança e direitos

  /rpc/denunciar:
    post:
      tags: [Confiança e direitos]
      operationId: denunciar
      summary: Denunciar outro usuário
      description: |
        Registra a denúncia e a envia à Equipe Frila, que responde por e-mail em até 5 dias úteis.
        Denúncia grave confirmada (assédio, fraude ou documento falso) leva à suspensão, com motivo
        registrado e direito de contestar (RN13). Fraude e documento falso chegam pelo motivo `outro`,
        com o relato, e a Equipe Frila apura (decisão de produto de 30/09). Em risco imediato, o app mostra os atalhos para o 190
        e o 180 sem esperar a resposta. Exigência da diretriz 1.2 da App Store.

        Recusas: campo obrigatório ausente (`campo_obrigatorio`, com o nome do campo em `details`:
        `alvo_tipo`, `alvo_id`, `motivo`, `relato` ou `chave`, RF26); valor recusado pela regra
        (`campo_invalido`, com o campo em `details`: `alvo_tipo` fora do enum, `alvo_id` não UUID,
        `motivo` fora do enum `MotivoDenuncia`, `relato` com menos de 10 caracteres, `chave` não UUID,
        `midia_id` que não seja foto de perfil do alvo, ou `chamada_id` inexistente ou de terceiros).
      x-requisitos: [RF26, RN13, RN15, UC17, CD-S13]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alvo_tipo, alvo_id, motivo, relato, chave]
              properties:
                alvo_tipo:
                  $ref: '#/components/schemas/TipoDeAlvo'
                alvo_id:
                  description: |
                    O `id` do `PerfilPublico` da outra parte, como ele chegou ao app. O servidor
                    resolve a conta a partir do par `alvo_tipo` + `alvo_id`.
                  $ref: '#/components/schemas/Uuid'
                turno_id:
                  oneOf:
                    - $ref: '#/components/schemas/Uuid'
                    - type: 'null'
                motivo:
                  $ref: '#/components/schemas/MotivoDenuncia'
                relato:
                  type: string
                  minLength: 10
                chave:
                  $ref: '#/components/schemas/ChaveDeIdempotencia'
                midia_id:
                  description: |
                    0.2.54. Opcional: denuncia uma foto específica, pelo `foto_id` que o perfil
                    mostrou. Tem de ser foto do próprio alvo (`alvo_tipo` + `alvo_id`); senão,
                    `422 campo_invalido` com `details: midia_id`. A contagem é por mídia e por
                    denunciante distinto: a 2ª denúncia de conta diferente oculta a foto na hora e
                    dispara a reanálise automática; a mesma conta denunciando de novo não conta duas
                    vezes. Denúncia sem `midia_id` continua valendo como hoje, sobre o perfil.
                  $ref: '#/components/schemas/Uuid'
                chamada_id:
                  description: |
                    0.2.71. Opcional: associa a denúncia à chamada direta (CD-S13, cartão AGkBFg9a).
                    A chamada deve existir e envolver tanto o denunciante quanto o alvo (`alvo_tipo`
                    + `alvo_id`); senão, `422 campo_invalido` com `details: chamada_id`. O servidor
                    grava apenas a referência em `public.ocorrencia` (sigilo RN15). Denúncia sem
                    `chamada_id` continua funcionando como antes.
                  oneOf:
                    - $ref: '#/components/schemas/Uuid'
                    - type: 'null'
      responses:
        '200':
          description: Denúncia registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Protocolo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/abrir_suporte:
    post:
      tags: [Confiança e direitos]
      operationId: abrirSuporte
      summary: Abrir um chamado de suporte a partir de um turno
      description: |
        Registra o chamado e devolve o `Protocolo`, com o prazo de até 5 dias úteis. **Não envia
        e-mail**: o app chama esta operação e em seguida abre o e-mail do aparelho para
        `suporte@frilabr.com`, com o protocolo curto no assunto, no formato
        `[Frila Suporte #<protocolo curto>]`. O texto da pessoa vai só nesse e-mail, e o Frila não o
        guarda no banco (RN15). Sem atendimento ao vivo (RF23). Em risco imediato, o app mostra os
        atalhos para o 190 e o 180 sem esperar a resposta (UC14).

        Quem pode chamar: o profissional do turno, ou um membro do estabelecimento da vaga, com
        a conta ativa. A conta suspensa recebe `403 sem_permissao` com `details: conta_suspensa`;
        o canal dela é a contestação (`/rpc/contestar_suspensao`) ou o e-mail direto.

        **Idempotente pela `chave`:** reenviar com a mesma chave devolve o mesmo `Protocolo` e não
        abre outro chamado, e esse reenvio não conta para o limite diário.

        **Limite diário (0.2.40):** no máximo 5 chamados novos por conta por dia (dia de
        America/Sao_Paulo). O 5 é um valor inicial, ajustável sem mudar o contrato, a reavaliar com
        dados do piloto. O seguinte recebe `429 limite_excedido`. O limite por minuto de toda
        escrita (RNF07) continua valendo à parte.

        Recusas: `campo_obrigatorio` com o campo em `details` (`turno_id`, `categoria` ou `chave`);
        `campo_invalido` com `details: categoria` quando fora do enum `CategoriaSuporte`; `404
        nao_encontrado` quando o turno não existe **ou não é do chamador**, sem distinguir os dois
        casos.
      x-requisitos: [RF23, RN15, UC14]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [turno_id, categoria, chave]
              properties:
                turno_id:
                  $ref: '#/components/schemas/Uuid'
                categoria:
                  $ref: '#/components/schemas/CategoriaSuporte'
                chave:
                  $ref: '#/components/schemas/ChaveDeIdempotencia'
      responses:
        '200':
          description: Chamado aberto, ou o mesmo chamado de um reenvio com a mesma `chave`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Protocolo'
              example:
                ocorrencia_id: 6f1c2a4e-2b7d-4c5e-9a1f-3d2e1c0b9a88
                tipo: suporte
                criada_em: '2026-10-08T14:00:00Z'
                prazo_resposta_ate: '2026-10-15'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'
        '429':
          $ref: '#/components/responses/LimiteExcedido'

  /rpc/bloquear:
    post:
      tags: [Confiança e direitos]
      operationId: bloquear
      summary: Bloquear outro usuário
      description: |
        Imediato e automático, sem depender da Equipe Frila. Vale nos dois sentidos: as partes não
        voltam a se cruzar em notificação, lista ou candidatura. Quando uma delas é membro de
        estabelecimento, vale para as vagas do estabelecimento inteiro. Idempotente.

        Recusas: campo obrigatório ausente (`campo_obrigatorio`, com o nome do campo em `details`:
        `alvo_tipo` ou `alvo_id`, RF26); valor recusado pela regra (`campo_invalido`, com o campo em
        `details`: `alvo_tipo` fora do enum, `alvo_id` não UUID ou tentativa de bloquear a si mesmo).
      x-requisitos: [RF26, UC17]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alvo_tipo, alvo_id]
              properties:
                alvo_tipo:
                  $ref: '#/components/schemas/TipoDeAlvo'
                alvo_id:
                  description: O `id` do `PerfilPublico` da outra parte, como ele chegou ao app.
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Bloqueio em vigor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bloqueio'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/listar_bloqueios:
    get:
      tags: [Confiança e direitos]
      operationId: listarBloqueios
      summary: Listar os bloqueios que o chamador criou
      description: |
        Devolve os bloqueios criados por quem chama, para que a tela de bloqueados possa mostrá-los e
        oferecer o desbloqueio (decisão A8 da PO, RF26). Cada item traz o par `alvo_tipo` + `alvo_id`
        que `/rpc/desbloquear` recebe, o nome público da outra parte e o instante do bloqueio. Do mais
        recente para o mais antigo. Sem nenhum bloqueio, `200` com lista vazia, e não erro.

        Nunca traz o `usuario_id` da outra parte (RN10): o `alvo_id` é o `id` do `PerfilPublico`, como
        em `/rpc/bloquear`. Só aparecem bloqueios criados pelo chamador; bloqueio que a outra parte
        criou contra ele não é listado, para não revelar quem o bloqueou.
      x-requisitos: [RF26, RN10, UC17]
      responses:
        '200':
          description: Bloqueios do chamador.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemBloqueio'
              examples:
                dois_bloqueios:
                  value:
                    - alvo_tipo: profissional
                      alvo_id: 7c1d2b3a-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                      nome: Carlos Mendes
                      criado_em: '2026-11-03T14:20:00Z'
                    - alvo_tipo: estabelecimento
                      alvo_id: 0b8a7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                      nome: Bar do Zé
                      criado_em: '2026-10-28T22:05:00Z'
                lista_vazia:
                  value: []
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'

  /rpc/desbloquear:
    post:
      tags: [Confiança e direitos]
      operationId: desbloquear
      summary: Desfazer um bloqueio
      description: |
        Desfaz o bloqueio que o chamador criou contra a outra parte (decisão A8 da PO, RF26). A volta
        é imediata e automática, como o bloqueio: as partes voltam a poder se cruzar em notificação,
        lista e candidatura. Quando o chamador é membro de estabelecimento, desfaz o bloqueio para a
        casa inteira, do mesmo jeito que `/rpc/bloquear` vale para as vagas do estabelecimento inteiro.

        Idempotente: desbloquear quem já não está bloqueado devolve `200`, e não `404`.

        Recusas: campo obrigatório ausente (`campo_obrigatorio`, com o nome do campo em `details`:
        `alvo_tipo` ou `alvo_id`); valor recusado pela regra (`campo_invalido`, com o campo em
        `details`: `alvo_tipo` fora do enum ou `alvo_id` não UUID). `404 nao_encontrado` quando o alvo
        não existe ou não é visível para quem pede.
      x-requisitos: [RF26, RN10, UC17]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alvo_tipo, alvo_id]
              properties:
                alvo_tipo:
                  $ref: '#/components/schemas/TipoDeAlvo'
                alvo_id:
                  description: O `id` do `PerfilPublico` da outra parte, como veio em `/rpc/listar_bloqueios`.
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: |
            Bloqueio desfeito. Devolve o par recebido e o `criado_em` do bloqueio que deixou de valer.
            Se já não havia bloqueio, a chamada repetida devolve o mesmo par com o instante da chamada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bloqueio'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/situacao_da_conta:
    get:
      tags: [Confiança e direitos]
      operationId: situacaoDaConta
      summary: Situação da conta e da suspensão, se houver
      description: |
        Mostra ao titular o motivo e a data da suspensão, e o protocolo da contestação vinculada à
        suspensão em vigor, esteja ela em análise ou já respondida pela Equipe Frila (decisão de produto,
        opção B) (RF24, RN13). O resultado da análise do suporte não é exposto no app (RN07), e eventual
        recurso adicional é tratado exclusivamente por e-mail, sem reenvio pelo aplicativo.
      x-requisitos: [RF24, RN13, UC15]
      responses:
        '200':
          description: Situação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SituacaoDaConta'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /rpc/contestar_suspensao:
    post:
      tags: [Confiança e direitos]
      operationId: contestarSuspensao
      summary: Contestar a suspensão
      description: |
        Vai à Equipe Frila, com resposta em até 5 dias úteis. Se a contestação for aceita, a conta volta
        na hora (RN13). Sem suspensão em vigor: `422 sem_suspensao_ativa`.

        Relato vazio é `422 campo_obrigatorio`; relato com menos de 10 caracteres é
        `422 campo_invalido`, os dois com `details: relato`. O relato **não** passa pelo filtro de
        termos da diretriz 1.2 (decisão J1=B, 13/10/2026): quem contesta cita o que ouviu, e só a
        Equipe Frila lê.

        Uma contestação por suspensão (opção B, 0.2.36): quem já contestou a suspensão em vigor,
        com a contestação em análise ou já respondida, recebe `409 contestacao_ja_aberta`. Depois de
        respondida não há reenvio pelo app; o eventual recurso é por e-mail e não aparece no app.
      x-requisitos: [RF24, RN13, UC15]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [relato]
              properties:
                relato:
                  type: string
                  minLength: 10
      responses:
        '200':
          description: Contestação registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Protocolo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/minha_identidade_status:
    get:
      tags: [Confiança e direitos]
      operationId: minhaIdentidadeStatus
      summary: Estado da verificação de identidade do profissional autenticado
      description: |
        Devolve o estado da verificação de identidade (RN14) do profissional que chama: se há
        exigência aberta, com que motivo, até quando, e se o selo está ativo. É leitura e não tem
        efeito colateral; por isso é `GET`, como as demais leituras por função do contrato.

        Só olha para a conta de quem chama. Conta que não é de profissional recebe
        `403 sem_permissao` (RF21). Conta encerrada ou anonimizada recebe `401 nao_autenticado`
        (RF25).

        Toda conta tem uma resposta: `nao_exigida` é o estado inicial, com `motivo` e
        `prazo_envio_ate` nulos.
      x-requisitos: [RN13, RN14, RN15]
      responses:
        '200':
          description: Estado atual da verificação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusVerificacao'
              examples:
                nao_exigida:
                  summary: Estado inicial, sem exigência
                  value:
                    status_verificacao: nao_exigida
                    motivo: null
                    prazo_envio_ate: null
                    identidade_verificada: false
                pendente:
                  summary: Exigência aberta pela moderação
                  value:
                    status_verificacao: pendente
                    motivo: Apuração de denúncia grave
                    prazo_envio_ate: '2026-11-18T23:59:59Z'
                    identidade_verificada: false
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'

  /rpc/solicitar_upload_verificacao:
    post:
      tags: [Confiança e direitos]
      operationId: solicitarUploadVerificacao
      summary: Pedir as URLs assinadas para enviar as evidências da verificação
      description: |
        Começa o envio das evidências da verificação de identidade (RN14), voluntário (selo) ou em
        atendimento a uma exigência formal. Devolve uma URL assinada de upload por parte do
        documento, para o bucket privado `documentos-identidade`, **válidas por 2 horas**
        (`expira_em`). Passado esse prazo, o cliente pede de novo.

        O bucket é privado e o app só escreve: leitura é exclusiva da moderação. O aplicativo nunca
        fala direto com o fornecedor de verificação; se houver um, a integração passa por uma
        função interna do servidor.

        Só o profissional que chama pode pedir, para a própria conta (`403 sem_permissao` para
        qualquer outro perfil, RF21). Aceita `nao_exigida`, `pendente` e `rejeitada` (novo envio).
        Com a análise em curso ou a verificação já aprovada, `409 verificacao_indisponivel`, com
        `details` `em_analise` ou `aprovada`. Pedir de novo antes de confirmar o envio é permitido e
        devolve URLs novas.

        Nenhum dado de verificação entra em log, fixture ou captura de tela (RN15).
      x-requisitos: [RN13, RN14, RN15]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documento_tipo]
              properties:
                documento_tipo:
                  type: string
                  enum: [rg, cnh]
                  description: Tipo do documento que será enviado.
      responses:
        '200':
          description: URLs assinadas emitidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadVerificacao'
              examples:
                rg:
                  value:
                    expira_em: '2026-11-05T14:00:00Z'
                    partes:
                      - parte: frente
                        url: https://frila.supabase.co/storage/v1/object/upload/sign/documentos-identidade/exemplo-frente?token=exemplo
                      - parte: verso
                        url: https://frila.supabase.co/storage/v1/object/upload/sign/documentos-identidade/exemplo-verso?token=exemplo
                      - parte: selfie
                        url: https://frila.supabase.co/storage/v1/object/upload/sign/documentos-identidade/exemplo-selfie?token=exemplo
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/confirmar_envio_verificacao:
    post:
      tags: [Confiança e direitos]
      operationId: confirmarEnvioVerificacao
      summary: Avisar que as evidências subiram e a análise pode começar
      description: |
        Confirma que o upload das evidências terminou (RN14) e move a verificação para
        `em_analise`. A partir daí a análise é da moderação humana; não há decisão automática
        sobre a conta (RN13).

        O servidor confere que todas as partes pedidas em `solicitar_upload_verificacao` chegaram
        ao bucket. Se alguma faltar, `422 evidencia_incompleta`, com `details` dizendo a parte
        (`frente`, `verso` ou `selfie`). Sem ter pedido o upload antes, `409
        verificacao_indisponivel` com `details: sem_envio_solicitado`; com a verificação já
        `aprovada`, o mesmo código com `details: aprovada`.

        Idempotente: confirmar de novo com a verificação já em `em_analise` devolve o mesmo
        estado, sem reabrir a análise.

        Só o profissional que chama, para a própria conta (`403 sem_permissao`, RF21).
      x-requisitos: [RN13, RN14, RN15]
      responses:
        '200':
          description: Envio confirmado; a verificação está em análise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusVerificacao'
              examples:
                em_analise:
                  value:
                    status_verificacao: em_analise
                    motivo: Apuração de denúncia grave
                    prazo_envio_ate: '2026-11-18T23:59:59Z'
                    identidade_verificada: false
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  # ───────────────────────────────────────────── Dispositivos

  /rpc/registrar_dispositivo:
    post:
      tags: [Dispositivos]
      operationId: registrarDispositivo
      summary: Registrar o token de push do aparelho
      description: |
        O agendador manda o push pelo FCM, que no iOS entrega pelo APNs (B17). Chamar a cada abertura do
        app e sempre que o token mudar. O mesmo token reenviado só atualiza a data. Quem recusou a
        permissão de notificação não registra token e, para o despacho, não é alcançável.

        **Conta suspensa registra normalmente** (`200`): RN15 não exige conta ativa para registrar o
        token do aparelho. Esta operação não responde `403`.

        A resposta traz o `vinculo_id` deste token com a conta que chama. O mesmo id vem em todo
        push mandado a este aparelho para esta conta, e é por ele que o app sabe que o aviso é de
        quem está no aparelho: o token que era de outra conta passa para quem chama com um
        `vinculo_id` novo, e o aviso que ainda carrega o anterior não é mostrado nem aberto (RN15).
        No Android, o push chega como payload data-only (com título e corpo em `titulo` e `corpo`),
        garantindo a interceptação pelo serviço nativo para conferência de `vinculo_id` mesmo em segundo
        plano ou com app fechado. O cliente Android seleciona o canal de notificação (`canal_urgencia`,
        `canal_turnos` ou `canal_sistema`) mapeando `data.tipo` conforme a tabela canônica descrita no
        Estado da versão 0.2.46. No iOS, o alerta vai em `apns.payload.aps.alert` com `mutable-content: 1`
        e `vinculo_id` no payload. A Notification Service Extension (`FrilaNotificationService`) intercepta
        o push antes da exibição: se o `vinculo_id` divergir do vínculo ativo no App Group (outra conta
        deslogada ou sessão encerrada), o título e o corpo são neutralizados por texto neutro genérico
        sem `tipo`, impedindo qualquer vazamento visual entre contas na tela bloqueada e na central (RN15).
      x-requisitos: [RF06, RN15, RNF02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token_fcm, plataforma]
              properties:
                token_fcm:
                  type: string
                  minLength: 20
                plataforma:
                  $ref: '#/components/schemas/Plataforma'
                versao_app:
                  description: |
                    0.2.56. Opcional. Versão do app, no formato de `ConfiguracaoDoApp.versao_minima`.
                    O servidor guarda junto do token e só manda aviso `chamada_*` para aparelho cuja
                    versão alcança a versão mínima de `chamada_direta` da plataforma (0.2.66); sem
                    versão, ou com ela fora do formato, o aparelho conta como antigo (0.2.67).
                  type: string
                  pattern: '^[0-9]{1,6}(\.[0-9]{1,6}){0,3}$'
                  example: "1.1.0"
      responses:
        '200':
          description: Dispositivo registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispositivo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /rpc/remover_dispositivo:
    post:
      tags: [Dispositivos]
      operationId: removerDispositivo
      summary: Tirar o token de push do aparelho
      description: |
        Chamada no logout, e em todo caminho que encerra a sessão naquele aparelho. Sem ela, o
        token continua registrado para a conta anterior: o aparelho passa a receber push de vagas
        de alguém que não está mais logado nele — que é vazamento de dado pessoal por notificação,
        e RN15 proíbe.

        Idempotente: token que não está registrado devolve `200` igual. O app não precisa saber se
        chegou a registrar.
      x-requisitos: [RF06, RN15, RNF02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token_fcm]
              properties:
                token_fcm:
                  type: string
                  minLength: 20
      responses:
        '200':
          description: O token não está mais registrado para esta conta.
          content:
            application/json:
              schema:
                type: object
                required: [removido]
                properties:
                  removido:
                    type: boolean
                    description: Falso quando o token já não estava registrado. A ação deu no mesmo.
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /rpc/registrar_evento:
    post:
      tags: [Telemetria]
      operationId: registrarEvento
      summary: Registrar um evento do dicionário de métricas
      description: |
        Só eventos do dicionário fechado (`EventoDeTelemetria`), e só identificadores no corpo.
        Texto livre não entra: RN15 proíbe dado pessoal em log, e um campo aberto de telemetria é
        por onde o dado pessoal entra — alguém manda o nome do profissional "só para depurar" e
        ninguém revisa de novo.

        A lista fechada não é burocracia: é o que torna a proibição verificável. Evento fora dela é
        recusado com `422 campo_invalido`, `details: evento`.

        Não substitui o log do servidor. Serve para o que só o app sabe: que a tela apareceu, que a
        permissão foi negada, que a ação entrou na fila offline.
      x-requisitos: [RN15, RNF08]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evento]
              properties:
                evento:
                  $ref: '#/components/schemas/EventoDeTelemetria'
                vaga_id:
                  oneOf:
                    - $ref: '#/components/schemas/Uuid'
                    - type: 'null'
                turno_id:
                  oneOf:
                    - $ref: '#/components/schemas/Uuid'
                    - type: 'null'
                ocorrido_em:
                  description: |
                    Quando o app registrou o evento. Existe por causa da fila offline, que envia
                    depois — sem ele, um dia inteiro de uso sem rede chegaria carimbado com a hora
                    da reconexão. O servidor recusa instante adiante do próprio relógio com
                    `422 registro_no_futuro`.
                  $ref: '#/components/schemas/Instante'
      responses:
        '200':
          description: Evento registrado.
          content:
            application/json:
              schema:
                type: object
                required: [registrado]
                properties:
                  registrado:
                    type: boolean
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  # ───────────────────────────────────────────── Exportação e conta (Edge Functions)

  /exportar-turnos:
    servers:
      - url: https://{projeto}.supabase.co/functions/v1
        variables:
          projeto:
            default: frila
    post:
      tags: [Exportação e conta]
      operationId: exportarTurnos
      summary: Exportar os turnos de um período em CSV ou PDF
      description: |
        Data, função, horários registrados, valor acordado e contraparte de cada turno (RF22, RN17). O
        valor é o acordado e registrado, nunca um pagamento processado pelo Frila (RN09). Turno "não
        verificado" sai marcado como tal.

        Os parâmetros `de` e `ate` são opcionais: se omitidos, assume-se o padrão dos últimos 15 dias.
        O intervalo entre `de` e `ate` não pode exceder 30 dias (janela regulamentar, pd7zOS5P).

        Corpo incompleto ou inválido é `422`: `campo_obrigatorio` quando falta `formato`;
        `intervalo_maximo_excedido` quando o intervalo entre `de` e `ate` for superior a 30 dias;
        `campo_invalido` quando o instante não é ISO-8601, quando `de` vem depois de `ate`
        (com `details: de`), quando o formato não é `csv` nem `pdf`, ou quando `estabelecimento_id`
        não é um uuid. Método que não é POST é `405 metodo_nao_permitido`.
      x-requisitos: [RF22, RN09, RN17, UC13]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [formato]
              properties:
                de:
                  description: Início do período (ISO-8601). Opcional; default dos últimos 15 dias se omitido.
                  $ref: '#/components/schemas/Instante'
                ate:
                  description: Fim do período (ISO-8601). Opcional; default dos últimos 15 dias se omitido.
                  $ref: '#/components/schemas/Instante'
                formato:
                  type: string
                  enum: [csv, pdf]
                estabelecimento_id:
                  description: Para membros de estabelecimento. Sem ele, valem os turnos do chamador como profissional.
                  oneOf:
                    - $ref: '#/components/schemas/Uuid'
                    - type: 'null'
      responses:
        '200':
          description: Arquivo gerado.
          content:
            text/csv:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
        '204':
          description: O período não tem turnos; nenhum arquivo vazio é gerado (UC13, 1a).
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '405':
          $ref: '#/components/responses/MetodoNaoPermitido'
        '422':
          $ref: '#/components/responses/RegraRecusou'

  /exportar-meus-dados:
    servers:
      - url: https://{projeto}.supabase.co/functions/v1
        variables:
          projeto:
            default: frila
    post:
      tags: [Exportação e conta]
      operationId: exportarMeusDados
      summary: Exportar os dados pessoais do titular
      description: |
        Devolve o JSON **no corpo da resposta**, e não um link para baixar depois. Um link é mais
        um lugar onde o dado pessoal fica em repouso, com prazo de validade que alguém precisa
        lembrar de configurar; o corpo da resposta morre com a conexão.

        O conteúdo é o que a LGPD chama de portabilidade: o que o titular forneceu e o que o
        sistema registrou sobre ele. As avaliações **recebidas** entram sem o autor — a resposta
        individual não é do titular, e revelá-la convidaria à retaliação, que é o que RN07 evita
        ao manter a avaliação binária e agregada.

        Sessão sem conta (antes de `criar_conta`) é `404 nao_encontrado`. Método que não é POST é
        `405 metodo_nao_permitido`.
      x-requisitos: [RF25, RNF08, UC16]
      responses:
        '200':
          description: Os dados pessoais do chamador, no corpo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeusDados'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '405':
          $ref: '#/components/responses/MetodoNaoPermitido'

  /entrar-demonstracao:
    servers:
      - url: https://{projeto}.supabase.co/functions/v1
        variables:
          projeto:
            default: frila
    post:
      tags: [Exportação e conta]
      operationId: entrarDemonstracao
      summary: Entrada da conta de demonstração da revisão da App Store
      description: |
        A App Store exige que o revisor consiga usar o app inteiro, e o Frila entra por código no
        e-mail — o revisor não tem acesso à caixa de entrada de ninguém. Sem esta porta, a revisão
        para na primeira tela (diretriz 2.1).

        Aceita **um** e-mail, declarado no App Store Connect, com um código fixo guardado como
        segredo da função. Devolve a mesma `Sessao` do fluxo normal; daí para a frente o app não
        sabe que a conta é de demonstração.

        **O que esta porta não faz:** não cria conta, não aceita e-mail que não seja o declarado, e
        não existe fora da Edge Function — não há RPC equivalente, porque uma função do Postgres
        com esse poder ficaria exposta em `rest/v1` para qualquer um tentar. A conta é de
        profissional, tem dados de demonstração e não recebe push.

        Roda como Edge Function porque emite sessão, e emitir sessão é trabalho do Supabase Auth,
        não do Postgres.
      security:
        - chaveDoProjeto: []
      x-requisitos: [RF01, RNF08]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, codigo]
              properties:
                email:
                  type: string
                  format: email
                  description: O endereço declarado no App Store Connect. Qualquer outro recebe `404 nao_encontrado`.
                codigo:
                  type: string
                  description: Código fixo da revisão, guardado como segredo da função. Não é o código de 6 dígitos do e-mail.
      responses:
        '200':
          description: Sessão da conta de demonstração.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'

  /excluir-conta:
    servers:
      - url: https://{projeto}.supabase.co/functions/v1
        variables:
          projeto:
            default: frila
    post:
      tags: [Exportação e conta]
      operationId: excluirConta
      summary: Excluir a conta e anonimizar os dados pessoais (RF25, RN15)
      description: |
        Exclusão definitiva de conta exigida pelas diretrizes de privacidade das lojas (App Store 5.1.1(v)).
        Anonimiza o registro em `usuario`, cancela turnos futuros sem gerar falta para o profissional,
        notifica as contrapartes, remove registros de aparelhos e apaga a credencial em `auth.users`.
        Idempotente: reenviar em conta já anonimizada ou sem registro no banco devolve 202 com
        `turnos_cancelados: 0`. O único administrador de um estabelecimento com outros usuários precisa
        transferir a administração antes (`409 administrador_unico`). Roda como Edge Function porque
        apaga a credencial no Supabase Auth.
      x-requisitos: [RF25, RNF08, UC16]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmar]
              properties:
                confirmar:
                  type: boolean
                  enum: [true]
                  description: Confirmação explícita obrigatória.
      responses:
        '202':
          description: Exclusão aceita e processada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExclusaoDeConta'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '405':
          description: Método não permitido (apenas POST).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                code: metodo_nao_permitido
                message: metodo_nao_permitido
                details: null
                hint: null
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraRecusou'

components:

  securitySchemes:
    chaveDoProjeto:
      type: apiKey
      in: header
      name: apikey
      description: Chave publicável do projeto no Supabase. Vai em toda requisição; não identifica o usuário.
    tokenDoUsuario:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acesso da sessão do Supabase Auth. É ele que as políticas de RLS leem.

  parameters:
    EstabelecimentoId:
      name: estabelecimento_id
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'

  responses:
    NaoAutenticado:
      description: Token ausente, expirado, inválido ou pertencente a conta encerrada/anonimizada (RF25).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            jwt_invalido:
              summary: Token ausente ou expirado na camada PostgREST
              value:
                code: PGRST301
                message: JWT expired
                details: null
                hint: null
            conta_encerrada:
              summary: Token de conta cuja exclusão já foi processada
              value:
                code: nao_autenticado
                message: nao_autenticado
                details: null
                hint: null
    SemPermissao:
      description: |
        Autenticado, mas sem papel para a ação, ou prazo de acesso vencido. Conta suspensa, em
        operação que exige conta ativa, recebe o mesmo código com `details: conta_suspensa` (RN13).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            sem_permissao:
              value:
                code: sem_permissao
                message: sem_permissao
                details: null
                hint: null
            contato_expirado:
              value:
                code: contato_expirado
                message: contato_expirado
                details: null
                hint: null
            sem_turno_cumprido:
              summary: Profissional sem turno verificado prévio no estabelecimento
              value:
                code: sem_permissao
                message: sem_permissao
                details: sem_turno_cumprido
                hint: null
            conta_suspensa:
              summary: Conta suspensa em operação que exige conta ativa (RN13)
              value:
                code: sem_permissao
                message: sem_permissao
                details: conta_suspensa
                hint: null
    ContaSuspensa:
      description: |
        A conta está suspensa, e a operação exige conta ativa (RN13). É o mesmo `403 sem_permissao`
        do papel insuficiente, com `details: conta_suspensa`; a tela que explica a suspensão lê
        `/rpc/situacao_da_conta`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            code: sem_permissao
            message: sem_permissao
            details: conta_suspensa
            hint: null
    NaoEncontrado:
      description: Não existe, ou não é visível para quem pede.
      content:
        application/json:
          schema:
