openapi: 3.1.0
info:
  title: Frila API
  version: 0.2.41
  summary: Contrato entre o app do Frila, em iOS, Android e web, e o backend no Supabase.
  description: |
    Contrato escrito **antes** do backend (decisão B16, 21/09/2026), para que iOS, Android e web
    sejam construídos em paralelo contra a mesma especificação. É a fonte de onde saem os modelos
    de cada cliente. Regras, requisitos e casos de uso citados (RN, RF, UC) estão no Documento de
    Requisitos v1.5.0; o esquema do banco, na Modelagem de Banco de Dados.

    ## Como o contrato funciona no Supabase

    - **Quase tudo é função RPC.** Cada operação que carrega regra de negócio — publicar, candidatar,
      confirmar, check-in, avaliar, denunciar — é uma função no Postgres, chamada em
      `POST /rest/v1/rpc/<nome>` (leituras em `GET`). A regra é escrita uma vez, no banco, e vale igual
      para os três clientes. Os apps não escrevem direto nas tabelas.
    - **Leitura sob Row Level Security; escrita só por função.** Toda tabela do produto tem política
      de leitura, e nenhuma tem política de escrita para os clientes. As duas tabelas de operação,
      `entrada_demonstracao` e `pedido_de_exclusao`, não têm política nenhuma: ninguém as lê pela API. As funções que gravam são `SECURITY DEFINER`:
      conferem por dentro quem chama, o perfil (RN25) e o papel, e só então escrevem. O que é da outra
      parte (perfil público, contato) também sai por função, só com as colunas permitidas. As políticas
      estão na Modelagem de Banco de Dados.
    - **Três portas.** `rest/v1` (tabelas e RPC), `auth/v1` (Supabase Auth, pelo SDK) e `functions/v1`
      (Edge Functions, só onde o Postgres não basta: arquivos de exportação e exclusão de conta).
    - **O despacho não aparece aqui.** Notificar os elegíveis, agrupar, respeitar o teto, lembrar,
      alertar e fechar o modo seleção é trabalho do agendador (`pg_cron` + fila `pgmq` + Edge
      Function), fora da requisição (B15). Os clientes só registram o dispositivo e recebem o push.

    ## Convenções

    | Convenção | Regra |
    |---|---|
    | Dinheiro | Inteiro em centavos: `"valor_centavos": 12000` (RN18). Nunca `120.00` |
    | Tempo | UTC em ISO-8601: `"inicio_em": "2026-09-19T21:00:00Z"` (RN18). O fuso `America/Sao_Paulo` é da tela |
    | Identificadores | `uuid` |
    | Nomes | `snake_case`, iguais às colunas do banco |
    | Idempotência | Reenviar a mesma escrita devolve o mesmo resultado. Onde há chave natural (candidatura por vaga e profissional, check-in por turno, avaliação por turno e lado, bloqueio por par, cancelamento pelo mesmo autor), ela basta. `publicar_vaga` e `denunciar`, que não têm chave natural, recebem `chave` (uuid gerado pelo app) |
    | Versão | Mudança incompatível vira função nova (`publicar_vaga_v2`); a antiga continua no ar enquanto houver app antigo na loja |

    ## Erros

    O envelope é o do PostgREST: `code`, `message`, `details` e `hint`. Nas recusas de regra de
    negócio, **`code` é um código estável em `snake_case`**, que o cliente compara sem traduzir;
    `details` traz o motivo complementar, também estável, quando houver; `message` é texto para log e
    nunca vai para a tela. As funções levantam o erro por um auxiliar único:

    ```sql
    create or replace function erro(status int, codigo text, motivo text default null)
    returns void language plpgsql as $$
    begin
      raise sqlstate 'PGRST' using
        message = json_build_object('code', codigo, 'message', codigo,
                                    'details', motivo, 'hint', null)::text,
        detail  = json_build_object('status', status,
                                  'headers', json_build_object())::text;
    end $$;
    ```

    `headers` é obrigatório no `detail`: sem ele o PostgREST responde `500 PGRST121` no
    lugar do status que a regra levantou, e toda recusa de regra de negócio chega ao app
    como erro interno. A 0.2.0 trazia o trecho sem essa chave.

    | HTTP | `code` | Quando |
    |---|---|---|
    | 401 | `nao_autenticado`, `PGRST301` e afins | Token ausente, expirado, inválido ou de conta já encerrada/anonimizada (RF25) |
    | 403 | `sem_permissao` | Autenticado, mas sem papel para a ação (RF21); ou profissional sem turno verificado prévio na casa ao incluir na equipe (UC11). `details`: `conta_suspensa` quando a conta está suspensa e a ação exige conta ativa (RN13), ou `sem_turno_cumprido` (UC11) |
    | 403 | `contato_expirado` | Contato pedido depois de 7 dias do fim do turno (RN10) |
    | 404 | `nao_encontrado` | O recurso não existe ou não é visível para quem pede (inclui bloqueio, RF26, e vaga ocultada pela moderação da Equipe Frila, diretriz 1.2) |
    | 409 | `posicao_ja_preenchida` | Alguém chegou antes (RN19). **Funcionamento normal no modo urgência** |
    | 409 | `vaga_encerrada` | A vaga fechou, já começou ou foi cancelada por outro autor. Reenvio pelo mesmo contratante autor do cancelamento devolve 200 (0.2.35). Posição reaberta por atraso: a partir de `fim_em - 1 h` |
    | 409 | `checkin_pendente` | Check-out ou confirmação de um turno que ainda não teve check-in. O código diz qual é o passo que falta |
    | 409 | `checkin_ja_confirmado` | Confirmação de um check-in geolocalizado, que já nasceu verificado |
    | 409 | `posicao_nao_cancelavel` | A posição não está confirmada: aberta não tem o que cancelar, turno já em andamento ou cumprido não volta atrás, ou posição cancelada pela outra parte. Reenvio pelo mesmo autor devolve 200 (0.2.35) |
    | 409 | `candidatura_indisponivel` | A candidatura foi retirada, expirou ou já foi escolhida |
    | 409 | `avaliacao_ja_registrada` | Já existe avaliação **deste lado** do turno, com outra resposta — de quem chama ou de outro membro do mesmo estabelecimento |
    | 409 | `conta_existente`, `documento_ja_cadastrado` | Cadastro repetido |
    | 409 | `administrador_unico` | Exclusão de conta de quem é o único administrador (UC16) |
    | 409 | `perfil_ja_existe` | `criar_perfil_profissional` numa conta que já tem perfil. Conflito, e não sobrescrita: sobrescrever apagaria a grade de quem tocasse duas vezes no botão |
    | 409 | `contestacao_ja_aberta` | Já existe contestação para a suspensão em vigor ou para o despacho, em análise ou já respondida (RF24, RF27) |
    | 422 | `campo_obrigatorio` | Falta campo exigido; `details` diz qual (na vaga, RN02) |
    | 422 | `campo_invalido` | O campo veio, e o valor é recusado pela regra; `details` diz qual campo. Distinto de `campo_obrigatorio`, que é ausência — a tela destaca o mesmo campo, com texto diferente |
    | 422 | `intervalo_maximo_excedido` | Intervalo entre `de` e `ate` maior que 30 dias na exportação de turnos (pd7zOS5P) |
    | 422 | `menor_de_idade` | Nascimento com menos de 18 anos (RN20) |
    | 422 | `perfil_incompativel` | A ação é do outro perfil: conta de contratante criando perfil de profissional, ou conta de profissional cadastrando estabelecimento (RN25) |
    | 422 | `selecao_sem_antecedencia` | Modo seleção em vaga que começa em menos de 24 h (RN24) |
    | 422 | `republicacao_indisponivel` | `republicar_posicoes_restantes` não pode republicar; `details` diz o motivo: `nao_e_selecao`, `selecao_em_curso`, `vaga_cancelada`, `ja_comecou`, `sem_posicoes_restantes` ou `ja_republicada` (0.2.41) |
    | 422 | `vaga_oculta` | A vaga foi ocultada pela moderação da Equipe Frila (diretriz 1.2): não se escolhe candidato nela nem se republica a partir dela até ser reexibida |
    | 422 | `horario_invalido` | Fim antes do início, ou turno no passado |
    | 422 | `inelegivel` | `details`: `turno_sobreposto` (RN21), `perfil_suspenso` (RN13) ou `funcao_incompativel` (RN05) |
    | 422 | `avaliacao_indisponivel` | `details`: `antes_do_fim` ou `sem_presenca_verificada` (RN07) |
    | 422 | `fora_da_janela` | Check-in ou check-out fora da janela que a regra permite para o turno (RN22) |
    | 422 | `a_caminho_fora_da_janela` | Chamada de `avisar_a_caminho` fora da janela permitida (de 3 h antes até 15 min depois do início do turno) (US14, RF12) |
    | 422 | `registro_no_futuro` | Instante de check-in ou check-out adiante do relógio do servidor. O relógio que vale é o do servidor, nunca o do aparelho |
    | 422 | `reabertura_antes_da_tolerancia` | Reabrir por atraso antes dos 15 minutos (D06) |
    | 422 | `sem_suspensao_ativa` | Contestação sem suspensão em vigor (RF24) |
    | 429 | `limite_excedido` | Limite de requisições |

    ## Estado

    **Versão 0.2.41, de 09/10/2026.** Republicar as posições restantes do modo seleção em
    urgência, com um toque (decisão D1-C de 07/10/2026 e R1 a R4 de 09/10/2026, aprovadas por João Paulo; cartão d3A1WjG3). Só superfície nova:

    - **`POST /rpc/republicar_posicoes_restantes`** (`republicarPosicoesRestantes`): `vaga_id` e
      `chave`. Publica uma vaga de **urgência**, para o **mesmo turno** e o **mesmo valor** da vaga
      de seleção que fechou, só com as posições que sobraram. Devolve `VagaPublicada`.
    - **`422 republicacao_indisponivel`** (código novo), com o motivo em `details`:
      `nao_e_selecao`, `selecao_em_curso`, `vaga_cancelada`, `ja_comecou`, `sem_posicoes_restantes`
      e `ja_republicada`.
    - **`VagaNoPainel.republicavel_em_urgencia`** (campo novo, opcional): quantas posições o toque
      republicaria, ou nulo quando a vaga não é republicável. Fora de `required` nesta versão, para o
      app poder ler o contrato antes de o servidor preenchê-lo; ausente vale nulo.
    - Nenhuma mudança em `republicar_vaga` nem em `publicar_vaga`.

    **Versão 0.2.40, de 08/10/2026.** Suporte por e-mail a partir do turno (cartão iOS #21 e
    NLgx2GCO, US22, RF23, UC14; decisões D1 a D11 aprovadas por João Paulo em 08/10/2026). O
    backend **não** recebe o e-mail: o app chama `abrir_suporte` antes de abrir o e-mail do
    aparelho, recebe o `Protocolo` e põe o protocolo curto no assunto. Só superfície nova:

    - **`POST /rpc/abrir_suporte`** (`abrirSuporte`): abre o chamado de suporte de um turno do
      qual o chamador é parte. Devolve `Protocolo` com o prazo de 5 dias úteis. Idempotente pela
      `chave`. Recusas: `401`, `403` (conta suspensa), `404`, `422`, `429`.
    - **`CategoriaSuporte`** (novo): `endereco`, `atraso`, `conduta`, `seguranca`, `outro`
      (os motivos do UC14).
    - **`Protocolo.tipo` ganha `suporte`**, e a descrição de `Protocolo` passa a definir o
      **protocolo curto**: os 8 primeiros caracteres hexadecimais de `ocorrencia_id`, sem hifens,
      em maiúsculas. É o que vai no assunto do e-mail e o que a Equipe Frila usa para achar o
      chamado.
    - Nenhuma mudança em operação existente.

    **Versão 0.2.39, de 08/10/2026.** Corrige dois `403` que o contrato declarava e o sistema nunca
    devolve. Os dois vieram de cópia de modelo na revisão de 03/10 (a resposta comum
    `ContaSuspensa` colada em 14 operações), e a Bigorna os provou errados contra os testes
    pgTAP 130 e 495. Nenhuma outra mudança de superfície:

    - **`candidatar`: sai o `403`.** Conta suspensa que se candidata recebe
      `422 inelegivel` com `details: perfil_suspenso` (RN13), que o contrato já declarava.
    - **`registrarDispositivo`: sai o `403`.** Conta suspensa registra o token com `200` (RN15):
      RN15 não exige conta ativa para registrar o token do aparelho.
    - Quem tratava esses dois `403` não perde nada: nunca chegavam. O texto da 0.2.x sobre as
      "14 operações" fica como história; para estas duas, vale o que está acima.

    **Versão 0.2.38, de 07/10/2026.** Fecha o contrato do modo seleção para o iOS da v1.1 (cartão
    d3A1WjG3; decisões de produto D1 a D9 aprovadas por João Paulo em 07/10/2026). Duas adições de
    superfície, ambas compatíveis para quem não as lê, e a escrita das regras de reposição de posição:

    - **`Candidato.da_equipe` (D7):** booleano. `true` quando o profissional está na equipe de
      confiança do estabelecimento da vaga, e a tela mostra o selo "da sua equipe". **Não reordena**:
      a lista continua em ordem de chegada (RN06). Campo opcional no esquema nesta versão (fora de
      `required`), para o app poder ler o contrato antes de o backend preencher; ausente vale
      `false`. O backend passa a devolvê-lo na entrega seguinte, e o campo vira obrigatório na
      versão em que isso for medido pelo portão do contrato.
    - **Aviso `selecao_lembrete` (D6):** um lembrete à casa, **uma vez por vaga**, quando faltarem
      6 horas ou menos para o prazo de escolha (RN24) e houver ao menos uma candidatura pendente.
      Sem pendentes, não sai. Vai a cada membro do estabelecimento. Não conta para o teto da RN23,
      que é só de `vaga` e `vagas_agrupadas`. Payload de sempre (RN15): `tipo` e `vaga_id`.
    - **Textos finais dos avisos do modo seleção:** definidos na descrição de `TipoNotificacao`
      (`confirmacao` no modo seleção, `candidatura_recusada`, `selecao_encerrada`, `selecao_lembrete`).
      Substituem o texto genérico provisório da 0.2.24.
    - **Reposição de posição dentro das 24 h (D4 e D5):** quando uma posição de vaga em seleção volta
      a ficar aberta (cancelamento do escolhido, `cancelar_posicao`, ou `reabrir_por_atraso`) e o
      início está a **24 horas ou menos**, a reposição é em **urgência**: o primeiro elegível que
      se candidata é confirmado na hora, e o agendador do modo seleção não a fecha. Com **mais de 24
      horas**, a posição reaberta volta a ser seleção. Isso fecha a lacuna de 0.2.x, em que a posição
      reaberta dentro das 24 h era cancelada pelo agendador em até um minuto. O campo `reaberta` do
      aviso `cancelamento` passa a ser verdadeiro só quando a posição de fato voltou à fila. É
      comportamento, sem mudança de assinatura; a correção no backend vem em PR próprio.

    **Versão 0.2.37, de 06/10/2026.** Ciclo de vida da revisão de despacho no app (decisão de produto
    sobre a opção B em `pedirRevisaoDespacho` / RF27) e parâmetros de exportação de turnos com janela
    regulamentar de até 30 dias (cartão pd7zOS5P):

    - **Uma contestação por despacho (opção B, RF27):** O titular pode submeter no máximo uma
      contestação por despacho através do aplicativo na tela "Por que recebo vagas". Caso tente reenviar
      com uma contestação em análise ou já respondida pela Equipe Frila, a operação responde com
      `409 contestacao_ja_aberta`. Qualquer recurso subsequente é tratado exclusivamente por e-mail e não
      aparece nem pode ser reenviado pelo aplicativo. Adicionada a resposta `409` (`Conflito`) em
      `/rpc/pedir_revisao_despacho`.
    - **Janela regulamentar e parâmetros opcionais em `exportarTurnos` (pd7zOS5P):**
      - Os parâmetros `de` e `ate` tornam-se opcionais na chamada de `/exportar-turnos`. Quando
        omitidos, o padrão aplicado é o intervalo dos últimos 15 dias.
      - A janela regulamentar máxima permitida entre `de` e `ate` é de até 30 dias. Solicitações com
        intervalo superior a 30 dias são recusadas com `422 intervalo_maximo_excedido`.

    **Versão 0.2.36, de 05/10/2026.** Ciclo de vida da contestação de suspensão no app (decisão
    de produto de 05/10/2026 sobre a opção B do cartão yoV2Ak4j / suspensão). Clarifica o contrato
    de `situacaoDaConta` e `contestarSuspensao`:

    - **Uma contestação por suspensão (opção B):** O titular pode submeter no máximo uma contestação
      por suspensão através do aplicativo. Após a resposta do suporte da Equipe Frila, não há reenvio
      nem abertura de nova contestação pelo app; qualquer recurso subsequente é realizado exclusivamente
      por e-mail e não aparece na interface do aplicativo.
    - **`situacaoDaConta` devolve o `Protocolo` em análise ou já respondido:** O campo `contestacao`
      em `SituacaoDaConta.suspensao` devolve o `Protocolo` da contestação vinculada à suspensão em
      vigor, quer ela esteja em análise (`resolvido_em` nulo) ou já respondida pela Equipe Frila. O
      resultado da análise de suporte não é exposto no app (RN07, RF24) e a tela mantém a exibição do
      protocolo original para acompanhamento. O campo só é nulo se nenhuma contestação foi enviada para
      a suspensão em vigor.
    - **`409 contestacao_ja_aberta` em `contestarSuspensao`:** O erro `409` cobre os dois casos:
      impede nova contestação tanto quando a contestação da suspensão em vigor estiver em análise
      quanto quando já tiver sido respondida pela Equipe Frila.
    - **Sem alteração de schema:** A estrutura de `SituacaoDaConta` e de `Protocolo` permanece
      inalterada.

    **Versão 0.2.35, de 05/10/2026.** Reenvio idempotente de cancelamento pós-queda de rede (decisão
    de produto de 05/10/2026 sobre o cartão pVvubZJy, opção A). Em condições de conectividade instável,
    o cliente pode reenviar com segurança a chamada de cancelamento sem receber erro de conflito.

    - **`cancelar_posicao` e `cancelar_vaga` idempotentes para o mesmo autor:** Repetir a chamada
      pelo **mesmo autor** em uma posição ou vaga já cancelada por ele próprio devolve `200` com o
      objeto já cancelado, em vez de `409 posicao_nao_cancelavel` ou `409 vaga_encerrada`. Nenhum
      efeito colateral é duplicado no reenvio: não há nova ocorrência, nova penalidade na taxa de
      comparecimento, nova notificação para a contraparte ou criação de nova posição reaberta.
    - **O que continua sendo `409`:**
      - Cancelar posição aberta sem confirmação (`409 posicao_nao_cancelavel`).
      - Cancelar posição de turno já em andamento ou cumprido (`409 posicao_nao_cancelavel`).
      - Cancelar o que foi cancelado pela contraparte ou por outro autor (`409 posicao_nao_cancelavel`
        ou `409 vaga_encerrada`).
      - Cancelar vaga já encerrada por horário (`409 vaga_encerrada`).
    - **O que continua sendo `404` / `403` / `422`:** Cancelar o que não é seu (recurso inexistente
      ou sem visibilidade para o usuário) continua respondendo `404 nao_encontrado`, sem permissão
      continua `403 sem_permissao` e perfil trocado responde `422 perfil_incompativel`.

    **Versão 0.2.34, de 03/10/2026.** Só documentação: o contrato passa a declarar os status que o
    servidor já devolve e que as operações não listavam. Eles foram medidos na auditoria app ×
    contrato de 03/10 contra o `develop` do frila-backend (`14adec8`), seguindo cada RPC, as
    funções que ela chama e os gatilhos do banco. Nenhum comportamento muda, e nenhum cliente
    precisa mudar para continuar funcionando; quem trata só os status declarados passa a saber de
    casos que já aconteciam.

    - **Conta suspensa (RN13).** Resposta comum `ContaSuspensa` (`403 sem_permissao` com
      `details: conta_suspensa`) nas 14 operações que exigem conta ativa e não declaravam 403,
      inclusive `retirar_candidatura` e `minhas_candidaturas` (aprovado em 02/10). As que já
      declaravam 403 apontam para `SemPermissao`, que ganha o mesmo exemplo.
    - **Parâmetro nulo.** Resposta comum `ParametroObrigatorio` (`422 campo_obrigatorio`, com o
      nome do parâmetro em `details`) em `contato_do_turno`, `confirmar_checkin_manual` e
      `painel_estabelecimento`. Onde a operação também recusa por regra, vale `RegraRecusou`.
    - **Cancelamentos.** `cancelar_posicao` e `cancelar_vaga` declaram o `422` do motivo
      (`campo_obrigatorio` com menos de 3 caracteres, `campo_invalido` quando o filtro da diretriz
      1.2 recusa, os dois com `details: motivo`) e o `404 nao_encontrado`.
    - **Status que faltavam.** `409 contestacao_ja_aberta` em `contestar_suspensao`; `404` em
      `fazer_checkin`, `fazer_checkout`, `confirmar_checkin_manual` e `criterios_de_notificacao`;
      `422` em `vagas_abertas`, `detalhe_vaga`, `criterios_de_notificacao`,
      `pedir_revisao_despacho`, `incluir_na_equipe` e `remover_da_equipe`; `405` e `422` em
      `exportar-turnos`; `404` e `405` em `exportar-meus-dados`, com a resposta comum
      `MetodoNaoPermitido`. O catálogo de `contestacao_ja_aberta` passa a dizer que a contestação
      já respondida também conta: o servidor recusa a segunda contestação da mesma suspensão.
    - **O 409 de `fazer_checkin` fica, agora explicado.** Check-in em posição já cancelada é
      `409 vaga_encerrada` com `details: posicao_cancelada`, pelo gatilho
      `turno_checkin_nunca_em_posicao_cancelada` do banco.

    O `500 erro_interno` das Edge Functions continua fora, como nas demais operações: é falha do
    servidor, e não uma resposta que o cliente trate.

    **Versão 0.2.33, de 03/10/2026.** `MeusDados` passa a declarar as sete coleções que faltavam
    para a exportação cobrir todo dado do titular (cartão nUpPFCpM, IrtkCWDz, RF25, UC16, LGPD art. 18),
    e `contato_do_turno` passa a exigir conta ativa (B10, RF25, RNF08). Sete tabelas guardam dado
    pessoal e não tinham lugar no schema: `candidaturas`, `ocorrencias`, `bloqueios`, `notificacoes`,
    `despachos`, `equipe_confianca` e `pedido_de_exclusao`.

    **Os sete são obrigatórios.** Eles nasceram opcionais nesta mudança, enquanto
    `privado.meus_dados` devolvia só as nove chaves das versões anteriores, e passam a `required`
    porque a implementação os devolve: medido na migração
    `20261003060000_meus_dados_sete_colecoes.sql`, a função monta as dezesseis chaves, e o teste
    `440_exportar_meus_dados` exige cada uma. Um campo opcional que o servidor sempre manda é um
    campo que o cliente trata com um caminho de nulo que nunca acontece, e os três clientes geram
    o modelo deste arquivo.

    **Esta versão e a implementação entram juntas.** O contrato que exige sete campos que o backend
    publicado não manda reprova o portão do contrato para todo mundo, e não só para quem mexeu na
    exportação.

    - **`candidaturas`**: array de `Candidatura`, o mesmo objeto de `/rpc/minhas_candidaturas`.
      Inclui as retiradas, recusadas e expiradas — o estado final faz parte do registro. Ganha
      `turno_id` junto (da 0.2.32).
    - **`ocorrencias`**: os registros em que o titular é autor ou alvo (denúncia, contestação,
      revisão de despacho, atendimento e suspensão). `motivo` vem só quando ele é o autor, ou
      quando o tipo é `suspensao` — o motivo é da Equipe Frila e ele já o lê em
      `/rpc/situacao_da_conta`. Quando ele é o alvo de uma denúncia, o texto foi escrito por
      outra pessoa, e devolvê-lo aqui abriria pela porta da portabilidade o que RF26 e RN07
      fecham. Sem `resultado`: o que o titular precisa saber do próprio caso é se ele foi
      resolvido, e `resolvido_em` diz.
    - **`bloqueios`**: quem o titular bloqueou (RF26), no mesmo par `alvo_tipo` + `alvo_id` que
      `/rpc/bloquear` devolve, e não o id de conta da outra parte. Só os que ele criou: saber que
      foi bloqueado é exatamente o que RF26 esconde.
    - **`notificacoes`**: os avisos endereçados à conta do titular (0.2.14). Sem a mecânica de
      entrega: nada de token de aparelho, contagem de tentativas ou erro devolvido pelo provedor
      de push (RN15).
    - **`despachos`**: o registro de ter sido considerado para uma vaga (RF18, RN05). Uma linha por
      vaga, com `reaberta`.
    - **`equipe_confianca`**: as casas que puseram o titular na equipe de confiança (RF18). Só o
      lado do profissional: a equipe das casas que o titular administra é dado dos profissionais
      dela, não dele.
    - **`pedido_de_exclusao`**: o pedido de exclusão de conta, quando existe (RF25), ou `null`.
    - **`TipoNotificacao`**: enum com os 18 tipos de aviso, para gerar o modelo de `notificacoes`.
    - **`contato_do_turno` exige conta ativa (B10, RF25, RNF08):** token de conta encerrada ou
      anonimizada não acessa telefones nem dados de contato da contraparte, respondendo
      `401 nao_autenticado` (o mesmo status já declarado e documentado na tabela de recusas). A checagem
      roda no início da função antes de qualquer leitura no banco, impedindo vazamento de dados
      pessoais por JWTs emitidos antes da exclusão.
    - **`MeusDados.turnos`** usa o mesmo `Turno` e já traz `estado`, `avaliacao` (0.2.31) e
      `cancelamento` (0.2.32) incorporados.

