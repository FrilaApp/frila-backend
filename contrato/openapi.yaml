    **Versão 0.2.11, de 24/09/2026.** `cancelar_posicao` e `cancelar_vaga` foram
    implementadas.

    - **`409 posicao_nao_cancelavel`**, código novo: a posição não está confirmada.
      Aberta não tem o que cancelar; cumprida ou já cancelada não volta atrás.
    - **O motivo passa pelo filtro da diretriz 1.2** e recusa com `422 campo_invalido`,
      `details: motivo`. Ele vai para a tela da outra parte, como qualquer texto livre.
    - **Quem não é nenhum dos dois lados recebe `404`**, e não `403` — o mesmo critério
