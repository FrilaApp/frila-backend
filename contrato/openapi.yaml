openapi: 3.1.0
info:
  title: Frila API
  version: 0.2.73
  summary: Contrato entre o app do Frila, em iOS, Android e web, e o backend no Supabase.
  description: |
    Contrato escrito **antes** do backend (decisão B16, 21/09/2026), para que iOS, Android e web
    sejam construídos em paralelo contra a mesma especificação. É a fonte de onde saem os modelos
    de cada cliente. Regras, requisitos e casos de uso citados (RN, RF, UC) estão no Documento de
    Requisitos v1.5.0; o esquema do banco, na Modelagem de Banco de Dados.

    ## Como o contrato funciona no Supabase

    - **Quase tudo é função RPC.** Cada operação que carrega regra de negócio — publicar, candidatar,
      confirmar, check-in, avaliar, denunciar — é uma função no Postgres, chamada em
      `POST /rest/v1/rpc/<nome>` (leituras em `GET`). A regra é escrita uma vez, no banco, e vale igual
      para os três clientes. Os apps não escrevem direto nas tabelas.
    - **Leitura sob Row Level Security; escrita só por função.** Toda tabela do produto tem política
      de leitura, e nenhuma tem política de escrita para os clientes. As duas tabelas de operação,
      `entrada_demonstracao` e `pedido_de_exclusao`, não têm política nenhuma: ninguém as lê pela API. As funções que gravam são `SECURITY DEFINER`:
      conferem por dentro quem chama, o perfil (RN25) e o papel, e só então escrevem. O que é da outra
      parte (perfil público, contato) também sai por função, só com as colunas permitidas. As políticas
      estão na Modelagem de Banco de Dados.
    - **Três portas.** `rest/v1` (tabelas e RPC), `auth/v1` (Supabase Auth, pelo SDK) e `functions/v1`
      (Edge Functions, só onde o Postgres não basta: arquivos de exportação e exclusão de conta).
    - **O despacho não aparece aqui.** Notificar os elegíveis, agrupar, respeitar o teto, lembrar,
      alertar e fechar o modo seleção é trabalho do agendador (`pg_cron` + fila `pgmq` + Edge
      Function), fora da requisição (B15). Os clientes só registram o dispositivo e recebem o push.

    ## Convenções

    | Convenção | Regra |
    |---|---|
    | Dinheiro | Inteiro em centavos: `"valor_centavos": 12000` (RN18). Nunca `120.00` |
    | Tempo | UTC em ISO-8601: `"inicio_em": "2026-09-19T21:00:00Z"` (RN18). O fuso `America/Sao_Paulo` é da tela |
    | Identificadores | `uuid` |
    | Nomes | `snake_case`, iguais às colunas do banco |
    | Idempotência | Reenviar a mesma escrita devolve o mesmo resultado. Onde há chave natural (candidatura por vaga e profissional, check-in por turno, avaliação por turno e lado, bloqueio por par, cancelamento pelo mesmo autor), ela basta. `publicar_vaga` e `denunciar`, que não têm chave natural, recebem `chave` (uuid gerado pelo app) |
    | Versão | Mudança incompatível vira função nova (`publicar_vaga_v2`); a antiga continua no ar enquanto houver app antigo na loja |

    ## Erros

    O envelope é o do PostgREST: `code`, `message`, `details` e `hint`. Nas recusas de regra de
    negócio, **`code` é um código estável em `snake_case`**, que o cliente compara sem traduzir;
    `details` traz o motivo complementar, também estável, quando houver; `message` é texto para log e
    nunca vai para a tela. As funções levantam o erro por um auxiliar único:

    ```sql
    create or replace function erro(status int, codigo text, motivo text default null)
    returns void language plpgsql as $$
    begin
      raise sqlstate 'PGRST' using
        message = json_build_object('code', codigo, 'message', codigo,
                                    'details', motivo, 'hint', null)::text,
        detail  = json_build_object('status', status,
                                  'headers', json_build_object())::text;
    end $$;
    ```

    `headers` é obrigatório no `detail`: sem ele o PostgREST responde `500 PGRST121` no
    lugar do status que a regra levantou, e toda recusa de regra de negócio chega ao app
    como erro interno. A 0.2.0 trazia o trecho sem essa chave.

    | HTTP | `code` | Quando |
    |---|---|---|
    | 401 | `nao_autenticado`, `PGRST301` e afins | Token ausente, expirado, inválido ou de conta já encerrada/anonimizada (RF25) |
    | 403 | `sem_permissao` | Autenticado, mas sem papel para a ação (RF21); ou profissional sem turno verificado prévio na casa ao incluir na equipe (UC11). `details`: `conta_suspensa` quando a conta está suspensa e a ação exige conta ativa (RN13), ou `sem_turno_cumprido` (UC11) |
    | 403 | `contato_expirado` | Contato pedido depois de 7 dias do fim do turno (RN10) |
    | 404 | `nao_encontrado` | O recurso não existe ou não é visível para quem pede (inclui bloqueio, RF26, e vaga ocultada pela moderação da Equipe Frila, diretriz 1.2) |
    | 409 | `posicao_ja_preenchida` | Alguém chegou antes (RN19). **Funcionamento normal no modo urgência** |
    | 409 | `vaga_encerrada` | A vaga fechou, já começou ou foi cancelada por outro autor. Reenvio pelo mesmo contratante autor do cancelamento devolve 200 (0.2.35). Posição reaberta por atraso: a partir de `fim_em - 1 h` |
    | 409 | `checkin_pendente` | Check-out ou confirmação de um turno que ainda não teve check-in. O código diz qual é o passo que falta |
    | 409 | `checkin_ja_confirmado` | Confirmação de um check-in geolocalizado, que já nasceu verificado. Desde a 0.2.68, também o código pedido ou lido num turno com a presença já verificada; desde a 0.2.69, a confirmação manual de turno verificado pelo código |
    | 409 | `codigo_bloqueado` | Check-in por código bloqueado no turno (0.2.68); `details`: `temporario` (3 tentativas erradas: espere o bloqueio) ou `encerrado` (2 bloqueios: o código fecha para o turno e vale a confirmação manual) |
    | 409 | `posicao_nao_cancelavel` | A posição não está confirmada: aberta não tem o que cancelar, cumprida não volta atrás, ou posição cancelada pela outra parte. Passar do horário de início não basta: a posição confirmada continua cancelável (0.2.48). Reenvio pelo mesmo autor devolve 200 (0.2.35) |
    | 409 | `candidatura_indisponivel` | A candidatura foi retirada, expirou ou já foi escolhida |
    | 409 | `avaliacao_ja_registrada` | Já existe avaliação **deste lado** do turno, com outra resposta — de quem chama ou de outro membro do mesmo estabelecimento |
    | 409 | `conta_existente`, `documento_ja_cadastrado` | Cadastro repetido |
    | 409 | `administrador_unico` | Exclusão de conta de quem é o único administrador (UC16) |
    | 409 | `perfil_ja_existe` | `criar_perfil_profissional` numa conta que já tem perfil. Conflito, e não sobrescrita: sobrescrever apagaria a grade de quem tocasse duas vezes no botão |
    | 409 | `verificacao_indisponivel` | A verificação de identidade não aceita a ação agora; `details`: `em_analise` ou `aprovada` (pedir upload), `aprovada` ou `sem_envio_solicitado` (confirmar envio) (RN14) |
    | 409 | `contestacao_ja_aberta` | Já existe contestação para a suspensão em vigor ou para o despacho, em análise ou já respondida (RF24, RF27) |
    | 422 | `campo_obrigatorio` | Falta campo exigido; `details` diz qual (na vaga, RN02) |
    | 422 | `cursor_invalido` | Cursor de outra lista, vencido ou adulterado (0.2.56) |
    | 409 | `chamada_ja_aberta` | O par estabelecimento e profissional já tem chamada aberta (0.2.55, RN34) |
    | 409 | `chamada_indisponivel` | Responder ou cancelar chamada que não está aberta; `details`: `aceita`, `recusada`, `expirada`, `cancelada` ou `encerrada` (0.2.55) |
    | 409 | `recorrencia_nao_confirmada` | 3ª chamada da mesma casa pessoa física ao mesmo profissional em 7 dias sem `confirmo_recorrencia: true` (0.2.55, RN45) |
    | 422 | `profissional_indisponivel` | A chamada fura preferência ou limite do profissional; `details`: `nao_aceita_chamadas`, `antecedencia_insuficiente`, `agenda_cheia`, `pausado`, `par_em_pausa` ou `par_bloqueado_temporariamente` (0.2.55, RN30, RN33, RN34; os três últimos listados na 0.2.67). `pausa_por_recusas` foi listado na 0.2.55, mas o servidor não o devolve |
    | 422 | `limite_de_chamadas` | Limite do estabelecimento; `details`: `por_vaga`, `abertas`, `por_dia` ou `conta_nova` (0.2.55, RN34) |
    | 403 | `sem_permissao` + `recurso_desligado` | O recurso está desligado no servidor (`ConfiguracaoDoApp.recursos`, 0.2.54, RN46) |
    | 409 | `midia_indisponivel` | `pedir_nova_analise_midia` em mídia que não está `recusada` nem `nao_publicada`; `details: estado_invalido` ou `expurgada` (0.2.54) |
    | 422 | `midia_invalida` | Mídia recusada na entrada; `details`: `formato`, `tamanho`, `metadados` (tipo pelo cabeçalho ou EXIF presente), `limite_atingido` ou `tipo_indisponivel` (0.2.54) |
    | 422 | `funcao_nao_marcada` | `definir_servicos` com função que o profissional não marcou no perfil (0.2.53, RN27) |
    | 422 | `campo_invalido` | O campo veio, e o valor é recusado pela regra; `details` diz qual campo. Distinto de `campo_obrigatorio`, que é ausência — a tela destaca o mesmo campo, com texto diferente |
    | 422 | `intervalo_maximo_excedido` | Intervalo entre `de` e `ate` maior que 30 dias na exportação de turnos (pd7zOS5P) |
    | 422 | `menor_de_idade` | Nascimento com menos de 18 anos (RN20) |
    | 422 | `perfil_incompativel` | A ação é do outro perfil: conta de contratante criando perfil de profissional, ou conta de profissional cadastrando estabelecimento (RN25) |
    | 422 | `selecao_sem_antecedencia` | Modo seleção em vaga que começa em menos de 24 h (RN24) |
    | 422 | `republicacao_indisponivel` | `republicar_posicoes_restantes` não pode republicar; `details` diz o motivo: `nao_e_selecao`, `selecao_em_curso`, `vaga_cancelada`, `ja_comecou`, `sem_posicoes_restantes` ou `ja_republicada` (0.2.41) |
    | 422 | `vaga_oculta` | A vaga foi ocultada pela moderação da Equipe Frila (diretriz 1.2): não se escolhe candidato nela nem se republica a partir dela até ser reexibida |
    | 422 | `horario_invalido` | Fim antes do início, ou turno no passado |
    | 422 | `inelegivel` | `details`: `turno_sobreposto` (RN21), `perfil_suspenso` (RN13) ou `funcao_incompativel` (RN05) |
    | 422 | `avaliacao_indisponivel` | `details`: `antes_do_fim` ou `sem_presenca_verificada` (RN07) |
    | 422 | `fora_da_janela` | Check-in ou check-out fora da janela que a regra permite para o turno (RN22) |
    | 422 | `codigo_invalido` | Código de check-in recusado (0.2.68): errado, vencido, de outro turno ou lido a mais de 100 m. Um código só, sem `details`, para não dizer a quem tenta qual foi o motivo |
    | 422 | `a_caminho_fora_da_janela` | Chamada de `avisar_a_caminho` fora da janela permitida (de 3 h antes até 15 min depois do início do turno) (US14, RF12) |
    | 422 | `registro_no_futuro` | Instante de check-in ou check-out adiante do relógio do servidor. O relógio que vale é o do servidor, nunca o do aparelho |
    | 422 | `reabertura_antes_da_tolerancia` | Reabrir por atraso antes dos 15 minutos (D06) |
    | 422 | `sem_suspensao_ativa` | Contestação sem suspensão em vigor (RF24) |
    | 422 | `evidencia_incompleta` | `confirmar_envio_verificacao` sem todas as partes no bucket; `details`: `frente`, `verso` ou `selfie`, a primeira que falta (RN14) |
    | 429 | `limite_excedido` | Limite de requisições |

    ## Estado

    **Versão 0.2.73, de 09/11/2026.** Múltiplos membros por estabelecimento com papéis (RF21, US24).
    - **`POST /rpc/convidar_membro`**: gera convite para novo membro do estabelecimento com token
      opaco de uso único e validade de 7 dias. Exige ser administrador do estabelecimento.
    - **`POST /rpc/aceitar_convite_membro`**: consome o token de convite e vincula o usuário autenticado
      (perfil contratante) ao estabelecimento com o papel designado (administrador ou operador).
    - **`POST /rpc/remover_membro`**: remove membro da equipe do estabelecimento. Bloqueia a remoção
      do último administrador (`422 ultimo_administrador`).
    - **`POST /rpc/transferir_administracao`**: promove outro membro do estabelecimento para o papel de
      administrador. Exige ser administrador atual.

    **Versão 0.2.72, de 09/11/2026.** Equipe de confiança: autoexclusão do profissional e expurgo após 5 anos sem turnos juntos.
    - **`POST /rpc/sair_da_equipe`**: o profissional sai voluntariamente da equipe de confiança de um
      estabelecimento (LGPD art. 18, direito de autoexclusão). Sem penalidade nem aviso ao estabelecimento.
      Exige perfil profissional ativo.
    - **Expurgo após 5 anos sem turnos juntos:** a rotina diária de retenção remove vínculos da equipe de
      confiança onde o último turno verificado/cumprido entre o profissional e o estabelecimento ocorreu há
      mais de 5 anos (ou onde a data de inclusão tem mais de 5 anos e não houve nenhum turno nos últimos 5 anos).

    **Versão 0.2.71, de 09/11/2026.** Denúncia feita na chamada leva o `chamada_id` (CD-S13, cartão
    AGkBFg9a):
    - **`chamada_id` em `/rpc/denunciar` (opcional):** associa a denúncia à chamada direta. A chamada
      deve existir e envolver tanto o denunciante quanto o alvo (`alvo_tipo` + `alvo_id`); caso
      contrário, recusa com `422 campo_invalido` (`details: chamada_id`). O servidor grava apenas a
      referência em `public.ocorrencia` (RN15, nenhum recado ou texto é duplicado). Denúncias sem
      `chamada_id` continuam funcionando como antes.

    **Versão 0.2.70, de 08/11/2026.** Só descrição, no check-in por código. Nenhum campo, operação,
    status ou código de erro novo:
    - **A guarda dos registros do código em `MeusDados.checkins_por_codigo`:** os 90 dias contam do
      mais tarde entre o fim do turno e o fim da contestação. Conta a contestação do turno, quando
      existir, e a de suspensão do profissional, valendo a mais tarde; qualquer uma aberta segura os
      registros. A 0.2.68 falava só da contestação do turno, que hoje nenhuma operação registra. É a
      regra que a Modelagem já descreve e que o `frila-backend` #459 aplica.
    - **Fica para depois:** o espelho no backend, junto com a exportação de `checkins_por_codigo`.

    **Versão 0.2.69, de 08/11/2026.** Só descrição, aditiva, no check-in por código. Nenhum campo,
    operação, status ou código de erro novo:
    - **`confirmar_checkin_manual` depois do código:** turno com a presença já verificada pelo código
      (`tipo: codigo`) também recusa `409 checkin_ja_confirmado`, e a hora da validação não muda. O
      servidor já recusa assim todo check-in que não é `manual`; a 0.2.69 só o escreve.
    - **`validar_codigo_checkin` sem resposta:** se a resposta se perder (timeout), o app não repete
      sozinho; relê o turno e deixa a pessoa digitar de novo. A tentativa errada é gravada no
      servidor, e a repetição automática contaria outra e anteciparia o bloqueio.
    - **Fica para depois:** o espelho no backend, junto com a trava do turno em
      `confirmar_checkin_manual`.

    **Versão 0.2.68, de 08/11/2026.** Check-in por código: a casa mostra um código (QR e 6 dígitos)
    e o profissional lê, quando o GPS não basta ou quando a localização dá sinal de falsa (RN22,
    RN46). Desenho, decisões e pontos a confirmar em `arquitetura/desenho-checkin-por-codigo-v1.2.md`.
    Nada disto está implementado no backend nem no app. Tudo é aditivo:
    - **Duas operações novas, atrás da chave `checkin_por_codigo`:** `gerar_codigo_checkin` (o
      membro da casa gera ou revê o código do turno) e `validar_codigo_checkin` (o profissional manda
      o código lido e a distância medida no toque). Com a chave desligada para o estabelecimento do
      turno, as duas respondem `403 sem_permissao` (`recurso_desligado`) sem tocar em dado.
    - **`TipoRegistro` ganha `codigo`:** presença verificada pela leitura do código da casa. Com
      `codigo`, `checkin_confirmado_em` é a hora da validação, pelo relógio do servidor.
    - **`fazer_checkin` aceita `sinais` e devolve `codigo_exigido` e `codigo_disponivel`, os três
      opcionais.** Com sinal suspeito, a presença não é verificada pelo GPS, mesmo a até 200 m, e
      espera a casa: código ou confirmação manual. Sem `sinais`, como mandam o app 1.0 e o 1.1, o
      check-in segue exatamente como hoje.
    - **`RecursosDoApp` ganha `checkin_por_codigo`**, com a regra da 0.2.65 (chave e versão mínima
      por plataforma).
    - **Erros novos:** `422 codigo_invalido` e `409 codigo_bloqueado` (`temporario` ou `encerrado`).
    - **`MeusDados` ganha `checkins_por_codigo` (opcional):** na exportação do profissional, por
      turno, o "código exigido", a marca de confiança baixa e as tentativas (hora, resultado e
      faixa da leitura). A exportação de quem opera a casa não traz (LGPD, art. 18; regra da
      Bússola, 08/11).
    - **Por que não é `_v2`:** nenhum campo existente muda de forma, e o valor novo em resposta
      (`codigo`) já é tolerado pelo app publicado: o iOS 1.0 e o 1.1 leem tipo desconhecido como
      `manual` ou nulo, e o Android compara texto (evidência no desenho).
    - **Não muda:** o check-in a até 200 m sem sinal suspeito, `confirmar_checkin_manual`, o
      check-out, a janela de 60 minutos, o aviso `turno_nao_verificado` e os textos dos avisos
      `checkin` e `checkin_manual_pendente`, que continuam sem dado pessoal. Nenhum tipo de aviso novo.
    - **Fica para depois:** a migração e as RPCs no backend, com o pgTAP dos critérios de aceite e o
      espelho deste contrato (as duas operações ficam em `PENDENTES` do `contrato_responde.py` até
      existirem); a tela da casa e a leitura no iOS; o Android, antes de qualquer casa com Android
      no piloto.

    **Versão 0.2.67, de 08/11/2026.** Só formato e descrição. Nenhum campo, operação, status ou
    código de erro novo:
    - **`configuracao_do_app.versao_app` aceita até quatro partes**, como `versao_minima` e
      `registrar_dispositivo.versao_app`. Era até três (0.2.65). Assim a mesma versão vale igual na
      abertura e no aparelho: um app `1.2.0.1` não pode ser chamado e receber o aviso de chamada com
      a tela escondida.
    - **Aparelho sem versão, ou com ela fora do formato, conta como antigo**, nos avisos `chamada_*`
      e em `registrar_dispositivo.versao_app`.
    - **Os `details` de `profissional_indisponivel` que o servidor já devolvia** e o contrato não
      listava: `pausado`, `par_em_pausa` e `par_bloqueado_temporariamente` (em `chamar_profissional`).
      `pausa_por_recusas`, listado na 0.2.55, o servidor nunca devolveu: a pausa de 24 h depois de
      recusa é `par_em_pausa`, e a de 30 dias é `par_bloqueado_temporariamente`.
    - **`configuracao_do_app` sai do RNF12**, que é a disponibilidade e a janela do Prod, e não a
      atualização do app. O Documento de Requisitos v1.5.0 não tem requisito próprio de atualização
      do app; fica a RN46.
    - **Até o espelho no backend**, que vem antes de ligar as chaves, o servidor ainda aceita só três
      partes em `configuracao_do_app` (`frila-backend` `20261108150000:83`) e no mínimo guardado (o
      CHECK de `20261108150000:41`). Até lá, `1.2.0.1` conta como ausente, e os recursos vêm `false`.

    **Versão 0.2.66, de 08/11/2026.** Só descrição; nenhum campo, operação, status ou código muda.
    Fecha o portão (c) do corte por versão da 0.2.65 (desenho em
    `arquitetura/desenho-recursos-por-versao-do-app-v1.2.md`):
    - O aviso `chamada_*` só sai para aparelho cuja `versao_app` (de `registrar_dispositivo`)
      alcança a versão mínima de `chamada_direta` na plataforma do aparelho, a mesma que decide
      `recursos.chamada_direta` em `configuracao_do_app`. Antes era "versão que suporta a chamada"
      (0.2.56), sem número.
    - `chamar_profissional` recusa com `422 profissional_indisponivel` (`nao_aceita_chamadas`) quando
      o profissional não tem nenhum aparelho nessa versão mínima. É a recusa genérica que já existe,
      e ela não revela o motivo, como nas preferências e no vínculo. Sem permissão de notificação o
      app não registra o aparelho, então esse profissional não pode ser chamado.
    - Por que é só descrição: o código e o `details` já existem, e nenhum cliente precisa mudar.

    **Versão 0.2.65, de 08/11/2026.** Recursos por versão do app, para a revisão da 1.2 não ligar os
    recursos de quem está na 1.1 (desenho em `arquitetura/desenho-recursos-por-versao-do-app-v1.2.md`):
    - **`configuracao_do_app` ganha o parâmetro opcional `versao_app`.** Os três campos de
      `RecursosDoApp` (`foto_de_perfil`, `chamada_direta` e `perfil_rico`) só vêm `true` quando o
      servidor liga a chave **e** a `versao_app` informada alcança a versão mínima que o servidor
      guarda para aquele recurso naquela plataforma. Sem `versao_app`, com ela malformada, abaixo do
      mínimo ou sem mínimo configurado para a plataforma, vêm `false`. O mínimo não sai na resposta.
    - **Por que não é `_v2`:** a forma da resposta não muda; só o valor fica mais restrito, e só para
      quem não manda a versão. O app 1.0 e o 1.1 não mandam e foram revisados pela loja com os três
      recursos desligados, e é exatamente `false` nos três o que passam a receber em qualquer caso.
    - **Não muda:** as operações atrás das chaves recusam com `403 sem_permissao`
      (`recurso_desligado`) só pela chave (RN46), porque não conhecem a versão do app. Nenhum campo,
      status ou código de erro novo.
    - **Fica para depois:** o espelho no backend (a função e o mínimo por chave e plataforma) e o
      envio de `versao_app` pelo app 1.2, com um teste de contrato que confira o corpo.

    **Versão 0.2.64, de 08/11/2026.** Só descrição; nenhum campo, operação, status ou código muda.
    O endereço de suporte citado em `abrir_suporte` passa a ser `suporte@frilabr.com`: o domínio
