  schemas:

    # ── Tipos base

    Uuid:
      type: string
      format: uuid
    Instante:
      type: string
      format: date-time
      description: UTC, ISO-8601 (RN18).
      example: '2026-09-19T21:00:00Z'
    Centavos:
      type: integer
      minimum: 1
      description: Valor em centavos de real, inteiro (RN18).
      example: 12000
    Telefone:
      type: string
      pattern: '^\+[1-9][0-9]{7,14}$'
      description: Formato E.164.
      example: '+5561999990000'
    Coordenada:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      example:
        latitude: -15.7942
        longitude: -47.8822
    ChaveDeIdempotencia:
      type: string
      format: uuid
      description: Gerada pelo app uma vez por ação. Reenviar com a mesma chave devolve o mesmo resultado.
    HoraDoDia:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: Hora local em America/Sao_Paulo, HH:MM.
      example: '18:00'

    # ── Enumerações (iguais às do banco)

    ModoPreenchimento:
      type: string
      enum: [urgencia, selecao]
    EstadoVaga:
      type: string
      enum: [publicada, preenchida, encerrada, cancelada]
    EstadoPosicao:
      type: string
      enum: [aberta, confirmada, cumprida, cancelada]
    EstadoCandidatura:
      type: string
      enum: [pendente, aceita, recusada, retirada, expirada]
    TipoRegistro:
      type: string
      enum: [geolocalizado, manual, codigo]
      description: |
        Como a presença foi provada no check-in. `codigo` (0.2.68): o profissional leu o código que a
        casa mostrou (`validar_codigo_checkin`); o check-in nasce `manual` e passa a `codigo` na
        validação. `fazer_checkout` devolve o tipo do check-in, e por isso também pode trazer
        `codigo`.

        Cliente que não conhece um valor não quebra. O app publicado já se comporta assim: o iOS 1.0
        e o 1.1 leem valor desconhecido como `manual` ou nulo, e o Android compara texto.
    Verificacao:
      type: string
      enum: [pendente, verificado, nao_verificado]
      description: |
        `verificado` só com prova: check-in geolocalizado a até 200 m, manual confirmado pelo
        contratante, ou código da casa validado (0.2.68). `nao_verificado` não conta a favor nem
        contra na taxa de comparecimento (RN22).
    TipoEstabelecimento:
      type: string
      enum: [food_service, evento, varejo, logistica, servico_domestico, outro]
    PapelMembro:
      type: string
      enum: [administrador, operador]
    MotivoDenuncia:
      type: string
      enum: [assedio, discriminacao, risco_seguranca, outro]
    CategoriaSuporte:
      description: |
        O motivo do chamado de suporte, escolhido pela pessoa na tela do turno (UC14). Não é o
        texto do pedido: esse vai só no e-mail.
      type: string
      enum: [endereco, atraso, conduta, seguranca, outro]
    Plataforma:
      type: string
      enum: [ios, android, web]
    TipoDeAlvo:
      description: |
        O que o par `alvo_tipo` + `alvo_id` aponta. São os mesmos dois valores de
        `PerfilPublico.tipo`, e é essa igualdade que permite ao app denunciar ou bloquear com o
        que ele já tem na tela.
      type: string
      enum: [profissional, estabelecimento]
    TipoNotificacao:
      description: |
        Os avisos que o sistema endereça a uma conta. Descritos em prosa desde a 0.2.14 (e mais
        dois na 0.2.24), declarados como enum a partir da 0.2.33 porque `MeusDados.notificacoes`
        os devolve e o cliente precisa gerar o modelo. Só `vaga` e `vagas_agrupadas` contam para o
        teto da RN23.

        **Textos do push do modo seleção (0.2.38, aprovados em 07/10/2026).** O corpo do push é
        montado no servidor com a vaga e sai sem dado pessoal do candidato (RN15). Quando falta o dado
        entre `{}`, vale o texto sem ele.

        | Tipo | Quem recebe | Título | Corpo |
        |---|---|---|---|
        | `confirmacao` (vaga em seleção) | Profissional escolhido | Você foi escolhido | O estabelecimento escolheu você para o turno. Toque para ver os detalhes e o contato. |
        | `candidatura_recusada` | Candidato não escolhido, quando a vaga encheu | Vaga preenchida | O estabelecimento escolheu outro profissional para esta vaga. Sua candidatura foi encerrada e você está livre para outras vagas. |
        | `selecao_encerrada` | Candidato pendente | Vaga fechada sem escolha | O prazo de escolha terminou e sua candidatura foi encerrada. Você está livre para outras vagas. |
        | `selecao_encerrada` | Membro do estabelecimento | Prazo de escolha encerrado | A vaga de {função} fechou sem todas as posições preenchidas. Toque para republicar em urgência. |
        | `selecao_lembrete` | Membro do estabelecimento | Candidatos esperando sua escolha | {N} candidato(s) para a vaga de {função}. Escolha até {dd/mm às HH:MM}, quando a vaga fecha. |

        **Chamadas diretas (0.2.55).** Sem nome de pessoa e sem contato no texto; payload só com
        `tipo`, `chamada_id` e `vaga_id`. Não contam no teto da RN23. Só saem para aparelho cuja
        `versao_app` alcança a versão mínima de `chamada_direta` da plataforma (0.2.66; era "que
        suporta a chamada", 0.2.56), comparando parte a parte e completando com zeros, como em
        `configuracao_do_app`. Aparelho sem versão, ou com ela fora do formato, conta como antigo
        (0.2.67).

        | Tipo | Quem recebe | Título | Corpo |
        |---|---|---|---|
        | `chamada_recebida` | Profissional | Nova chamada | Um contratante quer você para {serviço} em {dd/mm}. Responda até {HH:MM}. |
        | `chamada_lembrete` | Profissional | Chamada esperando resposta | A chamada para {serviço} em {dd/mm} vence às {HH:MM}. |
        | `chamada_aceita` | Membros da casa | Chamada aceita | A chamada para {serviço} em {dd/mm} foi aceita. Toque para ver o turno. |
        | `chamada_recusada` | Membros da casa | Chamada recusada | A chamada para {serviço} em {dd/mm} foi recusada. Você pode chamar outra pessoa ou publicar para todos. |
        | `chamada_expirada` | Os dois | Chamada vencida | A chamada para {serviço} em {dd/mm} venceu sem resposta. |
        | `chamada_cancelada` | Profissional | Chamada cancelada | O contratante cancelou a chamada para {serviço} em {dd/mm}. Nada muda para você. |
        | `chamada_encerrada` | Profissional | Trabalho preenchido | O contratante fechou com outra pessoa. Nada muda para você. |

        **Foto de perfil (0.2.54).** `midia_recusada` vai ao dono quando a foto não é publicada
        (`recusada` ou `nao_publicada`), só com `tipo` e `midia_id`. Título "Foto não publicada";
        corpo "Use uma foto sua, com rosto visível, sem texto nem dados pessoais."

        **Turno não verificado (0.2.62, RN22).** Disparado aos dois lados quando o turno encerra sem confirmação de presença (check-in manual não confirmado ou sem check-in).

        | Tipo | Quem recebe | Título | Corpo |
        |---|---|---|---|
        | `turno_nao_verificado` | Ambos os lados | Turno não verificado | A presença no turno não foi confirmada dentro do prazo. O turno foi encerrado como não verificado. |

        **Check-in por código (0.2.68).** Nenhum tipo novo, e os textos não mudam. No app 1.2,
        `checkin_manual_pendente` abre a tela da casa já com o código; `checkin` também avisa os
        membros da presença verificada pelo código.

        `confirmacao` em vaga de urgência mantém o texto de sempre ("Turno confirmado"). O
        `selecao_lembrete` sai uma vez por vaga: faltando 6 horas ou menos para o prazo de escolha
        (RN24) e com ao menos uma candidatura pendente. O horário é o do fuso America/Sao_Paulo (RN18).
      type: string
      enum: [vaga, vagas_agrupadas, vaga_sem_elegiveis, confirmacao, lembrete_24h, lembrete_3h,
             inicio_sem_checkin, atraso_15min, fim_sem_checkout, vaga_vazia, checkin,
             checkin_manual_pendente, cancelamento, avaliacao_disponivel, suspensao, reativacao,
             candidatura_recusada, selecao_encerrada, selecao_lembrete, midia_recusada,
             chamada_recebida, chamada_lembrete, chamada_aceita, chamada_recusada,
             chamada_expirada, chamada_cancelada, chamada_encerrada, turno_nao_verificado]
    EventoDeTelemetria:
      description: |
        Dicionário fechado. Acrescentar evento é mudança de contrato, com versão subindo — é o
        preço de garantir que nenhum campo aberto entre por aqui (RN15).
      type: string
      enum:
        - app_aberto
        - cadastro_concluido
        - permissao_push_negada
        - vaga_vista
        - vaga_detalhe_aberto
        - candidatura_enviada
        - candidatura_retirada
        - checkin_tentado
        - checkin_concluido
        - checkout_concluido
        - avaliacao_enviada
        - contato_aberto
        - acao_enfileirada_offline
        - atualizacao_obrigatoria_exibida
    PerfilConta:
      type: string
      enum: [profissional, contratante]
      description: Perfil da conta, escolhido no cadastro e fixo (RN25).
    EstadoConta:
      type: string
      enum: [ativa, suspensa]

    # ── Erro

    Erro:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Código estável em `snake_case` nas recusas de regra (ver o catálogo na descrição da API), ou
            código do PostgREST/Postgres nos demais casos (`PGRST301`, `23505`...).
        message:
          type: string
          description: Texto para log. Nunca exibir na tela.
        details:
          type: [string, 'null']
          description: 'Motivo complementar estável, quando houver (por exemplo, `turno_sobreposto`).'
        hint:
          type: [string, 'null']

    # ── Conta e perfis

    Sessao:
      type: object
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: bearer
        expires_in:
          type: integer
          description: Segundos até o token de acesso expirar.
        refresh_token:
          type: string
        user:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            email:
              type: string
              format: email
    Usuario:
      type: object
      required: [id, perfil, nome, telefone, email, nascimento, estado]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        perfil:
          $ref: '#/components/schemas/PerfilConta'
        nome:
          type: string
        telefone:
          $ref: '#/components/schemas/Telefone'
        email:
          type: string
          format: email
        nascimento:
          type: string
          format: date
        estado:
          $ref: '#/components/schemas/EstadoConta'
    JanelaDeDisponibilidade:
      type: object
      required: [dia_semana, hora_inicio, hora_fim]
      description: |
        Janela semanal em que o profissional aceita trabalhar. `hora_fim` pode ser menor que
        `hora_inicio`: 18:00–02:00 atravessa a meia-noite e é a janela mais comum do setor.
      properties:
        dia_semana:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = domingo.
        hora_inicio:
          $ref: '#/components/schemas/HoraDoDia'
        hora_fim:
          $ref: '#/components/schemas/HoraDoDia'
    DadosDoPerfilProfissional:
      type: object
      required: [funcoes, ponto_base, disponibilidades]
      properties:
        funcoes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        ponto_base:
          $ref: '#/components/schemas/Coordenada'
        disponibilidades:
          type: array
          items:
            $ref: '#/components/schemas/JanelaDeDisponibilidade'
    AlteracaoDoPerfilProfissional:
      type: object
      minProperties: 1
      properties:
        funcoes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        ponto_base:
          $ref: '#/components/schemas/Coordenada'
        disponibilidades:
          type: array
          items:
            $ref: '#/components/schemas/JanelaDeDisponibilidade'
    PerfilProfissional:
      type: object
      required: [id, usuario_id, funcoes, ponto_base, disponibilidades, reputacao]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        usuario_id:
          $ref: '#/components/schemas/Uuid'
        funcoes:
          type: array
          items:
            $ref: '#/components/schemas/Funcao'
        ponto_base:
          $ref: '#/components/schemas/Coordenada'
        disponibilidades:
          type: array
          items:
            $ref: '#/components/schemas/JanelaDeDisponibilidade'
        reputacao:
          $ref: '#/components/schemas/Reputacao'
    UnidadePreco:
      type: string
      description: 0.2.53. Unidade do preço de um serviço (RN27).
      enum: [hora, diaria, evento, pacote, por_pessoa, a_combinar]
    LevaMaterial:
      type: string
      enum: [sim, nao, depende]
    ExperienciaFaixa:
      type: string
      enum: [menos_de_1_ano, de_1_a_3_anos, de_3_a_5_anos, de_5_a_10_anos, mais_de_10_anos]
    Idioma:
      type: string
      enum: [portugues, ingles, espanhol, libras, outro]
    ApresentacaoDoProfissional:
      type: object
      minProperties: 1
      description: 0.2.53. Corpo de `atualizar_apresentacao_profissional`. `null` limpa o campo.
      properties:
        apresentacao:
          oneOf:
            - type: string
              maxLength: 600
            - type: 'null'
        onde_trabalhei:
          oneOf:
            - type: string
              maxLength: 400
            - type: 'null'
        experiencia_faixa:
          oneOf:
            - $ref: '#/components/schemas/ExperienciaFaixa'
            - type: 'null'
        cursos:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 80
        idiomas:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Idioma'
    ServicoOferecido:
      type: object
      required: [funcao_id, unidade]
      description: |
        0.2.53. Um serviço do perfil, na entrada de `definir_servicos`. As regras de cada unidade
        estão na descrição da operação.
      properties:
        funcao_id:
          $ref: '#/components/schemas/Uuid'
        unidade:
          $ref: '#/components/schemas/UnidadePreco'
        valor_centavos:
          oneOf:
            - type: integer
              minimum: 1000
              maximum: 1000000
            - type: 'null'
        valor_max_centavos:
          oneOf:
            - type: integer
              minimum: 1000
              maximum: 1000000
            - type: 'null'
        horas_incluidas:
          type: integer
          minimum: 4
          maximum: 12
        minimo_horas:
          type: integer
          minimum: 1
          maximum: 12
        duracao_tipica_h:
          type: integer
          minimum: 1
          maximum: 24
        ate_pessoas:
          type: integer
          minimum: 1
          maximum: 2000
        minimo_pessoas:
          type: integer
          minimum: 1
          maximum: 2000
        descricao_pacote:
          type: string
          maxLength: 120
        inclui:
          type: string
          maxLength: 300
        leva_material:
          $ref: '#/components/schemas/LevaMaterial'
        especialidade_ids:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
    ServicoNoPerfil:
      type: object
      required: [funcao, unidade]
      description: 0.2.53. Um serviço como sai nas leituras, com a função e as especialidades por extenso.
      properties:
        funcao:
          $ref: '#/components/schemas/Funcao'
        unidade:
          $ref: '#/components/schemas/UnidadePreco'
        valor_centavos:
          oneOf:
            - type: integer
            - type: 'null'
        valor_max_centavos:
          oneOf:
            - type: integer
            - type: 'null'
        horas_incluidas:
          type: integer
        minimo_horas:
          type: integer
        duracao_tipica_h:
          type: integer
        ate_pessoas:
          type: integer
        minimo_pessoas:
          type: integer
        descricao_pacote:
          type: string
        inclui:
          type: string
        leva_material:
          $ref: '#/components/schemas/LevaMaterial'
        especialidades:
          type: array
          items:
            $ref: '#/components/schemas/Especialidade'
    PerfilProfissionalDetalhado:
      description: 0.2.53. `PerfilProfissional` mais os campos opcionais do perfil rico, para o próprio dono.
      allOf:
        - $ref: '#/components/schemas/PerfilProfissional'
        - type: object
          required: [servicos, regioes, atende_todo_df, cursos, idiomas]
          properties:
            apresentacao:
              oneOf:
                - type: string
                - type: 'null'
            onde_trabalhei:
              oneOf:
                - type: string
                - type: 'null'
            experiencia_faixa:
              oneOf:
                - $ref: '#/components/schemas/ExperienciaFaixa'
                - type: 'null'
            cursos:
              type: array
              items:
                type: string
            idiomas:
              type: array
              items:
                $ref: '#/components/schemas/Idioma'
            servicos:
              type: array
              items:
                $ref: '#/components/schemas/ServicoNoPerfil'
            regioes:
              type: array
              items:
                $ref: '#/components/schemas/RegiaoAdministrativa'
            atende_todo_df:
              type: boolean
            preferencia_chamadas:
              description: 0.2.56. Opcional; ausente vale os padrões de `PreferenciaChamadas`.
              $ref: '#/components/schemas/PreferenciaChamadas'
    RecursosDoApp:
      type: object
      description: |
        0.2.54. Interruptores do servidor. Ausente, ou campo ausente, vale `false`. O app esconde a
        entrada do recurso desligado, e o servidor recusa as operações dele com
        `403 sem_permissao` (`recurso_desligado`) independentemente do app (RN46).

        0.2.65. O valor depende também da `versao_app` que o app manda a `configuracao_do_app`: sem
        ela, malformada, abaixo da versão mínima do recurso na plataforma ou sem mínimo configurado,
        o campo vem `false`. A recusa das operações continua seguindo só a chave, porque a operação
        não conhece a versão do app.
      properties:
        foto_de_perfil:
          type: boolean
        chamada_direta:
          type: boolean
        perfil_rico:
          description: |
            0.2.60. Perfil rico da F2 (0.2.53): "Editar serviços", apresentação e regiões atendidas.
            Desligado, o app não mostra essas telas, as quatro operações da F2
            (`atualizar_apresentacao_profissional`, `definir_servicos`, `definir_regioes_atendidas`
            e `meu_perfil_detalhado`) respondem `403 sem_permissao` (`recurso_desligado`) e os campos
            opcionais do perfil rico em `PerfilPublico` vêm omitidos. Um servidor que ainda não
            conhece a chave não a manda, e ausente vale `false`.
          type: boolean
        checkin_por_codigo:
          description: |
            0.2.68. Check-in por código: a tela da casa com o código e a leitura no app do
            profissional. Segue a regra da 0.2.65 (chave e versão mínima por plataforma). Mesmo com
            `true`, o estabelecimento de um turno pode estar fora do piloto: aí as duas operações
            respondem `403 sem_permissao` (`recurso_desligado`) e `fazer_checkin` devolve
            `codigo_disponivel: false`. Ausente vale `false`.
          type: boolean
    TipoMidia:
      type: string
      description: |
        0.2.54, revisto na 0.2.61. A única mídia do Frila é a foto de perfil: `foto_perfil`, uma por
        dono (profissional ou estabelecimento). Outro valor é recusado com `422 midia_invalida`
        (`tipo_indisponivel`).
      enum: [foto_perfil]
    EstadoMidia:
      type: string
      description: |
        0.2.54. `enviando` → `em_analise` → `aprovada`, `recusada` ou `nao_publicada` (a análise
        falhou 4 vezes); `aprovada` → `ocultada` (duas denúncias, até a reanálise) ou `removida`
        (pelo dono). Só `aprovada` aparece para outra conta.
      enum: [enviando, em_analise, aprovada, recusada, nao_publicada, ocultada, removida]
    MotivoRecusaMidia:
      type: string
      description: |
        0.2.54. Motivo genérico, que o app traduz em texto amigável: `foto_inadequada` ("use uma
        foto sua, com rosto visível"), `texto_ou_dado_pessoal` ("sem texto, telefone, Pix, QR code
        ou documento"), `nao_e_pessoa_ou_servico` e `nao_analisada` ("não conseguimos analisar
        agora, tente de novo"). O código fino da análise fica só no registro interno.
      enum: [foto_inadequada, texto_ou_dado_pessoal, nao_e_pessoa_ou_servico, nao_analisada]
    Midia:
      type: object
      required: [id, tipo, estado, pode_pedir_nova_analise]
      description: |
        0.2.54. A mídia como o dono a vê. Nunca traz o caminho no Storage, o código fino do motivo,
        o classificador usado nem o hash da imagem.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tipo:
          $ref: '#/components/schemas/TipoMidia'
        estado:
          $ref: '#/components/schemas/EstadoMidia'
        motivo_recusa:
          oneOf:
            - $ref: '#/components/schemas/MotivoRecusaMidia'
            - type: 'null'
        pode_pedir_nova_analise:
          type: boolean
          description: "`true` quando a mídia está `recusada` ou `nao_publicada`, a nova análise ainda não foi pedida e o arquivo ainda não foi expurgado; `false` depois do expurgo (o app oferece enviar outra foto)."
        url:
          description: URL assinada por 1 h, só quando `aprovada`.
          type: string
          format: uri
        estabelecimento_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        enviada_em:
          $ref: '#/components/schemas/Instante'
        decidida_em:
          oneOf:
            - $ref: '#/components/schemas/Instante'
            - type: 'null'
    OrigemVaga:
      type: string
      description: 0.2.55. De onde a vaga nasceu. Ausente nas respostas vale `publicacao`.
      enum: [publicacao, chamada_direta]
    EstadoChamada:
      type: string
      description: |
        0.2.55. `aberta` → `aceita` · `recusada` · `expirada` · `cancelada` (pelo contratante ou por
        suspensão do profissional) · `encerrada` (outra chamada do trabalho foi aceita, a vaga foi
        cancelada ou convertida, o membro que chamou foi suspenso, ou houve bloqueio). Desfechos finais.
      enum: [aberta, aceita, recusada, expirada, cancelada, encerrada]
    MotivoRecusaChamada:
      type: string
      description: 0.2.55. Categoria opcional da recusa, vista pelo contratante; sem texto livre (RN33).
      enum: [agenda, distancia, valor, tipo_de_servico, outro]
    Chamada:
      type: object
      required: [id, vaga_id, profissional_id, estabelecimento_id, estado, expira_em, criada_em]
      description: |
        0.2.55. Uma chamada. Valor, horário e local moram na vaga; a leitura para o profissional
        antes do aceite é `detalhe_chamada` (0.2.56), sem endereço.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        vaga_id:
          $ref: '#/components/schemas/Uuid'
        profissional_id:
          $ref: '#/components/schemas/Uuid'
        estabelecimento_id:
          $ref: '#/components/schemas/Uuid'
        estado:
          $ref: '#/components/schemas/EstadoChamada'
        recado:
          oneOf:
            - type: string
              maxLength: 300
            - type: 'null'
        motivo_recusa:
          oneOf:
            - $ref: '#/components/schemas/MotivoRecusaChamada'
            - type: 'null'
        expira_em:
          $ref: '#/components/schemas/Instante'
        respondida_em:
          oneOf:
            - $ref: '#/components/schemas/Instante'
            - type: 'null'
        criada_em:
          $ref: '#/components/schemas/Instante'
    ResultadoChamada:
      type: object
      required: [chamada]
      description: |
        0.2.55. Resposta de `responder_chamada`. No aceite, traz o turno e o que a RN36 libera
        (`local`, `ponto`, `responsavel_local`); na recusa, só a chamada. Nunca telefone.
      properties:
        chamada:
          $ref: '#/components/schemas/Chamada'
        turno_id:
          $ref: '#/components/schemas/Uuid'
        local:
          type: string
        ponto:
          $ref: '#/components/schemas/Coordenada'
        responsavel_local:
          type: string
    PreferenciaChamadas:
      type: object
      required: [aceita_de_quem_ja_trabalhou, antecedencia_minima_h, aceita_de]
      description: 0.2.56. Preferências do profissional para receber chamadas (RN30, RN43).
      properties:
        aceita_de_quem_ja_trabalhou:
          type: boolean
        pausado_ate:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        antecedencia_minima_h:
          type: integer
          enum: [2, 6, 24, 48]
        aceita_de:
          type: string
          enum: [todos, so_cnpj]
    ChamadaResumo:
      description: 0.2.56. A chamada com o essencial do trabalho, para listas.
      allOf:
        - $ref: '#/components/schemas/Chamada'
        - type: object
          required: [funcao, inicio_em, fim_em, valor_centavos, outra_parte]
          properties:
            funcao:
              $ref: '#/components/schemas/Funcao'
            inicio_em:
              $ref: '#/components/schemas/Instante'
            fim_em:
              $ref: '#/components/schemas/Instante'
            valor_centavos:
              $ref: '#/components/schemas/Centavos'
            outra_parte:
              description: O perfil público da outra parte (o estabelecimento, para o profissional; o profissional, para a casa).
              $ref: '#/components/schemas/PerfilPublico'
    ChamadaDetalhe:
      description: |
        0.2.56. A chamada por inteiro. `local`, `ponto` e `responsavel_local` só vêm com
        `estado = aceita`; antes, o profissional decide pela região e pela faixa de distância.
      allOf:
        - $ref: '#/components/schemas/ChamadaResumo'
        - type: object
          required: [regiao_administrativa, inclui_refeicao, inclui_transporte, exige_material_proprio]
          properties:
            tipo_estabelecimento:
              $ref: '#/components/schemas/TipoEstabelecimento'
            conta_nova:
              description: "`true` quando o estabelecimento ainda não tem nenhum turno cumprido (RN43)."
              type: boolean
            regiao_administrativa:
              type: string
            distancia_faixa:
              description: Do ponto base do profissional ao local; só para o profissional.
              type: string
              enum: [ate_5_km, de_5_a_15_km, mais_de_15_km]
            inclui_refeicao:
              type: boolean
            inclui_transporte:
              type: boolean
            exige_material_proprio:
              type: boolean
            local:
              type: string
            ponto:
              $ref: '#/components/schemas/Coordenada'
            responsavel_local:
              type: string
            turno_id:
              $ref: '#/components/schemas/Uuid'
    CriteriosDeNotificacao:
      type: object
      required: [funcoes, disponibilidades, distancia_maxima_km, equipes_de_confianca, notificacoes_no_maximo_a_cada_min]
      properties:
        funcoes:
          type: array
          items:
            $ref: '#/components/schemas/Funcao'
        disponibilidades:
          type: array
          items:
            $ref: '#/components/schemas/JanelaDeDisponibilidade'
        distancia_maxima_km:
          type: number
          description: Parâmetro do sistema; hoje, 15 (RN05).
          example: 15
        equipes_de_confianca:
          type: array
          description: Estabelecimentos cuja equipe de confiança inclui o profissional; as vagas deles chegam mesmo além dos 15 km.
          items:
            type: object
            required: [estabelecimento_id, nome]
            properties:
              estabelecimento_id:
                $ref: '#/components/schemas/Uuid'
              nome:
                type: string
        notificacoes_no_maximo_a_cada_min:
          type: integer
          description: Teto de RN23; hoje, 30.
          example: 30
        contestacao:
          description: |
            0.2.62 (RF27). Protocolo da contestação do despacho vinculada ao titular, quer esteja em
            análise ou já respondida pela Equipe Frila (0.2.37). Nulo se o titular ainda não contestou.
            Permite ao app exibir o protocolo para acompanhamento no perfil e desativar o formulário.
          oneOf:
            - $ref: '#/components/schemas/Protocolo'
            - type: 'null'
    NovoEstabelecimento:
      type: object
      required: [nome, documento, tipo, endereco, regiao_administrativa, ponto]
      properties:
        nome:
          type: string
        documento:
          type: string
          pattern: '^([0-9]{11}|[0-9]{14})$'
          description: CPF (11) ou CNPJ (14), só dígitos.
        tipo:
          $ref: '#/components/schemas/TipoEstabelecimento'
        endereco:
          type: string
          description: Logradouro, número e complemento.
        regiao_administrativa:
          type: string
          description: "Região Administrativa do Distrito Federal onde o estabelecimento fica (ex.: Plano Piloto, Águas Claras, Taguatinga)."
          example: Plano Piloto
        ponto:
          $ref: '#/components/schemas/Coordenada'
    Estabelecimento:
      type: object
      required: [id, nome, documento, tipo, endereco, regiao_administrativa, ponto, papel]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nome:
          type: string
        documento:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoEstabelecimento'
        endereco:
          type: string
        regiao_administrativa:
          type: string
          description: "Região Administrativa do Distrito Federal onde o estabelecimento fica (ex.: Plano Piloto, Águas Claras, Taguatinga)."
          example: Plano Piloto
        ponto:
          $ref: '#/components/schemas/Coordenada'
        papel:
          $ref: '#/components/schemas/PapelMembro'
    MeuEstabelecimento:
      type: object
      required: [id, nome, tipo, endereco, regiao_administrativa, ponto, papel]
      description: |
        O cadastro do estabelecimento como um membro o lê em `/rpc/meu_estabelecimento` (0.2.29):
        os campos do `Estabelecimento`, **sem o `documento`**. O CNPJ ou CPF só aparece na resposta
        de `/rpc/cadastrar_estabelecimento`, para quem acabou de informá-lo (RN15).
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nome:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoEstabelecimento'
        endereco:
          type: string
          description: Logradouro, número e complemento. É o que preenche `NovaVaga.local`.
        regiao_administrativa:
          type: string
          description: "Região Administrativa do Distrito Federal onde o estabelecimento fica (ex.: Plano Piloto, Águas Claras, Taguatinga)."
          example: Plano Piloto
        ponto:
          $ref: '#/components/schemas/Coordenada'
        papel:
          description: O papel de quem chama neste estabelecimento.
          $ref: '#/components/schemas/PapelMembro'
      example:
        id: 5b0f6c1e-2a47-4f0b-9d3e-8c1a7e2f4b10
        nome: Bar da Lia
        tipo: food_service
        endereco: CLS 408, Bloco B, Loja 12
        regiao_administrativa: Plano Piloto
        ponto:
          latitude: -15.7942
          longitude: -47.8822
        papel: operador
    MembroDaEquipe:
      type: object
      required: [estabelecimento_id, profissional_id]
      properties:
        estabelecimento_id:
          $ref: '#/components/schemas/Uuid'
        profissional_id:
          $ref: '#/components/schemas/Uuid'
    Funcao:
      type: object
      required: [id, nome, categoria]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nome:
          type: string
          example: garçom
        categoria:
          type: string
          description: |
            Nome da categoria. Desde a 0.2.52 o catálogo tem também "Casa" e "Festa e eventos
            sociais", além das sete de antes.
          example: Salão
        formato_padrao:
          description: |
            0.2.52. Só muda o que a tela sugere: `turno` (horário fechado, preço por hora ou diária)
            ou `servico` (resultado contratado, fim previsto, preço por diária, evento, pacote ou
            pessoa). Não muda regra: todo trabalho tem início e fim (RN44). Ausente vale `turno`.
          type: string
          enum: [turno, servico]
        grupo_busca:
          description: |
            0.2.52. Funções com o mesmo valor aparecem juntas na busca (ex.: garçom e garçonete).
            Nulo quando a função não tem par.
          oneOf:
            - type: string
            - type: 'null'
        dica_perfil:
          description: 0.2.52. Dica para o profissional descrever este serviço no perfil. Nula quando não há.
          oneOf:
            - type: string
            - type: 'null'
        exemplo_perfil:
          description: 0.2.52. Exemplo de "Sobre mim" para este serviço. Nulo quando não há.
          oneOf:
            - type: string
            - type: 'null'
    RegiaoAdministrativa:
      type: object
      required: [id, numero, nome]
      description: 0.2.52. Região administrativa do DF, do catálogo fechado (RN44).
      properties:
        id:
          type: integer
          minimum: 1
          description: O número da região em arábico (RA I = 1).
          example: 1
        numero:
          type: string
          description: Número romano oficial.
          example: I
        nome:
          type: string
          example: Plano Piloto
        ativo:
          type: boolean
    Especialidade:
      type: object
      required: [id, funcao_id, nome]
      description: 0.2.52. Especialidade fechada de uma função (RN44).
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        funcao_id:
          $ref: '#/components/schemas/Uuid'
        nome:
          type: string
          example: pós-obra
        ativo:
          type: boolean

    # ── Reputação

    Reputacao:
      type: object
      required: [positivas, total, taxa_comparecimento, turnos_considerados, turnos_realizados]
      description: |
        Sempre exibida com o denominador: "7 de 7 chamariam de novo" (RN08). Não existe média, e não
        deve existir (RN07). Sem histórico, `total = 0` e taxa nula: a tela mostra "Sem histórico".
      properties:
        positivas:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        taxa_comparecimento:
          description: |
            Turnos com presença ÷ turnos confirmados. Falta = não aparecer ou cancelar com menos de 24 h.
            Ficam fora: candidatura não escolhida, cancelamento com mais de 24 h e turno não verificado.
            Só para profissional; aparece no perfil e não altera quem recebe notificação (RN06).
          oneOf:
            - type: number
              minimum: 0
              maximum: 1
            - type: 'null'
        turnos_considerados:
          description: |
            O **denominador** da taxa de comparecimento: turnos confirmados cujo desfecho já é
            conhecido. Entram o turno cumprido e a falta; ficam de fora a candidatura não
            escolhida, o cancelamento com mais de 24 h de antecedência e o turno ainda por
            acontecer. É este número que `taxa_comparecimento` divide.
          type: integer
          minimum: 0
        turnos_realizados:
          description: |
            Turnos que a pessoa **cumpriu**, com presença verificada. É o número que a tela mostra
            como experiência ("12 turnos realizados"), e não se confunde com `turnos_considerados`:
            quem faltou a dois de dez tem `turnos_realizados: 8` e `turnos_considerados: 10`.

            Os dois existem separados porque a tela usa um e a regra usa o outro, e um único campo
            chamado "turnos" seria lido como o que cada leitor precisasse naquele dia.
          type: integer
          minimum: 0
    PerfilPublico:
      type: object
      required: [id, tipo, nome, reputacao]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tipo:
          type: string
          enum: [profissional, estabelecimento]
        nome:
          type: string
        funcoes:
          type: array
          description: Só para profissional.
          items:
            type: string
        reputacao:
          $ref: '#/components/schemas/Reputacao'
        apresentacao:
          description: |
            0.2.53. Os campos a partir daqui são opcionais e só vêm para contratante com vínculo de
            leitura com o profissional (candidatura numa vaga da casa, turno entre eles ou equipe de
            confiança). Para qualquer outra conta, e para estabelecimento, são omitidos.
          oneOf:
            - type: string
              maxLength: 600
            - type: 'null'
        experiencia_faixa:
          oneOf:
            - $ref: '#/components/schemas/ExperienciaFaixa'
            - type: 'null'
        onde_trabalhei:
          oneOf:
            - type: string
              maxLength: 400
            - type: 'null'
        cursos:
          type: array
          items:
            type: string
            maxLength: 80
        idiomas:
          type: array
          items:
            $ref: '#/components/schemas/Idioma'
        servicos:
          type: array
          items:
            $ref: '#/components/schemas/ServicoNoPerfil'
        regioes:
          type: array
          items:
            $ref: '#/components/schemas/RegiaoAdministrativa'
        atende_todo_df:
          type: boolean
        foto_url:
          description: |
            0.2.54. URL assinada por 1 h da foto `aprovada` (miniatura de 320 px). Só vem para
            leitor com **vínculo de leitura**: foto de profissional, para contratante com
            candidatura numa vaga da casa, turno entre eles ou equipe de confiança; foto de
            estabelecimento, para profissional com candidatura, chamada ou turno com a casa. Sem
            vínculo, com `recursos.foto_de_perfil` desligado, sem foto aprovada, ou com o titular
            suspenso (RN13) ou com conta encerrada (RF25), o campo vem **ausente**, e os demais
            campos do perfil respondem exatamente como antes da 0.2.54.
          type: string
          format: uri
        foto_id:
          description: |
            0.2.54. Identificador opaco da foto exibida, com as mesmas condições de `foto_url`. É o
            que o app manda em `denunciar.midia_id` para denunciar a foto.
          $ref: '#/components/schemas/Uuid'
        no_frila_desde:
          description: 0.2.53. Mês e ano de criação do perfil, `AAAA-MM`.
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          example: 2026-10

    # ── Vagas

    NovaVaga:
      type: object
      required:
        - estabelecimento_id
        - funcao_id
        - inicio_em
        - fim_em
        - local
        - regiao_administrativa
        - ponto
        - valor_centavos
        - posicoes
        - inclui_refeicao
        - inclui_transporte
        - exige_material_proprio
        - responsavel_local
        - modo
        - chave
      description: Campos obrigatórios de RN02; traje, rateio e observações são opcionais.
      properties:
        estabelecimento_id:
          $ref: '#/components/schemas/Uuid'
        funcao_id:
          $ref: '#/components/schemas/Uuid'
        inicio_em:
          $ref: '#/components/schemas/Instante'
        fim_em:
          $ref: '#/components/schemas/Instante'
        local:
          type: string
          description: Endereço. Vem preenchido com o do estabelecimento.
        regiao_administrativa:
          type: string
          description: Região Administrativa do Distrito Federal onde o turno será executado. Vem preenchida com a do estabelecimento.
          example: Plano Piloto
        ponto:
          $ref: '#/components/schemas/Coordenada'
        valor_centavos:
          $ref: '#/components/schemas/Centavos'
        posicoes:
          type: integer
          minimum: 1
          maximum: 200
        inclui_refeicao:
          type: boolean
        inclui_transporte:
          type: boolean
        exige_material_proprio:
          type: boolean
          description: Sim = o profissional leva o material.
        responsavel_local:
          type: string
          description: Quem recebe o profissional no local.
        traje:
          type: [string, 'null']
        participa_rateio:
          type: [boolean, 'null']
          description: Participa do rateio dos 10% da taxa de serviço (Lei 13.419/2017).
        observacoes:
          type: [string, 'null']
        modo:
          $ref: '#/components/schemas/ModoPreenchimento'
        alerta_antecedencia_min:
          type: integer
          minimum: 1
          default: 180
          description: Janela crítica — minutos antes do início em que o contratante é alertado se a posição seguir vaga.
        chave:
          $ref: '#/components/schemas/ChaveDeIdempotencia'
    VagaPublicada:
      type: object
      required: [vaga_id, posicoes]
      properties:
        vaga_id:
          $ref: '#/components/schemas/Uuid'
        posicoes:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
    Inclusos:
      type: object
      required: [inclui_refeicao, inclui_transporte, exige_material_proprio]
      properties:
        inclui_refeicao:
          type: boolean
        inclui_transporte:
          type: boolean
        exige_material_proprio:
          type: boolean
    VagaNaLista:
      type: object
      required: [id, funcao, estabelecimento, inicio_em, fim_em, local, regiao_administrativa, distancia_km, valor_centavos, posicoes_abertas, inclusos, modo]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        funcao:
          $ref: '#/components/schemas/Funcao'
        estabelecimento:
          $ref: '#/components/schemas/PerfilPublico'
        inicio_em:
          $ref: '#/components/schemas/Instante'
        fim_em:
          $ref: '#/components/schemas/Instante'
        local:
          type: string
        regiao_administrativa:
          type: string
          description: Região Administrativa do Distrito Federal onde o turno será executado.
          example: Plano Piloto
        distancia_km:
          type: number
          minimum: 0
        valor_centavos:
          $ref: '#/components/schemas/Centavos'
        posicoes_abertas:
          type: integer
          minimum: 0
        inclusos:
          $ref: '#/components/schemas/Inclusos'
        modo:
          $ref: '#/components/schemas/ModoPreenchimento'
    Vaga:
      type: object
      required: [id, estabelecimento, funcao, inicio_em, fim_em, local, regiao_administrativa, ponto, valor_centavos, posicoes, posicoes_abertas, inclusos, responsavel_local, modo, estado, oculta, publicado_em]
      properties:
        origem:
          description: |
            0.2.55. `chamada_direta` na vaga criada por `chamar_profissional`; ausente vale
            `publicacao`. A vaga direta é `modo = urgencia`, nunca despachada nem listada.
          $ref: '#/components/schemas/OrigemVaga'
        vaga_origem_id:
          description: 0.2.55. Na vaga normal criada a partir de uma vaga direta, o id da direta.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        id:
          $ref: '#/components/schemas/Uuid'
        estabelecimento:
          $ref: '#/components/schemas/PerfilPublico'
        funcao:
          $ref: '#/components/schemas/Funcao'
        inicio_em:
          $ref: '#/components/schemas/Instante'
        fim_em:
          $ref: '#/components/schemas/Instante'
        local:
          type: string
        regiao_administrativa:
          type: string
          description: Região Administrativa do Distrito Federal onde o turno será executado.
          example: Plano Piloto
        ponto:
          $ref: '#/components/schemas/Coordenada'
        distancia_km:
          type: [number, 'null']
        valor_centavos:
          $ref: '#/components/schemas/Centavos'
        posicoes:
          type: integer
        posicoes_abertas:
          type: integer
        inclusos:
          $ref: '#/components/schemas/Inclusos'
        responsavel_local:
          type: string
        traje:
          type: [string, 'null']
        participa_rateio:
          type: [boolean, 'null']
        observacoes:
          type: [string, 'null']
        modo:
          $ref: '#/components/schemas/ModoPreenchimento'
        estado:
          $ref: '#/components/schemas/EstadoVaga'
        oculta:
          type: boolean
          description: |
            Verdadeiro quando a moderação da Equipe Frila ocultou a vaga (diretriz 1.2, 0.2.23). Só
            chega verdadeiro a quem ocupa posição ou tem candidatura nela; o `estado` não muda.
        publicado_em:
          $ref: '#/components/schemas/Instante'
    VagaDetalhe:
      $ref: '#/components/schemas/Vaga'
      description: Detalhe completo de uma vaga (mesmo schema de Vaga).
    VagaResumo:
      type: object
      required: [id, funcao, local, regiao_administrativa, inicio_em, fim_em, valor_centavos]
      properties:
        origem:
          description: |
            0.2.55. `chamada_direta` na vaga criada por `chamar_profissional`; ausente vale
            `publicacao`. A vaga direta é `modo = urgencia`, nunca despachada nem listada.
          $ref: '#/components/schemas/OrigemVaga'
        vaga_origem_id:
          description: 0.2.55. Na vaga normal criada a partir de uma vaga direta, o id da direta.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        id:
          $ref: '#/components/schemas/Uuid'
        funcao:
          type: string
        local:
          type: string
        regiao_administrativa:
          type: string
          description: Região Administrativa do Distrito Federal onde o turno será executado.
          example: Plano Piloto
        ponto:
          description: |
            Coordenadas geográficas exatas do estabelecimento onde o turno será executado (RN06, RN22, Cartão 72, v1.1).
            Presente em `/rpc/meus_turnos` para o profissional com turno confirmado ou verificado (LGPD art. 7º, V e VI),
            ou para membros do estabelecimento. Nos demais casos (ex.: turno cancelado, presença não verificada,
            ou em `/rpc/minhas_candidaturas` antes da confirmação), este campo é retornado nulo.
          oneOf:
            - $ref: '#/components/schemas/Coordenada'
            - type: 'null'
        inicio_em:
          $ref: '#/components/schemas/Instante'
        fim_em:
          $ref: '#/components/schemas/Instante'
        valor_centavos:
          $ref: '#/components/schemas/Centavos'
      example:
        id: 7b84c3e2-8e3b-4f9e-a0e2-1a2b3c4d5e6f
        funcao: Garçom
        local: CLN 201 Bloco B Loja 10, Asa Norte
        regiao_administrativa: Plano Piloto
        ponto:
          latitude: -15.7942
          longitude: -47.8822
        inicio_em: '2026-11-01T21:00:00Z'
        fim_em: '2026-11-02T03:00:00Z'
        valor_centavos: 15000

    # ── Candidatura e confirmação

    Contato:
      type: object
      required: [nome, telefone, whatsapp_url, visivel_ate]
      description: Liberado só depois da confirmação, até 7 dias depois do fim do turno (RN10).
      properties:
        nome:
          type: string
        telefone:
          $ref: '#/components/schemas/Telefone'
        whatsapp_url:
          type: string
          format: uri
        visivel_ate:
          $ref: '#/components/schemas/Instante'
    ResultadoCandidatura:
      type: object
      required: [estado, candidatura_id, posicao_id, turno_id]
      properties:
        estado:
          type: string
          enum: [confirmada, pendente]
          description: '`confirmada` no modo urgência; `pendente` no modo seleção.'
        candidatura_id:
          $ref: '#/components/schemas/Uuid'
        posicao_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        turno_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        contato:
          deprecated: true
          description: |
            Descontinuado na 0.2.49 (decisão de produto de 04/11/2026: o contato não é trocado
            pelo app). **Opcional e nulável:** o servidor atual ainda o preenche na confirmação em
            modo urgência; o servidor que parar de entregá-lo omite o campo ou manda `null`. O
            cliente trata ausente e nulo do mesmo jeito: não há contato a mostrar. Nulo já era o
            valor no modo seleção, antes da escolha.
          oneOf:
            - $ref: '#/components/schemas/Contato'
            - type: 'null'
    ResultadoConfirmacao:
      type: object
      required: [estado, posicao_id, turno_id]
      properties:
        estado:
          type: string
          const: confirmada
        posicao_id:
          $ref: '#/components/schemas/Uuid'
        turno_id:
          $ref: '#/components/schemas/Uuid'
        contato:
          deprecated: true
          description: |
            Descontinuado na 0.2.49 (decisão de produto de 04/11/2026: o contato não é trocado
            pelo app). **Opcional e nulável:** o servidor atual ainda o preenche; o servidor que
            parar de entregá-lo omite o campo ou manda `null`. O cliente trata ausente e nulo do
            mesmo jeito: não há contato a mostrar.
          oneOf:
            - $ref: '#/components/schemas/Contato'
            - type: 'null'
    Candidatura:
      type: object
      required: [id, vaga, estado, criada_em]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        vaga:
          $ref: '#/components/schemas/VagaResumo'
        estado:
          $ref: '#/components/schemas/EstadoCandidatura'
        criada_em:
          $ref: '#/components/schemas/Instante'
        turno_id:
          description: |
            O turno que nasceu desta candidatura (0.2.32). Só vem preenchido no estado `aceita`,
            e é o mesmo `turno_id` que `/rpc/candidatar` (modo urgência) ou
            `/rpc/escolher_candidato` (modo seleção) devolveu na confirmação. Nulo nos outros
            estados: `pendente`, `recusada`, `retirada` e `expirada`.

            O cancelamento do turno não muda a candidatura: ela segue `aceita`, com o `turno_id`
            do turno cancelado, e é `Turno.estado` que diz se o turno está de pé.

            Opcional: o servidor anterior à 0.2.32 não o manda. Ausente não é o mesmo que nulo: o
            cliente só afirma "não há turno" quando o campo vem nulo.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    Candidato:
      type: object
      required: [candidatura_id, profissional, criada_em]
      properties:
        candidatura_id:
          $ref: '#/components/schemas/Uuid'
        profissional:
          $ref: '#/components/schemas/PerfilPublico'
        criada_em:
          $ref: '#/components/schemas/Instante'
        da_equipe:
          description: |
            0.2.38. `true` se o profissional está na equipe de confiança do estabelecimento da vaga;
            a tela mostra o selo "da sua equipe". Não altera a ordem da lista (RN06). Ausente vale
            `false`.
          type: boolean

    # ── Turno

    RegistroDePresenca:
      type: object
      required: [turno_id, distancia_m, registrado_em]
      properties:
        turno_id:
          $ref: '#/components/schemas/Uuid'
        distancia_m:
          description: Distância até o endereço da vaga, medida no aparelho no momento do toque. Nulo quando não há localização.
          oneOf:
            - type: integer
              minimum: 0
            - type: 'null'
        registrado_em:
          $ref: '#/components/schemas/Instante'
    RegistroDeCheckin:
      description: |
        0.2.68. O corpo de `fazer_checkin`: `RegistroDePresenca` mais os `sinais` opcionais. O
        check-out continua com `RegistroDePresenca` e não aceita `sinais`.
      allOf:
        - $ref: '#/components/schemas/RegistroDePresenca'
        - type: object
          properties:
            sinais:
              $ref: '#/components/schemas/SinaisDoCheckin'
    SinaisDoCheckin:
      type: object
      required: [localizacao_simulada, precisao_m, salto_de_posicao]
      description: |
        0.2.68. O que o aparelho diz da leitura de localização do toque, para a proteção por risco.
        Nenhuma coordenada. O servidor usa os sinais na decisão e não os grava: guarda só se o código
        foi exigido. O app que manda `sinais` manda os três; sem `sinais`, o servidor entende app sem
        a proteção (1.0 e 1.1) e segue a regra de antes da 0.2.68.
      properties:
        localizacao_simulada:
          description: A leitura veio de fonte simulada por software (iOS `CLLocationSourceInformation.isSimulatedBySoftware`, Android `Location.isMock`).
          type: boolean
        precisao_m:
          description: Precisão horizontal da leitura, em metros inteiros (iOS `horizontalAccuracy`, Android `getAccuracy`). Nulo quando o aparelho não informa.
          oneOf:
            - type: integer
              minimum: 0
            - type: 'null'
        salto_de_posicao:
          description: Entre as leituras do mesmo toque, a posição saltou mais do que um deslocamento possível no intervalo.
          type: boolean
    ResultadoRegistro:
      type: object
      required: [turno_id, tipo, verificacao, registrado_em, distancia_m]
      properties:
        turno_id:
          $ref: '#/components/schemas/Uuid'
        tipo:
          $ref: '#/components/schemas/TipoRegistro'
        verificacao:
          $ref: '#/components/schemas/Verificacao'
        registrado_em:
          $ref: '#/components/schemas/Instante'
        distancia_m:
          oneOf:
            - type: integer
              minimum: 0
            - type: 'null'
        codigo_exigido:
          description: |
            0.2.68. Só em `fazer_checkin`. `true` quando o servidor recusou a verificação pelo GPS
            por sinal suspeito: a presença fica `pendente`, e a casa precisa atestar a chegada, pelo
            código ou pela confirmação manual. A tela não diz qual sinal pesou. Ausente vale
            `false`. O reenvio devolve o mesmo valor.
          type: boolean
        codigo_disponivel:
          description: |
            0.2.68. Só em `fazer_checkin`. `true` quando a presença está `pendente` e o caminho do
            código está aberto para o turno: chave ligada para o estabelecimento e caminho não
            encerrado por bloqueios. O app só oferece a leitura do código com `true`; sem ele, mostra
            a espera da confirmação manual, como hoje. Ausente vale `false`. No reenvio, vale o
            estado do momento.
          type: boolean
    CodigoDeCheckin:
      type: object
      required: [turno_id, codigo, expira_em, segundos_restantes]
      description: |
        0.2.68. O código de check-in em vigor, só para membro da casa dona do turno. O QR carrega
        exatamente `codigo`. Não aparece em nenhuma outra resposta, nem em aviso.
      properties:
        turno_id:
          $ref: '#/components/schemas/Uuid'
        codigo:
          type: string
          pattern: '^[0-9]{6}$'
          example: '482913'
        expira_em:
          $ref: '#/components/schemas/Instante'
        segundos_restantes:
          description: A validade que resta, contada pelo servidor no momento da resposta. Até 300.
          type: integer
          minimum: 0
          maximum: 300
    ResultadoACaminho:
      type: object
      required: [turno_id, a_caminho_em]
      description: Confirmação do registro de aviso "a caminho" pelo profissional do turno (US14).
      properties:
        turno_id:
          $ref: '#/components/schemas/Uuid'
        a_caminho_em:
          $ref: '#/components/schemas/Instante'
    Turno:
      type: object
      required: [id, posicao_id, vaga, contraparte, a_caminho_em, checkin_em, checkin_tipo, checkin_distancia_m, checkin_confirmado_em, checkout_em, checkout_distancia_m, verificacao, valor_acordado_centavos, pode_avaliar]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        posicao_id:
          $ref: '#/components/schemas/Uuid'
        vaga:
          $ref: '#/components/schemas/VagaResumo'
        contraparte:
          $ref: '#/components/schemas/PerfilPublico'
        contato_visivel_ate:
          deprecated: true
          description: |
            Descontinuado na 0.2.49 (decisão de produto de 04/11/2026: o contato não é trocado
            pelo app, e o prazo de 7 dias da RN10 perde o sentido). **Opcional e nulável:** o
            servidor atual ainda manda o fim previsto do turno mais 7 dias; o servidor que parar de
            entregar o contato omite o campo ou manda `null`. O cliente trata ausente e nulo do
            mesmo jeito: não há prazo a mostrar nem botão de contato a oferecer.
          oneOf:
            - $ref: '#/components/schemas/Instante'
            - type: 'null'
        a_caminho_em:
          oneOf:
            - $ref: '#/components/schemas/Instante'
            - type: 'null'
          description: Instante em que o profissional avisou que está a caminho do turno (US14). Nulo se ainda não avisou.
        checkin_em:
          oneOf:
            - $ref: '#/components/schemas/Instante'
            - type: 'null'
        checkin_tipo:
          oneOf:
            - $ref: '#/components/schemas/TipoRegistro'
            - type: 'null'
        checkin_distancia_m:
          type: [integer, 'null']
        checkin_confirmado_em:
          oneOf:
            - $ref: '#/components/schemas/Instante'
            - type: 'null'
        checkout_em:
          oneOf:
            - $ref: '#/components/schemas/Instante'
            - type: 'null'
        checkout_distancia_m:
          type: [integer, 'null']
        verificacao:
          $ref: '#/components/schemas/Verificacao'
        valor_acordado_centavos:
          $ref: '#/components/schemas/Centavos'
        pode_avaliar:
          type: boolean
          description: Verdadeiro depois do fim previsto, com presença verificada e sem avaliação deste lado ainda (RN07).
        estado:
          description: |
            O estado da posição deste turno (0.2.31), o mesmo campo de `PosicaoNoPainel.estado`:
            `confirmada` com o turno de pé, `cumprida` depois do fim com check-in, `cancelada`
            quando uma das partes cancelou, a casa reabriu por atraso, a vaga foi cancelada ou o
            turno terminou sem check-in. Nunca `aberta`: posição aberta não tem turno. Quem passa a
            `cumprida` ou fecha o turno sem check-in é o agendador, minutos depois do fim previsto;
            até lá o turno encerrado ainda vem `confirmada`.

            O turno cancelado continua em `/rpc/meus_turnos`, e é por este campo que a tela o
            distingue. Opcional: o servidor anterior à 0.2.31 não o manda, e o cliente trata a
            ausência como "o servidor ainda não diz", sem supor `confirmada`.
          $ref: '#/components/schemas/EstadoPosicao'
        avaliacao:
          description: |
            A avaliação que **este lado** do turno já deu (0.2.31), igual à resposta de
            `/rpc/avaliar`. Nulo enquanto este lado não avaliou. Para quem opera a casa é o voto da
            casa, dado por qualquer membro dela (um voto por lado). **Nunca** é a avaliação que a
            outra parte deu sobre quem chama: essa só aparece agregada, na reputação (RN07, RN08).
            Com `avaliacao` preenchida, `pode_avaliar` é falso.

            Opcional: o servidor anterior à 0.2.31 não o manda. Ausente não é o mesmo que nulo: o
            cliente só afirma "ainda não avaliou" quando o campo vem nulo.
          oneOf:
            - $ref: '#/components/schemas/Avaliacao'
            - type: 'null'
        cancelamento:
          description: |
            Por que este turno foi cancelado e se contou como falta (0.2.32, RN12). Vem preenchido
            quando `estado` é `cancelada`, e nulo nos outros estados. Não traz texto livre, para
            nenhum dos dois lados: o que a pessoa escreveu ao cancelar só sai no painel da casa
            (`PosicaoNoPainel.cancelamento.motivo`).

            Opcional: o servidor anterior à 0.2.32 não o manda. Ausente não é o mesmo que nulo.
          oneOf:
            - $ref: '#/components/schemas/CancelamentoDoTurno'
            - type: 'null'
    CancelamentoDoTurno:
      type: object
      required: [causa, falta, cancelada_em]
      description: |
        O cancelamento de um turno, como as duas partes o leem em `/rpc/meus_turnos` (0.2.32,
        RN12). É o `CancelamentoDaPosicao` do painel **sem o `motivo`**: o texto que a casa
        escreveu ao cancelar não vai ao profissional (decisão de produto de 02/10/2026). Por isso
        este schema não tem a propriedade, em vez de trazê-la nula. `causa`, `falta` e
        `cancelada_em` são os mesmos valores que o painel mostra para a mesma posição.

        O que o profissional lê em cada causa:

        - `profissional`: ele mesmo desistiu. `falta` diz se a desistência contou (menos de 24
          horas do início). O texto que ele escreveu não volta.
        - `estabelecimento`: a casa cancelou a posição ou a vaga inteira. Não conta falta.
        - `reabertura_por_atraso` e `no_show_sem_checkin`: sempre com `falta: true`.
        - `outro`: o turno saiu sem escolha de nenhuma das partes. Não conta falta.
      properties:
        causa:
          $ref: '#/components/schemas/CausaDoCancelamento'
        falta:
          type: boolean
          description: |
            Verdadeiro quando o cancelamento conta como falta do profissional na taxa de
            comparecimento (RN12). O mesmo valor de `CancelamentoDaPosicao.falta`.
        cancelada_em:
          $ref: '#/components/schemas/Instante'
      example:
        causa: estabelecimento
        falta: false
        cancelada_em: '2026-10-03T19:40:00Z'
    ResultadoCancelamento:
      type: object
      required: [posicao_id, falta, reaberta, nova_posicao_id]
      properties:
        posicao_id:
          $ref: '#/components/schemas/Uuid'
        falta:
          type: boolean
          description: Verdadeiro quando conta como falta do profissional (menos de 24 h, ou reabertura por atraso).
        reaberta:
          type: boolean
          description: Falso quando o início já passou e o turno ficou descoberto.
        nova_posicao_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    Avaliacao:
      type: object
      required: [turno_id, resposta, criada_em]
      properties:
        turno_id:
          $ref: '#/components/schemas/Uuid'
        resposta:
          type: boolean
        criada_em:
          $ref: '#/components/schemas/Instante'

    # ── Painel

    Painel:
      type: object
      required: [estabelecimento_id, vagas, checkins_pendentes]
      properties:
        estabelecimento_id:
          $ref: '#/components/schemas/Uuid'
        vagas:
          type: array
          items:
            $ref: '#/components/schemas/VagaNoPainel'
        checkins_pendentes:
          type: array
          description: |
            Turnos com check-in manual esperando a confirmação do contratante. Desde a 0.2.68,
            inclui o que espera o código, e o turno sai da lista quando o código é validado.
          items:
            $ref: '#/components/schemas/Uuid'
    VagaNoPainel:
      type: object
      required: [vaga, modo, estado, oculta, alerta_vaga_vazia, candidatos_pendentes, posicoes]
      properties:
        vaga:
          $ref: '#/components/schemas/VagaResumo'
        republicavel_em_urgencia:
          description: |
            0.2.41. Quantas posições `republicar_posicoes_restantes` republicaria agora, ou nulo
            quando a vaga não é republicável por esse caminho. A tela mostra "Republicar N posições
            em urgência" só quando é maior que zero. O servidor calcula com a mesma regra da
            operação, para o botão e a recusa nunca discordarem. Ausente vale nulo.
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
        modo:
          $ref: '#/components/schemas/ModoPreenchimento'
        estado:
          $ref: '#/components/schemas/EstadoVaga'
        oculta:
          type: boolean
          description: |
            Verdadeiro quando a moderação da Equipe Frila ocultou a vaga (diretriz 1.2, 0.2.23): fora
            da vitrine e do despacho, sem escolha de candidato e sem republicação, até a Equipe
            reexibi-la. A tela mostra "oculta pela Equipe"; o `estado` continua o do ciclo de vida.
        alerta_vaga_vazia:
          type: boolean
          description: Há posição aberta dentro da janela crítica.
        candidatos_pendentes:
          type: integer
          minimum: 0
        posicoes:
          type: array
          items:
            $ref: '#/components/schemas/PosicaoNoPainel'
    PosicaoNoPainel:
      type: object
      required: [id, estado, profissional, turno_id, verificacao, em_atraso, a_caminho_em]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        estado:
          $ref: '#/components/schemas/EstadoPosicao'
        profissional:
          oneOf:
            - $ref: '#/components/schemas/PerfilPublico'
            - type: 'null'
        turno_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        verificacao:
          oneOf:
            - $ref: '#/components/schemas/Verificacao'
            - type: 'null'
        em_atraso:
          type: boolean
          description: Passou 15 minutos do início sem check-in (D06); o contratante pode esperar ou reabrir.
        a_caminho_em:
          oneOf:
            - $ref: '#/components/schemas/Instante'
            - type: 'null'
          description: |
            Instante em que o profissional avisou estar a caminho do turno (US14). Nulo se ainda não
            avisou ou se a posição ainda não tem turno confirmado.
        checkin_em:
          description: |
            A hora do toque no check-in (0.2.31), o mesmo `Turno.checkin_em`. Nulo sem check-in ou
            sem turno. Com `checkin_tipo: manual`, é a hora que o profissional declarou e a casa
            confirma. Opcional: o servidor anterior à 0.2.31 não o manda.
          oneOf:
            - $ref: '#/components/schemas/Instante'
            - type: 'null'
        checkin_tipo:
          description: O tipo do check-in (0.2.31), o mesmo `Turno.checkin_tipo`. Nulo sem check-in. Opcional. Desde a 0.2.68, pode ser `codigo`.
          oneOf:
            - $ref: '#/components/schemas/TipoRegistro'
            - type: 'null'
        checkin_confirmado_em:
          description: |
            Quando um membro da casa confirmou o check-in manual (0.2.31), o mesmo
            `Turno.checkin_confirmado_em`. Nulo no check-in geolocalizado, que já nasce
            verificado, e no manual ainda sem confirmação. Com `checkin_tipo: codigo` (0.2.68), é a
            hora em que o código foi validado. Opcional.
          oneOf:
            - $ref: '#/components/schemas/Instante'
            - type: 'null'
        cancelamento:
          description: |
            Por que a posição foi cancelada (0.2.31, RN12). Vem na posição `cancelada` que chegou a
            ter profissional. Nulo nos outros estados e na posição cancelada **sem nunca ter tido
            profissional** (`profissional` nulo), que não tem cancelamento registrado: a vaga foi
            cancelada, o modo seleção fechou sem escolha, ou a posição reaberta por atraso não foi
            preenchida a tempo. Opcional: o servidor anterior à 0.2.31 não o manda.
          oneOf:
            - $ref: '#/components/schemas/CancelamentoDaPosicao'
            - type: 'null'
    CausaDoCancelamento:
      type: string
      enum: [profissional, estabelecimento, reabertura_por_atraso, no_show_sem_checkin, outro]
      description: |
        Dicionário fechado (0.2.31): valor novo é mudança de contrato, com versão subindo. Desde a
        0.2.32 é também a causa em `Turno.cancelamento`, com o mesmo valor que o painel mostra
        para a mesma posição.

        - `profissional`: o profissional desistiu (`cancelar_posicao`).
        - `estabelecimento`: um membro da casa cancelou a posição (`cancelar_posicao`) ou a vaga
          inteira (`cancelar_vaga`).
        - `reabertura_por_atraso`: a casa declarou o não comparecimento aos 15 minutos
          (`reabrir_por_atraso`, D06).
        - `no_show_sem_checkin`: o turno terminou sem check-in, e o agendador fechou a posição.
        - `outro`: a posição saiu sem escolha de nenhuma das partes neste turno, por conta
          encerrada ou por ação da Equipe Frila. O contrato não diz qual das duas: a situação da
          conta de uma parte não é dado da outra (RN13, RN15).
    CancelamentoDaPosicao:
      type: object
      required: [causa, falta, motivo, cancelada_em]
      description: O registro do cancelamento de uma posição que tinha profissional (RN12), como a casa o lê no painel.
      properties:
        causa:
          $ref: '#/components/schemas/CausaDoCancelamento'
        falta:
          type: boolean
          description: |
            Verdadeiro quando conta como falta do profissional na taxa de comparecimento (RN12):
            desistência a menos de 24 horas do início, reabertura por atraso ou turno terminado sem
            check-in. É o mesmo valor que `ResultadoCancelamento.falta` devolveu a quem cancelou.
        motivo:
          type: [string, 'null']
          description: |
            O texto que a pessoa escreveu ao cancelar, em `cancelar_posicao` ou `cancelar_vaga`, já
            passado pelo filtro de termos. Só vem com `causa` `profissional` ou `estabelecimento`.
            Nulo nas outras causas: o motivo delas é a própria causa, e nenhum código interno sai
            aqui como texto.
        cancelada_em:
          $ref: '#/components/schemas/Instante'
      example:
        causa: profissional
        falta: true
        motivo: Tive um imprevisto de saúde e não consigo chegar.
        cancelada_em: '2026-10-03T19:40:00Z'

    # ── Confiança e direitos

    StatusVerificacao:
      type: object
      required: [status_verificacao, motivo, prazo_envio_ate, identidade_verificada]
      description: |
        Estado da verificação de identidade da conta (RN14). O cliente vê estado e motivo, nunca
        evidência: o contrato não expõe `documento_hmac`, caminho de arquivo no Storage nem score
        biométrico.
      properties:
        status_verificacao:
          type: string
          enum: [nao_exigida, pendente, em_analise, aprovada, rejeitada]
          description: |
            `nao_exigida` é o estado inicial de toda conta; nenhuma conta nasce `pendente`.
            `pendente` é exigência formal aberta pela moderação em apuração de denúncia grave
            (RN13). `em_analise` vale depois de `confirmar_envio_verificacao`. `aprovada` e
            `rejeitada` são o desfecho. Nenhum dos cinco estados é "suspensa": suspensão de conta
            é assunto da RN13 e continua em `situacao_da_conta`.
        motivo:
          description: |
            Motivo da exigência, quando houver. Nulo em `nao_exigida`. O cliente mostra o motivo,
            mas não decide nada a partir dele.
          oneOf:
            - type: string
            - type: 'null'
        prazo_envio_ate:
          description: |
            Até quando o envio das evidências é esperado. **Informativo:** o cliente não decide
            nada a partir dele, porque vencer o prazo não tem consequência automática. Nulo
            quando não há exigência aberta.
          oneOf:
            - $ref: '#/components/schemas/Instante'
            - type: 'null'
        identidade_verificada:
          type: boolean
          description: Verdadeiro quando o selo "Identidade Verificada" está ativo para esta conta.
          example: false
    UploadVerificacao:
      type: object
      required: [expira_em, partes]
      description: |
        URLs assinadas de **upload** para as evidências da verificação de identidade (RN14), no
        bucket privado `documentos-identidade`. Cada URL é opaca para o cliente: o contrato não
        expõe o caminho do arquivo no Storage.
      properties:
        expira_em:
          description: Instante em que as URLs deixam de valer, duas horas depois de emitidas.
          $ref: '#/components/schemas/Instante'
        partes:
          type: array
          description: |
            Uma URL por parte a enviar: `frente`, `verso` e `selfie`. O cliente envia a imagem
            na URL da parte, até 5 MB por arquivo. A escrita só é aceita dentro da URL assinada,
            no caminho da própria conta.
          items:
            type: object
            required: [parte, url]
            properties:
              parte:
                type: string
                enum: [frente, verso, selfie]
              url:
                type: string
                format: uri
    Protocolo:
      type: object
      required: [ocorrencia_id, tipo, criada_em, prazo_resposta_ate]
      description: |
        Registro de algo que a Equipe Frila responde por e-mail em até 5 dias úteis. Não traz o
        desfecho nem a data da resposta: quem recebe um `Protocolo` não sabe por ele se o caso já foi
        respondido (0.2.48).

        O **protocolo curto** é o que a pessoa vê e cita: os 8 primeiros caracteres hexadecimais de
        `ocorrencia_id`, sem hifens, em maiúsculas (`6f1c2a4e-…` vira `6F1C2A4E`). O app o calcula
        desta regra, e a Equipe Frila o usa para achar a ocorrência.
      properties:
        ocorrencia_id:
          $ref: '#/components/schemas/Uuid'
        tipo:
          type: string
          enum: [denuncia, contestacao, revisao_despacho, suporte]
        criada_em:
          $ref: '#/components/schemas/Instante'
        prazo_resposta_ate:
          type: string
          format: date
    Bloqueio:
      type: object
      required: [alvo_tipo, alvo_id, criado_em]
      description: |
        Devolve o mesmo par que a chamada recebeu, e não o id de conta da outra parte: o app não
        tem o que fazer com um id que nenhuma outra resposta menciona, e devolvê-lo abriria um
        caminho de leitura que RN10 fecha em todos os outros.
      properties:
        alvo_tipo:
          $ref: '#/components/schemas/TipoDeAlvo'
        alvo_id:
          $ref: '#/components/schemas/Uuid'
        criado_em:
          $ref: '#/components/schemas/Instante'
    ItemBloqueio:
      type: object
      required: [alvo_tipo, alvo_id, nome, criado_em]
      description: |
        Um bloqueio criado pelo chamador, como `/rpc/listar_bloqueios` o mostra. O par
        `alvo_tipo` + `alvo_id` é o mesmo que `/rpc/bloquear` e `/rpc/desbloquear` recebem. Não traz o
        id de conta da outra parte (RN10).
      properties:
        alvo_tipo:
          $ref: '#/components/schemas/TipoDeAlvo'
        alvo_id:
          description: O `id` do `PerfilPublico` da outra parte.
          $ref: '#/components/schemas/Uuid'
        nome:
          type: string
          description: Nome público da outra parte, o mesmo de `PerfilPublico.nome`.
        criado_em:
          $ref: '#/components/schemas/Instante'
    SituacaoDaConta:
      type: object
      required: [estado, suspensao]
      properties:
        estado:
          $ref: '#/components/schemas/EstadoConta'
        suspensao:
          oneOf:
            - type: object
              required: [motivo, desde, contestacao]
              properties:
                motivo:
                  type: string
                desde:
                  $ref: '#/components/schemas/Instante'
                contestacao:
                  description: |
                    Protocolo da contestação vinculada à suspensão em vigor, quer esteja em análise
                    ou já respondida pela Equipe Frila (decisão de produto, opção B, 0.2.36). O
                    resultado do suporte não é exposto no app (RN07, RF24) e eventual recurso
                    adicional é tratado exclusivamente por e-mail. Nulo se o titular ainda não
                    contestou a suspensão em vigor.
                  oneOf:
                    - $ref: '#/components/schemas/Protocolo'
                    - type: 'null'
            - type: 'null'

    # ── Aplicativo

    ConfiguracaoDoApp:
      type: object
      required: [plataforma, versao_minima, versao_recomendada, url_da_loja]
      description: |
        Lida sem sessão, na abertura. As versões são strings de build comparadas por ordem natural
        de versão (`1.2.10` é maior que `1.2.9`), e não números — um `double` transformaria
        `1.2.10` em `1.21`.
      properties:
        plataforma:
          $ref: '#/components/schemas/Plataforma'
        versao_minima:
          type: string
          pattern: '^[0-9]{1,6}(\.[0-9]{1,6}){0,3}$'
          description: Abaixo desta, o app bloqueia e leva à loja. Nenhuma tela do produto abre.
          example: "1.0.0"
        versao_recomendada:
          type: string
          pattern: '^[0-9]{1,6}(\.[0-9]{1,6}){0,3}$'
          description: Aviso dispensável, uma vez por versão. Nunca abaixo de `versao_minima`.
          example: "1.1.0"
        url_da_loja:
          type: string
          format: uri
        mensagem:
          type: [string, 'null']
          description: |
            Texto opcional para a tela de bloqueio. Nulo na maior parte do tempo: o app tem um
            texto padrão, e depender deste campo para a tela funcionar faria uma falha de rede
            virar tela vazia.
        recursos:
          $ref: '#/components/schemas/RecursosDoApp'

    # ── Dispositivos e conta

    EstabelecimentoDaConta:
      type: object
      required: [id, nome, papel]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nome:
          type: string
        papel:
          $ref: '#/components/schemas/PapelMembro'
        tipo:
          $ref: '#/components/schemas/TipoEstabelecimento'
        reputacao:
          $ref: '#/components/schemas/Reputacao'

    MeusDados:
      type: object
      required: [gerado_em, conta, turnos, avaliacoes_dadas, avaliacoes_recebidas, dispositivos,
                 candidaturas, ocorrencias, bloqueios, notificacoes, despachos, equipe_confianca,
                 pedido_de_exclusao]
      description: |
        Portabilidade da LGPD: o que o titular forneceu e o que o sistema registrou sobre ele.

        As sete coleções acrescentadas na 0.2.33 — `candidaturas`, `ocorrencias`, `bloqueios`,
        `notificacoes`, `despachos`, `equipe_confianca` e `pedido_de_exclusao` — são obrigatórias
        como as demais: coleção vazia é `[]`, e `pedido_de_exclusao` é `null` quando não há pedido.
        Nenhuma delas vem ausente.
      properties:
        gerado_em:
          $ref: '#/components/schemas/Instante'
        conta:
          $ref: '#/components/schemas/Usuario'
        perfil_profissional:
          description: |
            0.2.58. O perfil do titular no mesmo objeto que `/rpc/meu_perfil_detalhado` devolve, para
            não existir uma segunda definição de perfil: além de `PerfilProfissional`, traz o perfil
            rico, com os serviços e as especialidades de cada um (`servicos`) e as regiões atendidas
            (`regioes`, `atende_todo_df`). `null` quando o titular não tem perfil de profissional.
          oneOf:
            - $ref: '#/components/schemas/PerfilProfissionalDetalhado'
            - type: 'null'
        estabelecimentos:
          type: array
          items:
            $ref: '#/components/schemas/EstabelecimentoDaConta'
        disponibilidade:
          type: array
          items:
            $ref: '#/components/schemas/JanelaDeDisponibilidade'
        turnos:
          type: array
          items:
            $ref: '#/components/schemas/Turno'
        avaliacoes_dadas:
          type: array
          items:
            $ref: '#/components/schemas/Avaliacao'
        avaliacoes_recebidas:
          description: |
            **Sem o autor.** A resposta individual não pertence ao titular, e devolvê-la aqui
            abriria pela porta da portabilidade o que RN07 fecha em todas as outras: a avaliação é
            binária e agregada justamente para que ninguém responda com medo de retaliação.
          type: array
          items:
            type: object
            required: [turno_id, resposta, criada_em]
            properties:
              turno_id:
                $ref: '#/components/schemas/Uuid'
              resposta:
                type: boolean
              criada_em:
                $ref: '#/components/schemas/Instante'
        dispositivos:
          type: array
          items:
            $ref: '#/components/schemas/Dispositivo'
        candidaturas:
          description: |
            As candidaturas do titular, no mesmo objeto que `/rpc/minhas_candidaturas` devolve — e
            pelo mesmo caminho, para não existir uma segunda definição de candidatura.

            Entram todas, inclusive as retiradas, recusadas e expiradas: o registro de ter se
            candidatado é dado do titular, e o estado final faz parte dele.
          type: array
          items:
            $ref: '#/components/schemas/Candidatura'
        ocorrencias:
          description: |
            Os registros em que o titular saiu do curso normal, de um lado ou do outro: denúncia
            que ele abriu, contestação de suspensão, pedido de revisão de despacho, atendimento de
            suporte, suspensão aplicada a ele e cancelamento registrado no nome dele. `papel` diz
            de que lado ele está em cada um.

            **`motivo` vem só quando o titular é o autor**, ou quando o tipo é `suspensao` — nesse
            caso o motivo é da Equipe Frila e ele já o lê em `/rpc/situacao_da_conta`. Quando ele é
            o alvo de uma denúncia, o texto foi escrito por outra pessoa, e devolvê-lo aqui abriria
            pela porta da portabilidade o que RF26 e RN07 fecham: quem denuncia precisa poder
            denunciar sem ser identificado.

            **Sem `resultado`.** O desfecho que a Equipe Frila escreve fala das duas partes; o que
            o titular precisa saber do próprio caso é se ele foi resolvido, e `resolvido_em` diz.
          type: array
          items:
            type: object
            required: [id, tipo, papel, criada_em]
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              tipo:
                type: string
                enum: [cancelamento, suspensao, contestacao, suporte, denuncia, revisao_despacho]
              papel:
                type: string
                enum: [autor, alvo]
                description: |
                  `autor` quando o titular abriu o registro, `alvo` quando ele é a parte sobre
                  quem o registro foi aberto.
              motivo:
                oneOf:
                  - type: string
                  - type: 'null'
                description: Nulo quando o titular é o alvo e o tipo não é `suspensao`.
              criada_em:
                $ref: '#/components/schemas/Instante'
              resolvido_em:
                oneOf:
                  - $ref: '#/components/schemas/Instante'
                  - type: 'null'
        bloqueios:
          description: |
            Quem o titular bloqueou (RF26), no mesmo par `alvo_tipo` + `alvo_id` que `/rpc/bloquear`
            devolve, e não o id de conta da outra parte.

            **Só os que ele criou.** Os bloqueios feitos contra ele não entram: saber que foi
            bloqueado é exatamente o que RF26 esconde, e uma exportação que contasse isso desfaria
            a proteção de todos os bloqueios já existentes.
          type: array
          items:
            $ref: '#/components/schemas/Bloqueio'
        notificacoes:
          description: |
            Os avisos endereçados à conta do titular (0.2.14): o que o sistema mandou para ele, de
            que tipo, sobre o que e quando.

            **Sem a mecânica de entrega.** Nada de token de aparelho, contagem de tentativas ou
            erro devolvido pelo provedor de push — é credencial e diagnóstico de infraestrutura,
            não dado do titular, pela mesma razão que `Dispositivo` não leva o token (RN15).
          type: array
          items:
            type: object
            required: [tipo, referencia_id, payload, enviada_em]
            properties:
              tipo:
                $ref: '#/components/schemas/TipoNotificacao'
              referencia_id:
                $ref: '#/components/schemas/Uuid'
                description: A vaga, posição, turno ou estabelecimento de que o aviso trata.
              payload:
                type: object
                description: |
                  O corpo que o toque no push carrega: só o tipo e ids (RN15). Chaves possíveis:
                  `vaga_id`, `posicao_id`, `turno_id`, `estabelecimento_id` e, no cancelamento,
                  `reaberta` (booleano). Nunca telefone, e-mail, nome ou coordenada.
                additionalProperties: true
              enviada_em:
                $ref: '#/components/schemas/Instante'
              entregue_em:
                oneOf:
                  - $ref: '#/components/schemas/Instante'
                  - type: 'null'
                description: Nulo enquanto o push não foi confirmado pelo aparelho, ou se falhou.
        despachos:
          description: |
            O registro de ter sido considerado para uma vaga (RF18, RN05): é o que sustenta a tela
            "Por que recebo vagas" e o pedido em `/rpc/pedir_revisao_despacho`.

            Uma linha por vaga, mesmo quando o aviso saiu agrupado com outras ou ainda não saiu: o
            despacho diz que o titular foi considerado, e a notificação diz o que chegou até ele.
            É por isso que os dois são coleções separadas aqui, como são duas tabelas no banco.
          type: array
          items:
            type: object
            required: [vaga_id, criado_em, reaberta]
            properties:
              vaga_id:
                $ref: '#/components/schemas/Uuid'
              criado_em:
                $ref: '#/components/schemas/Instante'
              reaberta:
                type: boolean
                description: O despacho nasceu da reabertura de uma posição por atraso (D06).
        equipe_confianca:
          description: |
            As casas que puseram o titular na equipe de confiança (RF18), com o instante em que
            isso aconteceu. Estar na equipe não muda a ordem de ninguém (RN06); muda o alcance: a
            pessoa é avisada das vagas daquela casa mesmo além dos 15 km.

            **Só o lado do profissional.** A equipe das casas que o titular administra é dado dos
            profissionais dela, e não dele — quem exporta os próprios dados não leva a lista de
            outras pessoas. Quem administra a casa lê essa equipe em `/rpc/equipe_de_confianca`.
          type: array
          items:
            type: object
            required: [estabelecimento_id, nome, adicionado_em]
            properties:
              estabelecimento_id:
                $ref: '#/components/schemas/Uuid'
              nome:
                type: string
              adicionado_em:
                $ref: '#/components/schemas/Instante'
        pedido_de_exclusao:
          description: |
            O pedido de exclusão de conta, quando existe (RF25), ou `null`. É registro de operação,
            e não cópia de dado: guarda o instante, o estado e quantas vezes o pedido foi repetido.

            Ele aparece na exportação porque sobrevive a uma exclusão que falhou — o pedido é
            gravado em transação própria, **antes** de a exclusão ser tentada, para não desaparecer
            junto com ela se ela voltar atrás. É nessa janela que o titular precisa poder ver que o
            pedido está registrado e pendente, em vez de não ter prova de que pediu.
          oneOf:
            - type: object
              required: [pedido_em, estado, tentativas]
              properties:
                pedido_em:
                  $ref: '#/components/schemas/Instante'
                estado:
                  type: string
                  enum: [pendente, concluido]
                tentativas:
                  type: integer
                  minimum: 1
                  description: Quantas vezes o pedido foi registrado. Quem repetiu porque a exclusão falhou aparece aqui.
                concluido_em:
                  oneOf:
                    - $ref: '#/components/schemas/Instante'
                    - type: 'null'
            - type: 'null'
        midias:
          description: |
            0.2.59. As fotos do titular, em qualquer estado, no mesmo objeto que `/rpc/minhas_midias`
            devolve, e com as mesmas exclusões: nunca o caminho no Storage, o código fino da análise,
            o classificador usado nem o hash. `url`, quando vem, vale 1 h, como lá. Mídia já expurgada
            (RN14) aparece só com o que sobrou do registro dela, sem `url`.

            Opcional nesta versão, como as sete coleções da 0.2.33 antes de o servidor devolvê-las
            sempre: passa a `required` na versão em que a exportação do backend publicado a montar.
          type: array
          items:
            $ref: '#/components/schemas/Midia'
        chamadas:
          description: |
            0.2.59. As chamadas diretas em que o titular é o profissional chamado, ou o membro do
            estabelecimento que chamou, no objeto `Chamada` (0.2.55). Entram todas, em qualquer estado,
            como as candidaturas. Não traz telefone, endereço nem perfil da outra parte. O `recado` é o
            que o profissional já lê em `detalhe_chamada`, e `motivo_recusa` é só uma categoria (RN33).

            Opcional nesta versão, pelo mesmo motivo de `midias`.
          type: array
          items:
            $ref: '#/components/schemas/Chamada'
        checkins_por_codigo:
          description: |
            0.2.68, revisto na 0.2.70. O que o check-in por código registrou sobre o titular como
            profissional (LGPD, art. 18, II, e art. 19): por turno, se a confirmação da casa foi
            exigida, a marca de confiança baixa e as tentativas de leitura. Não diz qual sinal pesou
            para exigir o código, não traz os metros da leitura nem quem da casa gerou o código, que
            o servidor não grava. Entra só o turno com algum desses registros, e só enquanto eles
            existem: o servidor os apaga 90 dias depois do mais tarde entre o fim do turno e o fim da
            contestação. Conta a contestação do turno, quando existir, e a de suspensão do
            profissional, valendo a mais tarde; qualquer uma aberta segura os registros.

            Só na exportação do próprio profissional: na de quem opera a casa vem `[]`, porque a
            marca e as tentativas não saem para a casa. Fora daqui, a marca não sai em resposta
            nenhuma.

            Opcional nesta versão, pelo mesmo motivo de `midias`.
          type: array
          items:
            type: object
            required: [turno_id, codigo_exigido, confianca_baixa, tentativas]
            properties:
              turno_id:
                $ref: '#/components/schemas/Uuid'
              codigo_exigido:
                description: O servidor pediu a confirmação da casa por sinal suspeito no check-in. Não diz qual sinal.
                type: boolean
              confianca_baixa:
                description: O código foi validado sem posição. Até uma decisão registrada, só alimenta a medição do piloto.
                type: boolean
              tentativas:
                description: As leituras que contaram como tentativa, em ordem. Sem o motivo da recusa.
                type: array
                items:
                  type: object
                  required: [em, resultado, faixa, codigo_gerado_em]
                  properties:
                    em:
                      $ref: '#/components/schemas/Instante'
                    resultado:
                      type: string
                      enum: [aceita, recusada]
                    faixa:
                      description: A faixa da distância medida na leitura, nunca os metros.
                      type: string
                      enum: [ate_100_m, acima_de_100_m, sem_posicao]
                    codigo_gerado_em:
                      description: Quando a casa gerou o código em vigor no momento da leitura. Nulo se não havia código em vigor.
                      oneOf:
                        - $ref: '#/components/schemas/Instante'
                        - type: 'null'
        eventos_app:
          description: |
            Eventos de telemetria emitidos pelo aplicativo e vinculados à conta do titular (LGPD art. 18,
            cartão nUpPFCpM, T-0017, RN15).

            **Sem campos livres de texto e sem coordenadas.** Contém apenas os identificadores
            estruturados do dicionário fechado (`EventoDeTelemetria`).
          type: array
          items:
            type: object
            required: [id, evento, ocorrido_em, criado_em]
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              evento:
                $ref: '#/components/schemas/EventoDeTelemetria'
              vaga_id:
                oneOf:
                  - $ref: '#/components/schemas/Uuid'
                  - type: 'null'
              turno_id:
                oneOf:
                  - $ref: '#/components/schemas/Uuid'
                  - type: 'null'
              ocorrido_em:
                $ref: '#/components/schemas/Instante'
              criado_em:
                $ref: '#/components/schemas/Instante'

    Dispositivo:
      type: object
      required: [plataforma, atualizado_em]
      properties:
        plataforma:
          $ref: '#/components/schemas/Plataforma'
        atualizado_em:
          $ref: '#/components/schemas/Instante'
        vinculo_id:
          type: string
          format: uuid
          description: |
            O vínculo deste token com a conta que o registrou, opaco. Muda quando o token passa de
            uma conta para outra e quando é registrado de novo depois de `remover_dispositivo`; o
            registro repetido pela mesma conta devolve o mesmo valor. Vem igual em todo push
            mandado a este aparelho para esta conta. Opcional: o servidor anterior à 0.2.30 não o
            devolve, e o app trata a ausência como "sem conferência por vínculo".
    ExclusaoDeConta:
      type: object
      required: [perfil_removido_em, dados_apagados_ate, turnos_cancelados]
      properties:
        perfil_removido_em:
          $ref: '#/components/schemas/Instante'
        dados_apagados_ate:
          type: string
          format: date
          example: '2026-10-11'
          description: Até 15 dias depois do pedido (RF25). Limite para purga dos backups/retenção LGPD.
        turnos_cancelados:
          type: integer
          minimum: 0
          example: 2
