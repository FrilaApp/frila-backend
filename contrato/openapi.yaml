    **Versão 0.2.10, de 24/09/2026.** O registro de presença foi implementado:
    `fazer_checkin`, `fazer_checkout` e `confirmar_checkin_manual`.

    Dois códigos novos no catálogo, os dois 409:

    - **`checkin_pendente`** — check-out de um turno que nunca teve check-in, ou
      confirmação de um check-in que não existe. O código diz **qual é o passo que
      falta**, para a tela poder levar a pessoa até ele em vez de só recusar.
    - **`checkin_ja_confirmado`** — confirmar um check-in geolocalizado, que já nasceu
      verificado. Não há o que confirmar.

    E três coisas que a implementação fixou:

    - **Quem decide o tipo é o servidor**, a partir da distância: até 200 m
      `geolocalizado`, acima disso ou sem distância `manual`. Deixar o app declarar o
      tipo seria deixar o app declarar a própria presença.
    - **A distância do check-in manual não é gravada.** Ela não prova nada, e guardá-la
      sugeriria que prova. O que vale é a confirmação de quem estava lá.
    - **`registrado_em` até 2 minutos no futuro é aceito** — é a folga do relógio do
      aparelho, que adianta. Acima disso, `422 registro_no_futuro`. A janela vai de 60
      minutos antes do início até o fim previsto; fora dela, `422 fora_da_janela`.

    O profissional que tenta confirmar o próprio check-in manual recebe `403
    sem_permissao`, e não 404: ele é parte do turno e sabe que ele existe — esconder não
    protegeria nada e confundiria a tela.

