    **Versão 0.2.19, de 28/09/2026.** Posição reaberta por atraso aceita candidatura depois
    do início do turno (decisão 8zLfn0mt, item 5, aprovada e registrada no cartão em
    28/09/2026). Até aqui, vaga cujo início já passou recusava `candidatar` com
    `409 vaga_encerrada`, e a reabertura de `reabrir_por_atraso` nascia sem ter quem a pegasse.
    Nenhuma assinatura, campo ou código de erro é novo, mas mudam regras de leitura, e uma delas
    vale para **toda** vaga:

    - **O prazo é o fim previsto menos 1 h.** A posição aberta por `reabrir_por_atraso` aceita
      candidatura enquanto o relógio do servidor estiver antes de `fim_em - 1 h`. Depois disso,
      `409 vaga_encerrada`, como qualquer vaga encerrada. A hora que falta até o fim dá ao
      substituto da região tempo de chegar e ainda cobrir o resto do serviço.
    - **A exceção é da posição, não da vaga.** `candidatar` recebe a vaga e o servidor escolhe
      a posição. Antes do início, vale qualquer posição `aberta`, como sempre. Depois do início,
      o servidor só escolhe posição criada por `reabrir_por_atraso`, e só até `fim_em - 1 h`.
      Posição original que ficou `aberta` sem ninguém não é oferecida depois do início, mesmo
      numa vaga que tem, ao lado dela, uma posição reaberta por atraso. Vaga que já começou e
      não tem posição reaberta por atraso `aberta` dentro do prazo responde
      `409 vaga_encerrada`; perder a corrida pela posição reaberta é `409 posicao_ja_preenchida`,
      como antes do início.
    - **`posicoes_abertas` conta o que se pode pegar.** Na lista e no detalhe, depois do
      início, o campo conta só as posições reabertas por atraso ainda dentro do prazo. Fora do
      prazo, ou sem reabertura, é `0`. Antes do início, nada muda.
    - **Regra nova para toda vaga: `vagas_abertas` esconde vaga que já começou.** Até a 0.2.18
      o contrato não dizia nada, e a vaga `publicada` continuava na lista até o fim, porque ela
      só passa a `encerrada` depois de `fim_em`. A partir da 0.2.19, vaga cujo início já passou
      sai da lista, salvo a que tem posição reaberta por atraso dentro do prazo. Ela sai no
      mesmo instante em que `candidatar` passa a recusar.
    - **`detalhe_vaga` continua respondendo fora do prazo.** Responde `200` com a vaga e o
      `estado` real (o início não muda o estado da vaga: a `publicada` segue `publicada` até
      o fim) e `posicoes_abertas = 0`. Não vira `404`,
      para que o toque numa notificação antiga abra a vaga em vez de cair em erro. A tela
      mostra o botão de candidatura só com `estado = publicada` e `posicoes_abertas > 0`, e
      nunca decide pelo relógio do aparelho. O `404` continua só para bloqueio (RF26) e conta
      de demonstração.
    - **O valor não muda.** O valor anunciado é o do turno inteiro (RN01), mesmo para quem
      chega com o turno em andamento. A tela de reabertura deve dizer isso ao contratante.
    - **Modo seleção.** Na v1.0 toda vaga é de urgência (`modo = selecao` é recusado), e a
      posição reaberta por atraso confirma o primeiro elegível na hora. Como a vaga em seleção
      fecha 24 h antes do início (RN24), a reabertura por atraso não cabe nela. **Regra
      da 0.2.38 (decisão D5, 07/10/2026):** em vaga de seleção, a posição reaberta por atraso é
      sempre reposta em urgência.

